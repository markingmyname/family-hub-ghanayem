name: Deploy Family Hub to GitHub Pages

# Publishes family-hub-app/ straight from source — no duplicate copy of
# index.html to keep in sync — onto the gh-pages branch, which GitHub Pages
# serves. Requires Settings → Pages → Source: "Deploy from a branch" →
# gh-pages / (root).
#
# Pull request previews (preview.yml) live in gh-pages/pr-preview/. This deploy
# leaves that folder alone, so publishing the live site never deletes a preview.
#
# Depends on: JamesIves/github-pages-deploy-action, pinned to the commit behind
# release v4.9.0 so a re-pointed tag can't change what runs with write access.

on:
  push:
    branches: [main]
    paths:
      - 'family-hub-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Only what the deploy needs: push to the gh-pages branch. Set here rather than
# by loosening the repository-wide Actions setting.
permissions:
  contents: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Branch-based Pages runs every site through Jekyll unless this file is at
      # the root. The app is plain files, so skip Jekyll and serve them as-is.
      - name: Serve the files exactly as they are (no Jekyll)
        run: touch family-hub-app/.nojekyll

      # force: false rebases instead of force-pushing, so a preview pushed to
      # gh-pages at the same moment isn't overwritten.
      - name: Publish the app folder to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: family-hub-app
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
