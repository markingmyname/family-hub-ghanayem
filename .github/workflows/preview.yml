name: Preview pull requests

# Publishes each pull request's version of family-hub-app/ to
#   https://markingmyname.github.io/family-hub-ghanayem/pr-preview/pr-<number>/
# and makes that link clickable in three places:
#   - a "Preview" link at the top of the pull request's description
#   - a pull request comment with the "Preview" link and a QR code for phones
#   - a GitHub deployment, so the pull request shows a "View deployment" button
#     and the repository's Deployments page lists the link
# Every new push to the PR updates the preview; closing or merging the PR
# removes the preview, takes the description link out, and marks the
# deployment inactive.
#
# Depends on:
#   - pages.yml publishing the live site to the gh-pages branch, and
#     Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).
#   - rossjrw/pr-preview-action, pinned to the commit behind release v1.8.2 so
#     a re-pointed tag can't change what runs with write access.
#   - .github/scripts/preview_links.py, which writes the three links.
#
# A preview runs at the same web address as the live app, so it shares the
# browser's saved data and Family sync with it. On a device that's joined to
# the family board, a preview reads and writes the REAL board.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    # Only pull requests that change the app need a preview.
    paths:
      - 'family-hub-app/**'

# Only what this needs: push the preview folder to gh-pages, edit the PR
# description and comment, and record deployments. Set here rather than by
# loosening the repository-wide Actions setting.
permissions:
  contents: write
  pull-requests: write
  deployments: write

# One run at a time per pull request; a newer push replaces a queued older one.
concurrency: preview-${{ github.ref }}

jobs:
  preview:
    # Pull requests from forks get a read-only token and the action doesn't
    # support them, so only branches in this repository get previews.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      # action defaults to "auto": deploy on opened/reopened/synchronize,
      # remove on closed. Its own comment is off; preview_links.py posts one
      # with a labeled, clickable link instead.
      - name: Deploy or remove the preview
        id: preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: family-hub-app
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false

      # Writes the link into the description, the comment, and a deployment.
      # Values reach the script only as environment variables, and the script
      # never passes PR text through a shell. Editing the description doesn't
      # re-trigger this workflow: "edited" isn't in the pull_request types above.
      - name: Publish the preview link (description, comment, deployment)
        if: steps.preview.outputs.deployment-action == 'deploy' || steps.preview.outputs.deployment-action == 'remove'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_ACTION: ${{ steps.preview.outputs.deployment-action }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          ACTION_VERSION: ${{ steps.preview.outputs.action-version }}
        run: python3 .github/scripts/preview_links.py
