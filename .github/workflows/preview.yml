name: Preview pull requests

# Publishes each pull request's version of family-hub-app/ to
#   https://markingmyname.github.io/family-hub-ghanayem/pr-preview/pr-<number>/
# comments that link (with a QR code for phones) on the pull request, and puts
# a "Preview" link at the top of the pull request's description. Every new push
# to the PR updates the preview; closing or merging the PR removes the preview
# and the description link.
#
# Depends on:
#   - pages.yml publishing the live site to the gh-pages branch, and
#     Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).
#     Until that's set, the preview link in the comment won't open.
#   - rossjrw/pr-preview-action, pinned to the commit behind release v1.8.2 so
#     a re-pointed tag can't change what runs with write access.
#
# A preview runs at the same web address as the live app, so it shares the
# browser's saved data and Family sync with it. On a device that's joined to
# the family board, a preview reads and writes the REAL board.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    # Only pull requests that change the app need a preview.
    paths:
      - 'family-hub-app/**'

# Only what the action needs: push the preview folder to gh-pages, and post or
# update the preview-link comment. Set here rather than by loosening the
# repository-wide Actions setting.
permissions:
  contents: write
  pull-requests: write

# One run at a time per pull request; a newer push replaces a queued older one.
concurrency: preview-${{ github.ref }}

jobs:
  preview:
    # Pull requests from forks get a read-only token and the action doesn't
    # support them, so only branches in this repository get previews.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      # action defaults to "auto": deploy on opened/reopened/synchronize,
      # remove on closed.
      - name: Deploy or remove the preview
        id: preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: family-hub-app
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      # Keeps a "Preview" link at the top of the PR description, pointing at
      # this PR's own preview (the action's preview-url output). The link sits
      # between two hidden markers, so each run replaces it instead of adding
      # another, and it's taken out when the preview is removed.
      # The description is read and rewritten through the API with Python and
      # never pasted into the shell, so nothing typed in it can run as a command.
      # Editing the description doesn't re-trigger this workflow: "edited" isn't
      # in the pull_request types above.
      - name: Add or remove the Preview link in the PR description
        if: steps.preview.outputs.deployment-action == 'deploy' || steps.preview.outputs.deployment-action == 'remove'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          DEPLOYMENT_ACTION: ${{ steps.preview.outputs.deployment-action }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          gh api "$api" > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json, os, re

          tmp = os.environ["RUNNER_TEMP"]
          body = json.load(open(f"{tmp}/pr.json", encoding="utf-8")).get("body") or ""
          start, end = "<!-- pr-preview-link -->", "<!-- /pr-preview-link -->"

          # Take out any earlier link (and the blank line after it).
          new = re.sub(re.escape(start) + r".*?" + re.escape(end) + r"\s*", "", body, flags=re.S)

          if os.environ["DEPLOYMENT_ACTION"] == "deploy":
              url = os.environ["PREVIEW_URL"]
              if not url.startswith("https://"):
                  raise SystemExit(f"Refusing to link a preview URL that isn't https: {url!r}")
              new = f"{start}\n[Preview]({url})\n{end}\n\n" + new

          with open(f"{tmp}/new-body.md", "w", encoding="utf-8", newline="") as f:
              f.write(new)
          with open(f"{tmp}/changed", "w", encoding="utf-8") as f:
              f.write("yes" if new != body else "no")
          PY
          if [ "$(cat "$RUNNER_TEMP/changed")" = "yes" ]; then
            gh api -X PATCH "$api" -F "body=@$RUNNER_TEMP/new-body.md" > /dev/null
            echo "PR description updated (${DEPLOYMENT_ACTION})."
          else
            echo "PR description already up to date."
          fi
