<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://login.live.com https://cdn.jsdelivr.net https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com; frame-src https://login.microsoftonline.com https://login.live.com https://accounts.google.com; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Family Hub</title>
<meta name="theme-color" content="#2E3A46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="application-name" content="Family Hub">
<meta name="msapplication-TileColor" content="#2E3A46">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #2E3A46;
    --board-2: #3A4856;
    --paper: #FFFDF7;
    --paper-2: #FBF4E7;
    --ink: #2A2A28;
    --ink-soft: #6B6862;
    --line: #E7DFCB;
    --mustard: #E3A731;
    --danger: #C4453B;
    --good: #3FAE49;
    --radius: 14px;
    --shadow: 0 2px 6px rgba(42,32,10,0.08), 0 8px 20px rgba(42,32,10,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.05) 1px, transparent 0) 0 0/16px 16px,
      var(--paper-2);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',cursive;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    background:var(--board);
    background-image: linear-gradient(180deg, var(--board), var(--board-2));
    color:#fff;
    padding:14px 18px 0 18px;
    box-shadow:var(--shadow);
    position:sticky; top:0; z-index:50;
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .pin-dot{width:10px;height:10px;border-radius:50%;background:var(--mustard); box-shadow:0 0 0 3px rgba(227,167,49,0.25);}
  .brand h1{font-size:22px; margin:0; letter-spacing:0.3px; font-weight:700;}
  .header-actions{display:flex; gap:8px;}
  .icon-btn{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); color:#fff;
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px;
  }
  .icon-btn:active{transform:scale(0.94);}
  nav.tabs{
    display:flex; gap:4px; margin-top:12px; overflow-x:auto; padding-bottom:0;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent; border:none; color:rgba(255,255,255,0.65);
    font-family:'Baloo 2',cursive; font-size:15px; font-weight:600;
    padding:10px 14px; border-radius:10px 10px 0 0; cursor:pointer; white-space:nowrap;
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active{color:#fff; background:var(--paper-2); border-bottom:3px solid var(--mustard);}

  main{flex:1; padding:16px; max-width:1100px; margin:0 auto; width:100%;}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
  .section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .section-title h2{margin:0; font-size:19px;}
  .btn{
    font-family:'Inter'; font-weight:600; font-size:14px; border:none; border-radius:10px;
    padding:9px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--board); color:#fff;}
  .btn-mustard{background:var(--mustard); color:#3a2a05;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn:active{transform:scale(0.97);}
  input, select, textarea{
    font-family:'Inter'; font-size:14px; border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; background:#fff; color:var(--ink); width:100%;
  }
  label{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700;}
  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft);}
  .empty .display{font-size:20px; color:var(--ink); margin-bottom:6px;}

  /* ---------- Avatars ---------- */
  .avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; overflow:hidden; background-size:cover; background-position:center;
  }
  .avatar.sm{width:20px; height:20px; font-size:11px;}
  .avatar.lg{width:44px; height:44px; font-size:22px;}
  .avatar img{width:100%; height:100%; object-fit:cover;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(30,25,15,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:200;}
  @media(min-width:640px){ .overlay{align-items:center;} }
  .modal{background:var(--paper); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:20px; box-shadow:var(--shadow); max-height:88vh; overflow-y:auto;}
  @media(min-width:640px){ .modal{border-radius:18px;} }
  .modal h3{margin:0 0 14px 0;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1; justify-content:center;}

  /* ---------- People chip row / filter ---------- */
  .people-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .person-chip{
    display:flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--line);
    border-radius:999px; padding:5px 12px 5px 5px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .person-chip.active{border-color:var(--board); background:var(--paper-2);}
  .person-chip.all-chip{padding:5px 14px;}
  .dot{width:16px; height:16px; border-radius:50%; flex-shrink:0;}

  /* ---------- Calendar ---------- */
  .cal-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
  .cal-nav{display:flex; align-items:center; gap:8px;}
  .view-toggle{display:flex; background:var(--paper-2); border-radius:10px; padding:3px; border:1px solid var(--line);}
  .view-toggle button{background:transparent; border:none; padding:6px 12px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft);}
  .view-toggle button.active{background:var(--board); color:#fff;}
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .dow{text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); padding-bottom:4px; text-transform:uppercase;}
  .day-cell{background:#fff; border:1px solid var(--line); border-radius:10px; min-height:112px; padding:6px; cursor:pointer; position:relative; display:flex; flex-direction:column; overflow:hidden;}
  .day-cell.other-month{opacity:0.45;}
  .day-cell.today{border:2px solid var(--mustard);}
  .day-num{font-family:'JetBrains Mono'; font-size:12px; font-weight:700; flex-shrink:0;}
  .day-cell.today .day-num{
    background:var(--mustard); color:#3a2a05; border-radius:999px;
    width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  }
  /* Google-style agenda chips: a solid bar for all-day, a dot + time for timed. */
  .day-events{display:flex; flex-direction:column; gap:2px; margin-top:4px; min-width:0;}
  .month-chip{
    display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
    padding:2px 5px; border-radius:5px; cursor:pointer; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.45;
  }
  .month-chip .chip-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .month-chip .chip-time{font-family:'JetBrains Mono'; font-size:10px; font-weight:700; opacity:0.75; flex-shrink:0;}
  .month-chip .chip-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .month-chip.timed{background:transparent; color:var(--ink);}
  .month-chip.timed:hover{background:var(--paper-2);}
  .month-chip.allday:hover{filter:brightness(1.08);}
  .day-more{font-size:10.5px; font-weight:700; color:var(--ink-soft); padding:1px 5px; margin-top:1px;}
  @media(max-width:640px){
    .month-grid{gap:3px;}
    .day-cell{min-height:94px; padding:4px; border-radius:8px;}
    .month-chip{font-size:10px; padding:1px 4px; gap:3px;}
    /* Cells are only ~50px wide here, so the dot and time are dropped and the
       chip becomes a solid colour bar — every pixel goes to the title. */
    .month-chip .chip-time, .month-chip .chip-dot{display:none;}
    .month-chip.timed{background:var(--chip-color); color:var(--chip-text,#fff);}
    .day-more{font-size:10px; padding:1px 4px;}
  }
  .week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .week-col{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; min-height:140px;}
  .week-col-head{font-size:12px; font-weight:700; margin-bottom:6px; text-align:center;}
  .ev-pill{font-size:11px; font-weight:600; padding:3px 6px; border-radius:6px; margin-bottom:4px; cursor:pointer;}
  .day-columns{display:flex; gap:10px; overflow-x:auto;}
  .person-col{flex:1; min-width:150px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px;}
  .person-col-head{display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; margin-bottom:8px; padding-bottom:8px; border-bottom:2px solid var(--line);}
  .day-event{background:var(--paper-2); border-radius:8px; padding:7px 8px; margin-bottom:6px; font-size:12px; cursor:pointer;}
  .day-event .t{font-family:'JetBrains Mono'; font-size:10px; color:var(--ink-soft); display:block;}

  /* ---------- Chores ---------- */
  /* One column per person, side by side — wraps to fewer columns as space runs out.
     align-items:start keeps a short list from stretching to the tallest card. */
  .chore-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); align-items:start;}
  .chore-person-col{background:#fff; border-radius:10px; border:1px solid var(--line); overflow:hidden; min-width:0;}
  .chore-person-head{padding:10px 12px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .chore-list-label{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); padding:10px 12px 2px 12px;}
  .chore-row{padding:9px 12px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; min-width:0;}
  .chore-check{width:24px; height:24px; border-radius:7px; border:2px solid var(--line); background:#fff; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
  .chore-check.checked{background:var(--good); border-color:var(--good);}
  .chore-row .name{font-size:13px; font-weight:600; flex:1; min-width:0; overflow-wrap:anywhere;}
  .chore-row.completed .name{text-decoration:line-through; color:var(--ink-soft);}
  .pts-tag{font-size:11px; color:var(--ink-soft); font-weight:700; white-space:nowrap;}
  .chore-del{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px;}

  /* ---------- Habit tracker ---------- */
  /* Soft per-week tints, cycled across the weeks of the month so each block of
     days reads as one group at a glance. */
  .habit-wk0{--wk:#F7E3EC;} .habit-wk1{--wk:#E8E3F7;} .habit-wk2{--wk:#DEE9F8;}
  .habit-wk3{--wk:#DEF1E5;} .habit-wk4{--wk:#FBF0D9;} .habit-wk5{--wk:#F3E5DC;}
  .habit-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff;}
  .habit-table{border-collapse:separate; border-spacing:0; width:100%; font-size:12px;}
  .habit-table th, .habit-table td{border-bottom:1px solid var(--line); border-right:1px solid var(--line);}
  .habit-table tr:last-child th, .habit-table tr:last-child td{border-bottom:none;}
  /* The habit name stays put while the day columns scroll sideways. */
  .habit-name-col{
    position:sticky; left:0; z-index:2; background:#fff; text-align:left;
    padding:6px 10px; font-weight:600; width:150px; min-width:150px; max-width:150px;
    box-shadow:1px 0 0 var(--line);
  }
  /* Table layout hands leftover width to whichever cell asks for it. Without
     this filler the weekly grid (few columns) balloons its cells while the
     daily grid (many columns) stays compact — so both get one, and both then
     size to content and scroll the same way. */
  .habit-filler{width:100%; min-width:0; background:#fff; border-right:none !important; padding:0;}
  /* Name and the remove button share a row so a long habit wraps its text
     rather than pushing the ✕ onto a line of its own. */
  .habit-name-cell{display:flex; align-items:flex-start; gap:6px;}
  .habit-name-cell .txt{flex:1; min-width:0; overflow-wrap:anywhere;}
  thead .habit-name-col{z-index:3; background:var(--paper-2);}
  .habit-wk-head{
    background:var(--wk); font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.03em; padding:5px 4px; text-align:center; color:var(--ink);
  }
  .habit-dow{
    background:var(--wk); padding:3px 0; text-align:center; font-weight:700;
    width:30px; min-width:30px; line-height:1.25;
  }
  .habit-dow .d{font-size:9.5px; color:var(--ink-soft); display:block; text-transform:uppercase;}
  .habit-dow .n{font-family:'JetBrains Mono'; font-size:11px;}
  .habit-dow.is-today{background:var(--mustard); color:#3a2a05;}
  .habit-dow.is-today .d{color:#3a2a05;}
  .habit-cell{padding:0; text-align:center; background:color-mix(in srgb, var(--wk) 32%, #fff);}
  .habit-cell.is-today{background:color-mix(in srgb, var(--mustard) 18%, #fff);}
  .habit-cell.is-future{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 3px,#f2f2f2 3px,#f2f2f2 6px);}
  .habit-box{
    width:17px; height:17px; margin:4px auto; display:block; cursor:pointer;
    border:1.5px solid #b9b2a4; border-radius:4px; background:#fff; padding:0;
    font-size:11px; line-height:1; color:#fff;
  }
  .habit-box.on{background:var(--good); border-color:var(--good);}
  .habit-box:disabled{cursor:default; opacity:0.35;}
  .habit-row-total{padding:0 8px; text-align:center; font-family:'JetBrains Mono'; font-size:11px; color:var(--ink-soft); white-space:nowrap;}
  .habit-del{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; padding:0; line-height:1.4; flex-shrink:0;}
  .habit-sub{font-size:12px; color:var(--ink-soft); margin:16px 0 8px;}
  .habit-chart{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px 6px;}
  .habit-stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .habit-stat{flex:1; min-width:120px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .habit-stat .lbl{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-soft);}
  .habit-stat .num{font-family:'JetBrains Mono'; font-size:22px; font-weight:700; margin-top:2px;}
  @media(max-width:640px){
    .habit-name-col{width:118px; min-width:118px; max-width:118px; font-size:11.5px; padding:6px 8px;}
    .habit-stat{min-width:100px;}
  }

  /* ---------- Rewards ---------- */
  .points-strip{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .points-card{flex:1; min-width:120px; border-radius:12px; padding:14px; box-shadow:var(--shadow);}
  .points-card .head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .points-card .num{font-family:'JetBrains Mono'; font-size:26px; font-weight:700;}
  .points-card .lbl{font-size:12px; opacity:0.9; font-weight:600;}
  .reward-item{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff; flex-wrap:wrap; gap:8px;}
  .reward-item .name{font-weight:600; font-size:14px;}
  .reward-item .cost{font-size:12px; color:var(--ink-soft);}

  /* ---------- Budget ---------- */
  .budget-card{position:relative;}
  .budget-card.debt{background:var(--danger) !important;}
  .budget-card .debt-note{font-size:11px; margin-top:4px; font-weight:700; opacity:0.95;}
  .txn-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; background:#fff;}
  .txn-row .amt{font-family:'JetBrains Mono'; font-weight:700; font-size:14px; min-width:70px;}
  .txn-row .amt.neg{color:var(--danger);}
  .txn-row .amt.pos{color:var(--good);}
  .txn-row .meta{flex:1; font-size:13px;}
  .txn-row .meta .note{color:var(--ink-soft); font-size:12px;}
  .quick-amt{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .quick-amt button{background:var(--paper-2); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;}

  /* ---------- Meals ---------- */
  .sub-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .sub-tabs button{background:var(--paper-2); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .sub-tabs button.active{background:var(--board); color:#fff; border-color:var(--board);}
  .meal-plan-grid{display:grid; grid-template-columns:80px repeat(7,1fr); gap:6px; overflow-x:auto;}
  .meal-plan-grid .mp-head{font-size:11px; font-weight:700; text-align:center; color:var(--ink-soft); text-transform:uppercase;}
  .meal-slot-label{font-size:11px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center;}
  .meal-cell{background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px; min-height:44px; font-size:12px; cursor:pointer;}
  .meal-cell:empty::before{content:'+'; color:#ccc;}
  .recipe-card{border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; background:#fff;}
  .recipe-card h4{margin:0 0 6px 0; font-size:15px;}
  .recipe-card .ing{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .list-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; background:#fff;}
  .list-row input[type=checkbox]{width:18px; height:18px; flex-shrink:0;}
  .list-row .txt{flex:1; font-size:14px;}
  .list-row .txt.done{text-decoration:line-through; color:var(--ink-soft);}
  .qty-tag{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono';}
  .row-x{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:2px 6px;}
  .add-row{display:flex; gap:8px; margin-top:10px;}
  .add-row input{flex:1;}

  /* ---------- Settings / avatar picker ---------- */
  .swatch-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:6px;}
  .swatch{width:100%; aspect-ratio:1; border-radius:8px; cursor:pointer; border:3px solid transparent;}
  .swatch.selected{border-color:var(--board);}
  .avatar-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .avatar-tabs button{flex:1; background:var(--paper-2); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .avatar-tabs button.active{background:var(--board); color:#fff; border-color:var(--board);}
  .emoji-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:10px;}
  .emoji-opt{font-size:20px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 0; cursor:pointer;}
  .emoji-opt.selected{border-color:var(--board); background:var(--paper-2);}

  /* ---------- Screensaver ---------- */
  #screensaver{position:fixed; inset:0; background:var(--board); z-index:500; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; cursor:pointer;}
  #screensaver .clock{font-family:'JetBrains Mono'; font-size:64px; font-weight:700;}

<script>

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* Rainbow palette — hex + a matching text color for contrast */
const PALETTE = [
  {name:'Blue',       hex:'#3B6FE0', text:'#fff'},
  {name:'Red',        hex:'#E2413F', text:'#fff'},
  {name:'Green',      hex:'#3FA34D', text:'#fff'},

  {name:'Purple',     hex:'#9455C9', text:'#fff'},

  {name:'Teal',       hex:'#2F9E8F', text:'#fff'},
  {name:'Sage',       hex:'#8FA86B', text:'#2a2a05'},
  {name:'Sky Blue',   hex:'#4FB3E8', text:'#0a2a3a'},
  {name:'Sea Green',  hex:'#2E9E7A', text:'#fff'},
  {name:'Maroon Red', hex:'#7A2530', text:'#fff'},

let state = null;
const STORAGE_KEY = 'family-hub-state-v2';

/* Storage adapter: uses Claude's shared cross-device storage when available
   (window.storage, inside claude.ai artifacts). When self-hosted elsewhere,
   window.storage won't exist, so this falls back to the browser's localStorage —
   which still works, but only syncs on THIS device/browser, not across devices.
   See the README for how to wire up real cross-device sync on your own hosting. */
const storageAdapter = (window.storage && typeof window.storage.get === 'function') ? window.storage : {
  async get(key){ const v = localStorage.getItem(key); return v ? {key, value:v, shared:false} : null; },
  async set(key, value){ localStorage.setItem(key, value); return {key, value, shared:false}; },
  async delete(key){ localStorage.removeItem(key); return {key, deleted:true, shared:false}; },
  async list(prefix){ return {keys: Object.keys(localStorage).filter(k=>!prefix||k.startsWith(prefix)), shared:false}; }
};
const usingLocalFallback = !(window.storage && typeof window.storage.get === 'function');

function defaultState(){

      {id:'p2', name:'Dad', color:'#3B6FE0', avatarType:'color', avatarEmoji:'', avatarImage:''},
      {id:'p3', name:'Kid 1', color:'#F2C230', avatarType:'color', avatarEmoji:'', avatarImage:''},

    ],

      {id:'r3', name:'Skip one chore day', cost:30}
    ],
    points: {},

    meals: { plan:{}, recipes:[], pantry:[], grocery:[] },
    habits: { items: [], log: {} },
    outlook: { clientId: '' },
    google: { clientId: '640349356853-ljl8ljpfpktegj49f9f4kr1kkb6fngv2.apps.googleusercontent.com', calendarId: 'ac3601938b78b11f2849f0a53d25e7047d4c115a510dd7d02464bc8a72b60a85@group.calendar.google.com', apiKey: '', consented: false },
    pin: '1234',

function todayStr(){ const d=new Date(); return fmtDate(d); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ============================= RECURRING EVENTS (series) =============================
   A series is stored as ordinary events that share a `seriesId`, so every existing
   render path (month/week/day, screensaver, ICS export) keeps working untouched.

   Sync model: the series is pushed to Google/Outlook as ONE recurring event, and the
   provider's master-event id is stored on every local instance (`seriesGoogleId` /
   `seriesGraphId`). When the next pull expands that series back into instances, each
   one is matched to its local twin by (master id + date) and adopts the instance id —
   so a series never round-trips into duplicates. */
const RECUR_MAX = 200;      // hard cap on generated occurrences
const RECUR_MAX_YEARS = 3;  // how far ahead an open-ended rule runs
const RECUR_ABS_YEARS = 25; // absolute far-future backstop
const RECUR_LABELS = {
  daily:'Every day', weekdays:'Every weekday', weekly:'Every week',
  biweekly:'Every 2 weeks', monthly:'Every month', yearly:'Every year'
};
const GRAPH_DOW = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];

/* Same month/day in a later month — null when that day doesn't exist (Feb 31). */
function nthMonthFrom(start, n){
  const probe = new Date(start.getFullYear(), start.getMonth()+n, 1);
  const day = start.getDate();
  const lastDay = new Date(probe.getFullYear(), probe.getMonth()+1, 0).getDate();
  return day > lastDay ? null : new Date(probe.getFullYear(), probe.getMonth(), day);
}
function nthYearFrom(start, n){
  const y = start.getFullYear()+n, m = start.getMonth(), day = start.getDate();
  const lastDay = new Date(y, m+1, 0).getDate();
  return day > lastDay ? null : new Date(y, m, day);
}

/* Expands a rule into concrete YYYY-MM-DD strings. The start date is always the
   first occurrence (RFC 5545 DTSTART), even when it doesn't match the rule. */
function expandRecurrence(startStr, rec){
  const out = [startStr];
  if(!startStr || !rec || !rec.freq || rec.freq==='none') return out;
  const start = parseDate(startStr);
  if(isNaN(start)) return out;

  /* An end date before the start means the series is just the one event —
     it must not fall through and be treated as open-ended. */
  const until = rec.until || null;
  if(until && until < startStr) return out;

  const maxCount = Math.min(rec.count || RECUR_MAX, RECUR_MAX);
  /* A count is honoured on its own terms (10 yearly events = 10 years). Only
     open-ended rules get squeezed into the short look-ahead window. */
  const horizon = new Date(start);
  horizon.setFullYear(horizon.getFullYear() + ((rec.count || until) ? RECUR_ABS_YEARS : RECUR_MAX_YEARS));

  const cursor = new Date(start);
  let step = 0, bail = false;

  for(let guard=0; guard<5000 && !bail; guard++){
    if(!until && out.length >= maxCount) break;
    let next = null;
    switch(rec.freq){
      case 'daily':    cursor.setDate(cursor.getDate()+1); next = new Date(cursor); break;
      case 'weekdays': do { cursor.setDate(cursor.getDate()+1); } while(cursor.getDay()===0 || cursor.getDay()===6);
                       next = new Date(cursor); break;
      case 'weekly':   cursor.setDate(cursor.getDate()+7);  next = new Date(cursor); break;
      case 'biweekly': cursor.setDate(cursor.getDate()+14); next = new Date(cursor); break;
      case 'monthly':  next = nthMonthFrom(start, ++step); break;
      case 'yearly':   next = nthYearFrom(start, ++step);  break;
      default: bail = true;
    }
    if(bail) break;
    if(!next){
      /* Skipped month/year (e.g. the 31st in February) — keep walking, but stop
         once even the skipped candidates are past the horizon. */
      const probe = rec.freq==='monthly'
        ? new Date(start.getFullYear(), start.getMonth()+step, 1)
        : new Date(start.getFullYear()+step, start.getMonth(), 1);
      if(probe > horizon) break;
      continue;
    }
    if(next > horizon) break;
    const ds = fmtDate(next);
    if(until && ds > until) break;
    out.push(ds);
    if(out.length >= RECUR_MAX) break;
  }
  return out;
}

/* COUNT is used (never UNTIL) so the provider's series length always matches the
   instances generated locally — no timezone edge cases on the UNTIL boundary. */
function recurToRRule(freq, count){
  const c = ';COUNT='+count;
  switch(freq){
    case 'daily':    return 'RRULE:FREQ=DAILY'+c;
    case 'weekdays': return 'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR'+c;
    case 'weekly':   return 'RRULE:FREQ=WEEKLY'+c;
    case 'biweekly': return 'RRULE:FREQ=WEEKLY;INTERVAL=2'+c;
    case 'monthly':  return 'RRULE:FREQ=MONTHLY'+c;
    case 'yearly':   return 'RRULE:FREQ=YEARLY'+c;
    default: return null;
  }
}
function recurToGraph(startStr, freq, count, tz){
  if(!freq || freq==='none') return null;
  const d = parseDate(startStr);
  let pattern;
  switch(freq){
    case 'daily':    pattern = {type:'daily', interval:1}; break;
    case 'weekdays': pattern = {type:'weekly', interval:1, daysOfWeek:['monday','tuesday','wednesday','thursday','friday']}; break;
    case 'weekly':   pattern = {type:'weekly', interval:1, daysOfWeek:[GRAPH_DOW[d.getDay()]]}; break;
    case 'biweekly': pattern = {type:'weekly', interval:2, daysOfWeek:[GRAPH_DOW[d.getDay()]]}; break;
    case 'monthly':  pattern = {type:'absoluteMonthly', interval:1, dayOfMonth:d.getDate()}; break;
    case 'yearly':   pattern = {type:'absoluteYearly', interval:1, dayOfMonth:d.getDate(), month:d.getMonth()+1}; break;
    default: return null;
  }
  return { pattern, range:{ type:'numbered', startDate:startStr, numberOfOccurrences:count, recurrenceTimeZone:tz } };
}
function seriesLabel(e){
  if(!e || !e.seriesId) return '';
  const rule = e.seriesRule || {};
  const base = RECUR_LABELS[rule.freq] || 'Repeating';
  return rule.count ? `${base} · ${rule.count} events` : base;
}
function seriesMembers(seriesId){
  return state.events.filter(e=>e.seriesId===seriesId).sort((a,b)=>a.date.localeCompare(b.date));
}

function migrateState(s){
  if(!s.budget) s.budget = { transactions: [] };
  if(!s.calFilter) s.calFilter = 'all';
  if(!s.familyLabel) s.familyLabel = 'Family calendar';
  if(!s.outlook) s.outlook = { clientId: '' };
  if(!s.google) s.google = { clientId: '' };
  if(!s.google.calendarId) s.google.calendarId = 'ac3601938b78b11f2849f0a53d25e7047d4c115a510dd7d02464bc8a72b60a85@group.calendar.google.com';
  if(s.google.consented === undefined) s.google.consented = false;
  if(s.google.apiKey === undefined) s.google.apiKey = '';
  (s.people||[]).forEach(p=>{
    if(!p.avatarType) p.avatarType = 'color';
    if(p.avatarEmoji===undefined) p.avatarEmoji='';
    if(p.avatarImage===undefined) p.avatarImage='';
  });
  (s.chores||[]).forEach(c=>{
    if(Array.isArray(c.done)){ c.done = false; }
    if(c.done===undefined) c.done = false;
  });
  if(!s.habits) s.habits = { items: [], log: {} };
  if(!Array.isArray(s.habits.items)) s.habits.items = [];
  if(!s.habits.log || typeof s.habits.log !== 'object') s.habits.log = {};
  if(!s.habitMonth) s.habitMonth = monthStr(new Date());
  if(!s.habitPersonId) s.habitPersonId = (s.people && s.people[0] && s.people[0].id) || 'p1';
  return s;
}

async function loadState(){
  let raw = null;
  try{
    const res = await storageAdapter.get(STORAGE_KEY, true);
    raw = res && res.value ? res.value : null;
  }catch(e){ /* nothing stored yet — first run */ }

  if(raw){
    try{
      state = migrateState(JSON.parse(raw));
      return;
    }catch(e){
      // Data exists but won't parse. DON'T overwrite it — back it up so it's recoverable.
      console.error('State parse failed; backing up raw data.', e);
      try{ await storageAdapter.set(STORAGE_KEY+'-corrupt-backup', raw, true); }catch(_){}
      toast('Saved data was unreadable. A backup was kept and a fresh start was created.', 'error');
    }
  }
  state = defaultState();
  await saveState();
}

let saveTimer=null;
async function saveState(){
  clearTimeout(saveTimer);
  return new Promise(resolve=>{
    saveTimer = setTimeout(async ()=>{
      try{
        const payload = JSON.stringify(state);
        // Guard: warn before hitting typical 5MB storage ceilings (usually big avatar photos).
        if(payload.length > 4_500_000){
          toast('Storage is nearly full — try smaller profile photos or remove old imported events.', 'error');
        }
        await storageAdapter.set(STORAGE_KEY, payload, true);
      }catch(e){
        console.error('Save failed', e);
        toast('Couldn\'t save your last change. Check connection/space and try again.', 'error');
      }
      resolve();
    }, 250);
  });
}

function personById(id){ return state.people.find(p=>p.id===id); }
function pointsFor(id){ return state.points[id] || 0; }
function addPoints(id, n){ state.points[id] = pointsFor(id) + n; }
function budgetFor(id){ return state.budget.transactions.filter(t=>t.personId===id).reduce((sum,t)=>sum+t.amount,0); }

/* ---- Avatar rendering ---- */
function avatarHtml(p, size){
  const cls = 'avatar' + (size?(' '+size):'');
  if(p.avatarType==='image' && p.avatarImage){
    return `<span class="${cls}"><img src="${p.avatarImage}" alt=""></span>`;
  }
  if(p.avatarType==='emoji' && p.avatarEmoji){
    return `<span class="${cls}" style="background:${p.color}22;">${p.avatarEmoji}</span>`;
  }
  return `<span class="${cls}" style="background:${p.color};"></span>`;
}

/* ============================= LOCK ============================= */
let unlocked = true;
let pendingPin = '';
let unlockCallback = null;

/* PINs are stored hashed (SHA-256) when the browser supports it, so the parental
   PIN isn't sitting in storage as plain text. Falls back to plain compare only
   where crypto isn't available (e.g. insecure context), so it always works. */
async function hashPin(p){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* fall through */ }
  return null;
}
async function checkPin(entered){
  if(state.pinHash){
    const h = await hashPin(entered);
    if(h) return h === state.pinHash;
    return entered === (state.pin || ''); // fallback if hashing unavailable now
  }
  return entered === (state.pin || '1234');
}
async function setPin(newPin){
  const h = await hashPin(newPin);
  if(h){ state.pinHash = h; delete state.pin; }
  else { state.pin = newPin; delete state.pinHash; }
  await saveState();
}

function requireUnlock(cb){
  if(unlocked){ cb(); return; }
  unlockCallback = cb;
  showLockscreen();
}
function showLockscreen(){
  pendingPin='';
  document.getElementById('lockErr').textContent='';
  renderPinDisplay();
  document.getElementById('lockscreen').style.display='flex';
}
function renderPinDisplay(){
  const el = document.getElementById('pinDisplay');
  el.innerHTML='';
  for(let i=0;i<4;i++){
    const span=document.createElement('span');
    if(i<pendingPin.length) span.classList.add('filled');
    el.appendChild(span);
  }
}
function buildKeypad(){
  const kp = document.getElementById('keypad');
  kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    const b=document.createElement('button');
    b.textContent=k;
    if(k===''){ b.style.visibility='hidden'; }
    else{
      b.addEventListener('click', ()=>{
        if(k==='⌫'){ pendingPin = pendingPin.slice(0,-1); }
        else if(pendingPin.length<4){ pendingPin += k; }
        renderPinDisplay();
        if(pendingPin.length===4){
          const entered = pendingPin;
          setTimeout(async ()=>{
            const ok = await checkPin(entered);
            if(ok){
              unlocked = true;
              document.getElementById('lockscreen').style.display='none';
              updateLockIndicator();
              if(unlockCallback){ unlockCallback(); unlockCallback=null; }
            } else {
              document.getElementById('lockErr').textContent = 'Incorrect PIN, try again';
              pendingPin='';
              renderPinDisplay();
            }
          }, 150);
        }
      });
    }
    kp.appendChild(b);
  });
}
function updateLockIndicator(){
  document.getElementById('lockIndicator').style.background = unlocked ? 'var(--mustard)' : 'var(--danger)';
}
document.getElementById('lockBtn').addEventListener('click', ()=>{
  unlocked = false;
  updateLockIndicator();
  showLockscreen();
});
document.getElementById('cancelUnlock').addEventListener('click', ()=>{
  document.getElementById('lockscreen').style.display='none';
  unlockCallback=null;
});

/* ============================= SCREENSAVER ============================= */
let idleTimer=null;
const IDLE_MS = 90000;
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(enterScreensaver, IDLE_MS);
}
function enterScreensaver(){
  const ss = document.getElementById('screensaver');
  ss.style.display='flex';
  tickClock();
  renderUpNext();
  ss._interval = setInterval(tickClock, 1000);
}
function exitScreensaver(){
  const ss = document.getElementById('screensaver');
  ss.style.display='none';
  clearInterval(ss._interval);
  resetIdleTimer();
}
function tickClock(){
  const now = new Date();
  document.getElementById('ssClock').textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  document.getElementById('ssDate').textContent = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
}
function renderUpNext(){
  const today = todayStr();
  const todays = state.events.filter(e=>e.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el = document.getElementById('ssUpNext');
  el.innerHTML = todays.slice(0,5).map(e=>{
    const p = personById(e.personId);
    return `<div class="ev-pill" style="background:${p?p.color:'#888'}; color:${p?p.text||'#fff':'#fff'};">${p?p.name+': ':''}${escapeHtml(e.title)}${e.time? ' · '+e.time:''}</div>`;
  }).join('') || '<div style="opacity:0.6;font-size:13px;">Nothing else on today\'s calendar 🎉</div>';
}
document.getElementById('screensaver').addEventListener('click', exitScreensaver);
document.getElementById('screensaverBtn').addEventListener('click', enterScreensaver);
['mousemove','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{
  if(document.getElementById('screensaver').style.display!=='flex') resetIdleTimer();
}));

/* ============================= HELPERS ============================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Toasts: every failure and every success surfaces here, never silently ---- */
let toastTimer=null;
function toast(msg, type){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1500;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:90%;text-align:center;';
    document.body.appendChild(el);
  }
  const colors = { error:['#fdecea','#b71c1c'], success:['#e7f6e9','#1b5e20'], info:['#2E3A46','#fff'] };
  const [bg,fg] = colors[type] || colors.info;
  el.style.background = bg; el.style.color = fg;
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; }, type==='error'?5000:2600);
}

/* ---- Catch-all: any uncaught error or rejected promise anywhere in the app
   is caught here, shown to the user, and does NOT crash the interface. ---- */
window.addEventListener('error', (e)=>{
  console.error('Caught error:', e.error || e.message);
  toast('Something went wrong, but the app is still running. Try again.', 'error');
});
window.addEventListener('unhandledrejection', (e)=>{
  console.error('Unhandled promise rejection:', e.reason);
  const msg = (e.reason && e.reason.message) ? e.reason.message : 'An action didn\'t finish.';
  toast(msg.length < 90 ? msg : 'An action didn\'t finish — please try again.', 'error');
  e.preventDefault();
});
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="ovl"><div class="modal">${html}</div></div>`;
  document.getElementById('ovl').addEventListener('click', e=>{ if(e.target.id==='ovl') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function peopleOptionsHtml(selectedId){
  return state.people.map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
}

/* ============================= TAB NAV ============================= */
let activeTab = 'calendar';
document.getElementById('tabNav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  activeTab = btn.dataset.tab;
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b===btn));

function render(){
  const main = document.getElementById('mainContent');
  try{
    if(activeTab==='calendar') main.innerHTML = renderCalendar();
    else if(activeTab==='chores') main.innerHTML = renderChores();
    else if(activeTab==='habits') main.innerHTML = renderHabits();
    else if(activeTab==='rewards') main.innerHTML = renderRewards();
    else if(activeTab==='budget') main.innerHTML = renderBudget();
    else if(activeTab==='meals') main.innerHTML = renderMeals();
    else if(activeTab==='settings') main.innerHTML = renderSettings();
    else { activeTab='calendar'; main.innerHTML = renderCalendar(); } // catch-all for any unknown view
    attachHandlers();
  }catch(err){
    console.error('Render failed:', err);
    main.innerHTML = `<div class="card"><div class="empty">
        <div class="display">This screen hit a snag</div>
        <p>The rest of the app is fine. You can go back to the calendar and keep going.</p>
        <button class="btn btn-primary" id="recoverBtn">Back to calendar</button>
      </div></div>`;
    const rb = document.getElementById('recoverBtn');
    if(rb) rb.onclick = ()=>{ activeTab='calendar'; document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='calendar')); render(); };
    toast('That screen had a problem and was recovered.', 'error');
  }
}

/* ============================= CALENDAR ============================= */
function renderCalendar(){
  const d = parseDate(state.calDate);
  const viewBtns = ['month','week','day'].map(v=>
    `<button data-calview="${v}" class="${state.calView===v?'active':''}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('');

  let body='';
  if(state.calView==='month') body = renderMonthGrid(d);
  else if(state.calView==='week') body = renderWeekGrid(d);
  else body = renderDayColumns(d);

  let label='';
  if(state.calView==='month') label = MONTHS[d.getMonth()]+' '+d.getFullYear();
  else if(state.calView==='week'){
    const start = startOfWeek(d), end = new Date(start); end.setDate(end.getDate()+6);
    label = `${MONTHS[start.getMonth()].slice(0,3)} ${start.getDate()} – ${MONTHS[end.getMonth()].slice(0,3)} ${end.getDate()}`;
  } else label = `${DOW[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;

  const filterChips = `<span class="person-chip all-chip ${state.calFilter==='all'?'active':''}" data-calfilter="all">🗓️ ${escapeHtml(state.familyLabel || 'Family calendar')}</span>` +
    state.people.map(p=>`<span class="person-chip ${state.calFilter===p.id?'active':''}" data-calfilter="${p.id}">${avatarHtml(p,'sm')}${escapeHtml(p.name)}</span>`).join('');

  const connectedNote = anyCalendarConnected()
    ? `<div style="background:#e7f6e9; border:1px solid #bfe3c4; border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:12.5px; color:#1b5e20; display:flex; align-items:center; justify-content:space-between; gap:8px;">
         <span>🟢 Live calendar connected${googleCount()||outlookCount()?` · ${googleCount()+outlookCount()} events pulled in`:''}</span>
         <button class="btn btn-ghost" id="calSyncManage" style="font-size:12px; padding:5px 10px;">Manage</button>
       </div>`
    : `<div style="background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
         <span>📥 Auto-fill this calendar from Google or Outlook — connect it under <strong>Settings → Open calendar sync</strong>.</span>
       </div>`;

  return `
    <div class="card">
      <div class="section-title">
        <h2>Calendar</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" id="syncBtn">🔄 Sync</button>
          <button class="btn btn-mustard" id="addEventBtn">+ Add event</button>
        </div>
      </div>
      ${connectedNote}
      <div class="people-row">${filterChips}</div>
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn btn-ghost" id="calPrev">◀</button>

          <button class="btn btn-ghost" id="calNext">▶</button>

        </div>

      </div>
      ${body}
    </div>

}
function startOfWeek(d){ const r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r; }
function visibleEvents(dateStr){
  const evs = state.events.filter(e=>e.date===dateStr);
  return state.calFilter==='all' ? evs : evs.filter(e=>e.personId===state.calFilter);
}

function renderMonthGrid(d){
  const year=d.getFullYear(), month=d.getMonth();
  const first = new Date(year, month, 1);
  const gridStart = startOfWeek(first);
  const cap = monthChipCap();
  let cells='';
  DOW.forEach(w=>cells+=`<div class="dow">${w}</div>`);
  /* Six rows only when the month actually needs them — otherwise the grid ends
     with a dead week of greyed-out cells. */
  const weeks = monthWeekCount(first);
  for(let i=0;i<weeks*7;i++){
    const cur = new Date(gridStart); cur.setDate(gridStart.getDate()+i);
    const ds = fmtDate(cur);
    const inMonth = cur.getMonth()===month;
    const isToday = ds===todayStr();
    const dayEvents = visibleEvents(ds).sort(byStartTime);
    /* Keep one slot for the "+N more" line rather than hiding a single event behind it. */
    const shownCount = dayEvents.length > cap ? cap-1 : dayEvents.length;
    const chips = dayEvents.slice(0, shownCount).map(e=>monthChipHtml(e)).join('');
    const hidden = dayEvents.length - shownCount;
    const more = hidden > 0 ? `<div class="day-more">+${hidden} more</div>` : '';
    cells += `<div class="day-cell ${inMonth?'':'other-month'} ${isToday?'today':''}" data-daycell="${ds}">
        <span class="day-num">${cur.getDate()}</span>
        <div class="day-events">${chips}${more}</div>
      </div>`;
  }
  return `<div class="month-grid">${cells}</div>`;
}
function byStartTime(a,b){
  /* All-day events sit above timed ones, the way Google stacks them. */
  if(!a.time && b.time) return -1;
  if(a.time && !b.time) return 1;
  return (a.time||'').localeCompare(b.time||'') || a.title.localeCompare(b.title);
}function monthWeekCount(firstOfMonth){
  const lead = firstOfMonth.getDay();
  const days = new Date(firstOfMonth.getFullYear(), firstOfMonth.getMonth()+1, 0).getDate();
  return Math.ceil((lead + days) / 7);
}
/* How many chips fit before the cell needs a "+N more" — recalculated on resize. */
function monthChipCap(){
  return window.innerWidth < 900 ? 3 : 4;
}
/* Rotating a tablet changes how many chips fit, so re-render — but only when the
   cap actually crosses a breakpoint, not on every resize tick. */
let lastChipCap = monthChipCap();
let chipCapTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(chipCapTimer);
  chipCapTimer = setTimeout(()=>{
    const cap = monthChipCap();
    if(cap === lastChipCap) return;
    lastChipCap = cap;
    if(activeTab==='calendar' && state.calView==='month') render();
  }, 200);
});
function monthChipHtml(e){
  const p = personById(e.personId);
  const color = p ? p.color : '#8a8a8a';
  const text = p && p.text ? p.text : '#fff';
  const label = escapeHtml(e.title);
  /* The cells are too narrow for badges, so who/when/repeating all live in the
     hover tooltip — the chip itself stays as readable as Google's. */
  const tip = escapeHtml(
    (e.time ? e.time+' · ' : 'All day · ')+e.title+(p ? ' · '+p.name : '')+(e.seriesId ? ' · '+seriesLabel(e) : '')
  );
  if(!e.time){
    return `<div class="month-chip allday" style="background:${color}; color:${text};" data-editevent="${e.id}" title="${tip}">
      <span class="chip-title">${label}</span></div>`;
  }
  return `<div class="month-chip timed" style="--chip-color:${color}; --chip-text:${text};" data-editevent="${e.id}" title="${tip}">
    <span class="chip-dot" style="background:${color};"></span>
    <span class="chip-time">${e.time}</span>
    <span class="chip-title">${label}</span></div>`;
}
function renderWeekGrid(d){
  const start = startOfWeek(d);
  let cols='';
  for(let i=0;i<7;i++){
    const cur = new Date(start); cur.setDate(start.getDate()+i);
    const ds = fmtDate(cur);
    const dayEvents = visibleEvents(ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const pills = dayEvents.map(e=>{ const p=personById(e.personId); return `<div class="ev-pill" style="background:${p?p.color:'#999'}; color:${p?p.text||'#fff':'#fff'};" data-editevent="${e.id}">${e.time?e.time+' · ':''}${escapeHtml(e.title)}</div>`; }).join('');
    cols += `<div class="week-col" data-daycell="${ds}">
        <div class="week-col-head">${DOW[cur.getDay()]}<br><span class="mono" style="font-weight:400;">${cur.getDate()}</span></div>
        ${pills}
      </div>`;
  }
  return `<div class="week-grid">${cols}</div>`;
}
function renderDayColumns(d){
  const ds = fmtDate(d);
  const people = state.calFilter==='all' ? state.people : state.people.filter(p=>p.id===state.calFilter);
  const cols = people.map(p=>{
    const evs = state.events.filter(e=>e.date===ds && e.personId===p.id).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const items = evs.map(e=>`<div class="day-event" data-editevent="${e.id}">${e.time?`<span class="t">${e.time}</span>`:''}${escapeHtml(e.title)}</div>`).join('') || `<div style="font-size:12px;color:var(--ink-soft);">No events</div>`;
    return `<div class="person-col">
        <div class="person-col-head">${avatarHtml(p,'sm')}${escapeHtml(p.name)}</div>
        ${items}
      </div>`;
  }).join('');
  return `<div class="day-columns">${cols}</div>`;
}

function connectedCalServices(){
  const s = [];
  if(googleSync.isConnected()) s.push({key:'google', label:'Google Calendar', idField:'googleId', seriesField:'seriesGoogleId', api:googleSync});
  if(outlookSync.isConnected()) s.push({key:'outlook', label:'Outlook', idField:'graphId', seriesField:'seriesGraphId', api:outlookSync});
  return s;
}

function eventModal(existing, presetDate){
  const isEdit = !!existing;
  const ev = existing || {id:null, personId: state.people[0]?.id, date: presetDate || todayStr(), time:'', title:''};
  const inSeries = isEdit && !!ev.seriesId;
  const services = connectedCalServices();
  const serviceChecks = services.map(s=>{
    const linked = !!(ev[s.idField] || ev[s.seriesField]);
    const checked = isEdit ? linked : true; // new events sync out by default; edits reflect current link
    return `<div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="svc_${s.key}" style="width:18px;height:18px;" ${checked?'checked':''}>
      <label style="margin:0;">Sync with ${s.label}</label></div>`;
  }).join('');

  /* New events can start a series; existing ones can only be edited in scope.
     Changing a rule after the fact is deliberately not supported — delete the
     series and add it again, which keeps the provider copy in step. */
  const repeatBlock = isEdit ? '' : `
    <div class="field"><label>Repeats</label>
      <select id="evRepeat">
        <option value="none">Does not repeat</option>
        ${Object.entries(RECUR_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select>
    </div>
    <div class="field" id="evRepeatEndWrap" style="display:none;">
      <label>Ends</label>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <select id="evRepeatEndType" style="width:auto;">
          <option value="count">After</option>
          <option value="until">On date</option>
        </select>
        <input type="number" id="evRepeatCount" min="2" max="${RECUR_MAX}" value="12" style="width:90px;">
        <span id="evRepeatCountLabel" style="font-size:13px; color:var(--ink-soft);">times</span>
        <input type="date" id="evRepeatUntil" style="display:none; width:auto;">
      </div>
    </div>`;

  const seriesBlock = inSeries ? `
    <div style="background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:12.5px;">
      🔁 Part of a repeating series — ${escapeHtml(seriesLabel(ev))}
    </div>
    <div class="field"><label>Apply to</label>
      <select id="evScope">
        <option value="one">This event only</option>
        <option value="all">All events in the series</option>
      </select>
    </div>` : '';

  openModal(`
    <h3>${isEdit?'Edit event':'Add event'}</h3>
    ${seriesBlock}
    <div class="field"><label>Person</label><select id="evPerson">${peopleOptionsHtml(ev.personId)}</select></div>
    <div class="field"><label>Title</label><input id="evTitle" value="${escapeHtml(ev.title)}" placeholder="Soccer practice"></div>
    <div class="field"><label>Date</label><input type="date" id="evDate" value="${ev.date}">
      ${inSeries?`<div id="evDateNote" style="display:none; font-size:12px; color:var(--ink-soft); margin-top:4px;">Each event keeps its own date when you edit the whole series.</div>`:''}</div>
    <div class="field"><label>Time (optional)</label><input type="time" id="evTime" value="${ev.time}"></div>
    ${repeatBlock}
    ${serviceChecks}
    <div class="modal-actions">
      ${isEdit ? '<button class="btn btn-danger" id="evDelete">Delete</button>' : ''}
      <button class="btn btn-ghost" id="evCancel">Cancel</button>
      <button class="btn btn-primary" id="evSave">Save</button>
    </div>
  `);
  document.getElementById('evCancel').onclick = closeModal;

  if(!isEdit){
    const repeatSel = document.getElementById('evRepeat');
    const endWrap = document.getElementById('evRepeatEndWrap');
    const endType = document.getElementById('evRepeatEndType');
    const syncRepeatUi = ()=>{
      endWrap.style.display = repeatSel.value==='none' ? 'none' : '';
      const byCount = endType.value==='count';
      document.getElementById('evRepeatCount').style.display = byCount ? '' : 'none';
      document.getElementById('evRepeatCountLabel').style.display = byCount ? '' : 'none';
      document.getElementById('evRepeatUntil').style.display = byCount ? 'none' : '';
    };
    repeatSel.onchange = syncRepeatUi;
    endType.onchange = syncRepeatUi;
    syncRepeatUi();
  }
  if(inSeries){
    const scopeSel = document.getElementById('evScope');
    scopeSel.onchange = ()=>{
      const all = scopeSel.value==='all';
      document.getElementById('evDate').disabled = all;
      document.getElementById('evDateNote').style.display = all ? '' : 'none';
    };
  }

  const readRecurrence = ()=>{
    const sel = document.getElementById('evRepeat');
    const freq = sel ? sel.value : 'none';
    if(freq==='none') return {freq:'none'};
    if(document.getElementById('evRepeatEndType').value==='until'){
      return {freq, until: document.getElementById('evRepeatUntil').value};
    }
    const n = parseInt(document.getElementById('evRepeatCount').value, 10);
    return {freq, count: Math.max(2, Math.min(RECUR_MAX, isNaN(n) ? 12 : n))};
  };
  const scopeValue = ()=>{
    const sel = document.getElementById('evScope');
    return sel ? sel.value : 'one';
  };

  if(isEdit) document.getElementById('evDelete').onclick = ()=>requireUnlock(async ()=>{
    const wholeSeries = inSeries && scopeValue()==='all';
    const errs = [];
    if(wholeSeries){
      const members = seriesMembers(ev.seriesId);
      for(const s of services){
        try{
          /* Deleting the provider's master removes every instance in one call —
             only fall back to per-instance deletes when there's no master id. */
          if(ev[s.seriesField]) await s.api.removeSeries(ev[s.seriesField]);
          else for(const m of members){ if(m[s.idField]) await s.api.remove(m); }
        }catch(e){ errs.push(s.label); }
      }
      state.events = state.events.filter(e=>e.seriesId!==ev.seriesId);
      await saveState(); closeModal(); render();
      if(errs.length) toast('Series removed here, but couldn\'t delete from '+errs.join(' & ')+'.', 'error');
      else toast(`Series deleted (${members.length} events).`, 'success');
      return;
    }
    for(const s of services){
      if(ev[s.idField]){ try{ await s.api.remove(ev); }catch(e){ errs.push(s.label); } }
    }
    state.events = state.events.filter(e=>e.id!==ev.id);
    await saveState(); closeModal(); render();
    if(errs.length) toast('Removed here, but couldn\'t delete from '+errs.join(' & ')+'.', 'error');
    else toast('Event deleted.', 'success');
  });

  document.getElementById('evSave').onclick = async ()=>{
    const title = document.getElementById('evTitle').value.trim();
    if(!title){ toast('Give the event a title.', 'error'); return; }
    const personId = document.getElementById('evPerson').value;
    const date = document.getElementById('evDate').value;
    const time = document.getElementById('evTime').value;

    /* ---- Edit applied to the whole series ---- */
    if(inSeries && scopeValue()==='all'){
      const members = seriesMembers(ev.seriesId);
      members.forEach(m=>{ m.title = title; m.personId = personId; m.time = time; });
      const errs = [];
      for(const s of services){
        const masterId = ev[s.seriesField];
        if(!masterId) continue;
        try{ await s.api.updateSeries(masterId, members[0]); }catch(e){ errs.push(s.label); }
      }
      await saveState(); closeModal(); render();
      if(errs.length) toast('Series updated here, but sync failed for '+errs.join(' & ')+'.', 'error');
      else toast(`Series updated (${members.length} events).`, 'success');
      return;
    }

    /* ---- New event that starts a series ---- */
    if(!isEdit){
      const rec = readRecurrence();
      const dates = expandRecurrence(date, rec);
      if(dates.length > 1){
        const seriesId = uid();
        const rule = {freq: rec.freq, count: dates.length};
        const instances = dates.map((d, i)=>({
          id: uid(), personId, title, date: d, time,
          source: undefined, seriesId, seriesRule: rule, seriesIndex: i
        }));
        const errs = [];
        for(const s of services){
          const box = document.getElementById('svc_'+s.key);
          if(!(box && box.checked)) continue;
          try{
            const masterId = await s.api.pushSeries(instances[0], rec.freq, dates.length);
            instances.forEach(x=>{ x[s.seriesField] = masterId; if(!x.source) x.source = s.key; });
          }catch(e){ errs.push(s.label); }
        }
        state.events.push(...instances);
        await saveState(); closeModal(); render();
        if(errs.length) toast(`Added ${dates.length} events here, but calendar sync failed for `+errs.join(' & ')+'.', 'error');
        else toast(`Added ${dates.length} events — ${RECUR_LABELS[rec.freq].toLowerCase()}.`, 'success');
        return;
      }
    }

    /* ---- Single event (or one instance of a series) ---- */
    const data = {
      id: ev.id || uid(),
      personId, title, date, time,
      source: ev.source,
      googleId: ev.googleId,
      graphId: ev.graphId,
      seriesId: ev.seriesId,
      seriesRule: ev.seriesRule,
      seriesIndex: ev.seriesIndex,
      seriesGoogleId: ev.seriesGoogleId,
      seriesGraphId: ev.seriesGraphId
    };
    const errs = [];
    for(const s of services){
      const box = document.getElementById('svc_'+s.key);
      const want = box && box.checked;
      const hasId = !!data[s.idField];
      try{
        if(want && !hasId){ data[s.idField] = await s.api.push(data); if(!data.source) data.source = s.key; }
        else if(want && hasId){ await s.api.update(data); }
        else if(!want && hasId){ await s.api.remove(data); data[s.idField] = undefined; }
      }catch(e){ errs.push(s.label); }
    }
    if(isEdit){ const idx = state.events.findIndex(e=>e.id===ev.id); state.events[idx]=data; }
    else state.events.push(data);
    await saveState(); closeModal(); render();
    if(errs.length) toast('Saved here, but calendar sync failed for '+errs.join(' & ')+'. Reconnect and retry.', 'error');
  };
}

/* ============================= CHORES (checkbox + completed bucket) ============================= */
function renderChores(){
  const cols = state.people.map(p=>{
    const mine = state.chores.filter(c=>c.personId===p.id);
    const todo = mine.filter(c=>!c.done);
    const done = mine.filter(c=>c.done);
    const todoRows = todo.map(c=>`
      <div class="chore-row">
        <button class="chore-check" data-chore="${c.id}"></button>
        <span class="name">${escapeHtml(c.name)}</span>
        <span class="pts-tag">${c.points} pt${c.points===1?'':'s'}</span>

      </div>`).join('') || `<div class="chore-row" style="color:var(--ink-soft); font-size:13px;">Nothing to do — nice! 🎉</div>`;
    const doneRows = done.map(c=>`
      <div class="chore-row completed">
        <button class="chore-check checked" data-chore="${c.id}">✓</button>
        <span class="name">${escapeHtml(c.name)}</span>
        <span class="pts-tag">+${c.points}</span>
        <button class="chore-del" data-delchore="${c.id}">✕</button>
      </div>`).join('');
    return `<div class="chore-person-col">
        <div class="chore-person-head" style="background:${p.color}; color:${p.text||'#fff'};">
          <span style="display:flex; align-items:center; gap:8px;">${avatarHtml(p)} ${escapeHtml(p.name)}</span>
          <button class="btn btn-ghost" style="background:rgba(255,255,255,0.2); color:${p.text||'#fff'}; border-color:transparent; padding:4px 10px; font-size:12px;" data-addchore="${p.id}">+ Chore</button>
        </div>
        <div class="chore-list-label">To do</div>
        ${todoRows}
        ${done.length ? `<div class="chore-list-label">Completed</div>${doneRows}` : ''}
      </div>`;
  }).join('');
  return `<div class="card">
      <div class="section-title"><h2>Chore chart</h2><span style="font-size:12px;color:var(--ink-soft);">Tap the checkbox when a chore's done — it moves to Completed and awards points</span></div>
      <div class="chore-grid">${cols}</div>
    </div>`;
}
function choreModal(personId){

/* ============================= HABIT TRACKER =============================
   A month grid of habits: daily habits get one checkbox per day (grouped into
   colour-tinted weeks), weekly habits get one checkbox per week. Completion is
   stored in a flat `log` map keyed `habitId|date`, so adding or removing a habit
   never has to rewrite history. */
function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function parseMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1); }

/* Days of the month split into Sunday-start weeks, matching the calendar tab. */
function habitWeeks(ym){
  const first = parseMonth(ym);
  const total = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const weeks = [];
  let cur = [];
  for(let i=1; i<=total; i++){
    const d = new Date(first.getFullYear(), first.getMonth(), i);
    if(d.getDay()===0 && cur.length){ weeks.push(cur); cur = []; }
    cur.push(d);
  }
  if(cur.length) weeks.push(cur);
  return weeks.map((days, i)=>({ label:'Week '+(i+1), days, tint:'habit-wk'+(i%6) }));
}
function habitLogKey(habit, d){
  /* Weekly habits collapse to their week's start date so any day in that week
     toggles the same box. */
  const anchor = habit.type==='weekly' ? startOfWeek(d) : d;
  return habit.id+'|'+fmtDate(anchor);
}
function habitDone(habit, d){ return !!state.habits.log[habitLogKey(habit, d)]; }
function habitsFor(personId, type){
  return state.habits.items.filter(h=>h.personId===personId && h.type===type);
}
function habitPerson(){
  return personById(state.habitPersonId) || state.people[0];
}

/* Share of that day's daily habits that are ticked — the productivity series. */
function habitDayPct(dailyHabits, d){
  if(!dailyHabits.length) return 0;
  const done = dailyHabits.filter(h=>habitDone(h, d)).length;
  return Math.round((done / dailyHabits.length) * 100);
}
function habitStreak(dailyHabits){
  if(!dailyHabits.length) return 0;
  let streak = 0;
  const d = new Date();
  /* A day only counts once it's complete; today not being done yet shouldn't
     wipe out a streak, so start from yesterday when today is incomplete. */
  if(habitDayPct(dailyHabits, d) < 100) d.setDate(d.getDate()-1);
  for(let i=0; i<400; i++){
    if(habitDayPct(dailyHabits, d) < 100) break;
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

/* Inline SVG area chart — no library, scales with the card. */
function habitChart(dailyHabits, days){
  const W = 720, H = 130, padL = 30, padR = 8, padT = 10, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const today = todayStr();
  const scored = days.filter(d=>fmtDate(d) <= today);
  if(!dailyHabits.length || scored.length < 2){
    return `<div class="habit-chart"><div style="font-size:12px;color:var(--ink-soft);padding:14px 0;text-align:center;">
      ${dailyHabits.length ? 'Tick a couple of days and your productivity line shows up here.' : 'Add a daily habit to start tracking productivity.'}
    </div></div>`;
  }
  const x = i => padL + (scored.length===1 ? plotW/2 : (i/(scored.length-1))*plotW);
  const y = pct => padT + plotH - (pct/100)*plotH;
  const pts = scored.map((d,i)=>`${x(i).toFixed(1)},${y(habitDayPct(dailyHabits,d)).toFixed(1)}`);
  const area = `M ${padL},${padT+plotH} L ${pts.join(' L ')} L ${x(scored.length-1).toFixed(1)},${padT+plotH} Z`;
  const grid = [0,50,100].map(p=>`
    <line x1="${padL}" y1="${y(p)}" x2="${W-padR}" y2="${y(p)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL-6}" y="${y(p)+3}" text-anchor="end" font-size="9" fill="var(--ink-soft)">${p}%</text>`).join('');
  const step = Math.ceil(scored.length/12);
  const xLabels = scored.map((d,i)=> i%step ? '' :
    `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-soft)">${d.getDate()}</text>`).join('');
  return `<div class="habit-chart">
      <div style="font-size:12px; font-weight:700; margin-bottom:4px;">Daily productivity</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="130" role="img" aria-label="Daily habit completion for the month">
        ${grid}
        <path d="${area}" fill="var(--good)" opacity="0.16"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${xLabels}
      </svg>
    </div>`;
}

function renderHabits(){
  const person = habitPerson();
  if(!person) return `<div class="card"><div class="empty">Add someone in Settings first.</div></div>`;
  const ym = state.habitMonth || monthStr(new Date());
  const first = parseMonth(ym);
  const weeks = habitWeeks(ym);
  const days = weeks.flatMap(w=>w.days);
  const today = todayStr();
  const daily = habitsFor(person.id, 'daily');
  const weekly = habitsFor(person.id, 'weekly');

  const chips = state.people.map(p=>
    `<span class="person-chip ${p.id===person.id?'active':''}" data-habitperson="${p.id}">${avatarHtml(p,'sm')}${escapeHtml(p.name)}</span>`
  ).join('');

  /* ---- Stats ---- */
  const scored = days.filter(d=>fmtDate(d) <= today);
  const monthPct = daily.length && scored.length
    ? Math.round(scored.reduce((sum,d)=>sum + habitDayPct(daily,d), 0) / scored.length) : 0;
  const todayPct = daily.length ? habitDayPct(daily, new Date()) : 0;
  const inThisMonth = monthStr(new Date()) === ym;
  const stats = `<div class="habit-stat-row">
      <div class="habit-stat"><div class="lbl">${inThisMonth?'Today':'Month total'}</div><div class="num">${inThisMonth?todayPct:monthPct}%</div></div>
      <div class="habit-stat"><div class="lbl">Month average</div><div class="num">${monthPct}%</div></div>
      <div class="habit-stat"><div class="lbl">Current streak</div><div class="num">${habitStreak(daily)}<span style="font-size:12px;font-weight:600;"> ${habitStreak(daily)===1?'day':'days'}</span></div></div>
    </div>`;

  /* ---- Daily grid: a week-grouped header, one checkbox per day ---- */
  const wkHead = weeks.map(w=>`<th class="habit-wk-head ${w.tint}" colspan="${w.days.length}">${w.label}</th>`).join('');
  const dowHead = weeks.map(w=>w.days.map(d=>{
    const isToday = fmtDate(d)===today;
    return `<th class="habit-dow ${w.tint} ${isToday?'is-today':''}"><span class="d">${DOW[d.getDay()][0]}</span><span class="n">${d.getDate()}</span></th>`;
  }).join('')).join('');

  const dailyRows = daily.map(h=>{
    const cells = weeks.map(w=>w.days.map(d=>{
      const ds = fmtDate(d);
      const future = ds > today;
      const on = habitDone(h, d);
      return `<td class="habit-cell ${w.tint} ${ds===today?'is-today':''} ${future?'is-future':''}">
        <button class="habit-box ${on?'on':''}" data-habit="${h.id}" data-habitdate="${ds}" ${future?'disabled':''}
          title="${escapeHtml(h.name)} · ${ds}" aria-label="${escapeHtml(h.name)} on ${ds}">${on?'✓':''}</button></td>`;
    }).join('')).join('');
    const done = days.filter(d=>fmtDate(d)<=today && habitDone(h,d)).length;
    return `<tr>
        <th class="habit-name-col"><div class="habit-name-cell"><span class="txt">${escapeHtml(h.name)}</span><button class="habit-del" data-delhabit="${h.id}" title="Remove habit">✕</button></div></th>
        ${cells}
        <td class="habit-row-total">${done}/${scored.length}</td>
        <td class="habit-filler"></td>
      </tr>`;
  }).join('');

  const dailyTable = daily.length ? `
    <div class="habit-scroll">
      <table class="habit-table">
        <thead>
          <tr><th class="habit-name-col" rowspan="2">Daily habits</th>${wkHead}<th class="habit-row-total" rowspan="2">Done</th><th class="habit-filler" rowspan="2"></th></tr>
          <tr>${dowHead}</tr>
        </thead>
        <tbody>${dailyRows}</tbody>
      </table>
    </div>` : `<div class="empty">No daily habits yet — add one to build the grid 🌱</div>`;

  /* ---- Weekly grid: one checkbox per week ---- */
  const weeklyRows = weekly.map(h=>{
    const cells = weeks.map(w=>{
      const anchor = w.days[0];
      const future = fmtDate(startOfWeek(anchor)) > today;
      const on = habitDone(h, anchor);
      return `<td class="habit-cell ${w.tint}">
        <button class="habit-box ${on?'on':''}" data-habit="${h.id}" data-habitdate="${fmtDate(anchor)}" ${future?'disabled':''}
          title="${escapeHtml(h.name)} · ${w.label}">${on?'✓':''}</button></td>`;
    }).join('');
    return `<tr>
        <th class="habit-name-col"><div class="habit-name-cell"><span class="txt">${escapeHtml(h.name)}</span><button class="habit-del" data-delhabit="${h.id}" title="Remove habit">✕</button></div></th>
        ${cells}
        <td class="habit-filler"></td>
      </tr>`;
  }).join('');

  const weeklyTable = weekly.length ? `
    <div class="habit-scroll">
      <table class="habit-table">
        <thead><tr><th class="habit-name-col">Weekly habits</th>${weeks.map(w=>`<th class="habit-wk-head ${w.tint}" style="min-width:64px;">${w.label}</th>`).join('')}<th class="habit-filler"></th></tr></thead>
        <tbody>${weeklyRows}</tbody>
      </table>
    </div>` : `<div class="empty">No weekly habits yet — things like "clean the bathroom" fit well here 🧽</div>`;

  return `<div class="card">
      <div class="section-title">
        <h2>Habit tracker</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" id="addWeeklyHabitBtn">+ Weekly habit</button>
          <button class="btn btn-mustard" id="addDailyHabitBtn">+ Daily habit</button>
        </div>
      </div>
      <div class="people-row">${chips}</div>
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn btn-ghost" id="habitPrev">◀</button>
          <strong class="display" style="font-size:17px;">${MONTHS[first.getMonth()]} ${first.getFullYear()}</strong>
          <button class="btn btn-ghost" id="habitNext">▶</button>
          <button class="btn btn-ghost" id="habitToday">This month</button>
        </div>
      </div>
      ${stats}
      ${habitChart(daily, days)}
      <div class="habit-sub">Daily habits — tick each day as you go</div>
      ${dailyTable}
      <div class="habit-sub">Weekly habits — one tick per week</div>
      ${weeklyTable}
    </div>`;
}

  document.getElementById('mpClear').onclick = ()=>{ delete state.meals.plan[key]; saveState(); closeModal(); render(); };
  const recipeSel = document.getElementById('mpRecipe');
  if(recipeSel) recipeSel.onchange = ()=>{ if(recipeSel.value) document.getElementById('mpText').value = recipeSel.value; };
  document.getElementById('mpSave').onclick = ()=>{
    const v = document.getElementById('mpText').value.trim();
    if(v) state.meals.plan[key] = v; else delete state.meals.plan[key];
    saveState(); closeModal(); render();
  };
}
