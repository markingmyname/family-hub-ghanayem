<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- CSP notes: 'wasm-unsafe-eval' lets the recipe text reader (Tesseract OCR,
     loaded on demand from cdn.jsdelivr.net) compile its WebAssembly engine; it
     does not allow eval() of JavaScript. worker-src lets that reader run in a
     background worker it starts from a blob: URL, and keeps 'self' for sw.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://login.live.com https://cdn.jsdelivr.net https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com https://*.supabase.co https://api.open-meteo.com https://geocoding-api.open-meteo.com; frame-src https://login.microsoftonline.com https://login.live.com https://accounts.google.com; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Family Hub</title>
<meta name="theme-color" content="#2E3A46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="application-name" content="Family Hub">
<meta name="msapplication-TileColor" content="#2E3A46">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #2E3A46;
    --family: #14161A;
    --board-2: #3A4856;
    --paper: #FFFDF7;
    --paper-2: #FBF4E7;
    --ink: #2A2A28;
    --ink-soft: #6B6862;
    --line: #E7DFCB;
    --mustard: #E3A731;
    --danger: #C4453B;
    --good: #3FAE49;
    --radius: 14px;
    --shadow: 0 2px 6px rgba(42,32,10,0.08), 0 8px 20px rgba(42,32,10,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.05) 1px, transparent 0) 0 0/16px 16px,
      var(--paper-2);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',cursive;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    background:var(--board);
    background-image: linear-gradient(180deg, var(--board), var(--board-2));
    color:#fff;
    padding:14px 18px 0 18px;
    box-shadow:var(--shadow);
    position:sticky; top:0; z-index:50;
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand h1{font-size:22px; margin:0; letter-spacing:0.3px; font-weight:700;}
  .header-actions{display:flex; gap:8px;}
  .icon-btn{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); color:#fff;
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px;
  }
  .icon-btn:active{transform:scale(0.94);}
  nav.tabs{
    display:flex; gap:4px; margin-top:12px; overflow-x:auto; padding-bottom:0;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent; border:none; color:rgba(255,255,255,0.65);
    font-family:'Baloo 2',cursive; font-size:15px; font-weight:600;
    padding:10px 14px; border-radius:10px 10px 0 0; cursor:pointer; white-space:nowrap;
    border-bottom:3px solid transparent;
  }
  /* The selected tab sits on the peach page colour, not the dark header, so its
     label takes the dark ink colour. White here left the current tab almost
     unreadable — the one label that most needs to stand out. */
  nav.tabs button.active{color:var(--ink); background:var(--paper-2); border-bottom:3px solid var(--mustard);}

  main{flex:1; padding:16px; max-width:1100px; margin:0 auto; width:100%;}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
  .section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .section-title h2{margin:0; font-size:19px;}
  .btn{
    font-family:'Inter'; font-weight:600; font-size:14px; border:none; border-radius:10px;
    padding:9px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--board); color:#fff;}
  .btn-mustard{background:var(--mustard); color:#3a2a05;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn:active{transform:scale(0.97);}
  input, select, textarea{
    font-family:'Inter'; font-size:14px; border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; background:#fff; color:var(--ink); width:100%;
  }
  label{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700;}
  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft);}
  .empty .display{font-size:20px; color:var(--ink); margin-bottom:6px;}

  /* ---------- Avatars ---------- */
  .avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; overflow:hidden; background-size:cover; background-position:center;
  }
  .avatar.sm{width:20px; height:20px; font-size:11px;}
  .avatar.lg{width:44px; height:44px; font-size:22px;}
  /* Chess glyphs carry a lot of empty space above the baseline, so they are
     set slightly larger and nudged up to look centred in the disc. */
  .avatar.piece{font-size:1.15em; line-height:1; padding-bottom:2px;}
  /* Signed out is hollow and grey so it reads as an empty slot rather than
     a person. Signed in is a filled disc - the difference you can see from
     across the kitchen without reading a tooltip. */
  .avatar.signed-out{background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);}
  #accountBtn.signed-in{padding:2px;}
  #accountBtn .avatar{display:inline-flex; align-items:center; justify-content:center;}
  .avatar img{width:100%; height:100%; object-fit:cover;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(30,25,15,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:200;}
  @media(min-width:640px){ .overlay{align-items:center;} }
  .modal{background:var(--paper); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:20px; box-shadow:var(--shadow); max-height:88vh; overflow-y:auto;}
  @media(min-width:640px){ .modal{border-radius:18px;} }
  .modal h3{margin:0 0 14px 0;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1; justify-content:center;}

  /* ---------- People chip row / filter ---------- */
  .people-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .person-chip{
    display:flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--line);
    border-radius:999px; padding:5px 12px 5px 5px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .person-chip.active{border-color:var(--board); background:var(--paper-2);}
  .person-chip.all-chip{padding:5px 14px;}
  .dot{width:16px; height:16px; border-radius:50%; flex-shrink:0;}

  /* ---------- Calendar ---------- */
  .tz-strip{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--paper-2); border:1px solid var(--line); border-radius:10px;
    padding:7px 12px; margin-bottom:12px; font-size:12.5px;
  }
  .tz-one{display:flex; align-items:baseline; gap:6px;}
  .tz-name{font-weight:700;}
  .tz-now{font-family:'JetBrains Mono'; font-size:13px;}
  .tz-sep{color:var(--ink-soft);}
  .tz-hint{margin-left:auto; color:var(--ink-soft); font-size:11.5px;}
  .calendar-connect-note{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper-2);
    font-size:13px;
  }

  /* Event people picker */
  .who-picker{display:flex; flex-wrap:wrap; gap:6px;}
  .who-opt{
    display:flex; align-items:center; gap:6px; cursor:pointer; margin:0;
    border:1.5px solid var(--line); border-radius:999px; padding:5px 12px 5px 8px;
    font-size:13px; font-weight:600; color:var(--ink); background:#fff;
  }
  .who-opt input{width:16px; height:16px; margin:0; cursor:pointer;}
  .who-opt:has(input:checked){border-color:var(--board); background:var(--paper-2);}
  .who-family{flex-basis:100%;}
  .cal-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
  .cal-nav{display:flex; align-items:center; gap:8px;}
  .view-toggle{display:flex; background:var(--paper-2); border-radius:10px; padding:3px; border:1px solid var(--line);}
  .view-toggle button{background:transparent; border:none; padding:6px 12px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft);}
  .view-toggle button.active{background:var(--board); color:#fff;}
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .dow{text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); padding-bottom:4px; text-transform:uppercase;}
  .day-cell{background:#fff; border:1px solid var(--line); border-radius:10px; min-height:112px; padding:6px; cursor:pointer; position:relative; display:flex; flex-direction:column; overflow:hidden;}
  .day-cell.other-month{opacity:0.45;}
  .day-cell.today{border:2px solid var(--mustard);}
  .day-num{font-family:'JetBrains Mono'; font-size:12px; font-weight:700; flex-shrink:0;}
  .day-cell.today .day-num{
    background:var(--mustard); color:#3a2a05; border-radius:999px;
    width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  }
  /* Google-style agenda chips: a solid bar for all-day, a dot + time for timed. */
  .day-events{display:flex; flex-direction:column; gap:2px; margin-top:4px; min-width:0;}
  .month-chip{
    display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
    padding:2px 5px; border-radius:5px; cursor:pointer; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.45;
  }
  .month-chip .chip-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .month-chip .chip-time{font-family:'JetBrains Mono'; font-size:10px; font-weight:700; opacity:0.75; flex-shrink:0;}
  .month-chip .chip-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .month-chip.timed{background:transparent; color:var(--ink);}
  .month-chip.timed:hover{background:var(--paper-2);}
  .month-chip.allday:hover{filter:brightness(1.08);}
  .day-more{font-size:10.5px; font-weight:700; color:var(--ink-soft); padding:1px 5px; margin-top:1px;}

  /* The month board is deliberately denser and darker than the other calendar
     views: it is the family-at-a-glance screen, not a stack of seven cards. */
  .calendar-card.month-view{
    --month-bg:#202124;
    --month-line:#3c4043;
    --month-muted:#9aa0a6;
    background:var(--month-bg);
    border-color:var(--month-line);
    color:#f1f3f4;
    overflow:hidden;
  }
  .calendar-card.month-view .section-title h2,
  .calendar-card.month-view .cal-toolbar .display{color:#f1f3f4;}
  .calendar-card.month-view .btn-ghost{
    color:#f1f3f4;
    border-color:#5f6368;
    background:transparent;
  }
  .calendar-card.month-view .btn-ghost:hover{background:#303134;}
  .calendar-card.month-view .people-row{
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .calendar-card.month-view .people-row::-webkit-scrollbar,
  .month-strip::-webkit-scrollbar{display:none;}
  .calendar-card.month-view .person-chip{
    flex:0 0 auto;
    color:#e8eaed;
    background:#292a2d;
    border-color:#5f6368;
  }
  .calendar-card.month-view .person-chip.active{
    color:#202124;
    background:#8ab4f8;
    border-color:#8ab4f8;
  }
  .calendar-card.month-view .view-toggle{
    background:#292a2d;
    border-color:#5f6368;
  }
  .calendar-card.month-view .view-toggle button{color:#bdc1c6;}
  .calendar-card.month-view .view-toggle button.active{background:#8ab4f8; color:#202124;}
  .calendar-card.month-view .calendar-connect-note{
    background:#292a2d;
    border-color:#5f6368;
    color:#e8eaed;
  }
  .month-strip{
    display:flex;
    align-items:center;
    gap:10px;
    overflow-x:auto;
    margin:0 -16px 14px;
    padding:0 16px 3px;
    scrollbar-width:none;
  }
  .month-jump{
    flex:0 0 auto;
    min-width:76px;
    border:1.5px solid #80868b;
    border-radius:999px;
    background:transparent;
    color:#e8eaed;
    padding:7px 17px;
    font:700 14px 'Inter',sans-serif;
    cursor:pointer;
  }
  .month-jump.active{background:#8ab4f8; border-color:#8ab4f8; color:#111;}
  .month-jump-year{flex:0 0 auto; color:#e8eaed; font-size:16px; font-weight:800;}
  .calendar-card.month-view .month-grid{
    gap:0;
    margin:0 -16px -16px;
    border-top:1px solid var(--month-line);
    border-left:1px solid var(--month-line);
  }
  .calendar-card.month-view .dow{
    background:var(--month-bg);
    color:var(--month-muted);
    padding:9px 4px;
    border-right:1px solid var(--month-line);
    border-bottom:1px solid var(--month-line);
    font-size:12px;
  }
  .calendar-card.month-view .day-cell{
    min-height:150px;
    padding:7px 5px;
    border:0;
    border-right:1px solid var(--month-line);
    border-bottom:1px solid var(--month-line);
    border-radius:0;
    background:var(--month-bg);
    color:#e8eaed;
  }
  .calendar-card.month-view .day-cell:hover{background:#292a2d;}
  .calendar-card.month-view .day-cell.other-month{opacity:1; color:#777b80;}
  .calendar-card.month-view .day-cell.today{border:0; border-right:1px solid var(--month-line); border-bottom:1px solid var(--month-line);}
  .calendar-card.month-view .day-num{
    align-self:center;
    margin-bottom:3px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
  }
  .calendar-card.month-view .day-cell.today .day-num{
    width:28px;
    height:28px;
    margin-top:-3px;
    background:#8ab4f8;
    color:#202124;
    font-size:14px;
    font-weight:700;
  }
  .calendar-card.month-view .day-events{gap:3px; margin-top:1px;}
  .calendar-card.month-view .month-chip{
    min-height:21px;
    padding:2px 6px;
    border-radius:4px;
    font-size:11px;
    font-weight:700;
    line-height:1.5;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .calendar-card.month-view .month-chip.timed{
    background:var(--chip-color);
    color:var(--chip-text,#fff);
  }
  .calendar-card.month-view .month-chip .chip-time{opacity:.9;}
  .calendar-card.month-view .month-chip .chip-dot{display:none;}
  .calendar-card.month-view .day-more{
    color:#bdc1c6;
    padding:1px 5px;
    font-size:11px;
    letter-spacing:.02em;
  }
  @media(max-width:640px){
    .month-grid{gap:3px;}
    .day-cell{min-height:94px; padding:4px; border-radius:8px;}
    .month-chip{font-size:10px; padding:1px 4px; gap:3px;}
    /* Cells are only ~50px wide here, so the dot and time are dropped and the
       chip becomes a solid colour bar — every pixel goes to the title. */
    .month-chip .chip-time, .month-chip .chip-dot{display:none;}
    .month-chip.timed{background:var(--chip-color); color:var(--chip-text,#fff);}
    .day-more{font-size:10px; padding:1px 4px;}
    .calendar-card.month-view{
      width:calc(100% + 32px);
      margin:-16px;
      border-left:0;
      border-right:0;
      border-radius:0;
      padding-top:14px;
    }
    .calendar-card.month-view .section-title{align-items:flex-start;}
    .calendar-card.month-view .section-title .btn{padding:8px 10px; font-size:12px;}
    .calendar-card.month-view .cal-toolbar{align-items:flex-start;}
    .calendar-card.month-view .cal-nav{width:100%; display:grid; grid-template-columns:auto 1fr auto auto;}
    .calendar-card.month-view .cal-nav .display{text-align:center; align-self:center;}
    .calendar-card.month-view .view-toggle{margin-left:auto;}
    .calendar-card.month-view .month-grid{margin-bottom:-16px;}
    .calendar-card.month-view .dow{padding:8px 2px; font-size:11px;}
    .calendar-card.month-view .day-cell{min-height:124px; padding:5px 3px;}
    .calendar-card.month-view .day-num{font-size:12px;}
    .calendar-card.month-view .month-chip{
      min-height:19px;
      padding:1px 4px;
      border-radius:3px;
      font-size:9.5px;
      line-height:1.55;
    }
    .calendar-card.month-view .day-more{font-size:9px; padding-left:3px;}
    .month-strip{gap:8px;}
    .month-jump{min-width:68px; padding:6px 14px; font-size:13px;}
  }
  .week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .week-col{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; min-height:140px;}
  .week-col-head{font-size:12px; font-weight:700; margin-bottom:6px; text-align:center;}
  .ev-pill{font-size:11px; font-weight:600; padding:3px 6px; border-radius:6px; margin-bottom:4px; cursor:pointer;}
  .day-columns{display:flex; gap:10px; overflow-x:auto;}
  .person-col{flex:1; min-width:150px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px;}
  .person-col-head{display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; margin-bottom:8px; padding-bottom:8px; border-bottom:2px solid var(--line);}
  .day-event{background:var(--paper-2); border-radius:8px; padding:7px 8px; margin-bottom:6px; font-size:12px; cursor:pointer;}
  .day-event .t{font-family:'JetBrains Mono'; font-size:10px; color:var(--ink-soft); display:block;}

  /* Day view: one grid so every column's 9am sits on the same line */
  .day-grid-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff;}
  .day-grid{display:grid; min-width:max-content;}
  .dg-corner{position:sticky; left:0; z-index:3; background:var(--paper-2); border-bottom:2px solid var(--line);}
  .dg-head{
    display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px;
    padding:9px 10px; background:var(--paper-2); border-bottom:2px solid var(--line);
    border-left:1px solid var(--line); white-space:nowrap;
  }
  /* The hour rail stays put while the columns scroll sideways. */
  .dg-hour{
    position:sticky; left:0; z-index:2; background:#fff;
    font-family:'JetBrains Mono'; font-size:10.5px; color:var(--ink-soft);
    padding:6px 8px 0 0; text-align:right; border-top:1px solid var(--line);
    box-shadow:1px 0 0 var(--line);
  }
  .dg-cell{border-top:1px solid var(--line); border-left:1px solid var(--line); padding:4px; min-height:34px; display:flex; flex-direction:column; gap:4px; min-width:0;}
  .dg-hour.is-now, .dg-cell.is-now{background:color-mix(in srgb, var(--mustard) 13%, #fff);}
  .dg-hour.is-now{color:#8a6400; font-weight:700;}
  .dg-allday-label{color:var(--ink); font-weight:700;}
  .dg-cell.dg-allday{background:var(--paper-2);}
  .dg-pill{
    border-radius:7px; padding:4px 7px; font-size:12px; font-weight:600;
    cursor:pointer; min-width:0; overflow-wrap:anywhere; line-height:1.3;
  }
  /* One line per title, cut with an ellipsis at whatever width the column has.
     Shared by the day and week views.

     contain:inline-size is the part that matters. .day-grid has
     min-width:max-content, so without it the grid sized itself to the longest
     title on one line, every column shares the same 1fr, and a single long
     title made all seven columns that wide -- which is what forced sideways
     scrolling to see the week. Containment takes the title out of that
     measurement, so columns are sized by the screen and the title is
     ellipsized to fit them.

     If a browser ignored containment the worst case is today's layout with
     single-line titles: no wider than before, and shorter. The full title is
     in the tooltip and one tap away in the event editor. */
  .dg-pill .dg-title{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; contain:inline-size;}
  @media(max-width:640px){
    .dg-head{font-size:12px; padding:7px 8px;}
    .dg-pill{font-size:11px;}
  }

  /* Small ✕ that removes a list row. */
  .row-del{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px;}

  /* ---------- Habit tracker ---------- */
  /* Soft per-week tints, cycled across the weeks of the month so each block of
     days reads as one group at a glance. */
  .habit-wk0{--wk:#F7E3EC;} .habit-wk1{--wk:#E8E3F7;} .habit-wk2{--wk:#DEE9F8;}
  .habit-wk3{--wk:#DEF1E5;} .habit-wk4{--wk:#FBF0D9;} .habit-wk5{--wk:#F3E5DC;}
  .habit-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff;}
  .habit-table{border-collapse:separate; border-spacing:0; width:100%; font-size:12px;}
  .habit-table th, .habit-table td{border-bottom:1px solid var(--line); border-right:1px solid var(--line);}
  .habit-table tr:last-child th, .habit-table tr:last-child td{border-bottom:none;}
  /* The habit name stays put while the day columns scroll sideways. */
  .habit-name-col{
    position:sticky; left:0; z-index:2; background:#fff; text-align:left;
    padding:6px 10px; font-weight:600; width:150px; min-width:150px; max-width:150px;
    box-shadow:1px 0 0 var(--line);
  }
  /* Table layout hands leftover width to whichever cell asks for it. Without
     this filler the weekly grid (few columns) balloons its cells while the
     daily grid (many columns) stays compact — so both get one, and both then
     size to content and scroll the same way. */
  .habit-filler{width:100%; min-width:0; background:#fff; border-right:none !important; padding:0;}
  /* Name and the remove button share a row so a long habit wraps its text
     rather than pushing the ✕ onto a line of its own. */
  .habit-name-cell{display:flex; align-items:flex-start; gap:6px;}
  .habit-name-cell .txt{flex:1; min-width:0; overflow-wrap:anywhere;}
  thead .habit-name-col{z-index:3; background:var(--paper-2);}
  .habit-wk-head{
    background:var(--wk); font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.03em; padding:5px 4px; text-align:center; color:var(--ink);
  }
  .habit-dow{
    background:var(--wk); padding:3px 0; text-align:center; font-weight:700;
    width:30px; min-width:30px; line-height:1.25;
  }
  .habit-dow .d{font-size:9.5px; color:var(--ink-soft); display:block; text-transform:uppercase;}
  .habit-dow .n{font-family:'JetBrains Mono'; font-size:11px;}
  .habit-dow.is-today{background:var(--mustard); color:#3a2a05;}
  .habit-dow.is-today .d{color:#3a2a05;}
  .habit-cell{padding:0; text-align:center; background:color-mix(in srgb, var(--wk) 32%, #fff);}
  .habit-cell.is-today{background:color-mix(in srgb, var(--mustard) 18%, #fff);}
  .habit-cell.is-future{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 3px,#f2f2f2 3px,#f2f2f2 6px);}
  .habit-box{
    width:17px; height:17px; margin:4px auto; display:block; cursor:pointer;
    border:1.5px solid #b9b2a4; border-radius:4px; background:#fff; padding:0;
    font-size:11px; line-height:1; color:#fff;
  }
  .habit-box.on{background:var(--good); border-color:var(--good);}
  .habit-box:disabled{cursor:default; opacity:0.35;}
  .habit-row-total{padding:0 8px; text-align:center; font-family:'JetBrains Mono'; font-size:11px; color:var(--ink-soft); white-space:nowrap;}
  .habit-del{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; padding:0; line-height:1.4; flex-shrink:0;}
  .habit-sub{font-size:12px; color:var(--ink-soft); margin:16px 0 8px;}
  .habit-chart{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px 6px;}
  .habit-stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .habit-stat{flex:1; min-width:120px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .habit-stat .lbl{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-soft);}
  .habit-stat .num{font-family:'JetBrains Mono'; font-size:22px; font-weight:700; margin-top:2px;}
  @media(max-width:640px){
    .habit-name-col{width:118px; min-width:118px; max-width:118px; font-size:11.5px; padding:6px 8px;}
    .habit-stat{min-width:100px;}
  }

  /* ---------- Rewards ---------- */
  .points-strip{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .points-card{flex:1; min-width:120px; border-radius:12px; padding:14px; box-shadow:var(--shadow);}
  .points-card .head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .points-card .num{font-family:'JetBrains Mono'; font-size:26px; font-weight:700;}
  .points-card .lbl{font-size:12px; opacity:0.9; font-weight:600;}
  .reward-item{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff; flex-wrap:wrap; gap:8px;}
  .reward-item .name{font-weight:600; font-size:14px;}
  .reward-item .cost{font-size:12px; color:var(--ink-soft);}

  .row-x{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:2px 6px;}

  /* ---------- Meals ---------- */
  .sub-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .sub-tabs button{background:var(--paper-2); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .sub-tabs button.active{background:var(--board); color:#fff; border-color:var(--board);}
  .meal-plan-grid{display:grid; grid-template-columns:80px repeat(7,1fr); gap:6px; overflow-x:auto;}
  .meal-plan-grid .mp-head{font-size:11px; font-weight:700; text-align:center; color:var(--ink-soft); text-transform:uppercase;}
  .meal-slot-label{font-size:11px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center;}
  .meal-cell{background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px; min-height:44px; font-size:12px; cursor:pointer;}
  .meal-cell:empty::before{content:'+'; color:#ccc;}
  /* Recipe cards: collapsed to name + photo; tap to open the full recipe. */
  .recipe-card{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff;}
  .recipe-card > summary{display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; list-style:none;}
  .recipe-card > summary::-webkit-details-marker{display:none;}
  .recipe-card .rc-name{font-weight:700; font-size:15px; flex:1;}
  .recipe-card .rc-count{font-size:11px; color:var(--ink-soft);}
  .recipe-card .rc-thumb{width:40px; height:40px; object-fit:cover; border-radius:6px;}
  .recipe-card .rc-body{padding:0 12px 12px;}
  .recipe-card .rc-photo{display:block; max-width:100%; max-height:420px; border-radius:8px; margin-bottom:8px;}
  .rc-label{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin:10px 0 4px;}
  .rc-ings, .rc-steps{margin:0; padding-left:20px; font-size:13px;}
  .rc-ings li, .rc-steps li{margin-bottom:3px;}
  .rc-amt{font-weight:700;}
  .rc-memory{margin:0; font-size:13px; font-style:italic;}
  .rc-none{margin:0; font-size:12px; color:var(--ink-soft);}
  .recipe-card .recipe-src{display:inline-block; margin-top:8px; font-size:12px; color:var(--ink-soft);}
  .recipe-add{margin:0 0 12px;}
  /* Recipe form: one row per ingredient, amount box then ingredient box. */
  .rc-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .rc-row .rc-amt-in{flex:0 0 32%; min-width:0;}
  .rc-row .rc-item-in{flex:1; min-width:0;}
  .rc-opt{font-weight:400; color:var(--ink-soft);}
  .rc-photo-preview{display:block; max-width:100%; max-height:220px; border-radius:8px; margin-bottom:6px;}
  .ai-note{font-size:12px; color:var(--ink-soft); margin:0 0 10px;}
  .list-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; background:#fff;}
  .list-row input[type=checkbox]{width:18px; height:18px; flex-shrink:0;}
  .list-row .txt{flex:1; font-size:14px;}
  .list-row .txt.done{text-decoration:line-through; color:var(--ink-soft);}
  .qty-tag{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono';}
  .row-x{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:2px 6px;}
  .add-row{display:flex; gap:8px; margin-top:10px;}
  .add-row input{flex:1;}

  /* ---------- To-Dos (Reminders-style) ---------- */
  .todo-app{display:grid; grid-template-columns:230px 1fr; gap:18px; align-items:start;}
  .todo-sidebar{border-right:1px solid var(--line); padding-right:14px; min-width:0;}
  .todo-side-label{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin:12px 0 6px 4px;}
  .todo-side-item{
    display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:9px;
    cursor:pointer; font-size:14px; font-weight:600; margin-bottom:2px; min-width:0;
  }
  .todo-side-item:hover{background:var(--paper-2);}
  .todo-side-item.active{background:var(--paper-2);}
  .todo-side-icon{
    width:26px; height:26px; border-radius:50%; flex-shrink:0; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .todo-side-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .todo-side-count{font-family:'JetBrains Mono'; font-size:12px; color:var(--ink-soft);}
  .todo-pane{min-width:0;}
  .todo-pane-title{font-family:'Baloo 2'; font-size:30px; font-weight:800; line-height:1.1; margin:0;}
  .todo-pane-sub{font-size:13px; color:var(--ink-soft); margin:2px 0 14px;}
  .todo-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .todo-toolbar .spacer{margin-left:auto;}
  .todo-section-head{
    display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px;
    color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em;
    padding:14px 2px 4px; cursor:pointer;
  }
  .todo-section-head .cnt{margin-left:auto; font-family:'JetBrains Mono'; font-size:11px; text-transform:none;}
  .todo-section-head .caret{font-size:10px; width:10px;}
  .todo-sec-x{background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; padding:0 4px;}
  /* Rows sit on hairlines that start under the title, like Reminders. */
  .todo-row{display:flex; align-items:flex-start; gap:12px; padding:9px 2px;}
  .todo-row + .todo-row{border-top:1px solid var(--line);}
  .todo-row.sub{padding-left:36px;}
  .todo-check{
    width:22px; height:22px; border-radius:50%; border:1.5px solid #c3bcae;
    background:#fff; cursor:pointer; flex-shrink:0; margin-top:2px; padding:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
  }
  .todo-check:hover{border-color:var(--board);}
  .todo-check.on{background:var(--good); border-color:var(--good);}
  .todo-check.prio{border-color:#E2413F;}
  .todo-main{flex:1; min-width:0;}
  .todo-title{font-size:15px; overflow-wrap:anywhere;}
  .todo-row.is-done .todo-title{text-decoration:line-through; color:var(--ink-soft);}
  .todo-notes{font-size:13.5px; color:var(--ink-soft); margin-top:1px; overflow-wrap:anywhere; white-space:pre-wrap;}
  .todo-notes ul{margin:2px 0 0; padding-left:18px;}
  .todo-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:3px; font-size:12px; color:var(--ink-soft);}
  .todo-due.overdue{color:#c62828; font-weight:700;}
  .todo-due.today{color:#E07C1D; font-weight:700;}
  .todo-prio{color:#E2413F; font-weight:800; letter-spacing:-1px; margin-right:3px;}
  .todo-actions{display:flex; align-items:center; gap:2px; flex-shrink:0;}
  .todo-actions button{background:transparent; border:none; cursor:pointer; font-size:15px; color:#b8b1a3; padding:3px 5px; border-radius:6px; line-height:1;}
  .todo-actions button:hover{background:var(--paper-2); color:var(--ink);}
  .todo-flag.on{color:#E07C1D;}
  /* Attachment thumbnails under the notes, mirroring Reminders' file chips. */
  .todo-atts{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .todo-att{
    width:44px; height:44px; border-radius:7px; border:1px solid var(--line);
    overflow:hidden; background:var(--paper-2); cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .todo-att img{width:100%; height:100%; object-fit:cover; display:block;}
  .todo-add{display:flex; gap:8px; margin-top:14px;}
  .todo-add input{flex:1;}
  .att-editor{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .att-chip{position:relative; width:60px; height:60px; border-radius:8px; border:1px solid var(--line); overflow:hidden; background:var(--paper-2); display:flex; align-items:center; justify-content:center; font-size:20px;}
  .att-chip img{width:100%; height:100%; object-fit:cover;}
  .att-chip button{position:absolute; top:1px; right:1px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:17px; height:17px; font-size:11px; cursor:pointer; line-height:1; padding:0;}
  @media(max-width:820px){
    .todo-app{grid-template-columns:1fr; gap:10px;}
    .todo-sidebar{border-right:none; border-bottom:1px solid var(--line); padding-right:0; padding-bottom:8px; display:flex; flex-wrap:wrap; gap:6px;}
    .todo-side-label{display:none;}
    .todo-side-item{border:1.5px solid var(--line); border-radius:999px; padding:5px 12px 5px 6px; margin:0; font-size:13px;}
    .todo-side-item.active{border-color:var(--board);}
    .todo-side-icon{width:22px; height:22px; font-size:11px;}
    .todo-pane-title{font-size:24px;}
    .todo-row.sub{padding-left:28px;}
  }

  /* ---------- Rewards: ways to earn ---------- */
  .earn-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); align-items:start; margin-bottom:6px;}
  .earn-card{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; min-width:0;}
  .earn-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; font-weight:700; font-size:13px; flex-wrap:wrap;}
  .earn-body{padding:4px 0;}
  .earn-row{display:flex; align-items:center; gap:8px; padding:6px 12px; border-top:1px solid var(--line); font-size:12.5px; min-width:0;}
  .earn-row:first-child{border-top:none;}
  .earn-row.is-done{opacity:0.5;}
  .earn-row.is-done .earn-name{text-decoration:line-through;}
  .earn-icon{flex-shrink:0;}
  .earn-name{flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere;}
  .earn-kind{font-size:10.5px; color:var(--ink-soft); white-space:nowrap;}
  .earn-pts{font-family:'JetBrains Mono'; font-weight:700; font-size:12px; white-space:nowrap;}

  /* ---------- Shared completed drawer ---------- */
  .done-drawer{margin-top:18px; border-top:2px solid var(--line); padding-top:10px;}
  .done-drawer-head{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--ink-soft); padding:4px 2px;
  }
  .done-drawer-head .caret{font-size:10px; width:10px;}
  .done-drawer-head .cnt{font-family:'JetBrains Mono'; font-size:11px; text-transform:none;}
  .done-drawer-body{padding-top:6px;}
  .done-empty{font-size:12.5px; color:var(--ink-soft); padding:6px 2px;}
  .done-row{
    display:flex; align-items:center; gap:10px; padding:7px 2px;
    border-bottom:1px solid var(--line); font-size:13px; min-width:0;
  }
  .done-row:last-child{border-bottom:none;}
  .done-row .done-check{
    width:20px; height:20px; border-radius:50%; border:none; background:var(--good);
    color:#fff; font-size:11px; cursor:pointer; flex-shrink:0; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .done-row .name{flex:1; min-width:0; text-decoration:line-through; color:var(--ink-soft); overflow-wrap:anywhere;}
  .done-row .who{font-size:11px; color:var(--ink-soft); white-space:nowrap;}
  .done-row .pts{font-family:'JetBrains Mono'; font-size:11px; color:var(--ink-soft); white-space:nowrap;}

  /* ---------- Settings / avatar picker ---------- */
  .swatch-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:6px;}
  .swatch{width:100%; aspect-ratio:1; border-radius:8px; cursor:pointer; border:3px solid transparent;}
  .swatch.selected{border-color:var(--board);}
  .avatar-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .avatar-tabs button{flex:1; background:var(--paper-2); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .avatar-tabs button.active{background:var(--board); color:#fff; border-color:var(--board);}
  .emoji-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:10px;}
  .emoji-opt{font-size:20px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 0; cursor:pointer;}
  .emoji-opt.selected{border-color:var(--board); background:var(--paper-2);}

  /* ---------- Dashboard ---------- */
  .dash-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); align-items:start;}
  .dash-hero{
    grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:linear-gradient(135deg, var(--board), var(--board-2)); color:#fff;
    border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);
  }
  .dash-hello{font-family:'Baloo 2'; font-size:27px; font-weight:800; line-height:1.15;}
  .dash-sub{font-size:13.5px; opacity:0.8; margin-top:2px;}
  .dash-clock{font-family:'JetBrains Mono'; font-size:34px; font-weight:700; line-height:1;}
  .wx{display:flex; align-items:center; gap:12px;}
  .wx-icon{font-size:38px; line-height:1;}
  .wx-temp{font-family:'JetBrains Mono'; font-size:28px; font-weight:700; line-height:1;}
  .wx-desc{font-size:12.5px; opacity:0.85;}
  .wx-hilo{font-size:12px; opacity:0.7; font-family:'JetBrains Mono';}
  .wx-set{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.22); color:#fff; border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .wx-days{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .wx-day{text-align:center; font-size:11.5px; min-width:52px;}
  .wx-day .d{font-weight:700; color:var(--ink-soft); text-transform:uppercase; font-size:10px;}
  .wx-day .i{font-size:20px; line-height:1.3;}
  .wx-day .t{font-family:'JetBrains Mono'; font-size:11px;}
  .dash-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; min-width:0;}
  .dash-card h3{margin:0 0 10px; font-size:16px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .dash-card h3 .more{font-family:'Inter'; font-size:12px; font-weight:600; color:var(--ink-soft); background:transparent; border:none; cursor:pointer;}
  .dash-line{display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13.5px; min-width:0;}
  .dash-line + .dash-line{border-top:1px solid var(--line);}
  .dash-line .t{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
  .dash-line .n{flex:1; min-width:0; overflow-wrap:anywhere;}
  .dash-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .dash-none{font-size:13px; color:var(--ink-soft); padding:6px 0;}
  .dash-meal{font-family:'Baloo 2'; font-size:20px; font-weight:700;}
  .dash-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .dash-chip{display:flex; align-items:center; gap:7px; background:var(--paper-2); border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 6px; font-size:13px;}
  .dash-chip .pts{font-family:'JetBrains Mono'; font-weight:700;}

  /* ---------- Groceries (Reminders-style) ---------- */
  .groc-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .groc-title{font-family:'Baloo 2'; font-size:30px; font-weight:800; line-height:1.1; margin:0; color:#3FA34D;}
  .groc-sub{font-size:13px; color:var(--ink-soft); margin:2px 0 0;}

/* Same month/day in a later month — null when that day doesn't exist (Feb 31). */
function nthMonthFrom(start, n){
  const probe = new Date(start.getFullYear(), start.getMonth()+n, 1);
  const day = start.getDate();
  const lastDay = new Date(probe.getFullYear(), probe.getMonth()+1, 0).getDate();
  return day > lastDay ? null : new Date(probe.getFullYear(), probe.getMonth(), day);
}
function nthYearFrom(start, n){
  const y = start.getFullYear()+n, m = start.getMonth(), day = start.getDate();
  const lastDay = new Date(y, m+1, 0).getDate();
  return day > lastDay ? null : new Date(y, m, day);
}

/* Expands a rule into concrete YYYY-MM-DD strings. The start date is always the
   first occurrence (RFC 5545 DTSTART), even when it doesn't match the rule. */
function expandRecurrence(startStr, rec){
  const out = [startStr];
  if(!startStr || !rec || !rec.freq || rec.freq==='none') return out;
  const start = parseDate(startStr);
  if(isNaN(start)) return out;

  /* An end date before the start means the series is just the one event —
     it must not fall through and be treated as open-ended. */
  const until = rec.until || null;
  if(until && until < startStr) return out;

  const maxCount = Math.min(rec.count || RECUR_MAX, RECUR_MAX);
  /* A count is honoured on its own terms (10 yearly events = 10 years). Only
     open-ended rules get squeezed into the short look-ahead window. */
  const horizon = new Date(start);
  horizon.setFullYear(horizon.getFullYear() + ((rec.count || until) ? RECUR_ABS_YEARS : RECUR_MAX_YEARS));

  const cursor = new Date(start);
  let step = 0, bail = false;

  for(let guard=0; guard<5000 && !bail; guard++){
    if(!until && out.length >= maxCount) break;
    let next = null;
    switch(rec.freq){
      case 'daily':    cursor.setDate(cursor.getDate()+1); next = new Date(cursor); break;
      case 'weekdays': do { cursor.setDate(cursor.getDate()+1); } while(cursor.getDay()===0 || cursor.getDay()===6);
                       next = new Date(cursor); break;
      case 'weekly':   cursor.setDate(cursor.getDate()+7);  next = new Date(cursor); break;
      case 'biweekly': cursor.setDate(cursor.getDate()+14); next = new Date(cursor); break;
      case 'monthly':  next = nthMonthFrom(start, ++step); break;
      case 'yearly':   next = nthYearFrom(start, ++step);  break;
      default: bail = true;
    }
    if(bail) break;
    if(!next){
      /* Skipped month/year (e.g. the 31st in February) — keep walking, but stop
         once even the skipped candidates are past the horizon. */
      const probe = rec.freq==='monthly'
        ? new Date(start.getFullYear(), start.getMonth()+step, 1)
        : new Date(start.getFullYear()+step, start.getMonth(), 1);
      if(probe > horizon) break;
      continue;
    }
    if(next > horizon) break;
    const ds = fmtDate(next);
    if(until && ds > until) break;
    out.push(ds);
    if(out.length >= RECUR_MAX) break;
  }
  return out;
}

/* COUNT is used (never UNTIL) so the provider's series length always matches the
   instances generated locally — no timezone edge cases on the UNTIL boundary. */
function recurToRRule(freq, count){
  const c = ';COUNT='+count;
  switch(freq){
    case 'daily':    return 'RRULE:FREQ=DAILY'+c;
    case 'weekdays': return 'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR'+c;
    case 'weekly':   return 'RRULE:FREQ=WEEKLY'+c;
    case 'biweekly': return 'RRULE:FREQ=WEEKLY;INTERVAL=2'+c;
    case 'monthly':  return 'RRULE:FREQ=MONTHLY'+c;
    case 'yearly':   return 'RRULE:FREQ=YEARLY'+c;
    default: return null;
  }
}
function recurToGraph(startStr, freq, count, tz){
  if(!freq || freq==='none') return null;
  const d = parseDate(startStr);
  let pattern;
  switch(freq){
    case 'daily':    pattern = {type:'daily', interval:1}; break;
    case 'weekdays': pattern = {type:'weekly', interval:1, daysOfWeek:['monday','tuesday','wednesday','thursday','friday']}; break;
    case 'weekly':   pattern = {type:'weekly', interval:1, daysOfWeek:[GRAPH_DOW[d.getDay()]]}; break;
    case 'biweekly': pattern = {type:'weekly', interval:2, daysOfWeek:[GRAPH_DOW[d.getDay()]]}; break;
    case 'monthly':  pattern = {type:'absoluteMonthly', interval:1, dayOfMonth:d.getDate()}; break;
    case 'yearly':   pattern = {type:'absoluteYearly', interval:1, dayOfMonth:d.getDate(), month:d.getMonth()+1}; break;
    default: return null;
  }
  return { pattern, range:{ type:'numbered', startDate:startStr, numberOfOccurrences:count, recurrenceTimeZone:tz } };
}
function seriesLabel(e){
  if(!e || !e.seriesId) return '';
  const rule = e.seriesRule || {};
  const base = RECUR_LABELS[rule.freq] || 'Repeating';
  return rule.count ? `${base} · ${rule.count} events` : base;
}
function seriesMembers(seriesId){
  return state.events.filter(e=>e.seriesId===seriesId).sort((a,b)=>a.date.localeCompare(b.date));
}

function migrateState(s){
  // Was a single id or 'all' before people could pick several at once.
  if(!Array.isArray(s.calFilter)) s.calFilter = (s.calFilter && s.calFilter !== 'all') ? [s.calFilter] : [];
  // '' means the family calendar — the catch-all everyone sees.
  if(s.syncAssignTo === undefined) s.syncAssignTo = '';
  if(s.syncAssignTo && !(s.people||[]).some(p=>p.id === s.syncAssignTo)) s.syncAssignTo = '';
  if(!s.familyLabel) s.familyLabel = 'Ghanayem family';
  /* Change tracking (see SYNC_SHAPE). `meta` holds the timestamps that let two
     devices merge instead of one overwriting the other, and `activity` is the
     family's record of who changed what. Both are part of the shared board. */
  if(!s.meta || typeof s.meta !== 'object') s.meta = {};
  ['fields','maps','gone','counters'].forEach(k=>{
    if(!s.meta[k] || typeof s.meta[k] !== 'object') s.meta[k] = {};
  });
  if(!Array.isArray(s.activity)) s.activity = [];
  /* Points used to be one running total per person, which can only hold one
     answer when two devices award at the same moment. Everything earned before
     this build is carried over as a single starting tally so nobody loses
     points in the switch; new awards land in the awarding device's own tally. */
  if(!s.points || typeof s.points !== 'object') s.points = { byDevice:{} };
  if(!s.points.byDevice){
    const carried = {};
    Object.keys(s.points).forEach(k=>{ if(typeof s.points[k] === 'number') carried[k] = s.points[k]; });
    s.points = { byDevice: Object.keys(carried).length ? { 'earned-before-change-tracking': carried } : {} };
  }
  if(!s.outlook) s.outlook = { clientId: '' };
  if(!s.google) s.google = { clientId: '' };
  if(!s.google.calendarId) s.google.calendarId = 'ac3601938b78b11f2849f0a53d25e7047d4c115a510dd7d02464bc8a72b60a85@group.calendar.google.com';
  if(s.google.consented === undefined) s.google.consented = false;
  if(s.google.apiKey === undefined) s.google.apiKey = '';
  (s.people||[]).forEach(p=>{
    if(!p.avatarType) p.avatarType = 'color';
    if(p.avatarEmoji===undefined) p.avatarEmoji='';
    if(p.avatarImage===undefined) p.avatarImage='';
    if(p.avatarPiece===undefined) p.avatarPiece='';
    /* Give the household its starting pieces once. Guarded on 'color', the
       untouched default, so this can never replace an avatar somebody chose,
       and guarded on avatarPiece so clearing it back to a plain colour sticks
       instead of being re-applied on the next load. */
    if(p.avatarType === 'color' && !p.avatarPiece){
      const piece = defaultPieceFor(p.name);
      if(piece){ p.avatarPiece = piece; p.avatarType = 'piece'; }
    }
  });
  if(!s.habits) s.habits = { items: [], log: {} };
  if(!Array.isArray(s.habits.items)) s.habits.items = [];
  if(!s.habits.log || typeof s.habits.log !== 'object') s.habits.log = {};
  s.habits.items.forEach(h=>{ if(typeof h.points !== 'number') h.points = 1; });
  if(!s.todos) s.todos = { lists: [], sections: [], items: [] };
  if(!Array.isArray(s.todos.lists)) s.todos.lists = [];
  if(!Array.isArray(s.todos.sections)) s.todos.sections = [];
  if(!Array.isArray(s.todos.items)) s.todos.items = [];
  if(!s.todos.lists.length) s.todos.lists = [
    {id:'l1', name:'Home', color:'#3B6FE0', emoji:'🏡'},
    {id:'l2', name:'School', color:'#E07C1D', emoji:'🎒'},
    {id:'l3', name:'Errands', color:'#3FA34D', emoji:'🛒'}
  ];
  s.todos.items.forEach((t,i)=>{
    if(!Array.isArray(t.personIds)) t.personIds = [];
    if(typeof t.priority !== 'number') t.priority = 0;
    if(typeof t.order !== 'number') t.order = i;
    if(t.flagged === undefined) t.flagged = false;
    if(t.done === undefined) t.done = false;
    if(t.notes === undefined) t.notes = '';
    if(t.due === undefined) t.due = '';
    if(t.sectionId === undefined) t.sectionId = null;
  });
  if(!s.todoView) s.todoView = { listId:'all', sort:'manual', showCompleted:false, collapsed:{} };
  if(!s.todoView.collapsed) s.todoView.collapsed = {};
  if(!s.completedOpen) s.completedOpen = { todos:false, habits:false, grocery:false };
  if(s.completedOpen.grocery === undefined) s.completedOpen.grocery = false;
  /* Existing households get the standard cleaning plan the first time they
     land on a build that has Housekeeping in it. */
  if(!s.housekeeping || !Array.isArray(s.housekeeping.areas) || !s.housekeeping.areas.length) s.housekeeping = defaultHousekeeping();
  if(!Array.isArray(s.housekeeping.tasks)) s.housekeeping.tasks = [];
  if(!Array.isArray(s.housekeeping.log)) s.housekeeping.log = [];
  s.housekeeping.tasks.forEach(t=>{
    if(typeof t.freqDays !== 'number' || t.freqDays < 1) t.freqDays = 7;
    if(typeof t.effort !== 'number') t.effort = 2;
    if(t.lastDone === undefined) t.lastDone = null;
    if(t.personId === undefined) t.personId = '';
    if(typeof t.paused !== 'boolean') t.paused = false;
  });
  if(typeof s.autoRemoveChecked !== 'boolean') s.autoRemoveChecked = false;
  if(!s.habitMonth) s.habitMonth = monthStr(new Date());
  if(!s.habitPersonId) s.habitPersonId = (s.people && s.people[0] && s.people[0].id) || 'p1';
  if(s.timeFormat !== '24h') s.timeFormat = '12h';
  if(!s.timeZones) s.timeZones = { secondaryEnabled:false, primary:'', secondary:'Europe/London', primaryLabel:'', secondaryLabel:'' };
  if(s.timeZones.secondaryEnabled === undefined) s.timeZones.secondaryEnabled = false;
  if(s.timeZones.primary === undefined) s.timeZones.primary = '';
  if(!s.timeZones.secondary) s.timeZones.secondary = 'Europe/London';
  if(s.timeZones.primaryLabel === undefined) s.timeZones.primaryLabel = '';
  if(s.timeZones.secondaryLabel === undefined) s.timeZones.secondaryLabel = '';
  if(typeof s.sleepAfterMin !== 'number' || ![5,10,15,30,60,0].includes(s.sleepAfterMin)) s.sleepAfterMin = 15;
  if(!s.weather) s.weather = { lat:null, lon:null, label:'', unit:'F' };
  if(s.weather.unit !== 'C') s.weather.unit = 'F';
  if(!s.screensaver) s.screensaver = { photos:true, seconds:15, showClock:true };
  if(typeof s.screensaver.seconds !== 'number') s.screensaver.seconds = 15;
  if(typeof s.screensaver.photos !== 'boolean') s.screensaver.photos = true;
  if(typeof s.screensaver.showClock !== 'boolean') s.screensaver.showClock = true;
  /* "Doing it" in Housekeeping moved out of its own localStorage key and into
     the personal settings, so it can follow whoever signed in. */
  if(typeof s.hkWho !== 'string'){
    let legacy = '';
    try{ legacy = localStorage.getItem(HK_WHO_KEY) || ''; }catch(e){ /* no storage — start empty */ }
    s.hkWho = legacy;
  }
  /* Personal settings can now arrive from another device, so the calendar's
     view and date are checked like everything else rather than trusted. */
  if(!['month','week','day'].includes(s.calView)) s.calView = 'month';
  if(typeof s.calDate !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s.calDate)) s.calDate = todayStr();
  /* Grocery items grew a category, quantity and note once the list started
     looking like Reminders. Older rows only had a name and a checkbox. */
  if(!s.meals) s.meals = { plan:{}, recipes:[], pantry:[], grocery:[] };
  if(!Array.isArray(s.meals.grocery)) s.meals.grocery = [];
  s.meals.grocery.forEach((g,i)=>{
    if(!g.cat) g.cat = guessGroceryCat(g.name);
    if(g.qty === undefined) g.qty = '';
    if(g.note === undefined) g.note = '';
    if(typeof g.order !== 'number') g.order = i;
    if(g.done === undefined) g.done = false;
  });
  /* Recipes grew a format: ingredient rows (amount + ingredient), instructions,
     an optional "recipe memory", an optional photo, and the page an imported
     recipe came from. Older recipes kept every ingredient in one comma- or
     line-separated string; normalizeRecipe() splits those into rows. */
  if(!Array.isArray(s.meals.recipes)) s.meals.recipes = [];
  s.meals.recipes = s.meals.recipes
    .filter(r=>r && typeof r.name === 'string' && r.name.trim())
    .map(normalizeRecipe);
  /* Events moved from a single personId to a personIds list. An empty list means
     the event belongs to the whole family (the catch-all calendar). */
  (s.events||[]).forEach(e=>{
    if(!Array.isArray(e.personIds)) e.personIds = e.personId ? [e.personId] : [];
    /* An empty start time has always meant all-day; endTime is simply absent on
       anything created before end times existed. */
    if(e.endTime === undefined) e.endTime = '';
  });
  return s;
}

async function loadState(){
  let raw = null;
  try{
    const res = await storageAdapter.get(STORAGE_KEY, true);
    raw = res && res.value ? res.value : null;
  }catch(e){ /* nothing stored yet — first run */ }

  if(raw){
    try{
      state = migrateState(JSON.parse(raw));
      return;
    }catch(e){
      // Data exists but won't parse. DON'T overwrite it — back it up so it's recoverable.
      console.error('State parse failed; backing up raw data.', e);
      try{ await storageAdapter.set(STORAGE_KEY+'-corrupt-backup', raw, true); }catch(_){}
      toast('Saved data was unreadable. A backup was kept and a fresh start was created.', 'error');
    }
  }
  state = defaultState();
  await saveState();
}

let saveTimer=null;
async function saveState(){
  clearTimeout(saveTimer);
  return new Promise(resolve=>{
    saveTimer = setTimeout(async ()=>{
      try{
        const payload = JSON.stringify(state);
        // Guard: warn before hitting typical 5MB storage ceilings (usually big avatar photos).
        if(payload.length > 4_500_000){
          toast('Storage is nearly full — try smaller profile photos or remove old imported events.', 'error');
        }
        await storageAdapter.set(STORAGE_KEY, payload, true);
      }catch(e){
        console.error('Save failed', e);
        toast('Couldn\'t save your last change. Check connection/space and try again.', 'error');
      }
      /* Both check for real changes first: the board goes up only when the
         family's data changed, personal settings only when they did. That is
         also what stops a copy that just came down from being echoed back up. */
      cloudSync.queuePush();
      mySettings.queuePush();
      resolve();
    }, 250);
  });
}

/* Saves to this device WITHOUT sending anything up. Used when the copy came
   from the cloud in the first place. Writes straight away rather than through
   saveState's 250 ms debounce: waiting on that debounce used to hang whenever
   another save landed inside the window (the debounce restarts and the first
   waiter is never resolved), which left this device quietly not syncing. */
async function saveLocalOnly(){
  try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state), true); }
  catch(e){
    console.error('Save failed', e);
    toast('Couldn\'t save the latest family changes on this device. Check storage space.', 'error');
  }
}

/* >>> SYNC ENGINE BEGIN (the test harness slices on these markers) >>> */
/* ==================== CHANGE TRACKING AND MERGE ====================
   WHAT THIS DOES
   The family board is one JSON document shared by every device. Until this
   block existed, a device sent its whole copy up and the last writer took the
   lot: two people editing inside the same poll window meant one of them
   silently lost everything they had just done. Three pieces fix that.

     SYNC_SHAPE    A description of where the board keeps its data and how each
                   part is allowed to merge. Adding a feature means adding a
                   line here, not editing the merge code.
     stampBoard()  Runs just before sending. Compares this device's copy with
                   the copy the server last confirmed, writes a timestamp onto
                   whatever actually changed, records deletions in a graveyard,
                   and returns the list of changes that becomes the activity
                   feed. One pass produces both, because they are the same
                   question asked twice.
     mergeBoards() Runs just after receiving. Combines the two copies item by
                   item, newest timestamp per item, so both people's edits live.

   DEPENDS ON
     syncNow()     server-corrected clock, defined in the sync section below.
                   Without it a device with a wrong clock would win every
                   conflict or lose every one.
     Nothing else. Every function here is pure apart from stampBoard(), which
     deliberately writes its stamps into the board it is given. That is what
     lets the test harness run this outside a browser.

   USED BY
     cloudSync.push()   stamps before serialising
     cloudSync.pull()   merges instead of replacing
     renderActivity()   reads state.activity

   WHY TIMESTAMPS AND NOT A VERSION NUMBER PER ITEM
   A counter needs one authority to hand out the next number, and a household's
   devices are offline half the time. Wall-clock time needs no authority, and
   the server-corrected clock removes the one thing that breaks it. */

const SYNC_TOMBSTONE_DAYS   = 30;    // how long a deletion is remembered, so a sleeping device cannot resurrect it
const ACTIVITY_MAX          = 200;   // entries kept in the feed
const ACTIVITY_COLLAPSE_AT  = 4;     // more changes than this to one list in one save become a single "added 12 events" line
const HK_LOG_MAX            = 400;   // matches the cap the Housekeeping page already applies
const SYN_DETAIL_MAX        = 400;   // longer than this is a photo or a pasted note, not data

/* How each part of the board is allowed to merge.

   lists     Arrays of objects carrying a stable `id`. Merged item by item.
             `quiet` keeps a list out of the activity feed. `append` marks a
             log that is only ever added to, so it merges by union with no
             timestamps and is trimmed to `cap` newest by `sortKey`.
   maps      Plain objects used as key to value. Merged key by key, with the
             timestamps held alongside in meta.maps because the values
             themselves (true, a meal name) have nowhere to put one.
   fields    Single values, replaced whole, newest wins.
   counters  Per-device tallies, summed on read. A device only ever writes its
             own shard, so two people awarding points at once cannot collide --
             there is nothing left to resolve. */
const SYNC_SHAPE = {
  lists: [
    { path:'people',             noun:'person' },
    { path:'events',             noun:'event' },
    { path:'rewards',            noun:'reward' },
    { path:'meals.recipes',      noun:'recipe' },
    { path:'meals.pantry',       noun:'pantry item' },
    { path:'meals.grocery',      noun:'grocery item' },
    { path:'habits.items',       noun:'habit' },
    { path:'todos.lists',        noun:'to-do list' },
    { path:'todos.sections',     noun:'section' },
    { path:'todos.items',        noun:'to-do' },
    { path:'housekeeping.areas', noun:'cleaning area' },
    { path:'housekeeping.tasks', noun:'cleaning job' },
    { path:'housekeeping.log',   noun:'cleaning tick', quiet:true, append:true, sortKey:'date', cap:HK_LOG_MAX },
    { path:'activity',           noun:'activity entry', quiet:true, append:true, sortKey:'at',  cap:ACTIVITY_MAX }
  ],
  maps: [
    { path:'habits.log', noun:'habit tick', quiet:true },
    { path:'meals.plan', noun:'planned meal' }
  ],
  fields: [
    { path:'familyLabel',  noun:'family name' },
    { path:'syncAssignTo', noun:'calendar sync target', quiet:true },
    { path:'google',       noun:'Google calendar settings', quiet:true },
    { path:'outlook',      noun:'Outlook settings', quiet:true }
  ],
  counters: [ { path:'points' } ]
};

/* ---- small helpers ---- */

function synGet(obj, path){
  let cur = obj;
  for(const part of path.split('.')){
    if(cur === null || typeof cur !== 'object') return undefined;
    cur = cur[part];
  }
  return cur;
}
function synSet(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i = 0; i < parts.length - 1; i++){
    if(cur[parts[i]] === null || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}
function synMeta(board){
  if(!board.meta || typeof board.meta !== 'object') board.meta = {};
  const m = board.meta;
  if(!m.fields   || typeof m.fields   !== 'object') m.fields = {};
  if(!m.maps     || typeof m.maps     !== 'object') m.maps = {};
  if(!m.gone     || typeof m.gone     !== 'object') m.gone = {};
  if(!m.counters || typeof m.counters !== 'object') m.counters = {};
  return m;
}
/* Key order in an object literal is not guaranteed to match between devices, so
   two copies of the same item can stringify differently. Sorting the keys makes
   "has this actually changed?" answerable by string comparison, which is far
   cheaper than a recursive walk. `_u` is excluded because it IS the answer. */
function synPrint(value){
  if(value === undefined) return 'undefined';
  if(value === null || typeof value !== 'object') return JSON.stringify(value);
  if(Array.isArray(value)) return '[' + value.map(synPrint).join(',') + ']';
  return '{' + Object.keys(value).filter(k=>k !== '_u').sort()
    .map(k=>JSON.stringify(k) + ':' + synPrint(value[k])).join(',') + '}';
}
/* Items name themselves differently across the app -- people and groceries use
   `name`, events and to-dos use `title`. Asking in order keeps the feed working
   when a new list arrives using either convention. */
function synLabel(item){
  if(!item || typeof item !== 'object') return '';
  return String(item.name || item.title || item.text || '').trim();
}
function synIndex(arr){
  const by = new Map();
  (Array.isArray(arr) ? arr : []).forEach(it=>{ if(it && it.id != null) by.set(String(it.id), it); });
  return by;
}
function synStamp(item){ const n = Number(item && item._u); return Number.isFinite(n) ? n : 0; }

/* A trimmed copy of an item, kept alongside each change for the daily log.
   Scalar fields only, and nothing long: without the trim, editing one person
   would carry their avatar photo into the log every time, which would be
   megabytes a week. What survives -- who it is assigned to, points, due date,
   done, category, quantity, a short note -- is the part worth analysing. */
function synDetail(item){
  if(!item || typeof item !== 'object') return null;
  const out = {};
  for(const key of Object.keys(item)){
    if(key === '_u' || key === 'id') continue;
    const v = item[key];
    if(v === null || typeof v === 'number' || typeof v === 'boolean'){ out[key] = v; continue; }
    if(typeof v === 'string'){ if(v.length <= SYN_DETAIL_MAX) out[key] = v; continue; }
    if(Array.isArray(v)){
      const flat = v.every(x=>typeof x === 'string' || typeof x === 'number');
      if(flat && JSON.stringify(v).length <= SYN_DETAIL_MAX) out[key] = v;
    }
  }
  return out;
}

/* ---- stamping: what changed on this device since the server last agreed ----
   Mutates `board` on purpose: the stamps have to travel up in the same push as
   the change they describe, and persist locally so a reload does not lose them.
   `base` is the board as the server last confirmed it; null means there is no
   agreed copy yet, in which case nothing is reported as news.

   Returns both shapes the callers need, because they want different things:
     entries  what the family sees -- collapsed, so one calendar import reads as
              one line, and quiet lists left out altogether.
     changes  every individual change, uncollapsed and including the quiet ones
              (habit ticks, chore ticks), which is what the daily log keeps. */
function stampBoard(board, base, nowMs, who){
  const meta = synMeta(board);
  const found = [];                                  // {path, noun, op, name, quiet}

  for(const spec of SYNC_SHAPE.lists){
    if(spec.append) continue;                        // logs are add-only; nothing to diff
    const curArr = synGet(board, spec.path);
    if(!Array.isArray(curArr)) continue;
    const baseArr = base ? synGet(base, spec.path) : null;
    const baseBy  = synIndex(baseArr);

    for(const item of curArr){
      if(!item || item.id == null) continue;
      const prev = baseBy.get(String(item.id));
      if(!base){
        /* No agreed copy to compare against, so leave existing stamps alone and
           only fill in a missing one. Calling everything "new" here would let a
           freshly reloaded device outrank newer edits from everyone else. */
        if(item._u === undefined) item._u = 0;
      }else if(!prev){
        item._u = nowMs;
        found.push({ path:spec.path, noun:spec.noun, op:'add', id:String(item.id),
                      name:synLabel(item), detail:synDetail(item), quiet:spec.quiet });
      }else if(synPrint(item) !== synPrint(prev)){
        item._u = nowMs;
        found.push({ path:spec.path, noun:spec.noun, op:'edit', id:String(item.id),
                      name:synLabel(item), detail:synDetail(item), quiet:spec.quiet });
      }else if(item._u === undefined){
        item._u = synStamp(prev);
      }
    }

    /* Deletions. The item is already gone from the array, so this graveyard
       entry is the only record of it -- without one, any device that still
       holds the item hands it straight back on the next merge. */
    if(base){
      const live = new Set(curArr.filter(i=>i && i.id != null).map(i=>String(i.id)));
      for(const [id, prev] of baseBy){
        if(live.has(id)) continue;
        if(!meta.gone[spec.path]) meta.gone[spec.path] = {};
        meta.gone[spec.path][id] = nowMs;
        found.push({ path:spec.path, noun:spec.noun, op:'remove', id:id, name:synLabel(prev), quiet:spec.quiet });
      }
    }
  }

  /* Maps: a habit tick or a planned meal has nowhere to carry its own stamp, so
     the stamp lives beside it. An absent key with a recent stamp means
     "deleted", which is how un-ticking a habit survives a merge. */
  for(const spec of SYNC_SHAPE.maps){
    const cur = synGet(board, spec.path);
    if(cur === null || typeof cur !== 'object') continue;
    if(!base) continue;
    const prev = synGet(base, spec.path) || {};
    if(!meta.maps[spec.path]) meta.maps[spec.path] = {};
    const stamps = meta.maps[spec.path];
    for(const key of new Set([...Object.keys(cur), ...Object.keys(prev)])){
      const a = Object.prototype.hasOwnProperty.call(cur, key);
      const b = Object.prototype.hasOwnProperty.call(prev, key);
      if(a && b && synPrint(cur[key]) === synPrint(prev[key])) continue;
      stamps[key] = nowMs;
      found.push({ path:spec.path, noun:spec.noun, op: a ? (b ? 'edit' : 'add') : 'remove', id:key,
                   name: a ? String(cur[key] === true ? key : cur[key]) : String(prev[key] === true ? key : prev[key]),
                   quiet:spec.quiet });
    }
  }

  /* Single values, replaced whole. */
  for(const spec of SYNC_SHAPE.fields){
    if(!base) continue;
    const a = synGet(board, spec.path), b = synGet(base, spec.path);
    if(synPrint(a) === synPrint(b)) continue;
    meta.fields[spec.path] = nowMs;
    found.push({ path:spec.path, noun:spec.noun, op:'edit', id:spec.path,
                 name: synLabel(a) || (a === null || typeof a !== 'object' ? String(a) : ''), quiet:spec.quiet });
  }

  /* Per-device counters. Only the shard belonging to this device can have
     changed, so the stamp records that and nothing needs resolving later. No
     feed entry: the chore or habit that earned the points already made one. */
  for(const spec of SYNC_SHAPE.counters){
    const cur = synGet(board, spec.path + '.byDevice');
    if(cur === null || typeof cur !== 'object') continue;
    const prev = (base && synGet(base, spec.path + '.byDevice')) || {};
    for(const shard of Object.keys(cur)){
      if(base && synPrint(cur[shard]) === synPrint(prev[shard])) continue;
      meta.counters[spec.path + '.' + shard] = base ? nowMs : 0;
    }
  }

  synPruneGraveyard(meta, nowMs);
  const entries = synActivityFor(found, nowMs, who);
  if(entries.length){
    board.activity = synTrim([...entries, ...(Array.isArray(board.activity) ? board.activity : [])],
                             'at', ACTIVITY_MAX);
  }
  return { entries, changes: found };
}

/* A deletion only needs remembering for as long as a device might plausibly
   have been asleep still holding the old item. Keeping them forever would grow
   the board without limit. */
function synPruneGraveyard(meta, nowMs){
  const cutoff = nowMs - SYNC_TOMBSTONE_DAYS * 86400000;
  for(const path of Object.keys(meta.gone)){
    const ids = meta.gone[path];
    for(const id of Object.keys(ids)) if((Number(ids[id]) || 0) < cutoff) delete ids[id];
    if(!Object.keys(ids).length) delete meta.gone[path];
  }
}

/* Turns raw change records into feed entries. A bulk action -- importing a
   calendar, seeding the cleaning plan -- collapses into one line, so one import
   cannot bury a day of real family activity. */
function synActivityFor(found, nowMs, who){
  const groups = new Map();
  for(const f of found){
    if(f.quiet) continue;
    const key = f.path + '|' + f.op;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  }
  const out = [];
  for(const [, list] of groups){
    const first = list[0];
    out.push({
      id: synActivityId(nowMs, first.path, first.op, list.map(f=>f.id || '')),
      at: nowMs,
      by: (who && who.id) || '',
      byName: (who && who.name) || '',
      path: first.path,
      noun: first.noun,
      op: first.op,
      name: list.length > ACTIVITY_COLLAPSE_AT ? '' : list.map(f=>f.name).filter(Boolean).join(', '),
      n: list.length
    });
  }
  return out;
}
/* The id has to come out the same on every device for the same change, or a
   merge would stack duplicates of one line. It is built from WHAT changed
   rather than exactly when, so a change stamped a second time -- which is what
   happens when a write is refused and replayed after merging -- lands on the
   line it already produced instead of adding another. The minute bucket keeps a
   genuinely repeated change (added, removed, added again) separate. */
function synActivityId(nowMs, path, op, ids){
  const key = path + '|' + op + '|' + (ids || []).slice().sort().join('|');
  let h = 0;
  for(let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) | 0;
  return Math.floor(nowMs / 60000).toString(36) + '-' + op + '-' + (h >>> 0).toString(36);
}

/* Union by id, newest first, capped. Used for the add-only logs, where there is
   never a conflict to resolve -- only duplicates to drop and age to trim. */
function synTrim(arr, sortKey, cap){
  const by = new Map();
  for(const it of arr) if(it && it.id != null && !by.has(String(it.id))) by.set(String(it.id), it);
  const list = [...by.values()].sort((a,b)=>{
    const av = a[sortKey], bv = b[sortKey];
    if(av === bv) return String(a.id) < String(b.id) ? 1 : -1;   // stable, and identical on every device
    return av < bv ? 1 : -1;                                     // newest first
  });
  return list.slice(0, cap);
}

/* ---- merging: combine this device's copy with the family's ----
   Pure: returns a new board and changes neither argument. `mine` wins nothing
   by being mine -- every decision is made on timestamps, so two devices merging
   the same pair of copies always land on the same answer. */
function mergeBoards(mine, theirs){
  const out   = JSON.parse(JSON.stringify(mine));
  const meta  = synMeta(out);
  const tMeta = synMeta(JSON.parse(JSON.stringify(theirs)));

  /* Graveyards first: the merged board has to remember every deletion either
     side knew about before any item is considered for survival. */
  for(const path of Object.keys(tMeta.gone)){
    if(!meta.gone[path]) meta.gone[path] = {};
    for(const [id, at] of Object.entries(tMeta.gone[path])){
      meta.gone[path][id] = Math.max(Number(meta.gone[path][id]) || 0, Number(at) || 0);
    }
  }

  for(const spec of SYNC_SHAPE.lists){
    const a = synGet(out, spec.path), b = synGet(theirs, spec.path);
    if(!Array.isArray(a) && !Array.isArray(b)) continue;

    if(spec.append){
      synSet(out, spec.path, synTrim([...(a||[]), ...(b||[])], spec.sortKey, spec.cap));
      continue;
    }

    const bBy  = synIndex(b);
    const kept = [];
    const seen = new Set();
    const gone = meta.gone[spec.path] || {};
    const take = item=>{
      /* A deletion wins only if it happened STRICTLY later than the surviving
         edit. On an exact tie the edit stays: a resurrected item is visible and
         can be deleted again, while a lost edit is invisible and simply gone. */
      if((Number(gone[String(item.id)]) || 0) > synStamp(item)) return;
      kept.push(item);
    };
    for(const item of (Array.isArray(a) ? a : [])){
      if(!item || item.id == null) continue;
      const id = String(item.id);
      seen.add(id);
      const other = bBy.get(id);
      if(!other){ take(item); continue; }
      const sa = synStamp(item), sb = synStamp(other);
      if(sb > sa) take(other);
      else if(sa > sb) take(item);
      else take(synPrint(item) >= synPrint(other) ? item : other);   // tie: same answer on both devices
    }
    for(const [id, item] of bBy) if(!seen.has(id)) take(item);
    synSet(out, spec.path, kept);
  }

  /* Maps: whichever side stamped the key more recently decides both whether it
     exists and what it holds. */
  for(const spec of SYNC_SHAPE.maps){
    const a = synGet(out, spec.path), b = synGet(theirs, spec.path);
    if((a === null || typeof a !== 'object') && (b === null || typeof b !== 'object')) continue;
    const av = a || {}, bv = b || {};
    const as = meta.maps[spec.path] || {}, bs = tMeta.maps[spec.path] || {};
    const merged = {}, stamps = {};
    for(const key of new Set([...Object.keys(av), ...Object.keys(bv), ...Object.keys(as), ...Object.keys(bs)])){
      const sa = Number(as[key]) || 0, sb = Number(bs[key]) || 0;
      const hasA = Object.prototype.hasOwnProperty.call(av, key);
      const hasB = Object.prototype.hasOwnProperty.call(bv, key);
      let useA;
      if(sa !== sb) useA = sa > sb;
      else if(hasA !== hasB) useA = hasA;                             // tie: present beats absent
      else useA = synPrint(av[key]) >= synPrint(bv[key]);
      const has = useA ? hasA : hasB;
      if(has) merged[key] = useA ? av[key] : bv[key];
      if(sa || sb) stamps[key] = Math.max(sa, sb);
    }
    synSet(out, spec.path, merged);
    meta.maps[spec.path] = stamps;
  }

  for(const spec of SYNC_SHAPE.fields){
    const sa = Number(meta.fields[spec.path]) || 0, sb = Number(tMeta.fields[spec.path]) || 0;
    if(sb > sa){ synSet(out, spec.path, synGet(theirs, spec.path)); meta.fields[spec.path] = sb; }
  }

  /* Counters: take each shard from whichever side stamped it last. Because only
     the owning device ever writes its own shard, that side is always the owner's
     own truth, so two devices awarding points at the same moment both count. */
  for(const spec of SYNC_SHAPE.counters){
    const a = synGet(out, spec.path + '.byDevice') || {};
    const b = synGet(theirs, spec.path + '.byDevice') || {};
    const merged = {};
    for(const shard of new Set([...Object.keys(a), ...Object.keys(b)])){
      const key = spec.path + '.' + shard;
      const sa = Number(meta.counters[key]) || 0, sb = Number(tMeta.counters[key]) || 0;
      const useA = sa !== sb ? sa > sb : Object.prototype.hasOwnProperty.call(a, shard);
      merged[shard] = useA ? a[shard] : b[shard];
      meta.counters[key] = Math.max(sa, sb);
    }
    synSet(out, spec.path + '.byDevice', merged);
  }
  return out;
}
/* <<< SYNC ENGINE END <<< */

/* ======================= CROSS-DEVICE FAMILY SYNC =======================
   Local storage keeps this device instant and usable with no connection. A
   single row in a free Supabase (Postgres) table keeps every OTHER device
   holding the same copy.

   The row IS the whole Family Hub document, so there is no server-side schema
   to migrate as the app grows — one household, one JSON blob:

     family_id   text primary key    which household this is
     payload     text                JSON.stringify(state), minus view-only keys
     rev         bigint              bumped on every write; how devices spot news
     updated_by  text                which device wrote it last
     updated_at  timestamptz

   Devices poll that row's `rev` every few seconds while the tab is on screen —
   a few bytes per check — and only download the payload when the number moves.
   Whole-document last-write-wins: two people editing the same second is rare in
   a household, and the alternative (per-field merge) is a lot of machinery for
   a fridge-door app.

   The table itself is sealed off. Nothing here touches it directly: reads and
   writes go through three `security definer` functions that each demand the
   family id, and no query will list those ids. That matters because this is a
   public page — the publishable key inside it can be read by anyone, so the key
   cannot be the lock. The family id is, and it appears only on the household's
   own devices and in the setup links they send each other. */
const CLOUD_CONFIG_KEY = 'fh-cloud-config';
const CLOUD_DEVICE_KEY = 'fh-device-id';
const CLOUD_PROMPTED_KEY = 'fh-cloud-prompted';
const CLOUD_POLL_MS    = 2500;   // how often a visible tab checks for news. Was 8000:
                                 // that was how wide the window was for two people to
                                 // edit from the same stale copy.
const CLOUD_PUSH_MS    = 700;    // debounce, so a burst of edits is one write
