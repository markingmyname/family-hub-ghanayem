    saveState(); closeModal(); render();
  };
}

/* ============================= HOUSEKEEPING =============================
   Modelled on Tody: the house is broken into areas, each area into small jobs,
   and every job carries how often it wants doing rather than a due date. What
   you see is "dueness" — how far through its interval a job has drifted — so
   nothing is ever simply late, it just gets dirtier, and the most-needed job is
   always the one at the top. Ticking a job resets its clock and pays the
   person who did it, which is why it shares the points pot with to-dos. */
const HK_LEVELS = [
  {max:0.5,      key:'fresh',   label:'Just done',  color:'#3FA34D'},
  {max:0.85,     key:'ok',      label:'Holding up', color:'#7CB342'},
  {max:1.0,      key:'soon',    label:'Due soon',   color:'#E3A731'},
  {max:1.6,      key:'due',     label:'Due',        color:'#E07C1D'},
  {max:Infinity, key:'overdue', label:'Overdue',    color:'#C4453B'}
];
const HK_EFFORT = [
  {v:1, label:'1 — a minute'},
  {v:2, label:'2 — quick'},
  {v:3, label:'3 — a proper job'},
  {v:4, label:'4 — hard work'},
  {v:5, label:'5 — a whole afternoon'}
];
const HK_ICONS = ['🍳','🛁','🛏️','🛋️','🧺','🚪','🌳','🚗','🪟','🧹','🐾','🧰','💻','🍽️','🚽','🪴'];

/* The plan a new household starts with, so Housekeeping is useful the moment
   it's opened rather than an empty page asking for homework. */
function defaultHousekeeping(){
  const plan = [
    ['Kitchen','🍳','#E07C1D', [
      ['Wash up / load the dishwasher',1,1],['Wipe the counters',2,1],['Clean the stovetop',3,2],
      ['Take the trash out',2,1],['Mop the floor',7,3],['Clean the microwave',14,2],
      ['Wipe out the fridge',30,3],['Clean the oven',90,4]
    ]],
    ['Bathrooms','🛁','#3B6FE0', [
      ['Wipe the sink and mirror',3,1],['Clean the toilet',4,2],['Scrub the shower or tub',7,3],
      ['Fresh towels',7,1],['Mop the floor',7,2],['Restock paper and soap',14,1]
    ]],
    ['Bedrooms','🛏️','#9455C9', [
      ['Make the beds',1,1],['Tidy clothes away',3,1],['Vacuum',7,2],
      ['Change the sheets',14,2],['Dust the surfaces',10,2],['Sort under the beds',60,3]
    ]],
    ['Living room','🛋️','#3FA34D', [
      ['Tidy up',1,1],['Vacuum',5,2],['Dust the surfaces',10,2],
      ['Wipe screens and remotes',14,1],['Wash the windows',60,3]
    ]],
    ['Laundry','🧺','#E8609F', [
      ['Run a load',2,1],['Fold and put away',3,2],['Clean the lint trap',7,1],['Wipe the machines',30,2]
    ]],
    ['Entry and hall','🚪','#6B6862', [
      ['Sweep the floor',7,1],['Line the shoes up',7,1],['Wipe door handles and switches',14,1]
    ]],
    ['Outside','🌳','#2E7D32', [
      ['Water the plants',3,1],['Bins out to the curb',7,1],['Sweep the porch',14,2],['Mow the lawn',10,4]
    ]]
  ];
  /* The ids are worked out from the names rather than generated at random,
     because they have to come out the SAME on every device. Two devices that
     both seed this plan used to produce two sets of the same jobs with
     different ids, and the merge -- which has no way to tell they are the same
     job -- kept both, handing the family 72 cleaning jobs instead of 36. The
     task id carries its area because names repeat: Vacuum and Mop the floor
     each appear in more than one room. */
  const hkId = text => String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  /* A small, stable number from a piece of text. Not a security hash -- it
     only has to spread the jobs out and give the same answer everywhere. */
  const hkSpread = text => { let h = 0; for(let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0; return Math.abs(h); };
  const areas = [], tasks = [];
  plan.forEach(([name, icon, color, jobs])=>{
    const areaId = 'hk-' + hkId(name);
    areas.push({id:areaId, name, icon, color});
    jobs.forEach(([taskName, freqDays, effort])=>{
      /* Stagger the starting point somewhere inside each interval, so a new
         plan reads like a lived-in house rather than 36 alarms at once. The
         offset is derived from the job's own name instead of being drawn at
         random, for the same reason the ids are: two devices seeding this plan
         have to produce the SAME rows, or the merge sees 21 jobs that disagree
         about when they were last done and records 21 changes nobody made. */
      const back = hkSpread(areaId + taskName) % freqDays;
      const seeded = new Date();
      seeded.setDate(seeded.getDate() - back);
      tasks.push({id:areaId + '--' + hkId(taskName), areaId, name:taskName, freqDays, effort, lastDone:fmtDate(seeded), personId:'', paused:false});
    });
  });
  return { areas, tasks, log: [] };
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const then = parseDate(dateStr), now = parseDate(todayStr());
  return Math.max(0, Math.round((now - then) / 86400000));
}
/* 0 = spotless, 1 = exactly due, above 1 = overdue. A job that has never been
   done starts just past due, which is what makes a fresh plan actionable. */
function hkDueness(t){
  const freq = Math.max(1, Number(t.freqDays) || 7);
  const since = daysSince(t.lastDone);
  if(since === null) return 1.05;
  return since / freq;
}
function hkLevel(d){ return HK_LEVELS.find(l=>d < l.max) || HK_LEVELS[HK_LEVELS.length-1]; }
function hkBar(d, small){
  const lvl = hkLevel(d);
  const pct = Math.max(4, Math.min(100, Math.round(d*100)));
  return `<div class="hk-bar ${small?'sm':''}"><span style="width:${pct}%; background:${lvl.color};"></span></div>`;
}
function hkTasksIn(areaId){ return state.housekeeping.tasks.filter(t=>t.areaId===areaId && !t.paused); }
function hkAreaById(id){ return state.housekeeping.areas.find(a=>a.id===id); }
function hkLastLabel(t){
  const since = daysSince(t.lastDone);
  if(since === null) return 'never done';
  if(since === 0) return 'done today';
  if(since === 1) return 'done yesterday';
  return `${since} days ago`;
}

/* Whoever is doing the cleaning. A personal setting (PERSONAL_KEYS), so it
   follows the signed-in person and one person tidying up doesn't reassign
   everyone else's phone. */
const HK_WHO_KEY = 'fh-hk-who';   // where older builds kept it; migrateState reads it once
function hkWho(){
  const id = state.hkWho;
  if(id && state.people.some(p=>p.id===id)) return id;
  return state.people[0] ? state.people[0].id : '';
}
function setHkWho(id){ state.hkWho = id; saveState(); }

let hkView = 'now';        // 'now' | 'areas' | 'plan'
let hkOpenArea = null;     // area drilled into from the areas view

function renderHousekeeping(){
  const hk = state.housekeeping;
  const live = hk.tasks.filter(t=>!t.paused);
  const dueCount = live.filter(t=>hkDueness(t) >= 1).length;
  const views = [
    {id:'now',   label:'🧽 Do it now'},
    {id:'areas', label:'🏠 By area'},
    {id:'plan',  label:'📋 Plan'}
  ].map(v=>`<button data-hkview="${v.id}" class="${hkView===v.id?'active':''}">${v.label}</button>`).join('');

  let body;

  else if(hkView === 'areas') body = renderHkAreas();
  else body = renderHkNow();

      <div class="hk-top">

        </div>
        <div class="sub-tabs" style="margin:0;">${views}</div>
      </div>
      ${hkView!=='plan' ? `<div class="hk-who">Doing it: ${whoPicker}</div>` : ''}
      ${body}

}

function hkTaskRow(t, showArea){
  const d = hkDueness(t);
  const lvl = hkLevel(d);
  const area = hkAreaById(t.areaId);
  const owner = t.personId ? personById(t.personId) : null;
  return `<div class="hk-task">
      <button class="hk-do" data-hkdo="${t.id}" title="Mark it done">✓</button>
      <div class="hk-task-main">
        <div class="hk-task-name">${escapeHtml(t.name)}</div>
        ${hkBar(d, true)}
        <div class="hk-task-meta">
          ${showArea && area ? `<span>${area.icon} ${escapeHtml(area.name)}</span>` : ''}
          <span style="color:${lvl.color}; font-weight:700;">${lvl.label}</span>
          <span class="mono">every ${t.freqDays}d · ${hkLastLabel(t)}</span>
          ${owner ? `<span>${escapeHtml(owner.name)}'s job</span>` : ''}
        </div>
      </div>
      <span class="hk-eff">${t.effort}</span>
      <div class="todo-actions"><button data-hkedit="${t.id}" title="Edit">✎</button></div>
    </div>`;
}

function renderHkNow(){
  const live = state.housekeeping.tasks.filter(t=>!t.paused)
    .sort((a,b)=>hkDueness(b)-hkDueness(a));
  const due = live.filter(t=>hkDueness(t) >= 0.85);
  const rest = live.filter(t=>hkDueness(t) < 0.85).slice(0,8);
  if(!live.length) return `<div class="empty">
      <div class="display">No cleaning plan yet</div>
      <p>Open <strong>Plan</strong> to add your first area.</p>
    </div>`;
  if(!due.length) return `<div class="empty">
      <div class="display">The house is in good shape 🎉</div>
      <p>Nothing is due. The next few jobs coming round:</p>
      <div class="hk-list" style="text-align:left;">${rest.map(t=>hkTaskRow(t,true)).join('')}</div>
    </div>`;
  return `<div class="hk-list">${due.map(t=>hkTaskRow(t,true)).join('')}</div>
    ${rest.length? `<div class="hk-area-head"><span class="hk-area-name">Not yet, but soon</span></div>
      <div class="hk-list">${rest.map(t=>hkTaskRow(t,true)).join('')}</div>` : ''}`;
}

function renderHkAreas(){
  const areas = state.housekeeping.areas;
  if(!areas.length) return `<div class="empty"><div class="display">No areas yet</div><p>Open <strong>Plan</strong> to add one.</p></div>`;
  const cards = areas.map(a=>{
    const tasks = hkTasksIn(a.id);
    /* An area is only as clean as its worst job — an average would hide the
       one thing that actually needs doing. */
    const worst = tasks.reduce((m,t)=>Math.max(m, hkDueness(t)), 0);
    const dueHere = tasks.filter(t=>hkDueness(t) >= 1).length;
    const lvl = hkLevel(worst);
    return `<div class="hk-area ${hkOpenArea===a.id?'is-open':''}" data-hkarea="${a.id}">
        <div class="hk-area-top">
          <span class="hk-icon">${a.icon}</span>
          <span class="hk-area-name">${escapeHtml(a.name)}</span>
          <span class="hk-pill" style="background:${lvl.color};">${dueHere? dueHere+' due' : 'clean'}</span>
        </div>
        ${hkBar(worst)}
        <div class="hk-area-meta">${tasks.length} job${tasks.length===1?'':'s'} · ${lvl.label.toLowerCase()}</div>
      </div>`;
  }).join('');

  let drill = '';
  if(hkOpenArea){
    const a = hkAreaById(hkOpenArea);
    if(a){
      const tasks = hkTasksIn(a.id).sort((x,y)=>hkDueness(y)-hkDueness(x));
      drill = `<div class="hk-area-head">
          <span class="hk-icon">${a.icon}</span>
          <span class="hk-area-name">${escapeHtml(a.name)}</span>
          <button class="btn btn-ghost" style="margin-left:auto; font-size:12px; padding:4px 10px;" data-hkaddtask="${a.id}">+ Job</button>
        </div>
        <div class="hk-list">${tasks.map(t=>hkTaskRow(t,false)).join('') || '<div class="dash-none">No jobs in here yet.</div>'}</div>`;
    }
  }
  return `<div class="hk-area-grid">${cards}</div>${drill}`;
}

function renderHkPlan(){
  const blocks = state.housekeeping.areas.map(a=>{
    const tasks = state.housekeeping.tasks.filter(t=>t.areaId===a.id);
    const rows = tasks.map(t=>`
      <div class="hk-task">
        <span class="hk-icon" style="font-size:15px; width:22px; text-align:center; opacity:${t.paused?0.4:1};">${t.paused?'⏸️':'•'}</span>
        <div class="hk-task-main">
          <div class="hk-task-name" style="${t.paused?'color:var(--ink-soft);':''}">${escapeHtml(t.name)}</div>
          <div class="hk-task-meta"><span class="mono">every ${t.freqDays} days · effort ${t.effort}</span>${t.paused?'<span>paused</span>':''}</div>
        </div>
        <div class="todo-actions">
          <button data-hkedit="${t.id}" title="Edit">✎</button>
          <button data-hkdeltask="${t.id}" title="Delete">✕</button>
        </div>
      </div>`).join('') || '<div class="dash-none">No jobs here yet.</div>';
    return `<div class="hk-area-head">
        <span class="hk-icon">${a.icon}</span>
        <span class="hk-area-name">${escapeHtml(a.name)}</span>
        <div class="todo-actions" style="margin-left:auto;">
          <button data-hkaddtask="${a.id}" title="Add a job">＋</button>
          <button data-hkeditarea="${a.id}" title="Edit area">✎</button>
          <button data-hkdelarea="${a.id}" title="Delete area">✕</button>
        </div>
      </div>
      <div class="hk-list">${rows}</div>`;
  }).join('') || '<div class="empty"><div class="display">Nothing planned yet</div></div>';

  return `<p style="font-size:13px; color:var(--ink-soft);">Every job carries how often it wants doing, not a date. The meters fill up on their own from there.</p>
    ${blocks}
    <div class="add-row" style="margin-top:16px;">
      <button class="btn btn-primary" id="hkAddArea">+ Add an area</button>
      <button class="btn btn-ghost" id="hkResetPlan">Start from the standard plan</button>
    </div>`;
}

function hkDoTask(id){
  const t = state.housekeeping.tasks.find(x=>x.id===id);
  if(!t) return;
  const whoId = hkWho();
  t.lastDone = todayStr();
  state.housekeeping.log.unshift({id:uid(), taskId:t.id, date:todayStr(), personId:whoId, points:t.effort});
  /* The log is a scoreboard, not an archive — a few hundred entries is plenty. */
  if(state.housekeeping.log.length > 400) state.housekeeping.log.length = 400;
  if(whoId) addPoints(whoId, t.effort);
  saveState(); render();
  const who = whoId ? personById(whoId) : null;
  toast(`${t.name} — done${who? `, +${t.effort} pt${t.effort===1?'':'s'} for ${who.name}` : ''} ✨`, 'success');
}

function hkTaskModal(existing, areaId){
  const t = existing || {id:null, areaId: areaId || (state.housekeeping.areas[0]||{}).id, name:'', freqDays:7, effort:2, lastDone:null, personId:'', paused:false};
  const areaOpts = state.housekeeping.areas.map(a=>`<option value="${a.id}" ${a.id===t.areaId?'selected':''}>${a.icon} ${escapeHtml(a.name)}</option>`).join('');
  openModal(`
    <h3>${existing?'Edit job':'Add job'}</h3>
    <div class="field"><label>What is it?</label><input id="hkName" value="${escapeHtml(t.name)}" placeholder="Mop the floor"></div>
    <div class="field"><label>Area</label><select id="hkArea">${areaOpts}</select></div>
    <div class="field"><label>How often — every N days</label><input type="number" id="hkFreq" min="1" max="730" value="${t.freqDays}"></div>
    <div class="field"><label>Effort</label><select id="hkEffort">${HK_EFFORT.map(e=>`<option value="${e.v}" ${e.v===t.effort?'selected':''}>${e.label}</option>`).join('')}</select></div>
    <div class="field"><label>Whose job (optional)</label><select id="hkPerson"><option value="">Anyone</option>${peopleOptionsHtml(t.personId)}</select></div>
    <div class="field"><label>Last done</label><input type="date" id="hkLast" value="${t.lastDone||''}"></div>
    <div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="hkPaused" style="width:18px;height:18px;" ${t.paused?'checked':''}>
      <label style="margin:0;">Pause this one — keep it, but stop it filling up</label>
    </div>
    <div class="modal-actions">
      ${existing? '<button class="btn btn-danger" id="hkDelete">Delete</button>':''}
      <button class="btn btn-ghost" id="hkCancel">Cancel</button>
      <button class="btn btn-primary" id="hkSave">Save</button>
    </div>
  `);
  document.getElementById('hkCancel').onclick = closeModal;
  const del = document.getElementById('hkDelete');
  if(del) del.onclick = ()=>{
    state.housekeeping.tasks = state.housekeeping.tasks.filter(x=>x.id!==t.id);
    saveState(); closeModal(); render();
  };
  document.getElementById('hkSave').onclick = ()=>{
    const name = document.getElementById('hkName').value.trim();
    if(!name){ toast('Give the job a name.', 'error'); return; }
    const freq = Math.max(1, Math.min(730, parseInt(document.getElementById('hkFreq').value, 10) || 7));
    const data = {
      name,
      areaId: document.getElementById('hkArea').value,
      freqDays: freq,
      effort: Number(document.getElementById('hkEffort').value) || 2,
      personId: document.getElementById('hkPerson').value,
      lastDone: document.getElementById('hkLast').value || null,
      paused: document.getElementById('hkPaused').checked
    };
    if(existing) Object.assign(t, data);
    else state.housekeeping.tasks.push({id:uid(), ...data});
    saveState(); closeModal(); render();
  };
}

function hkAreaModal(existing){
  const a = existing || {id:null, name:'', icon:'🧹', color:'#3B6FE0'};
  openModal(`

        ${rows.length
          ? `<ul class="rc-ings">${rows.map(x=>`<li>${x.amount ? `<span class="rc-amt">${escapeHtml(x.amount)}</span> ` : ''}${escapeHtml(x.item)}</li>`).join('')}</ul>`

        ${r.memory ? `<div class="rc-label">Recipe memory</div><p class="rc-memory">${escapeHtml(r.memory)}</p>` : ''}
        ${src ? `<a class="recipe-src" href="${escapeHtml(src.href)}" target="_blank" rel="noopener noreferrer">From ${escapeHtml(src.hostname.replace(/^www\./,''))} ↗</a>` : ''}
        <div class="meal-tools">
          <button class="btn btn-ghost" data-editrecipe="${escapeHtml(r.id)}">Edit</button>

/* ======================= GROCERIES (Reminders-style) =======================

/* Longest match wins, so "tortilla chips" lands in snacks rather than being
   caught by the "tortilla" in bakery. */
function guessGroceryCat(name){
  const n = (name||'').toLowerCase();
  if(!n) return 'other';
  let best = null, bestLen = 0;
  for(const cat of Object.keys(GROCERY_KEYWORDS)){
    for(const k of GROCERY_KEYWORDS[cat]){
      if(k.length > bestLen && n.includes(k)){ best = cat; bestLen = k.length; }
    }
  }
  return best || 'other';
}
function groceryCat(id){ return GROCERY_CATS.find(c=>c.id===id) || GROCERY_CATS[GROCERY_CATS.length-1]; }

/* Collapsed aisles are a per-screen preference, so they live in memory only —
   nobody wants their phone folding sections on the kitchen display. */
let grocCollapsed = {};

function renderGrocery(){
  const all = state.meals.grocery;

    </div>` : '';

  return `
    <div class="groc-head">
      <div>
        <h2 class="groc-title">Groceries</h2>

      </div>

function addGroceryItem(name, qty, note, cat){
  const clean = (name||'').trim();
  if(!clean) return null;
  const item = {
    id: uid(),
    name: clean,
    qty: (qty||'').trim(),
    note: (note||'').trim(),
    cat: cat || guessGroceryCat(clean),
    done: false,
    order: state.meals.grocery.length
  };
  state.meals.grocery.push(item);
  return item;
}

/* Pulls every ingredient line off the saved recipes that this week's plan
   actually names, so the shop matches the menu. */
function groceryFromMealPlan(){
  const start = startOfWeek(parseDate(state.calDate));
  const wanted = new Set();
  for(let i=0; i<7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    MEAL_SLOTS.forEach(slot=>{
      const meal = state.meals.plan[fmtDate(d)+'|'+slot];
      if(meal) wanted.add(meal.trim().toLowerCase());
    });
  }
  if(!wanted.size){ toast('Nothing is planned for this week yet.', 'error'); return; }
  const existing = new Set(state.meals.grocery.filter(g=>!g.done).map(g=>g.name.toLowerCase()));
  let added = 0;
  state.meals.recipes.forEach(r=>{
    if(!wanted.has((r.name||'').trim().toLowerCase())) return;
    // Each ingredient row becomes one grocery item, with its amount as the quantity.
    (r.ingredients||[]).forEach(row=>{
      const key = row.item.toLowerCase();
      if(existing.has(key)) return;
      existing.add(key);
      addGroceryItem(row.item, row.amount);
      added++;
    });
  });
  if(!added){ toast('No saved recipe matched this week\'s plan — add ingredients to those recipes first.', 'error'); return; }
  saveState(); render();
  toast(`${added} ingredient${added===1?'':'s'} added 🛒`, 'success');
}

/* ============================= RECIPES =============================
   Three ways in, one format out:
     Type a recipe    -> the recipe form, blank.
     From a photo     -> the same form, starting with "Take a photo" or
                         "Choose from library". The photo is kept on the card
                         and the family types the rest; nothing reads the photo.
     From a website   -> paste a recipe page's address. The recipe-import
                         Supabase Edge Function (supabase/functions/recipe-import)
                         copies the recipe the page publishes, and the form
                         opens filled in, to check before saving.
   Every recipe has this shape, and normalizeRecipe() enforces it each time the
   board loads, so a recipe can't exist in any other form:
     { id, name, ingredients: [{ amount, item }], instructions,
       memory?, photo?, source? }

   Depends on: uid(), escapeHtml(), openModal()/closeModal(), toast(),
   downscaleToDataUrl() (photos), saveState()/render(), and for website import
   cloudProject(), cloudConfig(), cloudSync.account, auth.accessToken(), and
   dailyLog.event() (failure log). */

const RECIPE_IMPORT_FN = 'recipe-import';
const RECIPE_PHOTO_DIM = 1000;        // longest side in px: recipe-card text stays readable
const RECIPE_PHOTO_QUALITY = 0.6;     // JPEG quality; roughly 60-120 KB per photo
const RECIPE_BOARD_LIMIT = 4_000_000; // characters; saveState() already warns at 4.5M
let recipeImportBusy = false;         // one import at a time

/* ---- Reading a recipe photo (OCR) ----
   Tesseract.js runs on the device: the photo never leaves it, and there's no
   key and no cost. It's good with printed text (cookbooks, screenshots) and
   weak with handwriting, so the form always shows the result for checking.
   External dependency: cdn.jsdelivr.net, downloaded only the first time someone
   taps "Read the text" (~7 MB: the library, its worker, its WebAssembly engine,
   and the English data); browsers keep it after that. If the CDN can't be
   reached, reading fails with a message and nothing else is affected.
   The library file is pinned by version AND by SHA-384 hash, so a changed file
   on the CDN is refused instead of run. The worker and engine are pinned by
   version through the library; the English data is pinned here. */
const OCR_LIB_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
const OCR_LIB_SRI = 'sha384-2BQ3U3OdKOb0Uczxqr41I9UvZkzr4V9Hv8uSzMMZAlmhsFClvdZX5wi5fDCzG+tM';
const OCR_LANG_PATH = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int';
const OCR_MAX_DIM = 2000;             // OCR reads small print better from a larger image than the saved one
let ocrLibPromise = null;
let ocrBusy = false;                  // one reading at a time: each holds ~100 MB while it runs

/** Loads the OCR library once, on first use. A failed load can be retried. */
function loadOcrLib(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(!ocrLibPromise){
    ocrLibPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = OCR_LIB_URL;
      s.integrity = OCR_LIB_SRI;
      s.crossOrigin = 'anonymous';
      s.onload = ()=> window.Tesseract ? resolve(window.Tesseract) : reject(new Error('The text reader didn\'t start.'));
      s.onerror = ()=>{ ocrLibPromise = null; s.remove(); reject(new Error('The text reader couldn\'t download. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
  }
  return ocrLibPromise;
}

/* Reads the text in one image. onProgress(label, fraction) reports each stage.
   The worker is always shut down afterwards, which frees its memory. */
async function ocrImage(source, onProgress){
  const T = await loadOcrLib();
  const labels = {
    'loading tesseract core': 'Getting the text reader ready',
    'loading language traineddata': 'Getting the text reader ready',
    'recognizing text': 'Reading the photo'
  };
  let worker = null;
  try{
    worker = await T.createWorker('eng', 1, {   // 1 = the LSTM (neural) engine only
      langPath: OCR_LANG_PATH,
      logger: m=>{ if(m && typeof m.progress === 'number' && labels[m.status]) onProgress(labels[m.status], m.progress); }
    });
    const { data } = await worker.recognize(source);
    return (data && data.text) || '';
  }catch(err){
    // The worker reports failures as plain strings or objects; give the family one sentence.
    throw new Error(err instanceof Error && /download|connection/i.test(err.message) ? err.message : 'The text reader couldn\'t read that photo. Try a clearer, closer one.');
  }finally{
    if(worker){ try{ await worker.terminate(); }catch(_){ /* already stopped */ } }
  }
}

/* Sorts OCR text into the recipe format. With "Ingredients" / "Directions"
   (or "Instructions", "Method", "Steps", "Preparation") headings, lines go
   where the headings say. Without them, lines that start with an amount are
   ingredients and the rest are steps. The first plain line before any heading
   is taken as the name. Lines the camera wrapped mid-sentence are joined back
   into one step. A best guess that the family checks in the form. */
function parseRecipeText(text){
  const lines = String(text || '').split(/\r?\n/)
    .map(l=>l.replace(/^[\s•·▪●○◦*>-]+/, '').replace(/\s+/g, ' ').trim())
    .filter(l=>l.length > 1);
  const ingHead = /^ingredients?\b[:\s]*$/i;
  const stepHead = /^(instructions?|directions?|method|steps|preparation)\b[:\s]*$/i;
  const looksLikeIngredient = l=>l.length <= 90 && splitIngredientLine(l).amount !== '';
  let name = '', section = 'auto';
  const ingredients = [], steps = [];
  for(const line of lines){
    if(ingHead.test(line)){ section = 'ing'; continue; }
    if(stepHead.test(line)){ section = 'steps'; continue; }
    if(!name && section === 'auto' && !looksLikeIngredient(line)){ name = line.slice(0, 120); continue; }
    const target = section === 'ing' ? 'ing'
                 : section === 'steps' ? 'steps'
                 : (looksLikeIngredient(line) ? 'ing' : 'steps');
    if(target === 'ing'){ ingredients.push(line); continue; }
    // A line that starts lowercase after a step that didn't end a sentence is
    // the same step, wrapped onto a new line by the page.
    const prev = steps[steps.length - 1];
    if(prev && !/[.!?:]$/.test(prev) && /^[a-z(]/.test(line)) steps[steps.length - 1] = prev + ' ' + line;
    else steps.push(line);
  }
  return { name, ingredients: ingredients.map(splitIngredientLine), instructions: steps.join('\n') };
}

/** An http(s) URL object, or null for anything else (javascript:, data:, junk). */
function safeHttpUrl(raw){
  if(typeof raw !== 'string' || !raw) return null;
  try{
    const u = new URL(raw);
    return (u.protocol === 'https:' || u.protocol === 'http:') ? u : null;
  }catch(e){ return null; }
}

/* Splits one ingredient line into { amount, item }:
     "1 (15 oz) can black beans" -> "1 (15 oz) can" + "black beans"
     "1 1/2 cups milk"           -> "1 1/2 cups"    + "milk"
     "Salt and pepper to taste"  -> ""              + "Salt and pepper to taste"
   The amount is the leading number (1, 1.5, 1 1/2, ½, 2-3), an optional "(…)"
   note, and an optional unit word. It's a best guess; the form shows both
   boxes so the family can fix it. The pattern is built inside the function
   because this runs while saved data loads, possibly before later script lines. */
function splitIngredientLine(line){
  const text = String(line || '').replace(/\s+/g, ' ').trim();
  // Longest forms first: the regex takes the first alternative that fits, so a
  // plain "1" listed first would leave "/2" of "1/2 tsp salt" on the ingredient.
  const num = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[½⅓⅔¼¾⅕⅛⅜⅝⅞])(?:\\s*[½⅓⅔¼¾⅕⅛⅜⅝⅞])?';
  const unit = 'cups?|c\\.|tablespoons?|tbsps?\\.?|tbs\\.?|tbl\\.?|teaspoons?|tsps?\\.?|fl\\.?\\s?oz\\.?|ounces?|oz\\.?' +
    '|pounds?|lbs?\\.?|grams?|g|kilograms?|kg|milliliters?|millilitres?|ml|liters?|litres?|quarts?|qts?\\.?' +
    '|pints?|pts?\\.?|gallons?|pinch(?:es)?|dash(?:es)?|cloves?|cans?|jars?|packages?|pkgs?\\.?|packets?' +
    '|sticks?|slices?|bunch(?:es)?|heads?|sprigs?|handfuls?|bottles?|bags?|boxes?|containers?|envelopes?' +
    '|pieces?|fillets?|stalks?|ears?|drops?';
  // A unit follows a space or a hyphen ("12-ounce package pasta").
  const re = new RegExp(`^(${num}(?:\\s*(?:-|–|to)\\s*${num})?(?:\\s*\\([^)]*\\))?(?:(?:\\s+|-)(?:${unit})(?=[\\s,]|$))?)\\s*(?:of\\s+)?(.*)$`, 'i');
  const m = text.match(re);
  if(!m || !m[2]) return { amount: '', item: text };
  return { amount: m[1].trim(), item: m[2].trim() };
}

/** Instructions are stored as text, one step per line; numbering typed by hand ("1.", "Step 2:") is dropped for display. */
function recipeSteps(text){
  return String(text || '').split('\n')
    .map(s=>s.replace(/^\s*(?:step\s*)?\d+\s*[.):-]\s*/i, '').trim())
    .filter(Boolean);
}

/* The only way a recipe enters the board: every field is checked and trimmed,
   ingredient rows without an ingredient are dropped, and optional fields are
   left out entirely when empty. Older recipes (one ingredient string) are
   split into rows here. */
function normalizeRecipe(r){
  const out = {
    id: (typeof r.id === 'string' && r.id) ? r.id : uid(),
    name: String(r.name || '').trim().slice(0, 120)
  };
  let rows;
  if(Array.isArray(r.ingredients)){
    rows = r.ingredients.map(x=>({ amount: String((x && x.amount) || '').trim().slice(0, 60), item: String((x && x.item) || '').trim().slice(0, 200) }));
  }else{
    const text = String(r.ingredients || '');
    rows = (text.includes('\n') ? text.split('\n') : text.split(',')).map(splitIngredientLine);
  }
  out.ingredients = rows.filter(x=>x.item);
  out.instructions = typeof r.instructions === 'string' ? r.instructions.trim() : '';
  if(typeof r.memory === 'string' && r.memory.trim()) out.memory = r.memory.trim().slice(0, 1000);
  if(typeof r.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(r.photo)) out.photo = r.photo;
  const src = safeHttpUrl(r.source);
  if(src) out.source = src.href;
  return out;
}

/* Calls one of the family's Supabase Edge Functions and returns its `data`.
   Uses the same two doors the board itself uses: a signed-in member sends
   their session token; a family-code device sends the family code. Throws an
   Error whose message is fit to show the family. */
async function callFamilyFunction(fn, payload){
  const { url, key } = cloudProject();
  const headers = { apikey: key, 'Content-Type': 'application/json' };
  const body = Object.assign({}, payload);
  if(cloudSync.account.kind === 'member'){
    headers.Authorization = 'Bearer ' + await auth.accessToken();
  }else{
    const cfg = cloudConfig();
    if(!cfg) throw new Error('Turn on Family sync in Settings first — this runs through it.');
    body.fid = cfg.familyId;
  }
  let res;
  try{
    // External call: the Supabase project's Edge Functions. Allowed by the
    // page's CSP through connect-src https://*.supabase.co.
    res = await fetch(`${url}/functions/v1/${fn}`, {
      method: 'POST', headers, body: JSON.stringify(body),
      signal: (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(30000) : undefined
    });
  }catch(err){
    if(err && err.name === 'TimeoutError') throw new Error('That took too long. Try again.');
    throw new Error('No connection right now. Try again when you\'re back online.');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* gateway errors aren't JSON; handled below */ }
  if(res.status === 404 && !(data && data.error)){
    throw new Error(`This isn't set up yet: the ${fn} function hasn't been deployed.`);
  }
  if(!res.ok || !data || !data.ok) throw new Error((data && data.error) || `That didn't work (error ${res.status}).`);
  return data.data;
}

/* The one recipe form. It types a new recipe, adds one from a photo, checks
   an imported one, and edits a saved one. Nothing touches the board until Save.
     recipeModal()                         type a new recipe
     recipeModal({ photoFirst: true })     add a recipe from a photo
     recipeModal({ prefill, hint })        check an imported recipe
     recipeModal({ recipe })               edit a saved recipe */
function recipeModal(opts){
  const o = opts || {};
  const editing = o.recipe || null;
  const base = editing || o.prefill || {};
  const src = safeHttpUrl(base.source);
  let rows = (base.ingredients || []).map(x=>({ amount: x.amount || '', item: x.item || '' }));
  if(!rows.length) rows = [{ amount: '', item: '' }];
  let photo = typeof base.photo === 'string' ? base.photo : '';
  let lastFile = null;                // the full-size photo just picked; OCR reads it at higher resolution
  const title = editing ? 'Edit recipe' : o.prefill ? 'Check this recipe' : o.photoFirst ? 'Add a recipe from a photo' : 'Add a recipe';
  const hint = o.hint || (o.photoFirst ? 'Take a photo of the recipe or choose one from your library. Tap "Read the text" to fill in the recipe from the photo, then check it before saving. Or just name it and type the rest.' : '');
  openModal(`
    <h3>${title}</h3>
    ${hint ? `<p class="ai-note">${escapeHtml(hint)}</p>` : ''}
    <div class="field">
      <label>Photo <span class="rc-opt">(optional)</span></label>
      <div id="rcPhotoView"></div>
      <div class="meal-tools" style="margin-top:0;">
        <button class="btn btn-ghost" type="button" id="rcCamBtn">📷 Take a photo</button>
        <button class="btn btn-ghost" type="button" id="rcLibBtn">🖼️ Choose from library</button>
      </div>
      <input type="file" id="rcCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="rcLib" accept="image/*" hidden>
    </div>
    <div class="field"><label for="rcName">Recipe name</label><input id="rcName" maxlength="120" value="${escapeHtml(base.name || '')}" placeholder="Grandma's chili"></div>
    <div class="field"><label>Ingredients</label>
      <div id="rcRows"></div>
      <button class="btn btn-ghost" type="button" id="rcAddRow">+ Add ingredient</button>
    </div>
    <div class="field"><label for="rcInst">Instructions</label><textarea id="rcInst" rows="5" placeholder="One step per line">${escapeHtml(base.instructions || '')}</textarea></div>
    <div class="field"><label for="rcMem">Recipe memory <span class="rc-opt">(optional)</span></label><textarea id="rcMem" rows="2" maxlength="1000" placeholder="Why you have this recipe: who made it, when you make it…">${escapeHtml(base.memory || '')}</textarea></div>
    ${src ? `<p class="ai-note">From <a href="${escapeHtml(src.href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(src.hostname.replace(/^www\./,''))} ↗</a></p>` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="rcCancel">Cancel</button>
      <button class="btn btn-primary" id="rcSave">Save</button>
    </div>`);

  // Photo: preview + remove. Data URLs only ever come from downscaleToDataUrl().
  const drawPhoto = ()=>{
    const view = document.getElementById('rcPhotoView');
    if(!view) return;
    view.innerHTML = photo
      ? `<img class="rc-photo-preview" src="${escapeHtml(photo)}" alt="Recipe photo">
         <div class="meal-tools" style="margin-top:0;">
           <button class="btn btn-primary" type="button" id="rcOcrBtn">🔤 Read the text</button>
           <button class="btn btn-ghost" type="button" id="rcPhotoDel">Remove photo</button>
         </div>
         <p class="ai-note" id="rcOcrStatus" aria-live="polite"></p>`
      : '';
    const del = document.getElementById('rcPhotoDel');
    if(del) del.onclick = ()=>{ photo = ''; lastFile = null; drawPhoto(); };
    const read = document.getElementById('rcOcrBtn');
    if(read) read.onclick = readText;
  };
  /* "Take a photo" asks the phone for its camera (capture); "Choose from
     library" opens the photo picker. Desktop browsers ignore capture and show
     a file picker for both. The photo is shrunk on the device and re-saved as
     JPEG, which also drops camera data such as GPS location. */
  const pick = async input=>{
    const file = input.files && input.files[0];
    input.value = '';               // so picking the same photo again still fires
    if(!file) return;
    try{
      photo = await downscaleToDataUrl(file, RECIPE_PHOTO_DIM, RECIPE_PHOTO_QUALITY);
      lastFile = file;
      drawPhoto();
    }catch(err){ toast((err && err.message) || 'That photo couldn\'t be used.', 'error'); }
  };
  const cam = document.getElementById('rcCam'), lib = document.getElementById('rcLib');
  document.getElementById('rcCamBtn').onclick = ()=>cam.click();
  document.getElementById('rcLibBtn').onclick = ()=>lib.click();
  cam.onchange = ()=>pick(cam);
  lib.onchange = ()=>pick(lib);

  // Ingredient rows: the inputs write straight into `rows`, so redrawing after
  // an add or a remove never loses what was typed.
  const rowsBox = document.getElementById('rcRows');
  const drawRows = focusLast=>{
    rowsBox.innerHTML = rows.map((x,i)=>`
      <div class="rc-row">
        <input class="rc-amt-in" data-rowamt="${i}" maxlength="60" value="${escapeHtml(x.amount)}" placeholder="Amount" aria-label="Amount for ingredient ${i+1}">
        <input class="rc-item-in" data-rowitem="${i}" maxlength="200" value="${escapeHtml(x.item)}" placeholder="Ingredient" aria-label="Ingredient ${i+1}">
        <button class="row-x" type="button" data-rowdel="${i}" title="Remove this ingredient" aria-label="Remove ingredient ${i+1}">✕</button>
      </div>`).join('');
    rowsBox.querySelectorAll('[data-rowamt]').forEach(el=>{ el.oninput = ()=>{ rows[+el.dataset.rowamt].amount = el.value; }; });
    rowsBox.querySelectorAll('[data-rowitem]').forEach(el=>{ el.oninput = ()=>{ rows[+el.dataset.rowitem].item = el.value; }; });
    rowsBox.querySelectorAll('[data-rowdel]').forEach(b=>{
      b.onclick = ()=>{
        rows.splice(+b.dataset.rowdel, 1);
        if(!rows.length) rows.push({ amount: '', item: '' });
        drawRows();
      };
    });
    if(focusLast){ const last = rowsBox.querySelector(`[data-rowamt="${rows.length-1}"]`); if(last) last.focus(); }
  };
  document.getElementById('rcAddRow').onclick = ()=>{ rows.push({ amount: '', item: '' }); drawRows(true); };

  /* "Read the text": OCR the photo on this device and fill the form. Empty
     fields are filled; ingredients and steps already typed are kept, and what
     the photo adds goes after them. Defined before drawPhoto() first runs,
     because the button it draws calls this. */
  const readText = async ()=>{
    if(!photo){ toast('Add a photo first.', 'error'); return; }
    if(ocrBusy) return;
    ocrBusy = true;
    const formName = document.getElementById('rcName');   // to tell if this form is still the one open
    const say = msg=>{ const el = document.getElementById('rcOcrStatus'); if(el) el.textContent = msg; };
    const btn = document.getElementById('rcOcrBtn');
    if(btn) btn.disabled = true;
    const started = Date.now();
    try{
      say('Getting the text reader ready… the first time downloads about 7 MB.');
      const source = lastFile ? await downscaleToDataUrl(lastFile, OCR_MAX_DIM, 0.92) : photo;
      const text = await ocrImage(source, (label, f)=>say(`${label}… ${Math.round(f * 100)}%`));
      if(document.getElementById('rcName') !== formName) return;   // closed or replaced while reading
      const found = parseRecipeText(text);
      if(!found.name && !found.ingredients.length && !found.instructions){
        say('No text was found. Try a clearer, closer photo with good light.');
        return;
      }
      if(!formName.value.trim() && found.name) formName.value = found.name;
      if(found.ingredients.length){
        rows = rows.filter(x=>x.item.trim() || x.amount.trim()).concat(found.ingredients);
        drawRows();
      }
      if(found.instructions){
        const inst = document.getElementById('rcInst');
        inst.value = inst.value.trim() ? `${inst.value.trim()}\n${found.instructions}` : found.instructions;
      }
      const nSteps = found.instructions ? found.instructions.split('\n').length : 0;
      say(`Filled in ${found.ingredients.length} ingredient${found.ingredients.length === 1 ? '' : 's'} and ${nSteps} step${nSteps === 1 ? '' : 's'}. Check everything before saving: photo reading makes mistakes, especially with handwriting.`);
    }catch(err){
      const msg = (err && err.message) || 'The text reader couldn\'t read that photo.';
      say('');
      toast(msg, 'error');
      try{ dailyLog.event('error', msg, { kind: 'recipe-ocr', ms: Date.now() - started }); }
      catch(_){ /* logging must never be the thing that breaks the page */ }
    }finally{
      ocrBusy = false;
      const b = document.getElementById('rcOcrBtn');
      if(b) b.disabled = false;
    }
  };
  drawPhoto();
  drawRows();

  document.getElementById('rcCancel').onclick = closeModal;
  document.getElementById('rcSave').onclick = ()=>{
    const nameEl = document.getElementById('rcName');
    const name = nameEl.value.trim();
    if(!name){ toast('Give the recipe a name first.', 'error'); nameEl.focus(); return; }
    const recipe = normalizeRecipe({
      id: editing ? editing.id : uid(),
      name,
      ingredients: rows,
      instructions: document.getElementById('rcInst').value,
      memory: document.getElementById('rcMem').value,
      photo,
      source: src ? src.href : ''
    });
    // A new or changed photo has to fit on the board, which is one synced document.
    if(recipe.photo && recipe.photo !== (editing && editing.photo)){
      if(JSON.stringify(state).length + recipe.photo.length > RECIPE_BOARD_LIMIT){
        toast('There\'s no room for another photo on the family board. Remove a photo from another recipe, or save this one without a photo.', 'error');
        return;
      }
    }
    const at = editing ? state.meals.recipes.findIndex(x=>x.id === editing.id) : -1;
    if(at >= 0) state.meals.recipes[at] = recipe; else state.meals.recipes.push(recipe);
    saveState(); closeModal(); render();
    toast(`Saved “${name}” to recipes 📖`, 'success');
  };
}

/* "From a website": paste a recipe page's address, the recipe-import function
   copies the page's own recipe data, and the recipe form opens filled in. */
function recipeWebModal(){
  openModal(`
    <h3>Add a recipe from a website</h3>
    <p class="ai-note">Copy the address of a recipe page, paste it here, and check the recipe before saving.</p>
    <div class="field"><label for="riUrl">Recipe page address</label><input id="riUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://…"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="riCancel">Cancel</button>
      <button class="btn btn-primary" id="riGo">Import</button>
    </div>`);
  const input = document.getElementById('riUrl');
  const go = document.getElementById('riGo');
  document.getElementById('riCancel').onclick = closeModal;
  const run = async ()=>{
    const link = safeHttpUrl(input.value.trim());
    if(!link){ toast('Paste the full address, starting with https://', 'error'); input.focus(); return; }
    if(recipeImportBusy) return;
    recipeImportBusy = true;
    go.disabled = true; go.textContent = 'Importing…';
    const started = Date.now();
    try{
      const out = await callFamilyFunction(RECIPE_IMPORT_FN, { url: link.href });
      recipeModal({
        prefill: {
          name: out.recipe.name,
          ingredients: (out.recipe.ingredients || []).map(splitIngredientLine),
          instructions: (out.recipe.instructions || []).join('\n'),
          source: out.source
        },
        hint: 'Copied from the page\'s own recipe card. Check the amounts before saving.'
      });
    }catch(err){
      const msg = (err && err.message) || 'That recipe couldn\'t be imported.';
      toast(msg, 'error');
      try{ dailyLog.event('error', msg, { kind: 'recipe-import', host: link.hostname, ms: Date.now() - started }); }
      catch(_){ /* logging must never be the thing that breaks the page */ }
      if(document.body.contains(go)){ go.disabled = false; go.textContent = 'Import'; }
    }finally{
      recipeImportBusy = false;
    }
  };
  go.onclick = run;
  input.onkeydown = e=>{ if(e.key === 'Enter') run(); };
  input.focus();
}
function mealSlotModal(key){
  const [date, slot] = key.split('|');
  const current = state.meals.plan[key] || '';
  const recipeOptions = state.meals.recipes.map(r=>`<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)}</option>`).join('');
  openModal(`
    <h3>${slot} — ${date}</h3>
    <div class="field"><label>What's for ${slot.toLowerCase()}?</label><input id="mpText" value="${escapeHtml(current)}" placeholder="Type or pick a saved recipe"></div>
    ${recipeOptions? `<div class="field"><label>Or choose a saved recipe</label><select id="mpRecipe"><option value="">—</option>${recipeOptions}</select></div>` : ''}
    <div class="modal-actions">
      <button class="btn btn-danger" id="mpClear">Clear</button>
      <button class="btn btn-ghost" id="mpCancel">Cancel</button>
      <button class="btn btn-primary" id="mpSave">Save</button>
    </div>
  `);
  document.getElementById('mpCancel').onclick = closeModal;
  document.getElementById('mpClear').onclick = ()=>{ delete state.meals.plan[key]; saveState(); closeModal(); render(); };
  const recipeSel = document.getElementById('mpRecipe');
  if(recipeSel) recipeSel.onchange = ()=>{ if(recipeSel.value) document.getElementById('mpText').value = recipeSel.value; };
  document.getElementById('mpSave').onclick = ()=>{
    const v = document.getElementById('mpText').value.trim();
    if(v) state.meals.plan[key] = v; else delete state.meals.plan[key];
    saveState(); closeModal(); render();
  };
}

/* ============================= SETTINGS ============================= */
function renderSettings(){

  const familySyncNote = cloudSync.mode() === 'member'
    ? `Signed in as <strong>${escapeHtml(cloudSync.account.email)}</strong>. Your family's board syncs to every device, and these settings follow you to any device you sign in on. Status: <strong>${cloudStatusLabel()}</strong>.`
    : cloudSync.isOn()
    /* Deliberately does NOT name a second place to sign in. This line used to
       send people to the 👤 button at the top while the Home strip sent them
       to the sync panel -- two routes described for one flow, which is what
       made it unclear which one was real. Sign-in lives on the Home strip and
       nowhere else; this only reports where the data stands. */
    ? `Cleaning jobs, to-dos, habits, points and meals are syncing through your cloud database, so every device shows the same board. Status: <strong>${cloudStatusLabel()}</strong>. Sign in with Google on the <strong>Home</strong> screen so your settings follow you too.`
    : usingLocalFallback
      ? `⚠️ This copy is saving data <strong>on this device/browser only</strong>. Connect a small free cloud database and every phone, tablet and computer shows the same board — about five minutes, once. After that, one button hands the settings to your other devices in a link.`
      : `This copy already syncs across every device that opens this link, so a cloud database is optional here.`;

    <div class="list-row">
      ${avatarHtml(p)}
      <input class="txt" style="border:none; background:transparent; padding:0;" data-personname="${p.id}" value="${escapeHtml(p.name)}">
      <button class="btn btn-ghost" style="font-size:12px; padding:5px 10px;" data-editavatar="${p.id}">Change avatar</button>
      <button class="row-x" data-delperson="${p.id}">✕</button>
    </div>`).join('');
  return `<div class="card">
      <div class="section-title"><h2>Settings</h2></div>

      <h3 style="font-size:15px;">Family calendar name</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:-4px;">This is the label for the tab that shows everyone's events together on the Calendar page.</p>
      <div class="add-row">
        <input id="familyLabelInput" value="${escapeHtml(state.familyLabel || 'Family calendar')}" placeholder="Family calendar" maxlength="40">
        <button class="btn btn-primary" id="saveFamilyLabel">Save</button>
      </div>

      <hr style="margin:20px 0; border:none; border-top:1px solid var(--line);">

      <h3 style="font-size:15px;">Time format</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:-4px;">How event times are shown across the app. Right now ${escapeHtml(fmtTime('14:30'))} — pick the other option to see it as ${escapeHtml(state.timeFormat==='24h' ? '2:30 PM' : '14:30')}.</p>
      <div class="add-row">
        <select id="timeFormatSel">
          <option value="12h" ${state.timeFormat!=='24h'?'selected':''}>12-hour — 2:30 PM</option>
          <option value="24h" ${state.timeFormat==='24h'?'selected':''}>24-hour — 14:30 (military)</option>
        </select>
      </div>

      <hr style="margin:20px 0; border:none; border-top:1px solid var(--line);">

      <h3 style="font-size:15px;">Second time zone</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:-4px;">Show every event in a second zone as well — handy when someone's travelling or family lives away. Week and day views print both times; month view shows the second zone when you hover an event.</p>
      <div class="field" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="tzEnabled" style="width:18px;height:18px;" ${tz.enabled?'checked':''}>
        <label style="margin:0;">Show a second time zone</label>
      </div>
      <div id="tzFields" style="${tz.enabled?'':'display:none;'}">
        <div class="field"><label>Main zone (how event times are entered)</label>
          <select id="tzPrimary">${tzOptionsHtml(tz.primary)}</select></div>
        <div class="field"><label>Main zone label (optional)</label>
          <input id="tzPrimaryLabel" value="${escapeHtml(state.timeZones.primaryLabel||'')}" placeholder="e.g. Home" maxlength="12"></div>
        <div class="field"><label>Second zone</label>
          <select id="tzSecondary">${tzOptionsHtml(tz.secondary)}</select></div>
        <div class="field"><label>Second zone label (optional)</label>
          <input id="tzSecondaryLabel" value="${escapeHtml(state.timeZones.secondaryLabel||'')}" placeholder="e.g. Grandma" maxlength="12"></div>
        <p style="font-size:12.5px; color:var(--ink-soft);">Right now that reads
          <strong>${escapeHtml(fmtNowInZone(tz.primary))} ${escapeHtml(tzLabel(tz.primary, tz.primaryLabel))}</strong> ·
          <strong>${escapeHtml(fmtNowInZone(tz.secondary))} ${escapeHtml(tzLabel(tz.secondary, tz.secondaryLabel))}</strong>.
        </p>
      </div>

      <hr style="margin:20px 0; border:none; border-top:1px solid var(--line);">

      <h3 style="font-size:15px;">Checked items</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:-4px;">To-dos normally drop into a Completed drawer at the foot of their page, where you can review them and clear them with <strong>Remove all checked</strong>. Turn this on to have them disappear the moment they're ticked instead.</p>
      <div class="field" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="autoRemoveChecked" style="width:18px;height:18px;" ${state.autoRemoveChecked?'checked':''}>
        <label style="margin:0;">Remove checked items automatically</label>
      </div>
      <p style="font-size:12.5px; color:var(--ink-soft);">Points are still awarded either way — ticking is what earns them. Habits are unaffected: ticking one is the tracking, so the grid keeps its history and the button only clears today's ticks.</p>

      <h3 style="font-size:15px;">Sleep mode</h3>
