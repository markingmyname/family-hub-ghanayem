          <li>In <strong>Authentication → URL Configuration</strong>, add <code style="user-select:all;">${escapeHtml(authReturnUrl())}</code> to the Redirect URLs.</li>
        </ol>
      </details>`);
  }

  if(acct.kind === 'checking'){
    return wrap(`
      <p style="font-size:13px; margin:0 0 8px;">Signed in as <strong>${escapeHtml(auth.email())}</strong>, but your family's list can't be reached right now${acct.detail ? ': ' + escapeHtml(acct.detail) : '.'}</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn btn-primary" id="acctRecheck">Check again</button>${signOutBtn}</div>`);
  }

  if(acct.kind === 'no-family'){
    /* Claiming is offered only when this device already belongs to a family;
       a device without one can only start a new family. That keeps a second
       phone from quietly creating a rival family instead of joining. */
    const firstStep = cfg
      ? `<li style="margin-bottom:6px;"><strong>First one here?</strong> This device syncs with family <code>${escapeHtml(cfg.familyId)}</code>. Switch it to Google sign-in — you'll be on its list and can add everyone else.
           <br><button class="btn btn-primary" id="acctSetup" style="margin-top:4px; font-size:12px;">Use Google sign-in for this family</button></li>`
      : `<li style="margin-bottom:6px;"><strong>Starting a brand-new family?</strong> This device's board becomes the family's.
           <br><button class="btn btn-ghost" id="acctSetup" style="margin-top:4px; font-size:12px;">Start a family with this device's board</button></li>`;
    return wrap(`
      <p style="font-size:13px; margin:0 0 6px;">Signed in as <strong>${escapeHtml(auth.email())}</strong> — this account isn't on a family list yet.</p>
      <ul style="font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 8px; padding-left:18px;">
        <li style="margin-bottom:6px;"><strong>Joining your family?</strong> Ask someone who's signed in to add <strong>${escapeHtml(auth.email())}</strong> under <em>Who can sign in</em> on this panel, then press Check again.</li>
        ${firstStep}
      </ul>
      <div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn btn-ghost" id="acctRecheck">Check again</button>${signOutBtn}</div>`);
  }

  /* ---- member ---- */
  const mine = acct.email;
  const list = cloudSync.members;   // null until loaded
  const byPerson = {};
  (list || []).forEach(m=>{ if(m.person_id) (byPerson[m.person_id] = byPerson[m.person_id] || []).push(m); });
  const othersOn = id => (byPerson[id] || []).some(m=>m.email !== mine);

  /* "This is me" offers only people with no one else's email on them, so
     picking yourself can never take someone else's access away. */
  const meOptions = state.people
    .filter(p=>!othersOn(p.id) || p.id === acct.personId)
    .map(p=>`<option value="${p.id}" ${p.id===acct.personId?'selected':''}>${escapeHtml(p.name)}</option>`).join('');

  const personRows = state.people.map(p=>{
    if(p.id === acct.personId){
      return `<div class="list-row" style="gap:8px;">${avatarHtml(p,'sm')}<span class="txt">${escapeHtml(p.name)}</span>
        <span style="font-size:12px; color:var(--ink-soft);">you · ${escapeHtml(mine)}</span></div>`;
    }
    const m = (byPerson[p.id] || []).find(x=>x.email !== mine);
    const status = m ? (m.signed_in ? '<span style="color:var(--good); font-size:12px;">✓ signed in</span>' : '<span style="font-size:12px; color:var(--ink-soft);">invited</span>') : '';
    return `<div class="list-row" style="gap:8px;">${avatarHtml(p,'sm')}<span class="txt" style="flex:0 0 auto; min-width:70px;">${escapeHtml(p.name)}</span>
      <input data-memberemail="${p.id}" value="${escapeHtml(m ? m.email : '')}" placeholder="their Google email" autocomplete="off" style="flex:1; min-width:140px; font-size:12.5px;">
      ${status}</div>`;
  }).join('');

  /* Accounts on the list that aren't linked to anyone on the board — yourself
     before you pick who you are, or someone whose person was renamed away. */
  const loose = (list || []).filter(m=>!m.person_id || !personById(m.person_id));
  const looseRows = loose.map(m=>`<div class="list-row" style="gap:8px; font-size:12.5px;">
      <span class="txt">${escapeHtml(m.email)}${m.email === mine ? ' (you)' : ''}</span>
      <span style="font-size:12px; color:var(--ink-soft);">${m.signed_in ? '✓ signed in' : 'invited'}</span>
      ${m.email === mine ? '' : `<button class="row-x" data-memberremove="${escapeHtml(m.email)}" title="Take off the list">✕</button>`}
    </div>`).join('');

  return wrap(`
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
      <span style="font-size:13px;">Signed in as <strong>${escapeHtml(mine)}</strong></span>${signOutBtn}
    </div>
    <div class="field" style="margin:8px 0;"><label>This is me</label>
      <select id="acctPerson">${acct.personId ? '' : '<option value="">Choose who you are…</option>'}${meOptions}</select></div>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);">
      <span>Last sync ${escapeHtml(cloudAgoLabel())}</span>
      <button class="btn btn-ghost" id="cloudSyncNow" style="font-size:12px;">🔄 Sync now</button>
    </div>
    <h4 style="font-size:13.5px; margin:14px 0 2px;">Who can sign in</h4>
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 6px;">Add each person's Google email. Only these accounts can open your family's board. Clear an email to take that person's access away.</p>
    ${list === null ? '<div style="font-size:12.5px; color:var(--ink-soft);">Loading the list…</div>' : personRows + looseRows}
    <div id="memberMsg" style="font-size:12px; margin-top:6px; min-height:15px;"></div>
    <h4 style="font-size:13.5px; margin:16px 0 2px;">Recent activity</h4>
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 6px;">Who changed what, on any device. The last ${ACTIVITY_MAX} changes are kept here; the complete record is in the daily log below.</p>
    <div id="activityFeed" style="font-size:12.5px; line-height:1.7; max-height:200px; overflow:auto;">${activityFeedHtml()}</div>

    <h4 style="font-size:13.5px; margin:16px 0 2px;">Daily log</h4>
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 6px;">Every change is kept permanently, one row each. Each day is sealed at 12:30am the next morning, and any day can be downloaded as a spreadsheet.</p>
    <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
      <select id="logDay" style="max-width:220px;"><option value="">Loading days…</option></select>
      <button class="btn btn-ghost" id="logCsv" style="font-size:12px;">⬇️ CSV</button>
      <button class="btn btn-ghost" id="logJson" style="font-size:12px;">⬇️ JSON</button>
    </div>
    <div id="logMsg" style="font-size:12px; margin-top:6px; min-height:15px; color:var(--ink-soft);"></div>
    <details style="margin-top:8px;">
      <summary style="cursor:pointer; font-size:11.5px; color:var(--ink-soft);">Update the setup SQL (after an app update)</summary>
      <p style="font-size:12px; color:var(--ink-soft); line-height:1.5; margin:6px 0;">
        An app update can add database functions. If syncing stops with a message about the setup SQL, copy it here and run it again — it is written to be safe to re-run, and it never touches your family's data.
      </p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost" id="acctCopySetup" style="font-size:12px;">📋 Copy SQL</button>
        <button class="btn btn-ghost" id="acctOpenSetupSql" style="font-size:12px;">↗️ Open SQL editor</button>
      </div>
    </details>

    <details style="margin-top:8px;">
      <summary style="cursor:pointer; font-size:11.5px; color:var(--ink-soft);">Turn on the nightly log seal (run once)</summary>
      <p style="font-size:12px; color:var(--ink-soft); line-height:1.5; margin:6px 0;">
        Changes are logged as they happen either way. This schedules a job inside the database that takes a sealed snapshot of each finished day at 12:30am, so a day can never be altered after the fact. It is separate because it needs the pg_cron extension turned on.
      </p>
      <button class="btn btn-ghost" id="acctCopySchedule" style="font-size:12px;">📋 Copy schedule SQL</button>
      <pre style="font-size:11px; line-height:1.5; overflow:auto; background:rgba(0,0,0,0.05); padding:8px 10px; border-radius:8px; margin:6px 0 0;">${escapeHtml(LOG_SCHEDULE_SQL)}</pre>
    </details>

    <details style="margin-top:8px;">
      <summary style="cursor:pointer; font-size:11.5px; color:var(--ink-soft);">Finish the switch, once everyone has signed in</summary>
      <p style="font-size:12px; color:var(--ink-soft); line-height:1.5; margin:6px 0;">
        Until this runs, the old family code still opens your board, so devices that haven't signed in keep working. Once every device has signed in, run this in the Supabase SQL editor so only signed-in family members can get in.
      </p>
      <button class="btn btn-ghost" id="acctCopyLockdown" style="font-size:12px;">📋 Copy lockdown SQL</button>
      <pre style="font-size:11px; line-height:1.5; overflow:auto; background:rgba(0,0,0,0.05); padding:8px 10px; border-radius:8px; margin:6px 0 0;">${escapeHtml(FAMILY_LOCKDOWN_SQL)}</pre>
    </details>`);
}

/* ---- The activity feed, as the family reads it ----
   Rendered straight from the board, so every device shows the same list without
   another call to the database. The board keeps the last ACTIVITY_MAX lines;
   anything older lives only in the daily log. */
function activityFeedHtml(limit){
  const feed = Array.isArray(state.activity) ? state.activity : [];
  if(!feed.length){
    return '<div style="color:var(--ink-soft);">Nothing yet. Changes will show up here as the family uses the app.</div>';
  }
  return feed.slice(0, limit || 25).map(e=>{
    const who  = e.byName ? escapeHtml(e.byName) : 'Someone';
    const verb = e.op === 'add' ? 'added' : e.op === 'remove' ? 'removed' : 'changed';
    const n    = Number(e.n) || 1;
    /* A collapsed line has no names on it -- one calendar import is "added 40
       events", not forty lines. A single change names the thing itself. */
    const what = e.name
      ? escapeHtml(e.name) + ' <span style="color:var(--ink-soft);">(' + escapeHtml(e.noun || '') + ')</span>'
      : n + ' ' + escapeHtml(pluralNoun(e.noun || 'things', n));
    return '<div style="display:flex; gap:8px; align-items:baseline;">'
         +   '<span style="color:var(--ink-soft); min-width:62px; font-variant-numeric:tabular-nums;">'
         +     escapeHtml(activityWhen(e.at)) + '</span>'
         +   '<span><strong>' + who + '</strong> ' + verb + ' ' + what + '</span>'
         + '</div>';
  }).join('');
}
function pluralNoun(noun, n){
  if(n === 1) return noun;
  if(noun === 'person') return 'people';
  return noun + 's';
}
/* Today shows a clock time, in whichever format this person prefers; anything
   older shows the date, because "3:40pm" on its own would be misleading. */
function activityWhen(ms){
  const when = new Date(Number(ms) || 0);
  if(!Number.isFinite(when.getTime()) || !ms) return '';
  if(fmtDate(when) !== fmtDate(new Date())) return fmtDate(when).slice(5);
  return fmtTime(String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0'));
}

/* Wires up whatever accountBlockHtml() drew. */
function attachAccountHandlers(setMsg){
  const memberMsg = (text, ok)=>{
    const el = document.getElementById('memberMsg');
    if(el){ el.style.color = ok === false ? 'var(--danger)' : 'var(--good)'; el.textContent = text; }
  };
  const busy = async (btn, work)=>{
    if(btn) btn.disabled = true;
    try{ await work(); }
    catch(err){ if(btn) btn.disabled = false; setMsg((err && err.message) || 'That didn\'t work.', false); }
  };

  /* No #acctSignIn here any more: the panel no longer carries a Sign in
     button. The app's only one is #bannerSignIn on the Home strip. If a second
     sign-in entry point is ever added, wire it there, not here. */

  /* ---- Daily log ----
     The day list comes from the database rather than from the board, because
     the board only remembers the last 200 changes and the log remembers all of
     them. Any change still waiting in this device's queue is sent first, so a
     download is never missing what was just done. */
  const logMsg = (text, bad)=>{
    const el = document.getElementById('logMsg');
    if(el){ el.style.color = bad ? 'var(--danger)' : 'var(--ink-soft)'; el.textContent = text; }
  };
  const logDay = document.getElementById('logDay');
  if(logDay){
    dailyLog.flush();
    dailyLog.days()
      .then(days=>{
        if(!days.length){
          logDay.innerHTML = '<option value="">Nothing logged yet</option>';
          logMsg('Changes will appear here as the family uses the app.');
          return;
        }
        logDay.innerHTML = days.map(d=>{
          const n = Number(d.entries) || 0;
          return '<option value="' + escapeHtml(d.day) + '">' + escapeHtml(d.day)
               + '  (' + n + ' ' + (n === 1 ? 'change' : 'changes') + ')</option>';
        }).join('');
        logMsg(days.length + (days.length === 1 ? ' day' : ' days') + ' on record.');
      })
      .catch(err=>{
        /* Almost always the setup SQL not having been run yet, so the message
           says what to do rather than just reporting a failure. */
        logDay.innerHTML = '<option value="">Unavailable</option>';
        logMsg(err.message, true);
      });
  }
  const download = (format, btn)=>busy(btn, async ()=>{
    const day = logDay && logDay.value;
    if(!day){ logMsg('Pick a day first.', true); return; }
    await dailyLog.flush();
    const res = await dailyLog.download(day, format);
    logMsg('Saved ' + res.name + '  \u2014  ' + res.rows + (res.rows === 1 ? ' change' : ' changes')
           + (res.sealed ? ', from the sealed snapshot.' : ', read live (this day is not sealed yet).'));
    if(btn) btn.disabled = false;
  });
  const logCsv = document.getElementById('logCsv');
  if(logCsv) logCsv.onclick = ()=>download('csv', logCsv);
  const logJson = document.getElementById('logJson');
  if(logJson) logJson.onclick = ()=>download('json', logJson);

  const copySetup = document.getElementById('acctCopySetup');
  if(copySetup) copySetup.onclick = ()=>busy(copySetup, async ()=>{
    await navigator.clipboard.writeText(CLOUD_SETUP_SQL);
    memberMsg('Setup SQL copied. Paste it into the Supabase SQL editor and press Run.', true);
    copySetup.disabled = false;
  });
  const openSetupSql = document.getElementById('acctOpenSetupSql');
  if(openSetupSql) openSetupSql.onclick = ()=>{
    /* Straight to a blank query against this project, rather than the
       dashboard home, so there is nothing to navigate. */
    const cfg = cloudConfig() || {};
    const ref = String(cfg.url || DEFAULT_CLOUD_URL).replace(/^https?:\/\//, '').split('.')[0];
    window.open('https://supabase.com/dashboard/project/' + encodeURIComponent(ref) + '/sql/new', '_blank', 'noopener');
  };

  const copySchedule = document.getElementById('acctCopySchedule');
  if(copySchedule) copySchedule.onclick = ()=>busy(copySchedule, async ()=>{
    await navigator.clipboard.writeText(LOG_SCHEDULE_SQL);
    logMsg('Schedule SQL copied. Paste it into the Supabase SQL editor and press Run.');
    copySchedule.disabled = false;
  });

  const signOut = document.getElementById('acctSignOut');
  if(signOut) signOut.onclick = ()=>busy(signOut, async ()=>{
    await cloudSync.signOut();
    renderCloudBlock(true);
    toast('Signed out. This device keeps its copy of the board but stops syncing until someone signs in.', 'success');
  });

  const recheck = document.getElementById('acctRecheck');
  if(recheck) recheck.onclick = ()=>busy(recheck, async ()=>{
    await cloudSync.refreshAccount();
    renderCloudBlock(true);
    refreshMemberList();
    if(cloudSync.mode() === 'member') toast('You\'re on your family\'s list. ✅', 'success');
  });

  const setup = document.getElementById('acctSetup');
  if(setup) setup.onclick = ()=>busy(setup, async ()=>{
    await cloudSync.setupFamily();
    renderCloudBlock(true);
    refreshMemberList();
    toast('Google sign-in is on for your family. Add everyone\'s Google email under Who can sign in. ✅', 'success');
  });

  const person = document.getElementById('acctPerson');
  if(person) person.onchange = ()=>{
    if(!person.value) return;
    person.disabled = true;
    cloudSync.setMemberEmail(person.value, cloudSync.account.email)
      .then(()=>{ renderCloudBlock(true); render(); toast(`Got it — you're ${personById(person.value).name}.`, 'success'); })
      .catch(err=>{ person.disabled = false; memberMsg(err.message, false); });
  };

  document.querySelectorAll('[data-memberemail]').forEach(inp=>inp.onchange = ()=>{
    const email = inp.value.trim();
    if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ memberMsg('That doesn\'t look like an email address.', false); return; }
    inp.disabled = true;
    const who = personById(inp.dataset.memberemail);
    cloudSync.setMemberEmail(inp.dataset.memberemail, email)
      .then(()=>{
        renderCloudBlock(true);
        memberMsg(email ? `${who ? who.name : 'They'} can now sign in with ${email.toLowerCase()}.` : `${who ? who.name : 'That person'} can no longer sign in.`, true);
      })
      .catch(err=>{ inp.disabled = false; memberMsg(err.message, false); });
  });

  document.querySelectorAll('[data-memberremove]').forEach(b=>b.onclick = ()=>{
    b.disabled = true;
    cloudSync.removeMember(b.dataset.memberremove)
      .then(()=>{ renderCloudBlock(true); memberMsg('Taken off the list.', true); })
      .catch(err=>{ b.disabled = false; memberMsg(err.message, false); });
  });

  const copyLock = document.getElementById('acctCopyLockdown');
  if(copyLock) copyLock.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(FAMILY_LOCKDOWN_SQL); memberMsg('Lockdown SQL copied. Paste it into the Supabase SQL editor and press Run.', true); }
    catch(e){ memberMsg('Copy failed — select the SQL below and copy it by hand.', false); }
  };

  const copySql = document.getElementById('acctCopySql');
  if(copySql) copySql.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(CLOUD_SETUP_SQL); setMsg('SQL copied. Open the SQL editor, paste, and press Run.', true); }
    catch(e){ setMsg('Copy failed — open the family code setup below and copy the SQL from there.', false); }
  };
  const openSql = document.getElementById('acctOpenSql');
  if(openSql) openSql.onclick = ()=>window.open(cloudSqlEditorUrl(cloudProject().url), '_blank', 'noopener');
}

/* `force` marks a redraw the person asked for. Background status updates leave
   an open form alone — a poll landing mid-keystroke used to wipe whatever was
   half-typed into it. */
function renderCloudBlock(force){
  const block = document.getElementById('cloudBlock');
  if(!block) return;
  const typing = block.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!force && (codeFormOpen || cloudFormOpen || typing)) return;
  const member = cloudSync.mode() === 'member';
  const cfg = cloudConfig();
  const on = !!cfg;

  /* Joining overwrites this device's copy, so the previous one is kept until
     the household is happy. Offered here rather than silently discarded. */
  let backupNames = '';
  try{
    const raw = localStorage.getItem(PREJOIN_BACKUP_KEY);
    if(raw){
      const prev = JSON.parse(raw);
      backupNames = (prev.people || []).map(p=>p.name).join(', ');
    }
  }catch(e){}
  const backupBlock = backupNames ? `
    <div style="border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin:0 0 10px; font-size:11.5px; color:var(--ink-soft); line-height:1.5;">
      Before joining, this device held: <strong>${escapeHtml(backupNames)}</strong>.
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
        <button class="btn btn-ghost" id="cloudRestoreBackup" style="font-size:11.5px;">↩️ Put that copy back</button>
        <button class="btn btn-ghost" id="cloudDropBackup" style="font-size:11.5px;">Discard it</button>
      </div>
    </div>` : '';

  /* The family-code controls (setup link, code, rename, stop) belong to the
     older way in. A signed-in device gets its family from the account instead. */
  const connectedSummary = (on && !member) ? `
    <div style="background:rgba(0,0,0,0.04); border-radius:8px; padding:8px 10px; margin:0 0 10px; font-size:12.5px; line-height:1.7;">
      <div>Database: <strong>${escapeHtml(cloudHost(cfg))}</strong></div>
      <div>Family: <code style="user-select:all;">${escapeHtml(cfg.familyId)}</code></div>
      <div>This device: <code>${escapeHtml(deviceId())}</code> · last sync ${escapeHtml(cloudAgoLabel())}</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-primary" id="cloudSyncNow">🔄 Sync now</button>
      <button class="btn btn-ghost" id="cloudInvite">🔗 Copy setup link for another device</button>
      <button class="btn btn-ghost" id="cloudCopyFamily">📋 Copy family code</button>
      <button class="btn btn-ghost" id="cloudRenameFamily" style="font-size:12px;">✏️ Change family code</button>
      <button class="btn btn-ghost" id="cloudEdit" style="font-size:12px;">${cloudFormOpen ? 'Cancel' : 'Change settings'}</button>
      <button class="btn btn-ghost" id="cloudDisconnect" style="font-size:12px;">Stop syncing</button>
    </div>
    ${codeFormOpen ? `
    <div style="border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin:10px 0 0;">
      <p style="font-size:12.5px; margin:0 0 6px;"><strong>Pick a new family code</strong></p>
      <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 8px;">
        The board moves to the new code and the old one is left as a signpost, so your other devices follow within a
        few seconds — nothing to retype on them.
      </p>
      <div class="add-row" style="margin:0;">
        <input id="newFamilyCode" value="${escapeHtml(cfg.familyId)}" placeholder="family-ghanayem-7k3p">
        <button class="btn btn-ghost" id="addCodeSuffix" style="font-size:12px;">+ Random 6</button>
      </div>
      <div id="codeHint" style="font-size:11.5px; margin-top:6px; min-height:15px;"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
        <button class="btn btn-primary" id="saveFamilyCode">💾 Save</button>
        <button class="btn btn-ghost" id="cancelFamilyCode">Cancel</button>
      </div>
      <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:8px 0 0;">
        This <strong>renames your own family</strong>. To put this device onto a family that already exists, close this and
        use <em>Change settings</em> instead — paste the code there and press <em>Join this family</em>.
      </p>
    </div>` : ''}
    <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:8px 0 0;">
      The setup link contains the key — send it to your own devices the way you'd hand over a house key, not in a public post.
    </p>` : '';

  /* Folded away by default now that signing in is the main way to join; still
     there for the setup SQL and for devices that haven't signed in yet. */
  const showFormBtn = (!member && !on && !cloudFormOpen) ? `
    <button class="btn btn-ghost" id="cloudShowForm" style="font-size:12px; margin-top:4px;">Set up with a family code instead (older way)</button>` : '';
  const form = (!member && cloudFormOpen) ? `
    <div style="border:1px solid var(--line, rgba(0,0,0,0.12)); border-radius:10px; padding:10px 12px; margin:10px 0 0;">
      <p style="font-size:12.5px; margin:0 0 8px;"><strong>Two steps — the project details are already filled in</strong></p>
      <ol style="font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:0; padding-left:18px;">
        <li style="margin-bottom:12px;">
          <strong style="color:var(--ink);">Run the setup SQL</strong> — once for the whole household, not once per device.
          It makes the one table your family's board lives in.
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
            <button class="btn btn-ghost" id="cloudCopySql" style="font-size:12px;">📋 Copy SQL</button>
            <button class="btn btn-ghost" id="cloudOpenSql" style="font-size:12px;">↗️ Open SQL editor</button>
          </div>
          <details style="margin-top:6px;">
            <summary style="cursor:pointer; font-size:11.5px;">Show me what it does</summary>
            <pre style="font-size:11px; line-height:1.5; overflow:auto; background:rgba(0,0,0,0.05); padding:8px 10px; border-radius:8px; margin:6px 0 0;">${escapeHtml(CLOUD_SETUP_SQL)}</pre>
          </details>
        </li>
        <li style="margin-bottom:12px;">
          <strong style="color:var(--ink);">Adding another device?</strong> Paste the <strong>setup link</strong> or the
          <strong>family code</strong> from a device that's already syncing — both are on its sync panel. That's what carries
          the family across; without it, this device starts a brand new empty family of its own.
          <br>Setting the household up for the very first time? Leave the details below exactly as they are and press Connect.
          <textarea id="cloudPaste" rows="3" placeholder="Paste a setup link, or a family code like family-a1b2c3d4e5f6"
            style="width:100%; box-sizing:border-box; margin-top:6px; font-size:12px; font-family:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; resize:vertical;">${escapeHtml(cfg ? cfg.url + '\n' + cfg.key : DEFAULT_CLOUD_URL + '\n' + DEFAULT_CLOUD_KEY)}</textarea>
          <div id="cloudPasteHint" style="font-size:11.5px; margin-top:4px; min-height:15px;"></div>
        </li>
      </ol>
      <button class="btn btn-primary" id="cloudConnect" style="margin-top:4px;">${on ? 'Save and reconnect' : 'Connect'}</button>

      <details style="margin-top:10px;">
        <summary style="cursor:pointer; font-size:11.5px; color:var(--ink-soft);">Advanced</summary>
        <div class="field" style="margin-top:8px;"><label>Family ID — identifies your household's row</label>
          <div class="add-row" style="margin:0;">
            <input id="cloudFamily" value="${escapeHtml(cfg ? cfg.familyId : newFamilyId())}" placeholder="family-…">
            <button class="btn btn-ghost" id="cloudGenFamily" style="font-size:12px;">New</button>
          </div>
        </div>
        <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:6px 0 0;">
          Generated for you, and carried to your other devices by the setup link — there's normally no reason to touch it.
          If this family already holds data in the cloud, this device adopts it and its current local copy is replaced.
        </p>
      </details>

      <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:10px 0 0;">
        The key here is the <strong>publishable</strong> one — it ships inside this page, so treat it as public. On its own it
        can't reach anything: every request goes through a database function that demands the family ID, and that ID travels
        only between your own devices. A <strong>secret</strong> or <strong>service role</strong> key is refused outright.
      </p>
    </div>` : '';

  block.innerHTML = `
    <p style="font-size:12.5px; color:var(--ink-soft); margin:4px 0 8px;">
      Status: <strong>${cloudStatusLabel()}</strong>${cloudSync.pendingPush && cloudSync.status !== 'live' ? ' · changes waiting to go up' : ''}
    </p>
    ${cloudSync.detail ? `<p style="font-size:11.5px; color:var(--danger); margin:-4px 0 8px;">${escapeHtml(cloudSync.detail)}</p>` : ''}
    ${accountBlockHtml()}
    ${backupBlock}
    ${connectedSummary}
    ${showFormBtn}
    ${form}
    <div id="cloudStatusMsg" style="font-size:12.5px; margin-top:8px; min-height:16px;"></div>`;

  const setMsg = (msg, ok)=>{
    const el = document.getElementById('cloudStatusMsg');
    if(el){ el.style.color = ok === false ? 'var(--danger)' : (ok ? 'var(--good)' : 'var(--ink-soft)'); el.textContent = msg; }
  };
  attachAccountHandlers(setMsg);

  const showForm = document.getElementById('cloudShowForm');
  if(showForm) showForm.onclick = ()=>{ cloudFormOpen = true; renderCloudBlock(true); };

  const gen = document.getElementById('cloudGenFamily');
  if(gen) gen.onclick = ()=>{ document.getElementById('cloudFamily').value = newFamilyId(); };

  /* Restoring pushes the old copy up as the family's, so the whole household
     gets those names back rather than just this screen. */
  const restore = document.getElementById('cloudRestoreBackup');
  if(restore) restore.onclick = async ()=>{
    try{
      const raw = localStorage.getItem(PREJOIN_BACKUP_KEY);
      if(!raw) return;
      cloudSync.applyRemote(JSON.parse(raw));
      localStorage.removeItem(PREJOIN_BACKUP_KEY);
      await saveState();
      renderCloudBlock(true); render();
      toast(`Restored: ${state.people.map(p=>p.name).join(', ')}.`, 'success');
    }catch(e){ setMsg('That backup could not be read.', false); }
  };

  const dropBackup = document.getElementById('cloudDropBackup');
  if(dropBackup) dropBackup.onclick = ()=>{
    try{ localStorage.removeItem(PREJOIN_BACKUP_KEY); }catch(e){}
    renderCloudBlock(true);
  };

  const copySql = document.getElementById('cloudCopySql');
  if(copySql) copySql.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(CLOUD_SETUP_SQL); setMsg('SQL copied. Open the SQL editor, paste, and press Run.', true); }
    catch(e){ setMsg('Copy failed — open "Show me what it does" and copy the SQL by hand.', false); }
  };

  /* Sends them to their own project's editor when the paste box already names
     it, and to the dashboard's project picker when it doesn't. */
  const openSql = document.getElementById('cloudOpenSql');
  if(openSql) openSql.onclick = ()=>{
    const box = document.getElementById('cloudPaste');
    const parsed = box ? parseCloudPaste(box.value) : {};
    window.open(cloudSqlEditorUrl(parsed.url || DEFAULT_CLOUD_URL), '_blank', 'noopener');
  };

  const connect = document.getElementById('cloudConnect');

  /* Say out loud which of the two things pressing the button will do, because
     "start a new family" and "join the existing one" look identical otherwise
     and only one of them is what someone setting up a second phone wants. */
  const pasteBox = document.getElementById('cloudPaste');
  const refreshHint = ()=>{
    const hint = document.getElementById('cloudPasteHint');
    if(!hint || !pasteBox || !connect) return;
    const parsed = parseCloudPaste(pasteBox.value);
    if(parsed.error){
      hint.style.color = 'var(--danger)';
      hint.textContent = parsed.error;
      connect.textContent = on ? 'Save and reconnect' : 'Connect';
    }else if(parsed.familyId){
      hint.style.color = 'var(--good)';
      hint.textContent = `${parsed.kind === 'code' ? 'Family code' : 'Setup link'} recognised — this device will join family ${parsed.familyId}.`;
      connect.textContent = 'Join this family';
    }else{
      hint.style.color = 'var(--ink-soft)';
      hint.textContent = on ? '' : 'No setup link — pressing Connect starts a new family on this device.';
      connect.textContent = on ? 'Save and reconnect' : 'Connect';
    }
  };
  if(pasteBox){ pasteBox.oninput = refreshHint; refreshHint(); }

  if(connect) connect.onclick = async ()=>{
    const parsed = parseCloudPaste(document.getElementById('cloudPaste').value);
    const familyEl = document.getElementById('cloudFamily');
    /* A setup link brings its own family id and must win: that's the whole
       point of it. Otherwise fall back to the box, then to a fresh id. */
    const familyId = parsed.familyId || (familyEl && familyEl.value.trim()) || newFamilyId();
    if(parsed.error){ setMsg(parsed.error, false); return; }
    if(!parsed.key){ setMsg('Paste the project key — it starts with sb_publishable_ or eyJ.', false); return; }
    if(!parsed.url){ setMsg('Paste the project URL too — it looks like https://abcdefgh.supabase.co.', false); return; }
    connect.disabled = true;
    setMsg('Connecting…');
    try{
      const outcome = await cloudSync.connect({ url: parsed.url, key: parsed.key, familyId }, { mustExist: !!parsed.familyId });
      cloudFormOpen = false;
      renderCloudBlock(true);
      toast(outcome === 'joined'
        ? `Joined — now showing ${state.people.map(p=>p.name).join(', ')}. ✅`
        : 'Family sync is on. This device\'s data is now the shared copy. ✅', 'success');
      render();
    }catch(err){
      connect.disabled = false;
      setMsg((err && err.message) || 'Couldn\'t connect.', false);
    }
  };

  const syncNow = document.getElementById('cloudSyncNow');
  if(syncNow) syncNow.onclick = async ()=>{
    syncNow.disabled = true;
    setMsg('Checking…');
    try{
      if(cloudSync.pendingPush) await cloudSync.push();
      const result = await cloudSync.pull(false);
      if(result === 'empty') await cloudSync.push();
      renderCloudBlock(true);
      setMsg(result === 'applied' ? 'Picked up newer changes from another device. ✅' : 'Everything is up to date. ✅', true);
      render();
    }catch(err){
      renderCloudBlock(true);
      setMsg((err && err.message) || 'Sync failed.', false);
    }
  };

  const invite = document.getElementById('cloudInvite');
  if(invite) invite.onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(cloudInviteLink(cfg));
      setMsg('Setup link copied. Open it on the other device — it joins this family and clears itself from the address bar.', true);
    }catch(e){ setMsg('Copy failed — this browser blocked clipboard access.', false); }
  };

  const copyFamily = document.getElementById('cloudCopyFamily');
  if(copyFamily) copyFamily.onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(cfg.familyId);
      setMsg('Family code copied. Paste it into the sync panel on the other device and press Join.', true);
    }catch(e){ setMsg(`Copy failed — the code is ${cfg.familyId}`, false); }
  };

  const edit = document.getElementById('cloudEdit');
  if(edit) edit.onclick = ()=>{ cloudFormOpen = !cloudFormOpen; renderCloudBlock(true); };

  const renameBtn = document.getElementById('cloudRenameFamily');
  if(renameBtn) renameBtn.onclick = ()=>{ codeFormOpen = !codeFormOpen; renderCloudBlock(true); };

  const codeInput = document.getElementById('newFamilyCode');
  const codeHint = document.getElementById('codeHint');
  const refreshCodeHint = ()=>{
    if(!codeInput || !codeHint) return;
    const code = normalizeFamilyCode(codeInput.value);
    const problem = familyCodeProblem(code);
    if(problem){ codeHint.style.color = 'var(--danger)'; codeHint.textContent = problem; return; }
    if(familyCodeIsGuessable(code)){
      codeHint.style.color = 'var(--mustard)';
      codeHint.textContent = `Will become ${code} — guessable, though. This code is the only thing keeping your family's board private.`;
    }else{
      codeHint.style.color = 'var(--good)';
      codeHint.textContent = `Will become ${code}`;
    }
  };
  if(codeInput){ codeInput.oninput = refreshCodeHint; refreshCodeHint(); }

  const addSuffix = document.getElementById('addCodeSuffix');
  if(addSuffix) addSuffix.onclick = ()=>{
    // Six characters of noise is enough to stop the code being guessed.
    const suffix = Math.random().toString(36).slice(2,8).padEnd(6,'x').slice(0,6);
    codeInput.value = normalizeFamilyCode(codeInput.value) + '-' + suffix;
    refreshCodeHint();
    codeInput.focus();
  };

  const cancelCode = document.getElementById('cancelFamilyCode');
  if(cancelCode) cancelCode.onclick = ()=>{ codeFormOpen = false; renderCloudBlock(true); };

  const saveCode = document.getElementById('saveFamilyCode');
  if(saveCode) saveCode.onclick = async ()=>{
    const code = normalizeFamilyCode(codeInput.value);
    const problem = familyCodeProblem(code);
    if(problem){ setMsg(problem, false); return; }
    saveCode.disabled = true;
    setMsg('Moving the family…');
    try{
      await cloudSync.changeFamilyCode(code);
      codeFormOpen = false;
      renderCloudBlock(true);
      setMsg(`Done. Your other devices will follow within about 8 seconds — no retyping needed.`, true);
      toast(`Family code is now ${code}.`, 'success');
    }catch(err){
      saveCode.disabled = false;
      /* Renaming onto a code that exists is nearly always someone trying to put
         this device onto the family they already have. Offer that, rather than
         sending them off to a different form to do it. */
      if(err && err.codeExists){
        const msgEl = document.getElementById('cloudStatusMsg');
        msgEl.style.color = 'var(--ink-soft)';
        msgEl.innerHTML = `<strong>${escapeHtml(code)}</strong> already exists — that's your other family.
          <br>Do you want this device to <strong>join</strong> it instead? Everything on this device will be replaced by that family's copy.
          <br><button class="btn btn-primary" id="joinExistingInstead" style="margin-top:6px; font-size:12px;">Join ${escapeHtml(code)}</button>`;
        document.getElementById('joinExistingInstead').onclick = async ()=>{
          const cfg = cloudConfig();
          try{
            await cloudSync.connect({ url: cfg.url, key: cfg.key, familyId: code }, { mustExist: true });
            codeFormOpen = false;
            renderCloudBlock(true);
            toast(`Joined — now showing ${state.people.map(p=>p.name).join(', ')}. ✅`, 'success');
            render();
          }catch(e){ setMsg((e && e.message) || 'Couldn\'t join.', false); }
        };
        return;
      }
      setMsg((err && err.message) || 'Couldn\'t change the code.', false);
    }
  };

  const disconnect = document.getElementById('cloudDisconnect');
  if(disconnect) disconnect.onclick = ()=>{
    cloudSync.disconnect();
    cloudFormOpen = true;
    renderCloudBlock(true);
    toast('Family sync is off. This device keeps its own copy; the cloud copy is untouched.', 'success');
  };
}

/* An invite link points the app at somebody's database, so it always asks
   first — the same reason a browser asks before sharing your location. */
function cloudInviteModal(cfg){
  openModal(`
    <h3>☁️ Join family sync?</h3>
    <p style="font-size:13px; line-height:1.6;">
      This link sets Family Hub up to sync with <strong>${escapeHtml(cloudHost(cfg))}</strong>, family <code>${escapeHtml(cfg.familyId)}</code>.
    </p>
    <p style="font-size:12.5px; color:var(--ink-soft); line-height:1.6;">
      Only continue if this came from your own household. This device will show that family's cleaning jobs, to-dos, habits, points and meals — replacing whatever is saved here now.
    </p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="inviteNo">Not now</button>
      <button class="btn btn-primary" id="inviteYes">Join</button>
    </div>
    <div id="inviteMsg" style="font-size:12.5px; color:var(--danger); min-height:16px;"></div>
  `);
  document.getElementById('inviteNo').onclick = ()=>closeModal();
  document.getElementById('inviteYes').onclick = async (e)=>{
    e.target.disabled = true;
    try{
      await cloudSync.connect(cfg, { mustExist: true });
      closeModal();
      render();
      toast('Joined family sync. This device is now in step with the others. ✅', 'success');
    }catch(err){
      e.target.disabled = false;
      document.getElementById('inviteMsg').textContent = (err && err.message) || 'Couldn\'t join.';
    }
  };
}

async function initCloudSync(){
  /* The header's cloud icon and its updateCloudIndicator() call were removed
     here. Sync state reaches the person through the refresh bar on every tab
     and cloudStatusLabel() in Settings; the header keeps only the avatar,
     screensaver and settings icons. */
  const accountBtn = document.getElementById('accountBtn');
  if(accountBtn) accountBtn.onclick = familySyncModal;

  /* Coming back to the screen: check the board, and pick up any settings this
     person changed on another device in the meantime. */
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState !== 'visible') return;
    cloudSync.tick();
    mySettings.pull();
  });
  window.addEventListener('online',  ()=>cloudSync.tick());
  window.addEventListener('offline', ()=>{ if(cloudSync.isOn()) cloudSync.setStatus('offline'); });

  /* Back from Google? Finish signing in before anything else, so the first
     sync already runs as that person. */
  let justSignedIn = false;
  try{
    justSignedIn = (await auth.finishRedirect()) === 'signed-in';
  }catch(err){
    toast(err.message || 'Sign-in didn\'t finish.', 'error');
  }

  /* Works out the account (member, not on a list, or signed out), then loads the
     board and this person's settings. Devices that haven't signed in carry on
     with the family code if they have one. */
  await cloudSync.refreshAccount();

  if(justSignedIn){
    const acct = cloudSync.account;
    if(acct.kind === 'member'){
      const p = acct.personId ? personById(acct.personId) : null;
      toast(`Signed in${p ? ' as ' + p.name : ''}. ✅`, 'success');
      if(!acct.personId) familySyncModal();   // first sign-in: say who you are, add everyone else
    }else{
      familySyncModal();                     // not on a list yet: show the ways forward
    }
    return;
  }

  const invite = takeInviteFromHash();
  if(invite){
    if(cloudSync.mode() === 'member') toast('You\'re signed in with Google, so that setup link isn\'t needed — your family comes from your account.', 'success');
    else cloudInviteModal(invite);
    return;
  }

  /* An iOS home-screen install gets its own empty storage, so it arrives here
     looking like a factory-fresh device — placeholder names and all. Say so on
     first launch instead of letting it look like sync is simply broken. */
  if(!cloudSync.isOn() && !auth.isSignedIn() && isStandalone()){
    let prompted = null;
    try{ prompted = localStorage.getItem(CLOUD_PROMPTED_KEY); }catch(e){}
    if(!prompted){
      try{ localStorage.setItem(CLOUD_PROMPTED_KEY, '1'); }catch(e){}
      familySyncModal();
      toast('This install starts fresh — sign in with Google to see your family\'s board.', 'error');
    }
  }
}

function syncModal(){

    `<details style="border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:6px;">

  openModal(`
    <h3>🔄 Calendar sync</h3>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:-6px;">Google, Outlook, Yahoo, and Cozi all speak the <strong>.ics</strong> calendar format — that's the bridge Family Hub uses.</p>

    <h4 style="margin:14px 0 6px; font-size:14px;">1. Import a calendar file</h4>
    <div class="field"><label>Where synced and imported events land</label><select id="syncPerson">${assignTargetOptionsHtml(state.syncAssignTo)}</select>
      <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:6px 0 0;">
        Applies to Google and Outlook sync as well as file imports, and follows every device in the family.
        Keep it on the family calendar unless a connected account belongs to one person — anything filed under a
        person only shows when you pick them, while family events show under everyone.
      </p>
      ${state.events.length ? `
      <div style="border-top:1px solid var(--line); margin-top:10px; padding-top:10px;">
        <label style="display:block; margin-bottom:4px;">Move every event at once</label>
        <div class="add-row" style="margin:0;">
          <select id="bulkAssignTarget">${assignTargetOptionsHtml('')}</select>
          <button class="btn btn-ghost" id="moveAllEvents" style="font-size:12px;">Move all ${state.events.length}</button>
        </div>
        <p style="font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:6px 0 0;">
          Puts all ${state.events.length} event${state.events.length===1?'':'s'} on the one calendar, replacing whoever they're
          assigned to now. Handy for starting clean — there's no undo, so pick deliberately.
        </p>
      </div>` : ''}
    </div>
    <div class="field"><label>Choose an .ics file (exported from any calendar app)</label><input type="file" accept=".ics,text/calendar" id="syncFile"></div>
    <div id="syncResult" style="font-size:13px; min-height:18px; color:var(--good); font-weight:600;"></div>
    ${importedCount() ? `<button class="btn btn-ghost" id="clearImported" style="font-size:12px; padding:6px 10px;">Remove ${importedCount()} imported event${importedCount()===1?'':'s'}</button>` : ''}

    <h4 style="margin:16px 0 6px; font-size:14px;">2. Export the Family Hub calendar</h4>
    <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 8px;">Download an .ics file, then import it into Google, Outlook, Yahoo, or Cozi.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-primary" id="exportAll">⬇️ Everyone</button>
      ${state.people.map(p=>`<button class="btn btn-ghost" data-exportperson="${p.id}" style="font-size:12px;">${escapeHtml(p.name)}</button>`).join('')}
    </div>

    <h4 style="margin:16px 0 6px; font-size:14px;">Where to find each app's file</h4>
    ${guideHtml}

    <hr style="margin:16px 0; border:none; border-top:1px solid var(--line);">
    <h4 style="margin:0 0 4px; font-size:14px;">⚡ Live sign-in sync (automatic, no files)</h4>
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 10px;">Sign in and your events fill the calendar right away. Events are assigned to the person picked above.</p>
    <div style="font-weight:700; font-size:13px; margin:6px 0 2px;">Google Calendar</div>
    <div id="googleBlock"></div>
    <div style="font-weight:700; font-size:13px; margin:14px 0 2px;">Outlook / Microsoft 365</div>
    <div id="outlookBlock"></div>

    <p style="font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:12px;">
      <strong>Yahoo and Cozi</strong> can't do live sign-in from a browser app — Yahoo is CalDAV-only (needs a proxy) and Cozi has no developer API at all. Use file import above for those.
    </p>

    <div class="modal-actions"><button class="btn btn-ghost" id="syncClose">Close</button></div>
  `);
  renderGoogleBlock();
  renderOutlookBlock();
  document.getElementById('syncClose').onclick = ()=>{ closeModal(); render(); };
  document.getElementById('syncFile').onchange = (e)=>{

    const reader = new FileReader();
    reader.onerror = ()=>{ const out=document.getElementById('syncResult'); out.style.color='var(--danger)'; out.textContent='Couldn\'t read that file.'; };
    reader.onload = (ev)=>{
      const personId = document.getElementById('syncPerson').value;
      const res = importIcsText(ev.target.result, personId);
      const out = document.getElementById('syncResult');
      if(res.error){ out.style.color='var(--danger)'; out.textContent='Could not read that file — make sure it\'s an .ics calendar file.'; return; }
      if(res.total===0){ out.style.color='var(--danger)'; out.textContent='No events found in that file.'; return; }
      out.style.color='var(--good)';
      out.textContent = `Imported ${res.added} event${res.added===1?'':'s'}${res.skipped?` (${res.skipped} already there, skipped)`:''}. ✅`;
      saveState();
    };
    reader.readAsText(file);
  };
  document.getElementById('exportAll').onclick = ()=>exportIcs(null);
  document.querySelectorAll('[data-exportperson]').forEach(b=>b.onclick = ()=>exportIcs(b.dataset.exportperson));

  const assignSel = document.getElementById('syncPerson');
  if(assignSel) assignSel.onchange = ()=>{
    state.syncAssignTo = assignSel.value;
    saveState();
    toast(state.syncAssignTo
      ? `Synced events will be filed under ${personById(state.syncAssignTo).name}.`
      : `Synced events will go to ${familyLabel()}, where everyone sees them.`, 'success');
  };

  const moveBtn = document.getElementById('moveAllEvents');
  if(moveBtn) moveBtn.onclick = async ()=>{
    const target = document.getElementById('bulkAssignTarget').value;
    const owner = target ? [target] : [];
    const moved = state.events.length;
    state.events.forEach(e=>{ e.personIds = owner.slice(); });
    await saveState();
    closeModal(); render();
    toast(`Moved ${moved} event${moved===1?'':'s'} to ${target ? personById(target).name : familyLabel()}.`, 'success');
  };
  const clearBtn = document.getElementById('clearImported');
  if(clearBtn) clearBtn.onclick = ()=>{
    state.events = state.events.filter(e=>e.source!=='import');
    saveState(); closeModal(); render();
  };
}

function renderOutlookBlock(){
  const block = document.getElementById('outlookBlock');
  if(!block) return;
  const clientId = (state.outlook && state.outlook.clientId) || '';
  const connected = outlookSync.isConnected();

  if(!clientId){
    block.innerHTML = `
      <p style="font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:4px 0 8px;">
        One-time setup: register a free Azure app (type <em>SPA</em>, permission <em>Calendars.ReadWrite</em>), then paste its Client ID here. Steps are in the README.
      </p>
      <div class="add-row">
        <input id="outlookClientId" placeholder="Azure app Client ID (GUID)">
        <button class="btn btn-primary" id="saveClientId">Save</button>
      </div>`;
    document.getElementById('saveClientId').onclick = ()=>{
      const v = document.getElementById('outlookClientId').value.trim();
      if(!v){ return; }
      state.outlook.clientId = v; saveState(); renderOutlookBlock();
    };
    return;
  }

  block.innerHTML = `
    <p style="font-size:12.5px; color:var(--ink-soft); margin:4px 0 8px;">
      Status: <strong>${connected ? '🟢 Connected' : '⚪ Not connected'}</strong>${outlookCount()?` · ${outlookCount()} Outlook event${outlookCount()===1?'':'s'} pulled in`:''}
    </p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      ${connected
        ? `<button class="btn btn-primary" id="outlookPull">⬇️ Pull from Outlook</button>
           <button class="btn btn-ghost" id="outlookDisconnect">Disconnect</button>`
        : `<button class="btn btn-primary" id="outlookConnect">Connect Outlook</button>`}
      <button class="btn btn-ghost" id="outlookForget" style="font-size:12px;">Change Client ID</button>
    </div>
    <div id="outlookStatus" style="font-size:12.5px; margin-top:8px; min-height:16px;"></div>`;

  const setStatus = (msg, ok)=>{ const el=document.getElementById('outlookStatus'); if(el){ el.style.color = ok===false?'var(--danger)':(ok?'var(--good)':'var(--ink-soft)'); el.textContent=msg; } };

  const connectBtn = document.getElementById('outlookConnect');
  if(connectBtn) connectBtn.onclick = async ()=>{
    setStatus('Opening Microsoft sign-in…');
    try{
      await outlookSync.connect();
      const personId = googleSyncPersonId();
      setStatus('Connected — pulling your events…');
      const res = await outlookSync.pull(personId);
      await saveState();
      renderOutlookBlock();
      setStatus(`Connected. Pulled ${res.added} event${res.added===1?'':'s'} in. ✅`, true);
      render();
    }
    catch(err){ setStatus(friendlyOutlookError(err), false); }
  };
  const pullBtn = document.getElementById('outlookPull');
  if(pullBtn) pullBtn.onclick = async ()=>{
    const personId = document.getElementById('syncPerson').value;
    setStatus('Pulling events…');
    try{
      const res = await outlookSync.pull(personId);
      await saveState();
      setStatus(`Pulled ${res.added} new, updated ${res.updated}. ✅`, true);
      renderOutlookBlock();
    }catch(err){ setStatus(friendlyOutlookError(err), false); }
  };
  const disc = document.getElementById('outlookDisconnect');
  if(disc) disc.onclick = async ()=>{ await outlookSync.disconnect(); renderOutlookBlock(); };
  const forget = document.getElementById('outlookForget');
  if(forget) forget.onclick = ()=>{ state.outlook.clientId=''; outlookSync.msal=null; outlookSync.account=null; saveState(); renderOutlookBlock(); };
}
function friendlyOutlookError(err){
  const m = (err && err.message) || String(err);
  if(m.includes('popup_window_error') || m.includes('popup')) return 'Sign-in popup was blocked — allow popups and retry.';
  if(m.includes('redirect')) return 'Redirect URI mismatch — make sure your Azure app SPA redirect URI equals this page\'s URL.';
  if(m.includes('Client ID')) return m;
  if(m.includes('Graph 401') || m.includes('Graph 403')) return 'Access denied — check the app has Calendars.ReadWrite and you consented.';
  return 'Couldn\'t reach Outlook: ' + m;
}

    }
  };
  const disc = document.getElementById('googleDisconnect');
  if(disc) disc.onclick = ()=>{ googleSync.disconnect(); renderGoogleBlock(); };
  const forget = document.getElementById('googleForget');

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(){
  /* Completed drawer toggle — shared by To-Dos and Habits. */
  document.querySelectorAll('[data-completedtoggle]').forEach(el=>el.onclick = (e)=>{
    e.stopPropagation();
    const key = el.dataset.completedtoggle;
    state.completedOpen[key] = !state.completedOpen[key];
    saveState(); render();
  });
  document.querySelectorAll('[data-completedclear]').forEach(el=>el.onclick = async (e)=>{
    e.stopPropagation();
    const { gone, noun } = clearCheckedFor(el.dataset.completedclear);
    await saveState(); render();
    if(gone) toast(`Removed ${gone} ${noun}.`, 'success');
  });
  // Calendar
  const addEventBtn = document.getElementById('addEventBtn');
  if(addEventBtn) addEventBtn.onclick = ()=>eventModal(null, state.calDate);
  const syncBtn = document.getElementById('syncBtn');
  if(syncBtn) syncBtn.onclick = ()=>runCalendarSync(syncBtn);
  document.querySelectorAll('[data-calview]').forEach(b=>b.onclick = ()=>{ state.calView = b.dataset.calview; saveState(); render(); });
  document.querySelectorAll('[data-monthjump]').forEach(b=>b.onclick = ()=>{
    state.calDate = b.dataset.monthjump;
    saveState(); render();
  });
  document.querySelectorAll('[data-calfilter]').forEach(b=>b.onclick = ()=>{
    const v = b.dataset.calfilter;
    const sel = calFilterIds();
    state.calFilter = v === 'all' ? [] : (sel.includes(v) ? sel.filter(id=>id!==v) : sel.concat(v));
    saveState(); render();
  });
  const prev = document.getElementById('calPrev'), next = document.getElementById('calNext'), today = document.getElementById('calToday');
  if(prev) prev.onclick = ()=>shiftCal(-1);
  if(next) next.onclick = ()=>shiftCal(1);
  if(today) today.onclick = ()=>{ state.calDate = todayStr(); saveState(); render(); };
  document.querySelectorAll('[data-daycell]').forEach(el=>el.onclick = (e)=>{
    if(e.target.closest('[data-editevent]')) return;
    const ds = el.dataset.daycell;
    if(state.calView==='month'){ state.calDate = ds; state.calView='day'; saveState(); render(); }
    else eventModal(null, ds);
  });
  document.querySelectorAll('[data-editevent]').forEach(el=>el.onclick = (e)=>{
    e.stopPropagation();
    const ev = state.events.find(x=>x.id===el.dataset.editevent);
    if(ev) eventModal(ev);
  });

  // Habits
  const addDailyHabit = document.getElementById('addDailyHabitBtn');  if(addDailyHabit) addDailyHabit.onclick = ()=>habitModal('daily');
  const addWeeklyHabit = document.getElementById('addWeeklyHabitBtn');
  if(addWeeklyHabit) addWeeklyHabit.onclick = ()=>habitModal('weekly');
  const habitPrev = document.getElementById('habitPrev');
  if(habitPrev) habitPrev.onclick = ()=>shiftHabitMonth(-1);
  const habitNext = document.getElementById('habitNext');
  if(habitNext) habitNext.onclick = ()=>shiftHabitMonth(1);
  const habitToday = document.getElementById('habitToday');
  if(habitToday) habitToday.onclick = ()=>{ state.habitMonth = monthStr(new Date()); saveState(); render(); };
  document.querySelectorAll('[data-habitperson]').forEach(el=>el.onclick = ()=>{
    state.habitPersonId = el.dataset.habitperson; saveState(); render();
  });
  document.querySelectorAll('[data-habit]').forEach(b=>b.onclick = ()=>{
    const habit = state.habits.items.find(h=>h.id===b.dataset.habit);
    if(!habit) return;
    const key = habitLogKey(habit, parseDate(b.dataset.habitdate));
    if(state.habits.log[key]){
      delete state.habits.log[key];
      addPoints(habit.personId, -(habit.points||0));
    } else {
      state.habits.log[key] = true;
      addPoints(habit.personId, habit.points||0);
    }
    saveState(); render();
  });
  document.querySelectorAll('[data-delhabit]').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    const id = b.dataset.delhabit;
    state.habits.items = state.habits.items.filter(h=>h.id!==id);
    /* Drop that habit's history too, so a re-added habit starts clean. */
    Object.keys(state.habits.log).forEach(k=>{ if(k.startsWith(id+'|')) delete state.habits.log[k]; });
    saveState(); render();
  });

  // To-Dos
  const addTodoBtn = document.getElementById('addTodoBtn');
  if(addTodoBtn) addTodoBtn.onclick = ()=>todoModal(null, todoView().listId);
  const addTodoListBtn = document.getElementById('addTodoListBtn');
  if(addTodoListBtn) addTodoListBtn.onclick = todoListModal;
  const addTodoSectionBtn = document.getElementById('addTodoSectionBtn');
  if(addTodoSectionBtn) addTodoSectionBtn.onclick = ()=>todoSectionModal(todoView().listId);
  document.querySelectorAll('[data-todocollapse]').forEach(el=>el.onclick = (e)=>{
    if(e.target.closest('[data-todosecdel]')) return;
    const key = el.dataset.todocollapse;
    const c = todoView().collapsed;
    if(c[key]) delete c[key]; else c[key] = true;
    saveState(); render();
  });
  document.querySelectorAll('[data-todosecdel]').forEach(b=>b.onclick = async (e)=>{
    e.stopPropagation();
    const id = b.dataset.todosecdel;
    state.todos.sections = state.todos.sections.filter(s=>s.id!==id);
    /* Items outlive their section — they just fall back to "No section". */
    state.todos.items.forEach(t=>{ if(t.sectionId===id) t.sectionId = null; });
    await saveState(); render();
  });
  document.querySelectorAll('[data-attopen]').forEach(el=>el.onclick = ()=>{
    const [todoId, attId] = el.dataset.attopen.split('|');
    const t = state.todos.items.find(x=>x.id===todoId);
    const a = t && (t.attachments||[]).find(x=>x.id===attId);
    if(!a) return;
    openModal(`
      <h3>${escapeHtml(a.name)}</h3>
      ${a.type.startsWith('image/')
        ? `<img src="${a.dataUrl}" alt="${escapeHtml(a.name)}" style="max-width:100%; border-radius:10px; display:block;">`
        : `<p style="font-size:13px; color:var(--ink-soft);">This file can't be previewed here.</p>`}
      <div class="modal-actions">
        <a class="btn btn-ghost" href="${a.dataUrl}" download="${escapeHtml(a.name)}">Download</a>
        <button class="btn btn-primary" id="attClose">Close</button>
      </div>
    `);
    document.getElementById('attClose').onclick = closeModal;
  });
  document.querySelectorAll('[data-todoview]').forEach(el=>el.onclick = ()=>{
    todoView().listId = el.dataset.todoview; saveState(); render();
  });
  const todoSort = document.getElementById('todoSort');
  if(todoSort) todoSort.onchange = ()=>{ todoView().sort = todoSort.value; saveState(); render(); };
  document.querySelectorAll('[data-todotoggle]').forEach(b=>b.onclick = ()=>{
    const t = state.todos.items.find(x=>x.id===b.dataset.todotoggle);
    if(!t) return;
    if(t.done){                       // un-completing always just takes the points back
      t.done = false;
      if(t.awardedTo){ addPoints(t.awardedTo, -(t.points||0)); t.awardedTo = null; }
      saveState(); render();
      return;
    }
    completeTodo(t);
  });
  document.querySelectorAll('[data-todoflag]').forEach(b=>b.onclick = ()=>{
    const t = state.todos.items.find(x=>x.id===b.dataset.todoflag);
    if(t){ t.flagged = !t.flagged; saveState(); render(); }
  });
  document.querySelectorAll('[data-todoedit]').forEach(b=>b.onclick = ()=>{
    const t = state.todos.items.find(x=>x.id===b.dataset.todoedit);
    if(t) todoModal(t);
  });
  document.querySelectorAll('[data-todosub]').forEach(b=>b.onclick = ()=>{
    const parent = state.todos.items.find(x=>x.id===b.dataset.todosub);
    if(parent) todoModal(null, parent.listId, parent.id);
  });
  document.querySelectorAll('[data-tododel]').forEach(b=>b.onclick = async ()=>{
    deleteTodo(b.dataset.tododel);
    await saveState(); render();
  });
  const quickAdd = document.getElementById('todoQuickAdd');
  const quickAddBtn = document.getElementById('todoQuickAddBtn');
  if(quickAdd && quickAddBtn){
    const add = async ()=>{
      const title = quickAdd.value.trim();
      if(!title) return;
      state.todos.items.push({
        id:uid(), listId: quickAddBtn.dataset.list, sectionId:null, title, notes:'', due:'', priority:0,
        flagged:false, personIds:[], points:0, parentId:null, attachments:[], done:false, order: state.todos.items.length
      });
      quickAdd.value = '';
      await saveState(); render();
      const again = document.getElementById('todoQuickAdd');
      if(again) again.focus();       // keep typing, the way Reminders does
    };
    quickAddBtn.onclick = add;
    quickAdd.onkeydown = e=>{ if(e.key==='Enter') add(); };
  }

  // Rewards
  const addRewardBtn = document.getElementById('addRewardBtn');
  if(addRewardBtn) addRewardBtn.onclick = rewardModal;
  document.querySelectorAll('[data-delreward]').forEach(b=>b.onclick = ()=>{
    state.rewards = state.rewards.filter(r=>r.id!==b.dataset.delreward);
    saveState(); render();
  });
  document.querySelectorAll('[data-redeem]').forEach(sel=>sel.onchange = ()=>{
    if(!sel.value) return;
    const reward = state.rewards.find(r=>r.id===sel.dataset.redeem);
    const personId = sel.value;
    if(pointsFor(personId) < reward.cost){
      alert(`${personById(personId).name} needs ${reward.cost - pointsFor(personId)} more points for this reward.`);
      sel.value=''; return;
    }
    addPoints(personId, -reward.cost);
    saveState(); render();
    alert(`${personById(personId).name} redeemed: ${reward.name} 🎉`);
  });

  // Meals
  document.querySelectorAll('[data-mealtab]').forEach(b=>b.onclick = ()=>{ mealSubTab=b.dataset.mealtab; render(); });
  document.querySelectorAll('[data-mealslot]').forEach(el=>el.onclick = ()=>mealSlotModal(el.dataset.mealslot));
  // Recipes: three ways in (see RECIPES), plus Edit and Remove on each card.
  document.querySelectorAll('[data-recipeadd]').forEach(b=>b.onclick = ()=>{
    if(b.dataset.recipeadd === 'web') recipeWebModal();
    else recipeModal({ photoFirst: b.dataset.recipeadd === 'photo' });
  });
  document.querySelectorAll('[data-editrecipe]').forEach(b=>b.onclick = ()=>{
    const r = state.meals.recipes.find(x=>x.id === b.dataset.editrecipe);
    if(r) recipeModal({ recipe: r });
  });
  document.querySelectorAll('[data-delrecipe]').forEach(b=>b.onclick = ()=>{
    state.meals.recipes = state.meals.recipes.filter(r=>r.id!==b.dataset.delrecipe);
    saveState(); render();
  });
  const pantryAddBtn = document.getElementById('pantryAddBtn');
  if(pantryAddBtn) pantryAddBtn.onclick = ()=>{
    const name = document.getElementById('pantryName').value.trim();
    if(!name) return;
    state.meals.pantry.push({id:uid(), name, qty:document.getElementById('pantryQty').value.trim()});
    saveState(); render();
  };
  document.querySelectorAll('[data-delpantry]').forEach(b=>b.onclick = ()=>{
    state.meals.pantry = state.meals.pantry.filter(i=>i.id!==b.dataset.delpantry);
    saveState(); render();
  });
  document.querySelectorAll('[data-topantrygrocery]').forEach(b=>b.onclick = ()=>{
    const item = state.meals.pantry.find(i=>i.id===b.dataset.topantrygrocery);
    if(item) addGroceryItem(item.name, item.qty);
    saveState(); mealSubTab='grocery'; render();
  });

  // Groceries
  const grocNew = document.getElementById('grocNewName');
  if(grocNew){
    const grocQty = document.getElementById('grocNewQty');
    /* Re-rendering blurs the field being typed in, which fires this handler
       again mid-render. One flag keeps a single keystroke to a single item. */
    let committing = false;
    const commit = ()=>{
      if(committing) return;
      if(!grocNew.value.trim()) return;
      committing = true;
      addGroceryItem(grocNew.value, grocQty.value);
      grocNew.value = ''; grocQty.value = '';
      saveState(); render();
      /* Keep the cursor where it was so a whole list can be typed in one go. */
      const again = document.getElementById('grocNewName');
      if(again) again.focus();
    };
    grocNew.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } };
    grocQty.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } };
    /* Moving between the name and quantity boxes is still the same item — only
       leaving the row altogether counts as finishing it. */
    const leftTheRow = e=>{
      const to = e.relatedTarget;
      if(to === grocNew || to === grocQty) return;
      commit();
    };
    grocNew.onblur = leftTheRow;
    grocQty.onblur = leftTheRow;
  }
  document.querySelectorAll('[data-grocsec]').forEach(h=>h.onclick = ()=>{
    const id = h.dataset.grocsec;
    grocCollapsed[id] = !grocCollapsed[id];
    render();
  });
  document.querySelectorAll('[data-editgrocery]').forEach(el=>el.onclick = ()=>groceryModal(el.dataset.editgrocery));
  document.querySelectorAll('[data-groctoggledone]').forEach(el=>el.onclick = e=>{
    if(e.target.id === 'grocClearDone') return;
    state.completedOpen.grocery = !state.completedOpen.grocery;
    saveState(); render();
  });
  const grocClearDone = document.getElementById('grocClearDone');
  if(grocClearDone) grocClearDone.onclick = ()=>{
    state.meals.grocery = state.meals.grocery.filter(g=>!g.done);
    saveState(); render();
  };
  const grocFromPlan = document.getElementById('grocFromPlan');
  if(grocFromPlan) grocFromPlan.onclick = groceryFromMealPlan;
  document.querySelectorAll('[data-togglegrocery]').forEach(b=>b.onclick = ()=>{
    const item = state.meals.grocery.find(i=>i.id===b.dataset.togglegrocery);
    if(!item) return;
    item.done = !item.done;
    saveState(); render();
  });
  document.querySelectorAll('[data-delgrocery]').forEach(b=>b.onclick = ()=>{
    state.meals.grocery = state.meals.grocery.filter(i=>i.id!==b.dataset.delgrocery);
    saveState(); render();
  });

  // Dashboard
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick = e=>{ e.stopPropagation(); gotoTab(b.dataset.goto); });  const dashAddEvent = document.getElementById('dashAddEvent');
  if(dashAddEvent) dashAddEvent.onclick = ()=>eventModal(null, todayStr());
  const wxSetBtn = document.getElementById('wxSetBtn');
  if(wxSetBtn) wxSetBtn.onclick = weatherModal;

  // Housekeeping
  document.querySelectorAll('[data-hkview]').forEach(b=>b.onclick = ()=>{ hkView = b.dataset.hkview; render(); });
  document.querySelectorAll('[data-hkwho]').forEach(b=>b.onclick = ()=>{ setHkWho(b.dataset.hkwho); render(); });
  document.querySelectorAll('[data-hkdo]').forEach(b=>b.onclick = ()=>hkDoTask(b.dataset.hkdo));
  document.querySelectorAll('[data-hkedit]').forEach(b=>b.onclick = e=>{
    e.stopPropagation();
    hkTaskModal(state.housekeeping.tasks.find(t=>t.id===b.dataset.hkedit));
  });
  document.querySelectorAll('[data-hkarea]').forEach(el=>el.onclick = ()=>{
    hkOpenArea = (hkOpenArea === el.dataset.hkarea) ? null : el.dataset.hkarea;
    render();
  });
  document.querySelectorAll('[data-hkaddtask]').forEach(b=>b.onclick = e=>{
    e.stopPropagation();
    hkTaskModal(null, b.dataset.hkaddtask);
  });
  document.querySelectorAll('[data-hkeditarea]').forEach(b=>b.onclick = ()=>hkAreaModal(hkAreaById(b.dataset.hkeditarea)));
  document.querySelectorAll('[data-hkdeltask]').forEach(b=>b.onclick = ()=>{
    state.housekeeping.tasks = state.housekeeping.tasks.filter(t=>t.id!==b.dataset.hkdeltask);
    saveState(); render();
  });
  document.querySelectorAll('[data-hkdelarea]').forEach(b=>b.onclick = ()=>{
    const id = b.dataset.hkdelarea;
    const area = hkAreaById(id);
    const count = state.housekeeping.tasks.filter(t=>t.areaId===id).length;
    if(!confirm(`Delete "${area? area.name : 'this area'}" and its ${count} job${count===1?'':'s'}?`)) return;
    state.housekeeping.areas = state.housekeeping.areas.filter(a=>a.id!==id);
    state.housekeeping.tasks = state.housekeeping.tasks.filter(t=>t.areaId!==id);
    if(hkOpenArea === id) hkOpenArea = null;
    saveState(); render();
  });
  const hkAddArea = document.getElementById('hkAddArea');
  if(hkAddArea) hkAddArea.onclick = ()=>hkAreaModal(null);
  const hkResetPlan = document.getElementById('hkResetPlan');
  if(hkResetPlan) hkResetPlan.onclick = ()=>{
    if(!confirm('Replace the current areas and jobs with the standard plan? Everything you have set up here is lost.')) return;
    state.housekeeping = defaultHousekeeping();
    hkOpenArea = null;
    saveState(); render();
    toast('Standard cleaning plan restored 🧹', 'success');
  };

  // Settings
  const saveFamilyLabel = document.getElementById('saveFamilyLabel');
  if(saveFamilyLabel) saveFamilyLabel.onclick = ()=>{
    const v = document.getElementById('familyLabelInput').value.trim();
    state.familyLabel = v || 'Family calendar';
    saveState(); render();
    toast('Calendar name updated ✅', 'success');
  };
  document.querySelectorAll('[data-personname]').forEach(inp=>inp.onchange = ()=>{
    personById(inp.dataset.personname).name = inp.value.trim() || 'Unnamed';
    saveState(); render();
  });
  document.querySelectorAll('[data-editavatar]').forEach(b=>b.onclick = ()=>avatarModal(b.dataset.editavatar));
  document.querySelectorAll('[data-delperson]').forEach(b=>b.onclick = ()=>{
    const id = b.dataset.delperson;
    state.people = state.people.filter(p=>p.id!==id);
    saveState(); render();
    /* Someone taken off the board shouldn't keep a way in: their Google email
       comes off the family's list too. */
    if(cloudSync.mode() === 'member'){
      cloudSync.setMemberEmail(id, null).catch(err=>toast('Removed from the board, but their sign-in is still on the list: ' + err.message, 'error'));
    }
  });
  const addPersonBtn = document.getElementById('addPersonBtn');
  if(addPersonBtn) addPersonBtn.onclick = ()=>{
    const name = document.getElementById('newPersonName').value.trim();
    if(!name) return;
    const usedColors = state.people.map(p=>p.color);
    const paletteEntry = PALETTE.find(c=>!usedColors.includes(c.hex)) || PALETTE[state.people.length % PALETTE.length];
    state.people.push({id:uid(), name, color:paletteEntry.hex, avatarType:'color', avatarEmoji:'', avatarImage:''});
    saveState(); render();
  };
  const exportBtn = document.getElementById('exportIcsBtn');
  if(exportBtn) exportBtn.onclick = syncModal;
  const familySyncBtn = document.getElementById('familySyncBtn');
  if(familySyncBtn) familySyncBtn.onclick = familySyncModal;

  /* Sign out from Settings. Confirmed rather than instant, because on an iOS
     home-screen app signing back in is not reliably possible -- the OAuth
     redirect leaves the installed app for Safari, which has its own separate
     storage -- so signing out there can strand the device. Cheap to confirm,
     expensive to undo.

     cloudSync.signOut() stops the poll, resets personal settings, ends the
     session with /logout?scope=local, and re-reads the account. It does NOT
     touch the saved board, which is why the wording promises that. */
  const settingsSignOut = document.getElementById('settingsSignOut');
  if(settingsSignOut) settingsSignOut.onclick = async ()=>{
    if(!confirm(`Sign out of ${auth.email()}?\n\nYour family's board stays on this device and on the server — nothing is deleted. This device stops syncing until you sign in again.`)) return;
    settingsSignOut.disabled = true;
    try{
      await cloudSync.signOut();
      toast('Signed out. The board on this device is untouched.', 'success');
    }catch(err){
      toast((err && err.message) || 'Sign out failed.', 'error');
    }
    /* Rebuilds Settings without the button, or with it re-enabled on failure. */
    render();
  };

  const bannerOpenSync = document.getElementById('bannerOpenSync');
  if(bannerOpenSync) bannerOpenSync.onclick = familySyncModal;

  /* The app's only Sign in with Google button. startSignIn() navigates away to
     Google, so nothing after the click handler runs on this page load. */
  const bannerSignIn = document.getElementById('bannerSignIn');
  if(bannerSignIn) bannerSignIn.onclick = ()=>startSignIn(bannerSignIn);

  /* The refresh bar's button. Present on every tab, because render() puts the
     bar above whichever view is showing, so this wires up on every screen.
     All the work lives in refreshEverything(). */
  const appRefresh = document.getElementById('appRefresh');
  if(appRefresh) appRefresh.onclick = ()=>refreshEverything(appRefresh);
  const timeFormatSel = document.getElementById('timeFormatSel');
  if(timeFormatSel) timeFormatSel.onchange = ()=>{
    state.timeFormat = timeFormatSel.value === '24h' ? '24h' : '12h';
    saveState(); render();
    toast(`Times now show as ${fmtTime('14:30')}.`, 'success');
  };

  // Second time zone
  const tzEnabled = document.getElementById('tzEnabled');
  if(tzEnabled) tzEnabled.onchange = ()=>{
    state.timeZones.secondaryEnabled = tzEnabled.checked;
    /* Pin the main zone to the device on first enable, so the label isn't blank. */
    if(tzEnabled.checked && !state.timeZones.primary) state.timeZones.primary = deviceZone();
    saveState(); render();
  };
  const tzBind = (id, apply)=>{
    const el = document.getElementById(id);
    if(!el) return;
    const handler = ()=>{ apply(el.value.trim()); saveState(); render(); };
    if(el.tagName === 'SELECT') el.onchange = handler; else el.onblur = handler;
  };
  tzBind('tzPrimary',        v=>state.timeZones.primary = v);
  tzBind('tzSecondary',      v=>state.timeZones.secondary = v);
  tzBind('tzPrimaryLabel',   v=>state.timeZones.primaryLabel = v);
  tzBind('tzSecondaryLabel', v=>state.timeZones.secondaryLabel = v);

  // Sleep mode
  const sleepSel = document.getElementById('sleepAfterSel');
  if(sleepSel) sleepSel.onchange = ()=>{
    state.sleepAfterMin = Number(sleepSel.value);
    saveState();
    resetIdleTimer();               // apply the new timing immediately
    toast(`Sleep mode: ${sleepLabel(state.sleepAfterMin).toLowerCase()}.`, 'success');
  };

  // Weather and screensaver photos
  const weatherSetBtn = document.getElementById('weatherSetBtn');
  if(weatherSetBtn) weatherSetBtn.onclick = weatherModal;
  const photoFileInput = document.getElementById('photoFileInput');
  if(photoFileInput) photoFileInput.onchange = ()=>addPhotoFiles(photoFileInput.files);
  document.querySelectorAll('[data-delphoto]').forEach(b=>b.onclick = ()=>removePhoto(b.dataset.delphoto));
  const ssPhotosOn = document.getElementById('ssPhotosOn');
  if(ssPhotosOn) ssPhotosOn.onchange = ()=>{ state.screensaver.photos = ssPhotosOn.checked; saveState(); };
  const ssShowClock = document.getElementById('ssShowClock');
  if(ssShowClock) ssShowClock.onchange = ()=>{ state.screensaver.showClock = ssShowClock.checked; saveState(); };
  const ssSecondsSel = document.getElementById('ssSecondsSel');
  if(ssSecondsSel) ssSecondsSel.onchange = ()=>{ state.screensaver.seconds = Number(ssSecondsSel.value); saveState(); };

  // Checked items
  const autoRemove = document.getElementById('autoRemoveChecked');
  if(autoRemove) autoRemove.onchange = ()=>{
    state.autoRemoveChecked = autoRemove.checked;
    saveState(); render();
    toast(autoRemove.checked
      ? 'Checked items will now disappear straight away.'
      : 'Checked items will collect in the Completed drawer.', 'success');
  };
}
function shiftCal(dir){
  const d = parseDate(state.calDate);
  if(state.calView==='month') d.setMonth(d.getMonth()+dir);
  else if(state.calView==='week') d.setDate(d.getDate()+dir*7);
  else d.setDate(d.getDate()+dir);
  state.calDate = fmtDate(d);
  saveState(); render();
}

/* ============================= INIT ============================= */
(async function init(){
  try{
    await loadState();
    state.calFilter = [];           // every session opens on the family calendar
    auth.load();                    // the saved Google sign-in, if any
    cloudSync.restoreCachedAccount();   // so the first screen already knows who's signed in
    render();
    resetIdleTimer();
    initGoogleSync();
    initCloudSync();
    refreshWeather();
    /* The Home screen shows a live clock, so nudge it once a minute. */
    setInterval(()=>{
      const el = document.getElementById('dashClock');
      if(el) el.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12: !use24h()});
    }, 30000);
    setInterval(()=>refreshWeather(), WX_TTL_MS);
  }catch(err){
    console.error('Startup failed:', err);
    document.getElementById('mainContent').innerHTML = `<div class="card"><div class="empty">
      <div class="display">Couldn't start up cleanly</div>
      <p>Reload the page to try again. Your saved data is untouched.</p>
    </div></div>`;
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.log('Service worker registration skipped:', err));
  });
}
</script>
</body>
</html>
