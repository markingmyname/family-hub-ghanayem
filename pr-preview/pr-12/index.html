   These never go into the family board, so one person's choices can't drag
   anyone else's screen along. Signed in, they follow that person to every
   device they sign in on (mySettings, below); signed out, they stay on this
   device. */
const PERSONAL_KEYS = [
  'calView','calDate','calFilter','habitMonth','habitPersonId','todoView','completedOpen','hkWho',
  'timeFormat','timeZones','sleepAfterMin','weather','screensaver','autoRemoveChecked'
];

/* This household's own project, prefilled so setting up the next phone is one
   tap rather than a hunt through a dashboard. Both values are the public pair:
   the URL is just an address, and a publishable key is designed to ship inside
   client code. Anyone running their own copy can overwrite both in the panel.
   What is NOT here — and must never be — is a secret or service_role key. */
const DEFAULT_CLOUD_URL = 'https://seehonmftkpbxemzehmc.supabase.co';
const DEFAULT_CLOUD_KEY = 'sb_publishable_kk18vKFswmp3Q8woTnBv_Q_ifFS3qLb';

function deviceId(){
  let id = null;
  try{ id = localStorage.getItem(CLOUD_DEVICE_KEY); }catch(e){}
  if(!id){
    id = 'dev-' + Math.random().toString(36).slice(2,8);
    try{ localStorage.setItem(CLOUD_DEVICE_KEY, id); }catch(e){}
  }

function cloudConfig(){

/* Takes what people actually paste: with or without https://, with a trailing
   slash, or with the /rest/v1 tail already on it. */
function normalizeCloudUrl(v){
  let u = (v||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1.*$/,'');
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try{
    const parsed = new URL(u);
    if(parsed.protocol !== 'https:') return '';
    /* A pasted line like NEXT_PUBLIC_SUPABASE_URL=https://... will happily parse
       as a URL whose "host" is the variable name. Insist on something that
       actually looks like a hostname. */
    if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(parsed.hostname)) return '';
    /* The dashboard shows two near-identical hostnames: the API one, and
       db.<ref>.supabase.co for direct Postgres connections. Only the first
       answers HTTP, so quietly correct the easy mistake. */
    const host = parsed.hostname.replace(/^db\.(?=[a-z0-9-]+\.supabase\.)/i, '');
    return 'https://' + host;
  }catch(e){ return ''; }
}
function cloudHost(cfg){
  try{ return new URL(cfg.url).host; }catch(e){ return cfg.url; }
}

// Installed to a home screen or dock, rather than running in a browser tab.
function isStandalone(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }catch(e){ return false; }
}
function newFamilyId(){
  return 'family-' + Math.random().toString(36).slice(2,8) + Math.random().toString(36).slice(2,8);
}

/* Codes are typed by people, so accept loose input and tidy it: lowercase, no
   spaces, always prefixed, since that prefix is what makes a pasted code
   recognisable as one. The 12-character floor matches what the database
   enforces — the code is the only lock on the family's data. */
function normalizeFamilyCode(v){
  let code = String(v||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  code = code.replace(/^(family-)+/,'');
  code = code.replace(/^-+|-+$/g,'');
  return code ? 'family-' + code : '';
}
function familyCodeProblem(code){
  if(!code || code === 'family-') return 'Give the family a code, something like family-ghanayem-7k3p.';
  if(code.length < 12) return `Too short — ${code} needs to be at least 12 characters.`;
  return '';
}
// A code with no digits is the kind a stranger could guess.
function familyCodeIsGuessable(code){
  return !/\d/.test(code) || code.length < 18;
}

/* ---- Reading a pasted key ----
   Supabase has two generations of key. The legacy `anon` key is a JWT whose
   payload names the project, which is handy: paste it and the project URL can
   be worked out rather than typed. The newer `sb_publishable_…` key is opaque,
   so that one needs the URL alongside it.

   Both of those are meant to be public. The `service_role` and `sb_secret_…`
   keys are not — they bypass every access policy, and this app serves every
   file it has to anyone who asks. Pasting one here would be handing out the
   keys to the database, so they're refused rather than quietly accepted. */
function supabaseKeyInfo(key){
  const k = (key||'').trim();
  if(!k) return { kind:'none' };
  if(/^sb_secret_/i.test(k)) return { kind:'secret' };
  if(/^sb_publishable_/i.test(k)) return { kind:'publishable' };
  if(/^eyJ/.test(k)){
    try{
      const body = k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      const claims = JSON.parse(atob(body + '==='.slice((body.length + 3) % 4)));
      if(claims.role === 'service_role') return { kind:'secret' };
      return { kind:'anon', ref: claims.ref || '' };
    }catch(e){ return { kind:'unknown' }; }
  }
  return { kind:'unknown' };
}

/* One paste box beats three labelled ones. Takes whatever comes off the
   Supabase dashboard — URL and key, either order, on one line or several. The
   Connect dialog hands out environment-variable lines rather than bare values,
   so NAME=value and surrounding quotes get peeled off before anything else. */
function parseCloudPaste(text){
  /* A setup link from a device that's already syncing carries all three values,
     the family id included. That's what makes a second phone JOIN the family
     rather than quietly starting one of its own. Checked first, because the
     link contains a URL and a key that would otherwise be read on their own. */
  const invite = /#fh-sync=([A-Za-z0-9+/=%_-]+)/.exec(String(text||''));
  if(invite){
    try{
      const bin = atob(decodeURIComponent(invite[1]));
      const cfg = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0))));
      const url = normalizeCloudUrl(cfg.url);
      if(url && cfg.key && cfg.familyId){
        return { url, key: String(cfg.key).trim(), familyId: String(cfg.familyId).trim(), kind: 'invite' };
      }
    }catch(e){ /* not a usable link — fall through and read it as plain values */ }
  }

  const parts = String(text||'').split(/[\s,]+/).map(p=>p.trim()).filter(Boolean);
  const tidy = (p)=>{
    let clean = p.replace(/^["'<]+|["'>.,;]+$/g,'');
    const eq = clean.indexOf('=');
    /* Only treat it as NAME=value when the left side reads like a variable
       name — never chop a key that happens to contain '='. */
    if(eq > 0 && /^[A-Za-z_][A-Za-z0-9_]*$/.test(clean.slice(0, eq))) clean = clean.slice(eq + 1);
    return clean.replace(/^["'<]+|["'>.,;]+$/g,'');
  };
  let url = '', key = '';
  parts.forEach(p=>{
    const clean = tidy(p);
    if(!clean) return;
    if(!key && (/^sb_(publishable|secret)_/i.test(clean) || /^eyJ[\w-]+\./.test(clean))) key = clean;
    else if(!url && /supabase\.(co|in|net)/i.test(clean) && !/^eyJ/.test(clean)) url = normalizeCloudUrl(clean);
  });
  const info = supabaseKeyInfo(key);
  /* Just the family code on its own pairs with the project this copy already
     ships with — relaying a short code beats relaying a long link, especially
     to a phone. */
  if(!key && !url && parts.length === 1 && /^family-[a-z0-9-]{6,}$/i.test(tidy(parts[0]))){
    return { url: DEFAULT_CLOUD_URL, key: DEFAULT_CLOUD_KEY, familyId: tidy(parts[0]), kind: 'code' };
  }
  if(info.kind === 'secret')
    return { error: 'That\u2019s a secret key — it bypasses every access rule, and this app is a public web page. Use the publishable (or anon) key instead.' };
  if(key && info.kind === 'unknown')
    return { error: 'That doesn\u2019t look like a Supabase key. It starts with sb_publishable_ or eyJ.' };
  /* Legacy keys name their own project, so the URL is optional for those. */
  if(!url && info.ref) url = `https://${info.ref}.supabase.co`;
  return { url, key, kind: info.kind };
}

/* The dashboard pages people need, for the project they just pasted. */
function cloudProjectRef(url){

/* Everything except each person's own settings — that's what goes in the row. */
function boardOf(src){
  const copy = {};
  Object.keys(src || {}).forEach(k=>{ if(!PERSONAL_KEYS.includes(k)) copy[k] = src[k]; });
  return copy;
}
function cloudPayload(){ return JSON.stringify(boardOf(state)); }

/* `fn` is the database function that was called. The sign-in ones (fh_*) raise
   plain-English reasons, so those are passed straight through. */
function cloudErrorMessage(status, body, fn){
  const text = (body||'').toLowerCase();
  const signIn = /^fh_/.test(fn || '');
  if(status === 404 || text.includes('schema cache') || text.includes('could not find the function'))
    return signIn
      ? 'The Google sign-in part of the setup SQL hasn\'t run on this project yet — open Family sync, press Copy SQL, paste it into the SQL editor and press Run.'
      : 'The setup SQL hasn\'t run on this project yet — press Copy SQL, open the SQL editor, press Run, then try again.';
  if(signIn && status >= 400 && status < 500){
    let reason = '';
    try{ reason = JSON.parse(body).message || ''; }catch(e){}
    if(status === 401 && !reason) return 'Your sign-in was rejected. Sign out and sign in again.';
    if(reason) return reason.charAt(0).toUpperCase() + reason.slice(1) + '.';
  }
  if(status === 401 || status === 403)
    return 'That key was rejected. Copy the publishable (or anon) key again — and check the setup SQL ran.';
  if(status === 413) return 'The family copy is too large to send. Try smaller profile photos or fewer attachments.';
  if(status >= 500) return 'The cloud database had a server error. It usually clears on its own.';
  return `The cloud database replied ${status}.`;
}

/* ======================= GOOGLE SIGN-IN (Supabase Auth) =======================
   Each family member signs in with their own Google account. The account
   decides which family board this device opens (family_hub_members on the
   server) and whose personal settings it shows (family_hub_settings).

   OAuth with PKCE, straight against Supabase Auth's REST API, so the app keeps
   its no-dependencies, works-offline shape:
     1. signIn() makes a random verifier, keeps it on this device, and sends the
        browser to Supabase's /authorize with only the verifier's SHA-256 hash.
     2. Google signs the person in, and Supabase sends the browser back to this
        page with a one-time ?code=.
     3. finishRedirect() trades code + verifier for a session at
        /token?grant_type=pkce. The code is useless without the verifier, which
        never left this device.
   The session lives in localStorage: an access token good for about an hour,
   renewed with the refresh token shortly before it runs out.

   Depends on: the Supabase project from cloudProject() (DEFAULT_CLOUD_URL/KEY
   unless changed on the sync panel); Google switched on under Authentication →
   Sign In / Providers in that project; this page's address on the project's
   Redirect URLs list; the Google sign-in part of CLOUD_SETUP_SQL. The Content
   Security Policy already allows https://*.supabase.co. */
const AUTH_SESSION_KEY  = 'fh-auth-session';
const AUTH_VERIFIER_KEY = 'fh-auth-verifier';
const AUTH_ACCOUNT_KEY  = 'fh-auth-account';   // last known family for the signed-in account, for offline starts
const AUTH_RENEW_EARLY_S = 120;                // renew the access token this long before it expires

/* The Supabase project this copy talks to: the one saved on the sync panel, or
   the household default. Works whether or not a family code is saved. */
function cloudProject(){
  try{
    const raw = JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY) || 'null');
    if(raw && raw.url && raw.key) return { url: raw.url, key: raw.key };
  }catch(e){ /* unreadable — fall back to the household project */ }
  return { url: DEFAULT_CLOUD_URL, key: DEFAULT_CLOUD_KEY };
}

/* Where Supabase sends the browser back: this page, minus any query or hash.
   Must be on the project's Redirect URLs list, or Supabase falls back to the
   project's Site URL. */
function authReturnUrl(){ return location.origin + location.pathname; }

function base64Url(bytes){
  let bin = '';
  bytes.forEach(b=>{ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

const auth = {
  session: null,       // { access_token, refresh_token, expires_at (unix seconds), user: { id, email } } or null
  _renewing: null,     // the in-flight renewal, shared so two callers never spend the same refresh token

  load(){
    try{
      const s = JSON.parse(localStorage.getItem(AUTH_SESSION_KEY) || 'null');
      this.session = (s && s.access_token && s.refresh_token && s.user && s.user.id) ? s : null;
    }catch(e){ this.session = null; }
  },

  /* Keep only what the app uses. The token response also carries the full user
     record and Google's own tokens, which have no reason to sit on disk. */
  _store(data){
    const now = Math.round(Date.now()/1000);
    const next = {
      access_token: data && data.access_token,
      refresh_token: data && data.refresh_token,
      expires_at: Number(data && data.expires_at) || (now + (Number(data && data.expires_in) || 3600)),
      user: { id: data && data.user && data.user.id, email: String((data && data.user && data.user.email) || '').toLowerCase() }
    };
    if(!next.access_token || !next.refresh_token || !next.user.id){
      throw new Error('Sign-in came back incomplete. Try again.');
    }
    this.session = next;
    try{ localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(next)); }
    catch(e){ throw new Error('This browser wouldn\'t save the sign-in (private mode blocks storage).'); }
  },
  _forget(){
    this.session = null;
    try{ localStorage.removeItem(AUTH_SESSION_KEY); }catch(e){}
  },

  isSignedIn(){ return !!this.session; },
  email(){ return this.session ? this.session.user.email : ''; },
  userId(){ return this.session ? this.session.user.id : ''; },

  /* POST to Supabase Auth. Network failure is marked `offline` so callers can
     keep the session; an HTTP error carries its status. */
  async _post(path, body, extraHeaders){
    const { url, key } = cloudProject();
    let res;
    try{
      res = await fetch(url + '/auth/v1' + path, {
        method: 'POST',
        headers: Object.assign({ apikey: key, 'Content-Type': 'application/json' }, extraHeaders || {}),
        body: JSON.stringify(body || {})
      });
    }catch(e){
      const err = new Error('No connection to the sign-in service right now.');
      err.offline = true;
      throw err;
    }
    const text = await res.text();
    let data = null;
    try{ data = text ? JSON.parse(text) : null; }catch(e){ /* not JSON — handled below */ }
    if(!res.ok){
      const err = new Error((data && (data.error_description || data.msg || data.message)) || `The sign-in service replied ${res.status}.`);
      err.status = res.status;
      throw err;
    }
    return data;
  },

  /* Step 1: off to Google. The page unloads at the end of this. */
  async signIn(){
    if(!(window.crypto && crypto.subtle && crypto.getRandomValues)){
      throw new Error('This browser can\'t do secure sign-in here — it needs the app\'s https address.');
    }
    const raw = new Uint8Array(32);
    crypto.getRandomValues(raw);
    const verifier = base64Url(raw);    // 43 characters, inside PKCE's 43–128 limit
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    try{ localStorage.setItem(AUTH_VERIFIER_KEY, verifier); }
    catch(e){ throw new Error('This browser wouldn\'t save the sign-in (private mode blocks storage).'); }
    const { url } = cloudProject();
    const q = new URLSearchParams({
      provider: 'google',
      redirect_to: authReturnUrl(),
      code_challenge: base64Url(digest),
      code_challenge_method: 's256'
    });
    location.assign(`${url}/auth/v1/authorize?${q.toString()}`);
  },

  /* Step 3: back from Google. Returns 'signed-in', or 'none' when the address
     holds no sign-in; throws with a readable reason otherwise. The code is
     cleared from the address bar first, so a refresh can't replay it and it
     doesn't sit in history. */
  async finishRedirect(){
    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    const code = query.get('code');
    const error = query.get('error_description') || query.get('error') || hash.get('error_description') || hash.get('error');
    if(!code && !error) return 'none';
    history.replaceState(null, '', location.pathname);
    let verifier = null;
    try{ verifier = localStorage.getItem(AUTH_VERIFIER_KEY); localStorage.removeItem(AUTH_VERIFIER_KEY); }catch(e){}
    if(error) throw new Error('Google sign-in didn\'t finish: ' + error);
    if(!verifier) throw new Error('Sign-in finished in a different browser or app than it started in. Tap Sign in again from here.');
    this._store(await this._post('/token?grant_type=pkce', { auth_code: code, code_verifier: verifier }));
    return 'signed-in';
  },

  /* A usable access token, renewed first when it's about to run out. Offline,
     the session is kept for later. Rejected — revoked, expired, or the account
     was deleted — the device is signed out and the error says so. */
  async accessToken(){
    if(!this.session) throw new Error('Not signed in.');
    const now = Math.round(Date.now()/1000);
    if(this.session.expires_at - now > AUTH_RENEW_EARLY_S) return this.session.access_token;
    if(!this._renewing){
      this._renewing = (async ()=>{
        try{
          this._store(await this._post('/token?grant_type=refresh_token', { refresh_token: this.session.refresh_token }));
        }catch(err){
          if(!err.offline && err.status >= 400 && err.status < 500){
            this._forget();
            err.signedOut = true;
            err.message = 'Your sign-in has expired. Sign in again.';
          }
          throw err;
        }finally{
          this._renewing = null;
        }
      })();
    }
    await this._renewing;
    return this.session.access_token;
  },

  /* Signs this device out. The server call revokes this device's session; if it
     can't be reached, the device is signed out locally anyway. */
  async signOut(){
    const token = this.session && this.session.access_token;
    this._forget();
    if(!token) return;
    try{ await this._post('/logout?scope=local', {}, { Authorization: 'Bearer ' + token }); }
    catch(e){ console.warn('Sign-out request failed; signed out on this device anyway.', e.message); }
  }
};

/* The last family this account opened, so a signed-in device that starts with
   no connection still knows whose board it is showing. */
function readCachedAccount(){
  try{ return JSON.parse(localStorage.getItem(AUTH_ACCOUNT_KEY) || 'null'); }catch(e){ return null; }
}
function writeCachedAccount(acct){
  try{ localStorage.setItem(AUTH_ACCOUNT_KEY, JSON.stringify(acct)); }catch(e){ /* only costs an offline start */ }
}
function forgetCachedAccount(){ try{ localStorage.removeItem(AUTH_ACCOUNT_KEY); }catch(e){} }

/* The clock the merge runs on. Every poll and every write brings back the
   server's own time, and the difference from this device's clock is remembered
   here. Without it, a tablet whose date is a day out would win every
   disagreement, and one a day behind would lose every one. Until the first
   answer arrives this is the device clock, which is correct: a device that has
   never reached the server has nothing to disagree with yet. */
let syncClockSkewMs = 0;
function noteServerTime(serverIso){
  if(!serverIso) return;
  const t = Date.parse(serverIso);
  if(Number.isFinite(t)) syncClockSkewMs = t - Date.now();
}
function syncNow(){ return Date.now() + syncClockSkewMs; }

/* Who the activity feed credits. The signed-in account knows the email and
   which person on the board it is linked to; the person's name is what the
   family actually recognises, so that is preferred and the email is the
   fallback. Returns null when nobody is signed in, and the feed then records
   the change without a name rather than guessing. */
function signedInPerson(){
  const acct = cloudSync.account;
  if(!acct || acct.kind !== 'member') return null;
  const person = acct.personId ? personById(acct.personId) : null;
  return {
    id: acct.personId || acct.email || '',
    name: (person && person.name) || String(acct.email || '').split('@')[0] || ''
  };
}

/* What counts as "this device has something to send". `meta` is left out
   deliberately: it is bookkeeping that both sides union when their copies meet,
   so a device that has only gained someone else's timestamps has nothing new to
   say. Including it made every change bounce back and forth once between
   devices. Compared canonically, because two devices can serialise the same
   data with their keys in a different order. */
function boardFingerprint(board){
  const copy = {};
  Object.keys(board || {}).forEach(k=>{ if(k !== 'meta') copy[k] = board[k]; });
  return synPrint(copy);
}

const cloudSync = {
  status: 'off',        // off | connecting | live | offline | error
  /* Who is signed in on this device, and what that opens. Exactly one of:
       { kind:'signed-out' }
       { kind:'checking', detail }   signed in, family list not reachable yet
       { kind:'no-family' }          signed in, not on any family's list
       { kind:'member', familyId, personId, email }
     mode() derives from this, so the two can never disagree. */
  account: { kind: 'signed-out' },
  members: null,        // the family's list (fh_members) while the sync panel shows it
  agreed: null,         // the board as the SERVER last confirmed it: the base for
                        // working out what changed, and for knowing what is still owed
  detail: '',
  rev: 0,               // highest revision this device has seen
  lastSyncAt: 0,
  pendingPush: false,   // an edit that hasn't reached the cloud yet
  _pollTimer: null,
  _pushTimer: null,
  _busy: false,

  /* How this device reaches the family board:
       'member' — signed in with Google and on the family's list (the secure way)
       'code'   — the older shared family code, kept working until everyone has
                  signed in and the lockdown SQL has run
       'off'    — this device only */
  mode(){
    if(this.account.kind === 'member') return 'member';
    return cloudConfig() ? 'code' : 'off';
  },
  isOn(){ return this.mode() !== 'off'; },

  setStatus(status, detail){
    /* Only a change into the error state is worth a row. Re-reporting the same
       status on every poll is what the cooldown in event() is there to stop,
       but not raising it at all is cheaper still. */
    if(status === 'error' && detail && this.detail !== detail){
      try{ dailyLog.event('sync', detail, { status: status }); }catch(_){}
    }
    this.status = status;
    this.detail = detail || '';
    /* The avatar carries the status now that the cloud icon is gone, and
       status changes far more often than render() runs -- without this the
       tooltip would still claim "connecting" long after it went live. */
    updateAccountButton();
    renderCloudBlock();          // no-op unless the sync panel happens to be open
  },

  /* Every call goes through a database function rather than at a table; the
     tables themselves are unreachable with the public key. The fh_* functions
     act for the signed-in person, so they carry that person's access token and
     work out the family from it. The older family_hub_* functions carry only
     the key and demand the family code — the one thing standing between a
     visitor and the board, which is why Google sign-in replaces them. */
  async _rpc(fn, args){
    const { url, key } = cloudProject();
    const headers = { apikey: key, 'Content-Type': 'application/json' };
    if(/^fh_/.test(fn)){
      try{ headers.Authorization = 'Bearer ' + await auth.accessToken(); }
      catch(err){
        if(err.signedOut) this._setAccount({ kind: 'signed-out' });
        throw err;
      }
    }else{
      if(!cloudConfig()) throw new Error('Family sync isn\'t set up on this device.');
      /* Legacy anon keys are JWTs and belong in both headers. The newer
         publishable keys are not JWTs, and Supabase rejects them when they turn
         up as a bearer token — those go in `apikey` alone. */
      if(/^eyJ/.test(key)) headers.Authorization = `Bearer ${key}`;
    }
    const res = await this._fetch(`${url}/rest/v1/rpc/${fn}`, {
      method: 'POST', headers, body: JSON.stringify(args || {})
    }, fn);
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  },

  async _fetch(url, opts, fn){
    let res;
    try{ res = await fetch(url, opts); }
    catch(e){
      const err = new Error('No connection to the cloud database right now.');
      err.offline = true;
      throw err;
    }
    if(!res.ok){
      let body = '';
      try{ body = await res.text(); }catch(e){}
      throw new Error(cloudErrorMessage(res.status, body, fn));
    }
    return res;
  },

  /* Just the revision marker — a few bytes, which is what makes polling cheap. */
  async fetchMeta(){
    if(this.mode() === 'member'){
      /* fh_meta_v2 answers with one object, or with nothing when this person is
         on no family list or the family has no board yet -- the same two "there
         is nothing here" cases the older call signalled by returning no rows.
         It also carries the server's clock, which is what keeps every device
         stamping its edits on the same timeline. */
      const row = await this._rpc('fh_meta_v2', {});
      if(row && typeof row === 'object'){ noteServerTime(row.server_now); return row; }
      return null;
    }
    const cfg = cloudConfig(); if(!cfg) return null;
    const rows = await this._rpc('family_hub_meta', { fid: cfg.familyId });
    return (rows && rows[0]) || null;
  },

  async fetchRow(){
    if(this.mode() === 'member') return ((await this._rpc('fh_get', {})) || [])[0] || null;
    const cfg = cloudConfig(); if(!cfg) return null;
    const rows = await this._rpc('family_hub_get', { fid: cfg.familyId });
    return (rows && rows[0]) || null;
  },

  /* Combines the family's copy with this device's, keeping this person's own
     settings (PERSONAL_KEYS) exactly as they are.

     This used to replace the board outright, which is why two people editing in
     the same few seconds meant one of them lost everything they had just done.
     mergeBoards works through the board item by item instead, taking the newer
     timestamp for each, so both people's edits survive. */
  applyRemote(remote){
    const keep = {};
    PERSONAL_KEYS.forEach(k=>{ if(state && state[k] !== undefined) keep[k] = state[k]; });
    const merged = migrateState(mergeBoards(migrateState(state || {}), migrateState(remote)));
    PERSONAL_KEYS.forEach(k=>{ if(keep[k] !== undefined) merged[k] = keep[k]; });
    if(!merged.calView) merged.calView = 'month';
    if(!merged.calDate) merged.calDate = todayStr();
    state = merged;
  },

  /* 'applied' — took a newer copy · 'current' — already up to date · 'empty' — no row yet */
  async pull(force){
    if(!this.isOn()) return 'empty';
    if(!force){
      const meta = await this.fetchMeta();
      if(!meta) return 'empty';
      if((Number(meta.rev) || 0) <= this.rev){
        this.lastSyncAt = Date.now();
        this.setStatus('live');
        return 'current';
      }
    }
    const row = await this.fetchRow();
    if(!row) return 'empty';
    let remote;
    try{ remote = JSON.parse(row.payload); }
    catch(e){ throw new Error('The copy in the cloud was unreadable, so this device kept its own.'); }

    /* The family may have been given a new code elsewhere. The old row is left
       holding a forwarding note so every other device follows by itself. */
    if(remote && remote.__movedTo){
      /* Signed-in members are tied to this row, and the setup SQL refuses this
         move once a family has a list — so this only means the move happened
         before anyone signed in. Never apply a signpost as the board. */
      if(this.mode() === 'member'){
        throw new Error('This family was moved to a new family code before Google sign-in was set up. Ask whoever moved it to sign in and add you again.');
      }
      const moved = normalizeFamilyCode(remote.__movedTo);
      const cfg = cloudConfig();
      if(moved && cfg && moved !== cfg.familyId){
        writeCloudConfig(Object.assign({}, cfg, { familyId: moved }));
        this.rev = 0;
        toast(`This family moved to ${moved} — following it.`, 'success');
        return await this.pull(true);
      }
      return 'current';
    }

    this.applyRemote(remote);
    this.rev = Number(row.rev) || 0;
    this.lastSyncAt = Date.now();
    /* The agreed copy is the one the SERVER holds, not the merged result. Where
       merging brought in work this device had and the server did not, that
       difference is still owed, and the queued push sends it. Recording the
       merged board here instead would leave this device believing it was up to
       date while still holding changes nobody else can see. */
    this.agreed = remote;
    this.setStatus('live');
    await saveLocalOnly();
    if(boardFingerprint(boardOf(state)) !== boardFingerprint(this.agreed)) this.queuePush();
    return 'applied';
  },

  /* Returns true when this call did the round trip (sent, or tried and failed),
     false when there was nothing to send — which is what lets tick() tell the
     two apart. */
  async push(){
    if(!this.isOn()) return false;
    if(this._busy){ this.pendingPush = true; return false; }

    /* Work out what actually changed since the copy the server confirmed: stamp
       those items with the time, record any deletions in the graveyard, and
       collect the feed lines. One pass answers both "what am I sending" and
       "what do I tell the family", because they are the same question. */
    const stamped = stampBoard(state, this.agreed, syncNow(), signedInPerson());
    const board = boardOf(state);

    /* Personal settings aren't in the board, so changing one leaves the board
       as it was. Sending it anyway would bump the revision and make every other
       device download the board and say "Updated from another device". */
    if(this.agreed && boardFingerprint(board) === boardFingerprint(this.agreed)){
      this.pendingPush = false;
      return false;
    }
    const body = JSON.stringify(board);
    this._busy = true;
    try{
      if(this.mode() === 'member'){
        /* `baserev` is the revision this device was working from. The database
           refuses the write if anyone has written since, instead of letting it
           erase work this device never saw. */
        const res = await this._rpc('fh_put_v2', { body, baserev: this.rev, device: deviceId() });
        if(res) noteServerTime(res.server_now);
        if(res && res.conflict){
          /* Somebody else wrote while this edit was being made. Nothing is
             lost: take their copy, merge this device's work into it, and the
             pull queues the result to go back up. */
          this.rev = Number(res.rev) || 0;
          await this.pull(true);
          this.pendingPush = true;
          this.setStatus('live');
          return true;
        }
        this.rev = Number(res && res.rev) || this.rev;
      }else{
        /* The older family-code path. The database picks the revision number:
           whichever is higher, our proposal or one past what is stored, so a
           device that has been asleep can't reuse a number. It has no guard, but
           it is no longer able to lose anything either -- the other device now
           merges its own copy back in rather than accepting the overwrite. */
        const stored = await this._rpc('family_hub_put', { fid: cloudConfig().familyId, body, newrev: this.rev + 1, device: deviceId() });
        this.rev = Number(stored) || this.rev + 1;
      }
      /* Cloned, because `board` shares its objects with `state` and the next
         edit would otherwise change the very copy we are comparing against. */
      this.agreed = JSON.parse(body);
      this.pendingPush = false;
      this.lastSyncAt = Date.now();
      this.setStatus('live');
      /* The stamps and feed lines are part of the board now, so this device's
         own storage has to hold them too. Without this a reload would drop
         them and this device would look untouched to everyone else. */
      await saveLocalOnly();
      /* The board is safely stored, so the same changes can now go to the
         permanent daily log. Deliberately not awaited: a slow or failed log
         write must never hold up the next edit, and the queue inside takes
         care of retrying. */
      dailyLog.record(stamped.changes, syncNow(), signedInPerson());
      if(stamped.entries.length) render();
    }catch(err){
      /* Nothing is lost — the edit is already saved on this device, and the next
         tick (or the next time the connection returns) sends it. */
      this.pendingPush = true;
      this.setStatus(err.offline ? 'offline' : 'error', err.message);
    }finally{
      this._busy = false;
    }
    return true;
  },

  queuePush(){
    if(!this.isOn()) return;
    this.pendingPush = true;
    clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(()=>this.push(), CLOUD_PUSH_MS);
  },

  async tick(){
    if(!this.isOn() || document.visibilityState === 'hidden') return;
    try{
      /* An edit waiting to go up goes first. If there turned out to be nothing
         to send — only a personal setting changed — carry on and check for
         other devices' changes, rather than skipping this round. */
      if(this.pendingPush && await this.push()) return;
      const result = await this.pull(false);
      if(result === 'empty'){ await this.push(); return; }   // first device seeds the row
      if(result === 'applied'){
        render();
        toast('Updated from another device.', 'success');
      }
    }catch(err){
      this.setStatus(err.offline ? 'offline' : 'error', err.message);
    }
  },

  start(){
    this.stop();
    if(!this.isOn()){ this.setStatus('off'); return; }
    this._pollTimer = setInterval(()=>this.tick(), CLOUD_POLL_MS);
  },
  stop(){
    clearInterval(this._pollTimer); this._pollTimer = null;
    clearTimeout(this._pushTimer);  this._pushTimer = null;
  },

  /* Points this device at a family row. If the row already holds a copy, that
     copy wins and this device adopts it; if not, this device's data seeds it.
     `mustExist` is set when the person supplied a code or link — they meant to
     JOIN, so an empty result is a typo, not an invitation to start a rival
     family with the same data. Returns 'joined' or 'seeded'. */
  async connect(cfg, opts){
    if(this.mode() === 'member'){
      throw new Error('This device is signed in with Google, so your family comes from your account — no setup link or code needed.');
    }
    this.stop();
    writeCloudConfig(cfg);
    this.rev = 0;
    this.agreed = null;
    this.pendingPush = false;
    this.setStatus('connecting');
    try{
      const row = await this.fetchRow();
      if(row){
        /* Joining replaces this device's copy wholesale, so keep the outgoing one
           — joining the wrong family shouldn't be how you lose the kids' names. */
        try{ await storageAdapter.set(PREJOIN_BACKUP_KEY, JSON.stringify(state), true); }catch(e){}
        await this.pull(true);
        render();
      }else if(opts && opts.mustExist){
        throw new Error('No family found with that code — check it for typos. Nothing was created.');
      }else{
        await this.push();
        if(this.status !== 'live') throw new Error(this.detail || 'Couldn\'t write to the cloud database.');
      }
      this.start();
      return row ? 'joined' : 'seeded';
    }catch(err){
      forgetCloudConfig();
      this.setStatus('off');
      throw err;
    }
  },

  disconnect(){
    this.stop();
    forgetCloudConfig();
    this.rev = 0;
    this.agreed = null;
    this.pendingPush = false;
    this.setStatus('off');
  },

  /* ---- Google sign-in ---- */

  /* Startup, before the first screen draws: pick up the last known answer for
     this account so a signed-in device doesn't flash "sign in" or start
     offline as "this device only". resolveAccount() confirms it right after. */
  restoreCachedAccount(){
    if(!auth.isSignedIn()){ this.account = { kind: 'signed-out' }; return; }
    const c = readCachedAccount();
    this.account = (c && c.userId === auth.userId() && c.familyId)
      ? { kind: 'member', familyId: c.familyId, personId: c.personId || '', email: c.email || auth.email() }
      : { kind: 'checking', detail: '' };
  },

  _setAccount(next){
    this.account = next;
    if(next.kind === 'member'){
      writeCachedAccount({ userId: auth.userId(), familyId: next.familyId, personId: next.personId, email: next.email });
      /* The family code was this device's old way in. Signed in, the account
         decides the family, so the code is retired here — otherwise signing
         out would quietly keep this device syncing through it. The project
         address and key stay. A code for a DIFFERENT family means this device
         is about to be replaced by the member family's board, so keep a copy. */
      const cfg = cloudConfig();
      if(cfg){
        if(cfg.familyId !== next.familyId){
          try{ localStorage.setItem(PREJOIN_BACKUP_KEY, JSON.stringify(state)); }catch(e){ /* best effort */ }
        }
        writeCloudConfig({ url: cfg.url, key: cfg.key });
      }
    }else if(next.kind !== 'checking'){
      forgetCachedAccount();
    }
    updateAccountButton();
  },

  /* Asks the server who this account is. fh_me also claims a waiting invite on
     the first sign-in. Offline, the last known answer stands. */
  async resolveAccount(){
    if(!auth.isSignedIn()){ this._setAccount({ kind: 'signed-out' }); return; }
    try{
      const me = ((await this._rpc('fh_me', {})) || [])[0];
      this._setAccount(me
        ? { kind: 'member', familyId: me.family_id, personId: me.person_id || '', email: me.email }
        : { kind: 'no-family' });
    }catch(err){
      if(err.signedOut || !auth.isSignedIn()){ this._setAccount({ kind: 'signed-out' }); return; }
      if(this.account.kind !== 'member') this._setAccount({ kind: 'checking', detail: err.message });
    }
  },

  /* After signing in, joining, or starting up: find the family, load the board
     and this person's settings, and start checking for changes. */
  async refreshAccount(){
    this.stop();
    await this.resolveAccount();
    this.rev = 0;
    this.agreed = null;
    this.pendingPush = false;
    if(!this.isOn()){ this.setStatus('off'); render(); return; }
    this.setStatus('connecting');
    try{
      const result = await this.pull(false);
      if(result === 'empty') await this.push();   // family-code mode: this device seeds the row
    }catch(err){
      this.setStatus(err.offline ? 'offline' : 'error', err.message);
    }
    this.start();
    await mySettings.pull();
    render();
  },

  /* Signing out leaves this device's copy where it is and stops syncing. The
     next person to sign in here gets their own family board and settings. */
  async signOut(){
    this.stop();
    mySettings.reset();
    await auth.signOut();
    this._setAccount({ kind: 'signed-out' });
    this.members = null;
    await this.refreshAccount();
  },

  /* For a signed-in account that isn't on any list yet: claim the family this
     device already syncs with (its family code), or start a new family from
     this device's board. The server refuses the claim once a family has a list. */
  async setupFamily(){
    const cfg = cloudConfig();
    await this._rpc('fh_setup', cfg ? { fid: cfg.familyId, body: null } : { fid: null, body: cloudPayload() });
    await this.refreshAccount();
  },

  async loadMembers(){
    this.members = (await this._rpc('fh_members', {})) || [];
    return this.members;
  },

  /* email '' or null takes that person's access away. */
  async setMemberEmail(personId, email){
    await this._rpc('fh_set_member', { person: personId, new_email: email || null });
    await this.loadMembers();
    if(this.account.kind === 'member' && String(email || '').trim().toLowerCase() === this.account.email){
      await this.resolveAccount();   // relinked yourself: header avatar and "this is me" follow
    }
  },

  async removeMember(email){
    await this._rpc('fh_remove_member', { target_email: email });
    await this.loadMembers();
  },

  /* Moves the whole family to a code of your choosing: write the board under
     the new code, leave a forwarding note under the old one, then follow it
     here. Every other device picks up the note on its next check. */
  async changeFamilyCode(newId){
    const cfg = cloudConfig();
    if(!cfg) throw new Error('Family sync isn\'t set up on this device.');
    if(newId === cfg.familyId) throw new Error('That\'s already this family\'s code.');

    const taken = await this._rpc('family_hub_meta', { fid: newId });
    if(taken && taken[0]){
      const err = new Error('That code already belongs to a family.');
      err.codeExists = true;
      throw err;
    }

    const stored = await this._rpc('family_hub_put', {
      fid: newId, body: cloudPayload(), newrev: 1, device: deviceId()
    });
    // Only once the board is safely under the new code does the old one become a signpost.
    await this._rpc('family_hub_put', {
      fid: cfg.familyId, body: JSON.stringify({ __movedTo: newId }), newrev: 999999, device: deviceId()
    });

    writeCloudConfig(Object.assign({}, cfg, { familyId: newId }));
    this.rev = Number(stored) || 1;
    this.lastSyncAt = Date.now();
    this.setStatus('live');
    return newId;
  }
};

/* ======================= PERSONAL SETTINGS =======================
   The PERSONAL_KEYS slice of state, saved to the signed-in person's own row
   (fh_get_settings / fh_put_settings) instead of the family board, so it
   follows them to any device they sign in on. Loaded when the account is
   confirmed and whenever the app comes back to the screen; saved a moment
   after any change — saveState() calls queuePush(). Signed out, the same
   values simply stay on this device. */
const SETTINGS_PUSH_MS = 1500;
const mySettings = {
  lastSent: null,   // the slice as last saved to, or read from, the server (JSON)
  _timer: null,

  slice(){
    const out = {};
    PERSONAL_KEYS.forEach(k=>{ if(state && state[k] !== undefined) out[k] = state[k]; });
    return out;
  },
  reset(){
    clearTimeout(this._timer);
    this._timer = null;
    this.lastSent = null;
  },

  async pull(){
    if(cloudSync.mode() !== 'member') return;
    /* A change made here that hasn't reached the server yet wins: send it
       rather than overwrite it with an older copy. */
    if(this._timer || (this.lastSent !== null && JSON.stringify(this.slice()) !== this.lastSent)){
      await this.push();
      return;
    }
    let remote;
    try{ remote = await cloudSync._rpc('fh_get_settings', {}); }
    catch(err){ console.warn('Could not load personal settings:', err.message); return; }

    if(!remote || typeof remote !== 'object' || Array.isArray(remote)){
      /* First sign-in for this person: start from what this device has, and
         point the "whose" pickers at them if they're linked to someone on the
         board. */
      const me = cloudSync.account.personId;
      if(me && personById(me)){ state.habitPersonId = me; state.hkWho = me; }
      await saveLocalOnly();
      await this.push(true);
      render();
      return;
    }
    PERSONAL_KEYS.forEach(k=>{ if(remote[k] !== undefined) state[k] = remote[k]; });
    state = migrateState(state);   // tidies anything malformed or from an older build
    this.lastSent = JSON.stringify(this.slice());
    await saveLocalOnly();
    render();
  },

  queuePush(){
    if(cloudSync.mode() !== 'member') return;
    if(JSON.stringify(this.slice()) === this.lastSent) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(()=>{ this._timer = null; this.push(); }, SETTINGS_PUSH_MS);
  },

  /* Kept on this device whatever happens; a failed save is retried by the next
     change, the next time the app comes back to the screen, or the next sign-in. */
  async push(force){
    if(cloudSync.mode() !== 'member') return;
    /* One save at a time. A second one started mid-flight would race the first
       to decide what was last saved, and the loser's change would be lost. */
    if(this._sending){ this.queuePush(); return; }
    clearTimeout(this._timer);
    this._timer = null;
    const body = JSON.stringify(this.slice());
    if(!force && body === this.lastSent) return;
    this._sending = true;
    try{
      await cloudSync._rpc('fh_put_settings', { body: JSON.parse(body) });
      this.lastSent = body;
      /* Anything changed while that was in flight is still unsaved — this save
         carried the older copy. Without this, the change would be taken for
         saved and quietly never sent. */
      if(JSON.stringify(this.slice()) !== body) this.queuePush();
    }catch(err){
      console.warn('Could not save personal settings:', err.message);
    }finally{
      this._sending = false;
    }
  }
};

/* ========================= THE DAILY LOG =========================
   WHAT THIS DOES
   The family board holds the CURRENT state, plus an activity feed capped at 200
   lines. That answers "what changed recently"; it cannot answer "what did we do
   on the 4th of last month". So every change is also appended to a table that
   is never trimmed, one row per change, and any day can be pulled back out as a
   file.

   WHY THE FILE IS NOT WRITTEN AS THE DAY GOES ON
   A web page cannot write files to a disk by itself -- browsers do not allow it,
   and they would not run at midnight anyway unless somebody happened to have the
   app open. So the rows go to the database as they happen, a scheduled job in
   Postgres seals each finished day at 12:30am in the family's own timezone,
   and the app turns a sealed day into a real file when asked.

   DEPENDS ON
     fh_log, fh_log_day, fh_log_days, fh_sealed_day   in the setup SQL
     cloudSync._rpc                                   makes the call
     cloudSync.account                                must be a signed-in member
     localStorage (LOG_QUEUE_KEY)                     holds changes not yet sent
     stampBoard()                                     produces the change records
     deviceId(), fmtDate()                            elsewhere in this file

   USED BY
     cloudSync.push()   hands over the changes after a save succeeds
     the Family sync panel   for the per-day download

   WHY A QUEUE
   The log is written AFTER the board save succeeds, so it never claims a change
   that was refused. If the connection drops in between, the change is in the
   family board but not yet in the log, so it waits here and goes up on the next
   attempt. Sending twice is harmless: every row carries a key the database
   treats as unique, so a retry inserts nothing the second time. */

const LOG_QUEUE_KEY  = 'fh-log-queue';
const LOG_SEQ_KEY    = 'fh-log-seq';   // counts changes on this device, so no two share a key
const LOG_QUEUE_MAX  = 4000;   // roughly three weeks of heavy use before the oldest is dropped
const LOG_BATCH_MAX  = 500;    // the limit fh_log enforces, so the call cannot be refused for size
const LOG_RETRY_MS   = 20000;
const LOG_EVENT_COOLDOWN_MS = 5 * 60 * 1000;  // the same error is logged at most this often
const LOG_MESSAGE_MAX = 180;                  // enough to identify a fault, short enough to scan  // a failed send waits this long rather than hammering a dead connection

const dailyLog = {
  _queue: null,
  _seq: null,
  _recent: new Map(),   // kind|message -> when it was last logged, for the cooldown
  _busy: false,
  _retryTimer: null,
  lastError: '',

  /* Read lazily, so a device that never signs in never touches storage. */
  queue(){
    if(this._queue) return this._queue;
    try{
      const raw = localStorage.getItem(LOG_QUEUE_KEY);
      this._queue = raw ? JSON.parse(raw) : [];
    }catch(e){
      /* An unreadable queue is not worth refusing to log over. Start clean and
         say so, rather than throwing on every save from now on. */
      console.warn('The log queue was unreadable and has been reset.', e);
      this._queue = [];
    }
    if(!Array.isArray(this._queue)) this._queue = [];
    return this._queue;
  },
  persist(){
    try{ localStorage.setItem(LOG_QUEUE_KEY, JSON.stringify(this._queue || [])); }
    catch(e){
      /* Storage full. The queue still works for this session; it just will not
         survive a reload. Logging is not worth losing an edit over, so this
         never becomes an error the person has to deal with. */
      console.warn('Could not store the log queue:', e.message);
    }
  },

  /* The key the database uses to refuse a duplicate. It has to satisfy two
     things at once: come out the SAME if this batch is sent twice, and come out
     DIFFERENT for two separate changes -- including two identical ones a few
     seconds apart, like ticking a habit, un-ticking it and ticking it again.

     A number that only ever counts up on this device does both, because it is
     fixed when the change is RECORDED, long before anything is sent. An earlier
     version keyed on the minute plus what changed, which quietly dropped the
     third of those three ticks. */
  nextSeq(){
    if(this._seq === null){
      let stored = 0;
      try{ stored = Number(localStorage.getItem(LOG_SEQ_KEY)) || 0; }
      catch(e){ stored = 0; }
      /* Storage unreadable: start from the clock rather than from zero. Reusing
         numbers would make the database treat genuinely new changes as repeats
         and throw them away, which is worse than a gap in the numbering. */
      this._seq = stored > 0 ? stored : Date.now();
    }
    this._seq += 1;
    try{ localStorage.setItem(LOG_SEQ_KEY, String(this._seq)); }
    catch(e){ /* the in-memory counter still rises, so this session stays safe */ }
    return this._seq;
  },
  keyFor(){ return deviceId() + '-' + this.nextSeq(); },

  /* Turns the raw change records from stampBoard into log rows and queues them.
     Called only after the board save succeeded. Every change is kept, including
     the ones the visible feed leaves out -- habit ticks and chore ticks are
     exactly the part worth studying later. */
  record(changes, atMs, who){
    if(!Array.isArray(changes) || !changes.length) return;
    if(cloudSync.account.kind !== 'member') return;   // nowhere to send it, and no identity to attach
    const q = this.queue();
    const when = new Date(atMs);
    const day = fmtDate(when);
    const iso = when.toISOString();
    const device = deviceId();
    for(const c of changes){
      if(c.path === 'activity') continue;             // logging the log is noise
      q.push({
        k: this.keyFor(),
        day, at: iso,
        by_name: (who && who.name) || '',
        device,
        path: c.path,
        op: c.op,
        item_id: String(c.id || ''),
        item_name: String(c.name || ''),
        n: Number(c.n) || 1,
        detail: c.detail || null
      });
    }
    /* Bounded on purpose. A device left offline for a month should not grow its
       storage without limit; the oldest unsent rows go first. */
    this._queued(q);
  },

  /* Trims, stores and tries to send. Shared by record() and event() so the
     queue is only managed in one place. */
  _queued(q){
    if(q.length > LOG_QUEUE_MAX) q.splice(0, q.length - LOG_QUEUE_MAX);
    this.persist();
    this.flush();
  },

  /* Anything worth knowing that is not a board change: a crash, a failed
     sign-in, a sync that stopped working.

     Deliberately NOT guarded on being a member, unlike record(). The most
     important thing this logs is a sign-in that failed, and by definition
     nobody is a member when that happens. The row waits in the queue and goes
     up after the next successful sign-in; flush() is what enforces the
     membership rule.

     kind is 'error', 'signin' or 'sync'. They are stored under an app.* path so
     they sort apart from board changes when the day is read back. */
  event(kind, message, detail){
    const text = scrubForLog(message);
    if(!text) return;
    /* A dropped connection re-reports itself on every poll. Without a cooldown
       an afternoon offline would write hundreds of identical rows and bury the
       one thing worth reading. */
    const key = kind + '|' + text;
    const now = Date.now();
    if(this._recent.get(key) > now - LOG_EVENT_COOLDOWN_MS) return;
    this._recent.set(key, now);

    const when = new Date(syncNow());
    const q = this.queue();
    q.push({
      k: this.keyFor(),
      day: fmtDate(when),
      at: when.toISOString(),
      by_name: (signedInPerson() || {}).name || '',
      device: deviceId(),
      path: 'app.' + kind,
      op: kind === 'signin' ? 'signin' : 'error',
      item_id: '',
      item_name: text,
      n: 1,
      detail: detail && typeof detail === 'object' ? detail : null
    });
    this._queued(q);
  },

  /* Sends what is queued, oldest first, in batches the database will accept.
     Rows are only dropped from the queue once the database has confirmed them. */
  async flush(){
    if(this._busy) return;
    if(cloudSync.account.kind !== 'member') return;
    const q = this.queue();
    if(!q.length) return;
    this._busy = true;
    clearTimeout(this._retryTimer);
    try{
      while(q.length){
        const batch = q.slice(0, LOG_BATCH_MAX);
        await cloudSync._rpc('fh_log', { entries: batch });
        q.splice(0, batch.length);
        this.persist();
      }
      this.lastError = '';
    }catch(err){
      /* Nothing is lost: the rows stay queued and go up on the next attempt.
         The board itself already saved, so this never blocks the family. */
      this.lastError = err.message || String(err);
      console.warn('The daily log could not be written yet:', this.lastError);
      this._retryTimer = setTimeout(()=>this.flush(), LOG_RETRY_MS);
    }finally{
      this._busy = false;
    }
  },

  /* Which days have anything in them, newest first. */
  async days(){
    const rows = await cloudSync._rpc('fh_log_days', {});
    return Array.isArray(rows) ? rows : [];
  },

  /* One day, as rows. Prefers the sealed copy -- the snapshot the scheduled job
     took at 12:30am the morning after -- and falls back to reading the live
     rows, which is what today needs, because today has not been sealed yet. */
  async day(dayStr){
    const sealed = await cloudSync._rpc('fh_sealed_day', { d: dayStr });
    if(sealed && Array.isArray(sealed.entries)) return { sealed: true, sealedAt: sealed.sealed_at, rows: sealed.entries };
    const rows = await cloudSync._rpc('fh_log_day', { d: dayStr });
    return { sealed: false, sealedAt: null, rows: Array.isArray(rows) ? rows : [] };
  },

  /* Builds the actual file and hands it to the browser's download. CSV, because
     the point of this is to open it in a spreadsheet later. */
  async download(dayStr, format){
    const { sealed, sealedAt, rows } = await this.day(dayStr);
    const body = format === 'json'
      ? JSON.stringify({ day: dayStr, sealed, sealed_at: sealedAt, entries: rows }, null, 2)
      : logRowsToCsv(rows);
    const name = `family-hub-log-${dayStr}.${format === 'json' ? 'json' : 'csv'}`;
    const blob = new Blob([body], { type: format === 'json' ? 'application/json' : 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    /* Released on the next turn of the event loop: revoking it immediately can
       cancel the download on some browsers before it has started. */
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    return { name, rows: rows.length, sealed };
  }
};

/* Error text can arrive carrying the very thing that must never be written
   down: a sign-in failure may quote the callback URL, which holds the one-time
   code, and a token refresh may quote the token. Anything that looks like a
   credential is replaced before the row is queued, and the result is capped so
   a stack trace cannot become a log entry. */
function scrubForLog(message){
  let text = String((message && message.message) || message || '').trim();
  if(!text) return '';
  text = text
    .replace(/(access_token|refresh_token|id_token|code_verifier|client_secret|apikey|api_key)=[^&\s"']+/gi, '$1=[removed]')
    .replace(/[?&]code=[^&\s"']+/gi, '?code=[removed]')
    .replace(/\beyJ[A-Za-z0-9_.-]{20,}/g, '[token removed]')
    .replace(/\bsb_(secret|publishable)_[A-Za-z0-9_-]+/g, '[key removed]')
    .replace(/\s+/g, ' ');
  return text.length > LOG_MESSAGE_MAX ? text.slice(0, LOG_MESSAGE_MAX - 1) + '\u2026' : text;
}

/* One row per change, with the item's own fields flattened into their own
   columns so a spreadsheet can sort and total them without any unpacking. */
function logRowsToCsv(rows){
  const base = ['at','by_name','by_email','device','path','op','item_id','item_name','n'];
  const extra = [];
  for(const r of rows){
    const d = r.detail;
    if(d && typeof d === 'object'){
      for(const k of Object.keys(d)) if(!extra.includes(k) && extra.length < 40) extra.push(k);
    }
  }
  extra.sort();
  const head = [...base, ...extra.map(k=>'detail.' + k)];
  const cell = v=>{
    if(v === null || v === undefined) return '';
    const text = typeof v === 'object' ? JSON.stringify(v) : String(v);
    /* Quote anything a spreadsheet would otherwise split or mangle, and double
       any quote inside, which is what RFC 4180 asks for. */
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  };
  const lines = [head.join(',')];
  for(const r of rows){
    const d = (r.detail && typeof r.detail === 'object') ? r.detail : {};
    lines.push([...base.map(k=>cell(r[k])), ...extra.map(k=>cell(d[k]))].join(','));
  }
  return lines.join('\r\n');
}

function cloudStatusLabel(){
  switch(cloudSync.status){
    case 'live':       return '🟢 Syncing across every device';
    case 'connecting': return '🔵 Connecting…';
    case 'offline':    return '🟡 Offline — saved here, will sync when the connection returns';
    case 'error':      return '🔴 Sync problem';
    default:           return '⚪ This device only';
  }
}

/* updateCloudIndicator() was removed with the header's cloud icon. Sync state
   now reaches the person in two better places: cloudStatusLabel() in words on
   the sync panel and in Settings, and the Last sync date and time on the
   refresh bar at the top of every tab. Do not reintroduce a header icon --
   a second indicator is a second thing to keep in step. */

/* Header account button: the signed-in person's avatar, or 👤 when nobody is
   signed in. Opens the sync panel, where signing in and out lives. */
/* The classic empty-profile silhouette, drawn rather than taken from an emoji
   so it inherits a colour and stays crisp at 20px. Shown when somebody is
   signed in but has not yet said which person on the board they are. */
const PERSON_SILHOUETTE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="width:62%; height:62%;">'
  + '<circle cx="12" cy="8" r="4"/><path d="M12 14c-4.4 0-8 2.9-8 6.5V22h16v-1.5C20 16.9 16.4 14 12 14z"/></svg>';

/* The header button is the only thing that answers "am I signed in?" at a
   glance, so the states have to LOOK different rather than only carry
   different tooltips. Before this, signed out and signed in both rendered the
   same person emoji, which is no answer at all.

     signed out             hollow grey outline
     signed in, no person   filled disc with the generic silhouette
     signed in, a member    that person's own piece, in their own colour */
function updateAccountButton(){
  const btn = document.getElementById('accountBtn');
  if(!btn) return;
  const acct = cloudSync.account;
  const generic = tint=>`<span class="avatar sm" style="background:${tint}; color:#fff;">${PERSON_SILHOUETTE}</span>`;

  /* This button took over BOTH of the removed cloud icon's jobs: it opens the
     Family sync panel (wired in initCloudSync), and it reports sync status.

     Every title below therefore leads with "Family sync" and ends with the
     current status. The old titles named only the account -- and when signed
     out it said "Sign in with Google", which was simply wrong about what
     pressing it does. A control that misreports its own action is worse than
     one with no tooltip at all.

     Status comes from cloudStatusLabel(), the same words the sync panel and
     Settings use, so there is one wording to keep in step rather than the
     icon-and-opacity scheme the cloud button had. */
  const status = ` · ${cloudStatusLabel()}`;

  if(acct.kind === 'member'){
    const p = acct.personId && state ? personById(acct.personId) : null;
    btn.innerHTML = p ? avatarHtml(p, 'sm') : generic('var(--board)');
    btn.title = `Family sync — signed in as ${acct.email}${p ? ' (' + p.name + ')' : ', tap to say who you are'}${status}`;
    btn.classList.add('signed-in');
    return;
  }
  if(auth.isSignedIn()){
    /* Signed in with Google but not on the family list. That is a real state,
       and a different one from signed out, so it gets its own colour. */
    btn.innerHTML = generic('var(--mustard)');
    btn.title = `Family sync — signed in as ${auth.email()}, not on a family list yet${status}`;
    btn.classList.add('signed-in');
    return;
  }
  btn.classList.remove('signed-in');
  btn.innerHTML = `<span class="avatar sm signed-out">${PERSON_SILHOUETTE}</span>`;
  btn.title = `Family sync — not signed in${status}`;
}

/* Starts Google sign-in from any button. On success the page leaves for Google,
   so only a failure comes back here. */
async function startSignIn(btn){
  if(btn) btn.disabled = true;
  try{ await auth.signIn(); }
  catch(err){
    if(btn) btn.disabled = false;
    toast(err.message || 'Couldn\'t start sign-in.', 'error');
    /* Queued even though nobody is signed in: it goes up with the next
       successful sign-in, which is when somebody will want to know why the
       previous attempt failed. */
    dailyLog.event('signin', err.message || 'Could not start sign-in', { stage: 'start' });
  }
}

/* The account strip on Home. Always present, because "am I signed in, and as
   who?" is a question the dashboard should answer without anyone opening a
   panel or hovering a tooltip.

   Signing in happens in ONE place: THIS strip. It is the only surface in the app that offers a Sign in with Google button. Every other surface either reports state or links here -- none of them carries a second button, and none of them tells you to go and find one somewhere else.

   The strip used to send you to the Family sync panel to press the real
   button. A signpost pointing at a signpost is what made this confusing, so the button now starts the sign-in itself.

   Signed in, the strip stops asking for anything and becomes the sync
   readout: the real date and time the board last agreed with the server, plus a Refresh that forces a round trip now.

   DEPENDS ON
     startSignIn()         the shared sign-in starter, wired in at #bannerSignIn
     cloudLastSyncStamp()  absolute timestamp, defined just below
     cloudSync.account     the four account states this switches on
     cloudSync.isOn()      true when EITHER signed in or on a family code */
     
function accountStripHtml(){
  const acct = cloudSync.account;
  const strip = (body, buttons, muted)=>`<div style="background:${muted ? 'transparent' : 'var(--paper-2)'}; border:1px solid var(--line); border-radius:12px; padding:${muted ? '7px 12px' : '10px 14px'}; margin-bottom:12px; font-size:${muted ? '12.5px' : '13.5px'}; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
      <span style="display:flex; align-items:center; gap:7px; flex-wrap:wrap;">${body}</span>
      <span style="display:flex; align-items:center; gap:6px;">${buttons}</span></div>`;
  const btn = (id, label, kind)=>`<button class="btn ${kind}" id="${id}" style="font-size:12px;">${label}</button>`;

  /* No Refresh button and no Last sync stamp here any more: the refresh bar
     at the top of every tab carries both, this screen included. Two Refresh
     buttons on Home would be the same duplication the strip was built to end. */

  if(acct.kind === 'member'){
    const p = acct.personId && state ? personById(acct.personId) : null;
    if(p) return strip(`${avatarHtml(p, 'sm')} <span style="color:var(--ink-soft);">Signed in as</span> <strong>${escapeHtml(p.name)}</strong>`,
                       btn('bannerOpenSync', 'Family sync', 'btn-ghost'), true);
    return strip(`<span style="color:var(--ink-soft);">Signed in as</span> <strong>${escapeHtml(acct.email)}</strong> <span style="color:var(--ink-soft);">— say which person you are</span>`,
                 btn('bannerOpenSync', 'Family sync', 'btn-primary'), false);
  }
  if(acct.kind === 'no-family'){
    return strip(`You're signed in as <strong>${escapeHtml(auth.email())}</strong>, but that account isn't on your family's list yet.`,
                 btn('bannerOpenSync', 'Finish setting up', 'btn-primary'), false);
  }
  if(acct.kind === 'checking'){
    /* Signed in, but the family list has not answered yet. Saying so beats
       showing "not signed in" and sending someone to sign in a second time. */
    return strip(`<span style="color:var(--ink-soft);">Checking your family list…</span>`,
                 btn('bannerOpenSync', 'Family sync', 'btn-ghost'), true);
  }
  /* Signed out, but already syncing on a family code: the board is NOT stuck.
     Saying "Not signed in" and nothing else would read as "nothing works",
     which is the opposite of true, and would send someone chasing a sync
     problem they do not have. */
  if(cloudSync.isOn()){
    return strip(`<span style="color:var(--ink-soft);">Syncing on this family's code.</span>`,
                 btn('bannerSignIn', 'Sign in with Google', 'btn-primary'), true);
  }
  return strip(`👋 <strong>Not signed in.</strong> <span style="color:var(--ink-soft);">Sign in once and your family's board, changes and settings follow you to every device.</span>`,
               btn('bannerSignIn', 'Sign in with Google', 'btn-primary'), false);
}

/* The real date and time of the last agreed sync, for the dashboard strip.
   cloudAgoLabel() below returns "5 minutes ago", which cannot tell you whether
   sync stopped twenty minutes ago or last Tuesday -- exactly the question you
   are asking when you suspect it is broken. Honours the 12/24-hour setting. */
function cloudLastSyncStamp(){
  if(!cloudSync.lastSyncAt) return 'never';
  const d = new Date(cloudSync.lastSyncAt);
  const time = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit', hour12: !use24h() });
  /* Today needs no date; any other day needs one, or "2:47 PM" is a lie by
     omission about a board that last synced on Tuesday. */
  if(fmtDate(d) === todayStr()) return `${time} today`;
  return `${time}, ${d.toLocaleDateString([], { month:'short', day:'numeric' })}`;
}

/* The refresh bar. render() puts this at the top of EVERY tab, so Refresh is
   never more than one look away no matter which screen someone is on.

   Built once and prepended in render() rather than copied into the seven
   render functions: a per-screen copy means seven places to keep in step, and
   a new tab added later would silently ship without one.

   The Last sync stamp travels with the button on purpose. A Refresh button on
   its own cannot tell you whether the last one worked, which is the actual
   question being asked when somebody presses it. */
function refreshBarHtml(){
  const status = cloudSync.isOn()
    ? `<span style="color:var(--ink-soft);">Last sync</span> <strong>${escapeHtml(cloudLastSyncStamp())}</strong>`
    : `<span style="color:var(--ink-soft);">Not syncing — this device only</span>`;
  return `<div style="display:flex; align-items:center; justify-content:flex-end; gap:8px; margin:0 0 10px; font-size:12.5px; flex-wrap:wrap;">
      ${status}
      <button class="btn btn-ghost" id="appRefresh" style="font-size:12px;">🔄 Refresh</button>
    </div>`;
}

/* Brings EVERY source the app displays up to date, from whichever tab the
   button was pressed on. The board is the point of it, so that one reports
   its result; the rest are best-effort.

   ORDER MATTERS. The push goes first: an edit of your own still queued is the
   likeliest reason another device has not seen it, and pulling first would
   report "already up to date" while your change sat in the queue.

   Each secondary source is wrapped on its own so one broken thing cannot stop
   the others -- an expired Google Calendar token must not prevent the family
   board from refreshing. All three guard themselves internally too
   (mySettings.pull returns unless signed in, googleAutoPull unless a calendar
   is connected, refreshWeather unless a location is set), so calling them
   unconditionally is safe.

   DEPENDS ON
     cloudSync.push/pull   the family board
     mySettings.pull()     this person's own settings, from another device
     googleAutoPull()      connected Google calendars
     refreshWeather(true)  forces past the weather cache */
async function refreshEverything(btn){
  if(btn){ btn.disabled = true; btn.textContent = '🔄 Checking…'; }

  let message = 'Already up to date.';
  let kind = 'success';

  if(cloudSync.isOn()){
    try{
      if(cloudSync.pendingPush) await cloudSync.push();
      const result = await cloudSync.pull(false);
      if(result === 'empty') await cloudSync.push();        // first device seeds the row
      if(result === 'applied') message = 'Picked up newer changes from another device.';
    }catch(err){
      /* A failed refresh is the whole signal the button was pressed for, so it
         is surfaced rather than swallowed back into a silent idle state. */
      message = (err && err.message) || 'Sync failed.';
      kind = 'error';
    }
  }else{
    message = 'This device is not syncing yet — sign in on the Home screen.';
    kind = 'error';
  }

  try{ await mySettings.pull(); }  catch(e){ console.warn('Personal settings did not refresh:', e.message); }
  try{ await googleAutoPull(); }   catch(e){ console.warn('Calendars did not refresh:', e.message); }
  try{ refreshWeather(true); }     catch(e){ console.warn('Weather did not refresh:', e.message); }

  toast(message, kind);
  /* Redraws the current tab with the new data and the new timestamp, which
     also rebuilds this button enabled -- no manual re-enable to forget. */
  render();
}

function cloudAgoLabel(){
  if(!cloudSync.lastSyncAt) return 'not yet';
  const secs = Math.round((Date.now() - cloudSync.lastSyncAt) / 1000);
  if(secs < 10) return 'just now';
  if(secs < 60) return `${secs} seconds ago`;
  const mins = Math.round(secs/60);
  if(mins < 60) return `${mins} minute${mins===1?'':'s'} ago`;
  const hrs = Math.round(mins/60);
  return `${hrs} hour${hrs===1?'':'s'} ago`;
}

/* ---- Invite links ----
   Setting a phone up by typing a project URL and a 200-character key is nobody's
   idea of a good time, so one configured device can hand the settings to the
   next one in a link. The link carries a key, so it's shared the way a house key
   is — directly, to people who live there. */
const PUBLIC_APP_URL = 'https://markingmyname.github.io/family-hub-ghanayem/';
/* A link built while testing on localhost points every other device at itself,
   where nothing is listening. Share the published address instead. */
function appShareUrl(){
  const isLocal = location.protocol === 'file:' ||
    /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname);
  return isLocal ? PUBLIC_APP_URL : location.origin + location.pathname;
}
function cloudInviteLink(cfg){
  const bytes = new TextEncoder().encode(JSON.stringify(cfg));
  const b64 = btoa(String.fromCharCode(...bytes));
  return appShareUrl() + '#fh-sync=' + encodeURIComponent(b64);
}
/* Reads an invite out of the address bar and strips it straight away, so the key
   doesn't sit in the URL bar, in history, or in a screenshot. */
function takeInviteFromHash(){
  const match = /(?:^|[#&])fh-sync=([^&]+)/.exec(location.hash || '');
  if(!match) return null;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    const bin = atob(decodeURIComponent(match[1]));
    const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
    const cfg = JSON.parse(new TextDecoder().decode(bytes));
    const url = normalizeCloudUrl(cfg.url);
    if(!url || !cfg.key || !cfg.familyId) return null;
    return { url, key: String(cfg.key).trim(), familyId: String(cfg.familyId).trim() };
  }catch(e){ return null; }
}

function personById(id){ return state.people.find(p=>p.id===id); }
/* Points are kept as one tally per device and added up on read. A single
   running total could only ever hold one answer, so two people awarding points
   in the same minute meant one award was quietly dropped. A device only ever
   writes its own tally, so there is nothing left to resolve when the copies
   meet. See SYNC_SHAPE.counters. */
function pointsFor(id){
  const shards = (state.points && state.points.byDevice) || {};
  let total = 0;
  for(const shard of Object.values(shards)) total += Number(shard && shard[id]) || 0;
  return total;
}

/* ---- Shared "Completed" drawer ----
   To-Dos and Habits both park finished items in the same collapsible
   block at the foot of their page, so the working list only ever shows what's
   still outstanding. */
function completedIsOpen(key){ return !!(state.completedOpen && state.completedOpen[key]); }
function autoRemoveOn(){ return !!state.autoRemoveChecked; }
/* With auto-remove on there is never anything to clear, so the button and the
   drawer both stand down rather than sitting there permanently empty. */
function completedToggleHtml(key, count){
  if(autoRemoveOn()) return '';
  return `<button class="btn btn-ghost" data-completedtoggle="${key}" style="font-size:12px;">
      ${completedIsOpen(key) ? 'Hide' : 'Show'} completed${count?` (${count})`:''}
    </button>`;
}
function completedClearHtml(key, count){
  if(autoRemoveOn() || !count) return '';
  const label = key === 'habits' ? 'Clear today\'s ticks' : 'Remove all checked';
  return `<button class="btn btn-ghost" data-completedclear="${key}" style="font-size:12px;">${label} (${count})</button>`;
}
function completedSectionHtml(key, count, rowsHtml, emptyNote){
  if(autoRemoveOn() || !count) return '';
  const open = completedIsOpen(key);
  return `<div class="done-drawer">
      <div class="done-drawer-head" data-completedtoggle="${key}">
        <span class="caret">${open?'▼':'▶'}</span>
        <span>Completed</span>
        <span class="cnt">${count}</span>
      </div>
      ${open ? `<div class="done-drawer-body">${rowsHtml || `<div class="done-empty">${emptyNote||'Nothing completed yet.'}</div>`}</div>` : ''}
    </div>`;
}

/* Removing checked items. To-dos are deleted outright; a habit is an
   ongoing thing rather than a one-off, so "clearing" it un-ticks today instead
   of deleting the habit and wiping its history. */
function clearCheckedFor(key){
  if(key === 'todos'){
    const doneIds = new Set(state.todos.items.filter(t=>t.done).map(t=>t.id));
    const gone = doneIds.size;
    state.todos.items = state.todos.items.filter(t=>!doneIds.has(t.id) && !doneIds.has(t.parentId));
    return { gone, noun: gone===1 ? 'to-do' : 'to-dos' };
  }
  /* Habits: un-tick everything done today and hand the points back. */
  const now = new Date();
  let gone = 0;
  state.habits.items.forEach(h=>{
    if(habitDone(h, now)){
      delete state.habits.log[habitLogKey(h, now)];
      addPoints(h.personId, -(h.points||0));
      gone++;
    }
  });
  return { gone, noun: gone===1 ? 'tick' : 'ticks' };
}
function addPoints(id, n){
  if(!state.points || typeof state.points !== 'object') state.points = { byDevice:{} };
  if(!state.points.byDevice) state.points.byDevice = {};
  const mine = state.points.byDevice[deviceId()] || (state.points.byDevice[deviceId()] = {});
  mine[id] = (Number(mine[id]) || 0) + n;     // this device's own tally only
}

/* ---- Event ownership ----
   An event carries a list of people. An EMPTY list means it belongs to the whole
   family — the catch-all calendar. */
function eventPersonIds(e){
  const ids = Array.isArray(e.personIds) ? e.personIds : (e.personId ? [e.personId] : []);
  return ids.filter(id=>personById(id));
}
function isFamilyEvent(e){ return eventPersonIds(e).length === 0; }
function eventPeople(e){ return eventPersonIds(e).map(personById).filter(Boolean); }
function familyLabel(){ return state.familyLabel || 'Family calendar'; }
/* The family tab is the whole household; picking people narrows the view to
   just their own diaries, and several can be on at once. An empty selection is
   the family tab. */
function calFilterIds(){
  const f = state && state.calFilter;
  if(Array.isArray(f)) return f.filter(id=>personById(id));
  return (f && f !== 'all' && personById(f)) ? [f] : [];
}
function eventMatchesFilter(e, filter){
  const ids = Array.isArray(filter) ? filter : ((filter && filter !== 'all') ? [filter] : []);
  if(!ids.length) return true;
  return eventPersonIds(e).some(id=>ids.includes(id));
}
/* One person keeps their own colour; several share the chip as equal bands;
   a family event uses the neutral board colour so it reads as "everyone". */
function eventColor(e){
  const ppl = eventPeople(e);
  if(!ppl.length) return 'var(--family)';
  if(ppl.length === 1) return ppl[0].color;
  const step = 100 / ppl.length;
  const stops = ppl.map((p,i)=>`${p.color} ${(i*step).toFixed(2)}% ${((i+1)*step).toFixed(2)}%`).join(', ');
  return `linear-gradient(90deg, ${stops})`;
}
function eventTextColor(e){
  const ppl = eventPeople(e);
  if(ppl.length === 1) return ppl[0].text || '#fff';
  return '#fff';
}
function eventPeopleLabel(e){
  const ppl = eventPeople(e);
  return ppl.length ? ppl.map(p=>p.name).join(', ') : familyLabel();
}

/* ---- Avatar rendering ---- */
/* Chess pieces as avatars. The SOLID glyphs are used rather than the outline
   ones because an outline piece turns into a grey smudge at 20px in the header.
   They are ordinary text characters, so they take the person's own colour -- a
   pink queen is a queen drawn in pink, not a black queen on a pink disc, which
   is all the emoji avatar type could manage. */
const CHESS_PIECES = { king:'♚', queen:'♛', rook:'♜', bishop:'♝', knight:'♞', pawn:'♟' };

/* Who starts as what. Applied only to a person still on the untouched default
   avatar, so nobody's chosen photo or emoji is ever overwritten. Matched on
   name because that is what the household recognises; spellings people
   actually use are all listed rather than guessed at. */
const DEFAULT_PIECES = [
  { match: ['mom', 'mum', 'katie', 'katherine', 'kathy'], piece: 'queen'  },
  { match: ['dad', 'mark', 'markg'],                      piece: 'king'   },
  { match: ['kingston'],                                  piece: 'knight' },
  { match: ['maddox', 'maddix', 'maddixx', 'madox'],      piece: 'knight' }
];
function defaultPieceFor(name){
  const n = String(name || '').trim().toLowerCase();
  if(!n) return '';
