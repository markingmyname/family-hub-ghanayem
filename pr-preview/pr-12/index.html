  const hit = DEFAULT_PIECES.find(d=>d.match.some(m=>n === m || n.startsWith(m + ' ')));
  return hit ? hit.piece : '';
}

function avatarHtml(p, size){
  const cls = 'avatar' + (size?(' '+size):'');
  if(p.avatarType==='image' && p.avatarImage){
    return `<span class="${cls}"><img src="${p.avatarImage}" alt=""></span>`;
  }
  if(p.avatarType==='emoji' && p.avatarEmoji){
    return `<span class="${cls}" style="background:${p.color}22;">${p.avatarEmoji}</span>`;
  }
  /* The piece is drawn in the person's own colour on a soft wash of the same
     colour, so it stays legible on both the light and dark backgrounds the
     avatar appears against. */
  if(p.avatarType==='piece' && CHESS_PIECES[p.avatarPiece]){
    return `<span class="${cls} piece" style="background:${p.color}22; color:${p.color};">${CHESS_PIECES[p.avatarPiece]}</span>`;
  }
  return `<span class="${cls}" style="background:${p.color};"></span>`;
}

/* ============================= IMAGES =============================
   The screensaver photo library's downscaler. Nothing full-size is ever kept:
   browser storage is small. */
function downscaleToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('That file isn\'t an image.'));
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read that file.'));
    reader.onload = ev=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('That image could not be loaded.'));
      img.onload = ()=>{
        try{
          const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const out = canvas.toDataURL('image/jpeg', quality);
          if(!out.startsWith('data:image/')) throw new Error('bad image data');
          resolve(out);
        }catch(err){ reject(new Error('Could not process that image.')); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================= WEATHER =============================
   Open-Meteo needs no key and no account, and sends CORS headers, so a static
   page can call it directly. The answer is cached on the device for half an
   hour — a screen that lives on a wall shouldn't re-ask every render. */
const WX_CACHE_KEY = 'fh-weather-cache';
const WX_TTL_MS = 30*60*1000;
let wxData = null;
let wxPending = null;

/* WMO weather codes, collapsed to the handful of buckets worth drawing. */
const WX_CODES = [
  [[0],        '☀️', 'Clear'],
  [[1,2],      '🌤️', 'Mostly sunny'],
  [[3],        '☁️', 'Cloudy'],
  [[45,48],    '🌫️', 'Fog'],
  [[51,53,55,56,57], '🌦️', 'Drizzle'],
  [[61,63,65,80,81,82], '🌧️', 'Rain'],
  [[66,67],    '🌧️', 'Freezing rain'],
  [[71,73,75,77,85,86], '❄️', 'Snow'],
  [[95,96,99], '⛈️', 'Thunderstorms']
];
function wxInfo(code){
  const hit = WX_CODES.find(([codes])=>codes.includes(code));
  return { icon: hit? hit[1] : '🌡️', label: hit? hit[2] : 'Weather' };
}
function wxUnit(){ return (state.weather && state.weather.unit === 'C') ? 'C' : 'F'; }
function wxDeg(v){ return (v===null || v===undefined || isNaN(v)) ? '--°' : Math.round(v)+'°'; }
function wxConfigured(){ return !!(state.weather && state.weather.lat !== null && state.weather.lon !== null); }

function wxReadCache(){
  try{
    const raw = localStorage.getItem(WX_CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    if(!c || !c.at || (Date.now() - c.at) > WX_TTL_MS) return null;
    if(c.lat !== state.weather.lat || c.lon !== state.weather.lon || c.unit !== wxUnit()) return null;
    return c.data;
  }catch(e){ return null; }
}
function wxWriteCache(data){
  try{
    localStorage.setItem(WX_CACHE_KEY, JSON.stringify({at:Date.now(), lat:state.weather.lat, lon:state.weather.lon, unit:wxUnit(), data}));
  }catch(e){ /* private mode — the in-memory copy still works for this session */ }
}

/* Turns a typed place name into coordinates. Nothing is stored but the numbers
   and the label, so the location never leaves the household's own devices. */
async function wxGeocode(query){
  const url = 'https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=' + encodeURIComponent(query);
  const res = await fetch(url);
  if(!res.ok) throw new Error('Could not look up that place right now.');
  const json = await res.json();
  const hit = json && json.results && json.results[0];
  if(!hit) throw new Error(`No place called "${query}" was found.`);
  const parts = [hit.name, hit.admin1, hit.country_code].filter(Boolean);
  return { lat: hit.latitude, lon: hit.longitude, label: parts.join(', ') };
}

async function loadWeather(force){
  if(!wxConfigured()) return null;
  if(!force){
    const cached = wxReadCache();
    if(cached){ wxData = cached; return cached; }
    if(wxData && wxData._at && (Date.now() - wxData._at) < WX_TTL_MS) return wxData;
  }
  if(wxPending) return wxPending;
  const unit = wxUnit() === 'C' ? 'celsius' : 'fahrenheit';
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${encodeURIComponent(state.weather.lat)}&longitude=${encodeURIComponent(state.weather.lon)}`
    + '&current=temperature_2m,weather_code,apparent_temperature'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min'
    + `&temperature_unit=${unit}&timezone=auto&forecast_days=5`;
  wxPending = (async ()=>{
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('Weather service said no (' + res.status + ').');
      const json = await res.json();
      json._at = Date.now();
      wxData = json;
      wxWriteCache(json);
      return json;
    }finally{ wxPending = null; }
  })();
  return wxPending;
}

/* Kicks a refresh and repaints whatever is on screen when it lands. Failures
   are quiet on purpose: a missing forecast must never take the board down. */
function refreshWeather(force){
  if(!wxConfigured()) return;
  loadWeather(force).then(()=>{
    if(activeTab === 'dashboard') render();
    const ss = document.getElementById('screensaver');
    if(ss && ss.style.display === 'flex') paintScreensaverWeather();
  }).catch(err=>console.warn('Weather unavailable:', err.message));
}

function weatherModal(){
  const w = state.weather;
  openModal(`
    <h3>Weather</h3>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:-4px;">Type a town, city or ZIP code. Forecasts come from Open-Meteo — no account, no key, and the location stays on your own devices.</p>
    <div class="field"><label>Place</label><input id="wxQuery" placeholder="Redmond, WA" value="${escapeHtml(w.label||'')}"></div>
    <div class="field"><label>Units</label>
      <select id="wxUnitSel">
        <option value="F" ${wxUnit()==='F'?'selected':''}>Fahrenheit (°F)</option>
        <option value="C" ${wxUnit()==='C'?'selected':''}>Celsius (°C)</option>
      </select>
    </div>
    <button class="btn btn-ghost" id="wxHere" style="width:100%; margin-bottom:8px;">📍 Use this device's location</button>
    <div class="modal-actions">
      ${wxConfigured()? '<button class="btn btn-danger" id="wxClear">Turn off</button>' : ''}
      <button class="btn btn-ghost" id="wxCancel">Cancel</button>
      <button class="btn btn-primary" id="wxSave">Save</button>
    </div>
  `);
  document.getElementById('wxCancel').onclick = closeModal;
  const clearBtn = document.getElementById('wxClear');
  if(clearBtn) clearBtn.onclick = ()=>{
    state.weather = { lat:null, lon:null, label:'', unit:wxUnit() };
    wxData = null;
    try{ localStorage.removeItem(WX_CACHE_KEY); }catch(e){}
    saveState(); closeModal(); render();
  };
  document.getElementById('wxHere').onclick = ()=>{
    if(!navigator.geolocation){ toast('This browser can\'t share a location.', 'error'); return; }
    toast('Asking this device where it is…');
    navigator.geolocation.getCurrentPosition(pos=>{
      state.weather.lat = Number(pos.coords.latitude.toFixed(3));
      state.weather.lon = Number(pos.coords.longitude.toFixed(3));
      state.weather.label = state.weather.label || 'Here';
      state.weather.unit = document.getElementById('wxUnitSel').value === 'C' ? 'C' : 'F';
      saveState(); closeModal(); refreshWeather(true); render();
      toast('Weather location set 📍', 'success');
    }, ()=>toast('This device wouldn\'t share its location.', 'error'), {timeout:10000});
  };
  document.getElementById('wxSave').onclick = async ()=>{
    const q = document.getElementById('wxQuery').value.trim();
    const unit = document.getElementById('wxUnitSel').value === 'C' ? 'C' : 'F';
    state.weather.unit = unit;
    if(!q){ saveState(); closeModal(); refreshWeather(true); render(); return; }
    const btn = document.getElementById('wxSave');
    btn.disabled = true; btn.textContent = 'Looking up…';
    try{
      const hit = await wxGeocode(q);
      state.weather.lat = hit.lat; state.weather.lon = hit.lon; state.weather.label = hit.label;
      await saveState();
      closeModal(); refreshWeather(true); render();
      toast(`Weather set to ${hit.label} 🌤️`, 'success');
    }catch(err){
      btn.disabled = false; btn.textContent = 'Save';
      toast(err.message, 'error');
    }
  };
}

/* ======================= SCREENSAVER PHOTO LIBRARY =======================
   Photos stay on the device that holds them. They are deliberately NOT part of
   the synced document: a handful of family pictures would dwarf everything
   else in the row and be pushed to every phone on every edit. Each screen
   keeps its own slideshow. */
const PHOTO_KEY = 'fh-photos';
const PHOTO_MAX_DIM = 1600;
const PHOTO_MAX_COUNT = 40;
let photoLib = null;

function photos(){
  if(photoLib) return photoLib;
  try{
    const raw = localStorage.getItem(PHOTO_KEY);
    photoLib = raw ? JSON.parse(raw) : [];
  }catch(e){ photoLib = []; }
  if(!Array.isArray(photoLib)) photoLib = [];
  return photoLib;
}
function savePhotos(){
  try{ localStorage.setItem(PHOTO_KEY, JSON.stringify(photoLib||[])); return true; }
  catch(e){
    toast('No room left for more photos on this device. Remove a few first.', 'error');
    return false;
  }
}
async function addPhotoFiles(fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return;
  const lib = photos();
  let added = 0;
  for(const f of files){
    if(lib.length + added >= PHOTO_MAX_COUNT){ toast(`Photo library is full (${PHOTO_MAX_COUNT} max).`, 'error'); break; }
    try{
      const dataUrl = await downscaleToDataUrl(f, PHOTO_MAX_DIM, 0.7);
      lib.push({id:uid(), dataUrl});
      added++;
    }catch(err){ toast(err.message, 'error'); }
  }
  if(!added) return;
  if(!savePhotos()){ lib.splice(lib.length-added, added); return; }
  toast(`${added} photo${added===1?'':'s'} added to this screen 🖼️`, 'success');
  render();
}
function removePhoto(id){
  photoLib = photos().filter(p=>p.id!==id);
  savePhotos(); render();
}

/* ============================= SCREENSAVER ============================= */
let idleTimer=null;
/* 0 means "never on its own" — sleep only when the 🌙 button is pressed. */
const SLEEP_OPTIONS = [
  {min:5,  label:'After 5 minutes'},
  {min:10, label:'After 10 minutes'},
  {min:15, label:'After 15 minutes'},
  {min:30, label:'After 30 minutes'},
  {min:60, label:'After 1 hour'},
  {min:0,  label:'Only when I press 🌙'}
];
function sleepAfterMin(){
  const v = state && state.sleepAfterMin;
  return SLEEP_OPTIONS.some(o=>o.min===v) ? v : 15;
}
function sleepLabel(min){
  const o = SLEEP_OPTIONS.find(x=>x.min===min);
  return o ? o.label : 'After 15 minutes';
}
function resetIdleTimer(){
  clearTimeout(idleTimer);
  const mins = sleepAfterMin();
  if(!mins) return;                 // manual-only: no timer at all
  idleTimer = setTimeout(enterScreensaver, mins * 60000);
}
function enterScreensaver(){
  const ss = document.getElementById('screensaver');
  ss.style.display='flex';
  tickClock();
  renderUpNext();
  paintScreensaverWeather();
  refreshWeather();
  startPhotoShow();
  ss._interval = setInterval(tickClock, 1000);
}
function exitScreensaver(){
  const ss = document.getElementById('screensaver');
  ss.style.display='none';
  clearInterval(ss._interval);
  stopPhotoShow();
  resetIdleTimer();
}

/* ---- Photo slideshow: two layers cross-fading, so nothing ever blinks ---- */
let photoTimer = null, photoIndex = 0, photoLayer = 0;
function photoShowOn(){ return !!(state.screensaver && state.screensaver.photos) && photos().length > 0; }
function startPhotoShow(){
  stopPhotoShow();
  const a = document.getElementById('ssPhotoA'), b = document.getElementById('ssPhotoB');
  const scrim = document.getElementById('ssScrim');
  const body = document.getElementById('ssBody');
  const on = photoShowOn();
  scrim.style.display = on ? 'block' : 'none';
  body.style.display = (on && state.screensaver.showClock === false) ? 'none' : 'flex';
  a.classList.remove('on'); b.classList.remove('on');
  if(!on){ a.style.backgroundImage=''; b.style.backgroundImage=''; return; }
  photoIndex = Math.floor(Math.random() * photos().length);
  photoLayer = 0;
  showPhoto();
  const secs = Math.max(5, Number(state.screensaver.seconds) || 15);
  photoTimer = setInterval(()=>{ photoIndex = (photoIndex + 1) % photos().length; showPhoto(); }, secs*1000);
}
function showPhoto(){
  const lib = photos();
  if(!lib.length) return;
  const a = document.getElementById('ssPhotoA'), b = document.getElementById('ssPhotoB');
  const next = photoLayer === 0 ? a : b, prev = photoLayer === 0 ? b : a;
  next.style.backgroundImage = `url("${lib[photoIndex].dataUrl}")`;
  next.classList.add('on');
  prev.classList.remove('on');
  photoLayer = photoLayer === 0 ? 1 : 0;
}
function stopPhotoShow(){ clearInterval(photoTimer); photoTimer = null; }

function paintScreensaverWeather(){
  const el = document.getElementById('ssWeather');
  if(!el) return;
  const cur = wxData && wxData.current;
  if(!wxConfigured() || !cur){ el.textContent = ''; return; }

  el.textContent = `${info.icon} ${wxDeg(cur.temperature_2m)}${wxUnit()} · ${info.label}${state.weather.label? ' · '+state.weather.label : ''}`;

/* ============================= HELPERS ============================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Toasts: every failure and every success surfaces here, never silently ---- */
let toastTimer=null;
function toast(msg, type){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1500;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:90%;text-align:center;';
    document.body.appendChild(el);
  }
  const colors = { error:['#fdecea','#b71c1c'], success:['#e7f6e9','#1b5e20'], info:['#2E3A46','#fff'] };
  const [bg,fg] = colors[type] || colors.info;
  el.style.background = bg; el.style.color = fg;
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; }, type==='error'?5000:2600);
}

/* ---- Catch-all: any uncaught error or rejected promise anywhere in the app
   is caught here, shown to the user, and does NOT crash the interface. ---- */
window.addEventListener('error', (e)=>{
  console.error('Caught error:', e.error || e.message);
  toast('Something went wrong, but the app is still running. Try again.', 'error');
  /* Logged as well as shown. A fault nobody reports is a fault nobody fixes,
     and the person who hits it is usually busy doing something else. */
  try{ dailyLog.event('error', (e.error && e.error.message) || e.message,
       { source: e.filename ? String(e.filename).split('/').pop() : '', line: e.lineno || 0 }); }
  catch(_){ /* logging must never be the thing that breaks the page */ }
});
window.addEventListener('unhandledrejection', (e)=>{
  console.error('Unhandled promise rejection:', e.reason);
  const msg = (e.reason && e.reason.message) ? e.reason.message : 'An action didn\'t finish.';
  toast(msg.length < 90 ? msg : 'An action didn\'t finish — please try again.', 'error');
  try{ dailyLog.event('error', msg, { kind: 'unhandled-rejection' }); }
  catch(_){ /* never let logging break the page */ }
  e.preventDefault();
});

let activeTab = 'dashboard';
document.getElementById('tabNav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  activeTab = btn.dataset.tab;
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

/* Jumps used by the dashboard's "see all" links and the header gear, so a
   widget can hand off to the tab that actually owns the data. Settings has no
   tab button, so every button simply deactivates when it's showing. */
function gotoTab(tab){
  if(tab === 'groceries'){ mealSubTab = 'grocery'; tab = 'meals'; }
  activeTab = tab;
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
}
document.getElementById('settingsBtn').addEventListener('click', ()=>gotoTab('settings'));

function render(){
  const main = document.getElementById('mainContent');
  try{
    /* Each view builds its own HTML, then the refresh bar is prepended ONCE
       below. Assigning innerHTML per branch is what would let a tab added
       later ship without a Refresh button; this way it cannot. */
    let view;
    if(activeTab==='dashboard') view = renderDashboard();
    else if(activeTab==='calendar') view = renderCalendar();
    else if(activeTab==='housekeeping') view = renderHousekeeping();
    else if(activeTab==='todos') view = renderTodos();
    else if(activeTab==='habits') view = renderHabits();
    else if(activeTab==='rewards') view = renderRewards();
    else if(activeTab==='meals') view = renderMeals();
    else if(activeTab==='settings') view = renderSettings();
    else { activeTab='dashboard'; view = renderDashboard(); } // catch-all for any unknown view
    main.innerHTML = refreshBarHtml() + view;
    attachHandlers();
    updateAccountButton();   // a renamed person or new avatar shows in the header too
  }catch(err){
    console.error('Render failed:', err);
    main.innerHTML = `<div class="card"><div class="empty">
        <div class="display">This screen hit a snag</div>
        <p>The rest of the app is fine. You can go back to the calendar and keep going.</p>
        <button class="btn btn-primary" id="recoverBtn">Back to calendar</button>
      </div></div>`;
    const rb = document.getElementById('recoverBtn');
    if(rb) rb.onclick = ()=>{ activeTab='calendar'; document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='calendar')); render(); };
    toast('That screen had a problem and was recovered.', 'error');
  }
}

  /* When a second zone is on, a live strip anchors the whole view — month cells
     are too narrow for two times, so the strip plus the chip tooltips carry it
     there, while week and day print both inline. */
  const tz = tzSettings();
  const zoneStrip = tz.enabled ? `
    <div class="tz-strip">
      <span class="tz-one"><span class="tz-name">${escapeHtml(tzLabel(tz.primary, tz.primaryLabel))}</span>
        <span class="tz-now" id="tzNowPrimary">${fmtNowInZone(tz.primary)}</span></span>
      <span class="tz-sep">↔</span>
      <span class="tz-one"><span class="tz-name">${escapeHtml(tzLabel(tz.secondary, tz.secondaryLabel))}</span>
        <span class="tz-now" id="tzNowSecondary">${fmtNowInZone(tz.secondary)}</span></span>
      <span class="tz-hint">${state.calView==='month' ? 'Hover an event for both zones' : 'Event times show both zones'}</span>
    </div>` : '';

  const monthStrip = isMonth ? renderMonthStrip(d) : '';

  return `
    <div class="card calendar-card ${isMonth?'month-view':''}">
      <div class="section-title">
        <h2>Calendar</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" id="syncBtn">🔄 Sync</button>
          <button class="btn btn-mustard" id="addEventBtn">+ Add event</button>
        </div>
      </div>
      ${connectedNote}
      ${zoneStrip}
      <div class="people-row">${filterChips}</div>
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn btn-ghost" id="calPrev">◀</button>
          <strong class="display" style="font-size:17px;">${label}</strong>
          <button class="btn btn-ghost" id="calNext">▶</button>
          <button class="btn btn-ghost" id="calToday">Today</button>
        </div>
        <div class="view-toggle">${viewBtns}</div>
      </div>
      ${monthStrip}
      ${body}
    </div>
  `;
}
function renderMonthStrip(d){
  const months = [];
  for(let offset=-2; offset<=3; offset++){
    const cur = new Date(d.getFullYear(), d.getMonth()+offset, 1);
    months.push(cur);
  }
  let lastYear = null;
  return `<div class="month-strip" aria-label="Choose month">${months.map(cur=>{
    const year = cur.getFullYear();
    const yearLabel = year !== lastYear ? `<span class="month-jump-year">${year}</span>` : '';
    lastYear = year;
    const selected = cur.getMonth()===d.getMonth() && year===d.getFullYear();
    return `${yearLabel}<button class="month-jump ${selected?'active':''}" data-monthjump="${fmtDate(cur)}">${MONTHS[cur.getMonth()].slice(0,3)}</button>`;
  }).join('')}</div>`;
}
function startOfWeek(d){ const r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r; }
function visibleEvents(dateStr){
  const evs = state.events.filter(e=>e.date===dateStr);
  return evs.filter(e=>eventMatchesFilter(e, calFilterIds()));
}

function renderMonthGrid(d){
  const year=d.getFullYear(), month=d.getMonth();
  const first = new Date(year, month, 1);
  const gridStart = startOfWeek(first);
  const cap = monthChipCap();
  let cells='';
  DOW.forEach(w=>cells+=`<div class="dow">${w}</div>`);
  /* Six rows only when the month actually needs them — otherwise the grid ends
     with a dead week of greyed-out cells. */
  const weeks = monthWeekCount(first);
  for(let i=0;i<weeks*7;i++){
    const cur = new Date(gridStart); cur.setDate(gridStart.getDate()+i);
    const ds = fmtDate(cur);
    const inMonth = cur.getMonth()===month;
    const isToday = ds===todayStr();
    const dayEvents = visibleEvents(ds).sort(byStartTime);
    /* Keep one slot for the "+N more" line rather than hiding a single event behind it. */
    const shownCount = dayEvents.length > cap ? cap-1 : dayEvents.length;
    const chips = dayEvents.slice(0, shownCount).map(e=>monthChipHtml(e)).join('');
    const hidden = dayEvents.length - shownCount;
    const more = hidden > 0 ? `<div class="day-more">+${hidden} more</div>` : '';
    cells += `<div class="day-cell ${inMonth?'':'other-month'} ${isToday?'today':''}" data-daycell="${ds}">
        <span class="day-num">${cur.getDate()}</span>
        <div class="day-events">${chips}${more}</div>
      </div>`;
  }
  return `<div class="month-grid">${cells}</div>`;
}
function byStartTime(a,b){
  /* All-day events sit above timed ones, the way Google stacks them. */
  if(!a.time && b.time) return -1;
  if(a.time && !b.time) return 1;
  return (a.time||'').localeCompare(b.time||'') || a.title.localeCompare(b.title);
}function monthWeekCount(firstOfMonth){
  const lead = firstOfMonth.getDay();
  const days = new Date(firstOfMonth.getFullYear(), firstOfMonth.getMonth()+1, 0).getDate();
  return Math.ceil((lead + days) / 7);
}
/* How many chips fit before the cell needs a "+N more" — recalculated on resize. */
function monthChipCap(){
  return window.innerWidth < 640 ? 5 : 6;
}
/* Rotating a tablet changes how many chips fit, so re-render — but only when the
   cap actually crosses a breakpoint, not on every resize tick. */
let lastChipCap = monthChipCap();
let chipCapTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(chipCapTimer);
  chipCapTimer = setTimeout(()=>{
    const cap = monthChipCap();
    if(cap === lastChipCap) return;
    lastChipCap = cap;
    if(activeTab==='calendar' && state.calView==='month') render();
  }, 200);
});
/* How much of a title the month grid shows before cutting it. The month view is
   an at-a-glance view: a long title pushes the cell taller, squeezes out the
   events below it, and is unreadable at that size anyway. The full title is
   always one tap away and is in the hover tooltip. */
const MONTH_CHIP_TITLE_MAX = 25;

/* Cuts at the limit and appends a real ellipsis character, so the chip is never
   wider than the budget. Shortens on the RAW title, before escaping -- trimming
   escaped HTML can slice an entity like &amp; in half and render as garbage. */
function monthChipTitle(title){
  const t = String(title || '');
  return t.length > MONTH_CHIP_TITLE_MAX ? t.slice(0, MONTH_CHIP_TITLE_MAX) + '…' : t;
}

function monthChipHtml(e){
  const color = eventColor(e);
  const text = eventTextColor(e);
  const label = escapeHtml(monthChipTitle(e.title));
  /* The cells are too narrow for badges, so who/when/repeating all live in the
     hover tooltip — the chip itself stays as readable as Google's. The tooltip
     deliberately keeps the FULL title, so shortening never loses information. */
  const tip = escapeHtml(
    (e.time ? fmtEventTime(e, {withLabels:true})+' · ' : 'All day · ')+e.title+' · '+eventPeopleLabel(e)+(e.seriesId ? ' · '+seriesLabel(e) : '')
  );
  if(!e.time){
    return `<div class="month-chip allday" style="background:${color}; color:${text};" data-editevent="${e.id}" title="${tip}">
      <span class="chip-title">${label}</span></div>`;
  }
  return `<div class="month-chip timed" style="--chip-color:${color}; --chip-text:${text};" data-editevent="${e.id}" title="${tip}">
    <span class="chip-dot" style="background:${color};"></span>
    <span class="chip-time">${fmtEventStart(e)}</span>
    <span class="chip-title">${label}</span></div>`;
}
/* The week as an hour grid: times run down the left, one column per day across
   the top -- the same shape as Google Calendar's week view, and the same shape
   renderDayColumns() already uses, so the two views read alike and share the
   dg-* styles rather than each inventing their own.

   The previous version stamped the time onto every pill ("9:00 AM · Soccer")
   and stacked them in a plain list. That repeated the time on every row and
   still never told you how far apart two events were. Putting the hour on the
   axis says it once and makes the gap visible.

   One shared hour window across all seven days, computed from the events
   actually in the week, so a 6am Tuesday and a 10pm Friday both have a row and
   every day's 9am sits on the same line. Rows are one hour tall: positioning
   by the minute needs collision handling for overlapping events, which is a
   different and much larger job than this.

   DEPENDS ON  visibleEvents(dateStr)  the calendar filter
               eventColor/eventTextColor, fmtEventTime, use24h
               .dg-* grid styles, shared with the day view */
function renderWeekGrid(d){
  const start = startOfWeek(d);
  const days = [];
  for(let i = 0; i < 7; i++){
    const cur = new Date(start); cur.setDate(start.getDate() + i);
    const ds = fmtDate(cur);
    days.push({ date: cur, ds, events: visibleEvents(ds) });
  }

  /* A waking day by default, stretched to cover anything outside it. Without
     the stretch an early or late event would simply have no row to sit in. */
  let startH = 7, endH = 21;
  days.forEach(day=>day.events.forEach(e=>{
    if(!e.time) return;                       // all-day events get their own row
    const h = parseInt(e.time.slice(0, 2), 10);
    if(!isNaN(h)){ startH = Math.min(startH, h); endH = Math.max(endH, h); }
  }));

  const hourLabel = h => use24h()
    ? String(h).padStart(2, '0') + ':00'
    : `${h % 12 === 0 ? 12 : h % 12} ${h < 12 ? 'AM' : 'PM'}`;

  /* No time on the pill any more -- the row it sits in is the time. The exact
     start and end stay in the tooltip for anything finer than the hour. */
  const pill = e => `<div class="dg-pill" style="background:${eventColor(e)}; color:${eventTextColor(e)};"
      data-editevent="${e.id}"
      title="${escapeHtml((e.time ? fmtEventTime(e, {withLabels:true}) + ' · ' : 'All day · ') + e.title + ' · ' + eventPeopleLabel(e))}"><span class="dg-title">${escapeHtml(e.title)}</span></div>`;

  const today = todayStr();
  const nowH = new Date().getHours();

  let cells = `<div class="dg-corner dg-head"></div>` + days.map(day=>`
    <div class="dg-head${day.ds === today ? ' is-now' : ''}" data-daycell="${day.ds}">
      ${DOW[day.date.getDay()]}<br><span class="mono" style="font-weight:400;">${day.date.getDate()}</span>
    </div>`).join('');

  /* All-day events can't belong to an hour, so they get one row above the
     grid rather than being dropped or forced into the first hour. */
  const anyAllDay = days.some(day=>day.events.some(e=>!e.time));
  if(anyAllDay){
    cells += `<div class="dg-hour dg-allday-label">All day</div>` + days.map(day=>`
      <div class="dg-cell dg-allday" data-daycell="${day.ds}">${day.events.filter(e=>!e.time).map(pill).join('')}</div>`).join('');
  }

  for(let h = startH; h <= endH; h++){
    cells += `<div class="dg-hour">${hourLabel(h)}</div>` + days.map(day=>{
      /* Highlighting the current hour only on today's column: the same hour on
         Friday is not "now", and shading the whole row would say it is. */
      const isNow = day.ds === today && h === nowH;
      const inHour = day.events
        .filter(e=>e.time && parseInt(e.time.slice(0, 2), 10) === h)
        .sort((a, b)=>(a.time || '').localeCompare(b.time || ''));
      return `<div class="dg-cell${isNow ? ' is-now' : ''}" data-daycell="${day.ds}">${inHour.map(pill).join('')}</div>`;
    }).join('');
  }

  return `<div class="day-grid-wrap">
      <div class="day-grid" style="grid-template-columns:70px repeat(7, minmax(110px, 1fr));">${cells}</div>
    </div>`;
}

/* The day view is one grid: hours down the side, one column per calendar across
   the top. Building it as a single CSS grid rather than independent columns is
   what keeps every person's 9am on the same line. */
function renderDayColumns(d){
  const ds = fmtDate(d);
  const dayEvents = state.events.filter(e=>e.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const selected = calFilterIds();
  const visible = dayEvents.filter(e=>eventMatchesFilter(e, selected));
  const people = selected.length ? state.people.filter(p=>selected.includes(p.id)) : state.people;

  /* One hour window shared by every column, so the rows line up. Defaults to a
     waking day and stretches to cover anything outside it. */
  let startH = 7, endH = 21;
  visible.filter(e=>e.time).forEach(e=>{
    const h = parseInt(e.time.slice(0,2), 10);
    if(!isNaN(h)){ startH = Math.min(startH, h); endH = Math.max(endH, h); }
  });
  const isToday = ds === todayStr();
  const nowH = new Date().getHours();
  const hourLabel = h => {
    if(use24h()) return String(h).padStart(2,'0')+':00';
    return `${h % 12 === 0 ? 12 : h % 12} ${h < 12 ? 'AM' : 'PM'}`;
  };

  /* Always the family first, then each person, so the columns don't shuffle
     about as you page from a day with shared events to one without. */
  const columns = [
    ...(selected.length ? [] : [{ key:'family', label:familyLabel(), dot:'var(--family)', match:isFamilyEvent }]),
    ...people.map(p=>({ key:p.id, label:p.name, avatar:p, match:e=>eventPersonIds(e).includes(p.id) }))
  ];

  /* No time inside the pill: the hour down the left side IS the time, same as
     the week view. Printing it again on its own line made every pill two lines
     tall for no new information. The exact start and end stay in the tooltip,
     and in the editor one tap away. */
  const pill = e=>`<div class="dg-pill" data-editevent="${e.id}"
      style="background:${eventColor(e)}; color:${eventTextColor(e)};"
      title="${escapeHtml((e.time ? fmtEventTime(e, {withLabels:true}) + ' · ' : 'All day · ') + e.title + ' · ' + eventPeopleLabel(e))}">
      <span class="dg-title">${escapeHtml(e.title)}</span>
    </div>`;

  let cells = `<div class="dg-corner"></div>` + columns.map(c=>`
    <div class="dg-head">${c.avatar ? avatarHtml(c.avatar,'sm') : `<span class="dot" style="background:${c.dot};"></span>`}${escapeHtml(c.label)}</div>`).join('');

  /* All-day band sits above the hours, same as every calendar app. */
  const allDay = visible.filter(e=>!e.time);
  if(allDay.length){
    cells += `<div class="dg-hour dg-allday-label">All day</div>` + columns.map(c=>`
      <div class="dg-cell dg-allday">${allDay.filter(c.match).map(pill).join('')}</div>`).join('');
  }

  for(let h = startH; h <= endH; h++){
    const nowCls = isToday && h===nowH ? 'is-now' : '';
    const inHour = visible.filter(e=>e.time && parseInt(e.time.slice(0,2),10) === h);
    cells += `<div class="dg-hour ${nowCls}">${hourLabel(h)}</div>` + columns.map(c=>`
      <div class="dg-cell ${nowCls}">${inHour.filter(c.match).map(pill).join('')}</div>`).join('');
  }

  const template = `70px repeat(${columns.length}, minmax(150px, 1fr))`;
  return `<div class="day-grid-wrap">
      <div class="day-grid" style="grid-template-columns:${template};">${cells}</div>
    </div>`;
}

function connectedCalServices(){
  const s = [];
  if(googleSync.isConnected()) s.push({key:'google', label:'Google Calendar', idField:'googleId', seriesField:'seriesGoogleId', api:googleSync});
  if(outlookSync.isConnected()) s.push({key:'outlook', label:'Outlook', idField:'graphId', seriesField:'seriesGraphId', api:outlookSync});
  return s;
}

function eventModal(existing, presetDate){
  const isEdit = !!existing;
  /* New events start on the family calendar, which is the safe catch-all. */
  const ev = existing || {id:null, personIds: [], date: presetDate || todayStr(), time:'', title:''};
  const inSeries = isEdit && !!ev.seriesId;
  const services = connectedCalServices();
  const serviceChecks = services.map(s=>{
    const linked = !!(ev[s.idField] || ev[s.seriesField]);
    const checked = isEdit ? linked : true; // new events sync out by default; edits reflect current link
    return `<div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="svc_${s.key}" style="width:18px;height:18px;" ${checked?'checked':''}>
      <label style="margin:0;">Sync with ${s.label}</label></div>`;
  }).join('');

  /* New events can start a series; existing ones can only be edited in scope.
     Changing a rule after the fact is deliberately not supported — delete the
     series and add it again, which keeps the provider copy in step. */
  const repeatBlock = isEdit ? '' : `
    <div class="field"><label>Repeats</label>
      <select id="evRepeat">
        <option value="none">Does not repeat</option>
        ${Object.entries(RECUR_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select>
    </div>
    <div class="field" id="evRepeatEndWrap" style="display:none;">
      <label>Ends</label>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <select id="evRepeatEndType" style="width:auto;">
          <option value="count">After</option>
          <option value="until">On date</option>
        </select>
        <input type="number" id="evRepeatCount" min="2" max="${RECUR_MAX}" value="12" style="width:90px;">
        <span id="evRepeatCountLabel" style="font-size:13px; color:var(--ink-soft);">times</span>
        <input type="date" id="evRepeatUntil" style="display:none; width:auto;">
      </div>
    </div>`;

  const seriesBlock = inSeries ? `
    <div style="background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:12.5px;">
      🔁 Part of a repeating series — ${escapeHtml(seriesLabel(ev))}
    </div>
    <div class="field"><label>Apply to</label>
      <select id="evScope">
        <option value="one">This event only</option>
        <option value="all">All events in the series</option>
      </select>
    </div>` : '';

  openModal(`
    <h3>${isEdit?'Edit event':'Add event'}</h3>
    ${seriesBlock}
    <div class="field"><label>Who's this for?</label>
      <div class="who-picker">
        <label class="who-opt who-family">
          <input type="checkbox" id="whoFamily" ${isFamilyEvent(ev)?'checked':''}>
          <span class="dot" style="background:var(--family);"></span>
          <span>${escapeHtml(familyLabel())} — everyone</span>
        </label>
        ${state.people.map(p=>`
          <label class="who-opt">
            <input type="checkbox" class="who-person" value="${p.id}" ${eventPersonIds(ev).includes(p.id)?'checked':''}>
            ${avatarHtml(p,'sm')}<span>${escapeHtml(p.name)}</span>
          </label>`).join('')}
      </div>
      <div id="whoHint" style="font-size:12px; color:var(--ink-soft); margin-top:5px;"></div>
    </div>
    <div class="field"><label>Title</label><input id="evTitle" value="${escapeHtml(ev.title)}" placeholder="Soccer practice"></div>
    <div class="field"><label>Date</label><input type="date" id="evDate" value="${ev.date}">
      ${inSeries?`<div id="evDateNote" style="display:none; font-size:12px; color:var(--ink-soft); margin-top:4px;">Each event keeps its own date when you edit the whole series.</div>`:''}</div>
    <div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="evAllDay" style="width:18px;height:18px;" ${!ev.time?'checked':''}>
      <label style="margin:0;">All day</label>
    </div>
    <div class="field" id="evTimeWrap" style="${!ev.time?'display:none;':''}">
      <label>Start and end</label>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <input type="time" id="evTime" value="${ev.time||''}" style="width:auto;">
        <span style="color:var(--ink-soft);">to</span>
        <input type="time" id="evEndTime" value="${ev.endTime||''}" style="width:auto;">
      </div>
      <div id="evTimeNote" style="font-size:12px; color:var(--ink-soft); margin-top:4px;"></div>
    </div>
    ${repeatBlock}
    ${serviceChecks}
    <div class="modal-actions">
      ${isEdit ? '<button class="btn btn-danger" id="evDelete">Delete</button>' : ''}
      <button class="btn btn-ghost" id="evCancel">Cancel</button>
      <button class="btn btn-primary" id="evSave">Save</button>
    </div>
  `);
  document.getElementById('evCancel').onclick = closeModal;

  /* All-day and a timed range are mutually exclusive. Picking a start with no
     end quietly suggests an hour later, which is what most events turn out to be. */
  const allDay = document.getElementById('evAllDay');
  const startEl = document.getElementById('evTime');
  const endEl = document.getElementById('evEndTime');
  const timeNote = document.getElementById('evTimeNote');
  const syncTimeUi = ()=>{
    document.getElementById('evTimeWrap').style.display = allDay.checked ? 'none' : '';
    if(allDay.checked){ timeNote.textContent = ''; return; }
    if(!startEl.value){ timeNote.textContent = 'Pick a start time, or tick All day.'; return; }
    timeNote.textContent = (endEl.value && endEl.value < startEl.value)
      ? 'Ends before it starts — treated as running past midnight.'
      : '';
  };
  allDay.onchange = ()=>{
    if(allDay.checked){ startEl.value = ''; endEl.value = ''; }
    else if(!startEl.value){
      const now = new Date();
      startEl.value = String(now.getHours()).padStart(2,'0')+':00';
      endEl.value = String((now.getHours()+1)%24).padStart(2,'0')+':00';
    }
    syncTimeUi();
  };
  startEl.onchange = ()=>{
    if(startEl.value && !endEl.value){
      const [h,m] = startEl.value.split(':').map(Number);
      endEl.value = String((h+1)%24).padStart(2,'0')+':'+String(m).padStart(2,'0');
    }
    syncTimeUi();
  };
  endEl.onchange = syncTimeUi;
  syncTimeUi();

  /* Family and individuals are mutually exclusive: picking people clears the
     family box, and ticking family clears the people. */
  const whoFamily = document.getElementById('whoFamily');
  const whoPeople = [...document.querySelectorAll('.who-person')];
  const whoHint = document.getElementById('whoHint');
  const syncWhoUi = ()=>{
    const picked = whoPeople.filter(c=>c.checked).map(c=>c.value);
    whoHint.textContent = whoFamily.checked
      ? `Shows for everyone, on every person's view.`
      : (picked.length
          ? `Shows for ${picked.map(id=>personById(id).name).join(' and ')}.`
          : `Nothing picked — this will be saved to ${familyLabel()}.`);
  };
  whoFamily.onchange = ()=>{
    if(whoFamily.checked) whoPeople.forEach(c=>c.checked = false);
    syncWhoUi();
  };
  whoPeople.forEach(c=>c.onchange = ()=>{
    if(c.checked) whoFamily.checked = false;
    syncWhoUi();
  });
  syncWhoUi();
  const readWho = ()=>whoFamily.checked ? [] : whoPeople.filter(c=>c.checked).map(c=>c.value);

  if(!isEdit){
    const repeatSel = document.getElementById('evRepeat');
    const endWrap = document.getElementById('evRepeatEndWrap');
    const endType = document.getElementById('evRepeatEndType');
    const syncRepeatUi = ()=>{
      endWrap.style.display = repeatSel.value==='none' ? 'none' : '';
      const byCount = endType.value==='count';
      document.getElementById('evRepeatCount').style.display = byCount ? '' : 'none';
      document.getElementById('evRepeatCountLabel').style.display = byCount ? '' : 'none';
      document.getElementById('evRepeatUntil').style.display = byCount ? 'none' : '';
    };
    repeatSel.onchange = syncRepeatUi;
    endType.onchange = syncRepeatUi;
    syncRepeatUi();
  }
  if(inSeries){
    const scopeSel = document.getElementById('evScope');
    scopeSel.onchange = ()=>{
      const all = scopeSel.value==='all';
      document.getElementById('evDate').disabled = all;
      document.getElementById('evDateNote').style.display = all ? '' : 'none';
    };
  }

  const readRecurrence = ()=>{
    const sel = document.getElementById('evRepeat');
    const freq = sel ? sel.value : 'none';
    if(freq==='none') return {freq:'none'};
    if(document.getElementById('evRepeatEndType').value==='until'){
      return {freq, until: document.getElementById('evRepeatUntil').value};
    }
    const n = parseInt(document.getElementById('evRepeatCount').value, 10);
    return {freq, count: Math.max(2, Math.min(RECUR_MAX, isNaN(n) ? 12 : n))};
  };
  const scopeValue = ()=>{
    const sel = document.getElementById('evScope');
    return sel ? sel.value : 'one';
  };

  if(isEdit) document.getElementById('evDelete').onclick = async ()=>{
    const wholeSeries = inSeries && scopeValue()==='all';
    const errs = [];
    if(wholeSeries){
      const members = seriesMembers(ev.seriesId);
      /* DELIBERATELY DOES NOT DELETE THE SERIES FROM THE CONNECTED CALENDAR.
         This was the most dangerous call in the app: one tap removed an entire
         recurring series from the shared household calendar, for every person
         it is shared with, with no undo. Family Hub drops its own copies and
         leaves the provider alone. */
      const linkedSeries = services.filter(s=>ev[s.seriesField] || members.some(m=>m[s.idField])).map(s=>s.label);
      state.events = state.events.filter(e=>e.seriesId!==ev.seriesId);
      await saveState(); closeModal(); render();
      if(linkedSeries.length) toast(`Series removed from Family Hub (${members.length} events). It's still in ${linkedSeries.join(' & ')} and will come back on the next sync — delete it there to remove it for good.`, 'success');
      else toast(`Series deleted (${members.length} events).`, 'success');
      return;
    }
    /* DELIBERATELY DOES NOT DELETE FROM THE CONNECTED CALENDAR.
       The household shares ONE Google calendar, so a delete here would remove
       the event from everybody's calendar, not just this board. Worse, two
       duplicate rows carry the SAME googleId, so deleting either copy would
       destroy the one real event behind both. Family Hub removes it from its
       own board only. See the matching note on the series branch above. */
    const linked = services.filter(s=>ev[s.idField]).map(s=>s.label);
    state.events = state.events.filter(e=>e.id!==ev.id);
    await saveState(); closeModal(); render();
    if(linked.length) toast(`Removed from Family Hub. It's still in ${linked.join(' & ')} and will come back on the next sync — delete it there to remove it for good.`, 'success');
    else toast('Event deleted.', 'success');
  };

  document.getElementById('evSave').onclick = async ()=>{
    const title = document.getElementById('evTitle').value.trim();
    if(!title){ toast('Give the event a title.', 'error'); return; }
    const personIds = readWho();
    const date = document.getElementById('evDate').value;
    const time = allDay.checked ? '' : document.getElementById('evTime').value;
    const endTime = (allDay.checked || !time) ? '' : document.getElementById('evEndTime').value;

    /* ---- Edit applied to the whole series ---- */
    if(inSeries && scopeValue()==='all'){
      const members = seriesMembers(ev.seriesId);
      members.forEach(m=>{ m.title = title; m.personIds = personIds.slice(); m.time = time; m.endTime = endTime; });
      const errs = [];
      for(const s of services){
        const masterId = ev[s.seriesField];
        if(!masterId) continue;
        try{ await s.api.updateSeries(masterId, members[0]); }catch(e){ errs.push(s.label); }
      }
      await saveState(); closeModal(); render();
      if(errs.length) toast('Series updated here, but sync failed for '+errs.join(' & ')+'.', 'error');
      else toast(`Series updated (${members.length} events).`, 'success');
      return;
    }

    /* ---- New event that starts a series ---- */
    if(!isEdit){
      const rec = readRecurrence();
      const dates = expandRecurrence(date, rec);
      if(dates.length > 1){
        const seriesId = uid();
        const rule = {freq: rec.freq, count: dates.length};
        const instances = dates.map((d, i)=>({
          id: uid(), personIds: personIds.slice(), title, date: d, time, endTime,
          source: undefined, seriesId, seriesRule: rule, seriesIndex: i
        }));
        const errs = [];
        for(const s of services){
          const box = document.getElementById('svc_'+s.key);
          if(!(box && box.checked)) continue;
          try{
            const masterId = await s.api.pushSeries(instances[0], rec.freq, dates.length);
            instances.forEach(x=>{ x[s.seriesField] = masterId; if(!x.source) x.source = s.key; });
          }catch(e){ errs.push(s.label); }
        }
        state.events.push(...instances);
        await saveState(); closeModal(); render();
        if(errs.length) toast(`Added ${dates.length} events here, but calendar sync failed for `+errs.join(' & ')+'.', 'error');
        else toast(`Added ${dates.length} events — ${RECUR_LABELS[rec.freq].toLowerCase()}.`, 'success');
        return;
      }
    }

    /* ---- Single event (or one instance of a series) ---- */
    const data = {
      id: ev.id || uid(),
      personIds, title, date, time, endTime,
      source: ev.source,
      googleId: ev.googleId,
      graphId: ev.graphId,
      seriesId: ev.seriesId,
      seriesRule: ev.seriesRule,
      seriesIndex: ev.seriesIndex,
      seriesGoogleId: ev.seriesGoogleId,
      seriesGraphId: ev.seriesGraphId
    };
    const errs = [];
    for(const s of services){
      const box = document.getElementById('svc_'+s.key);
      const want = box && box.checked;
      const hasId = !!data[s.idField];
      try{
        if(want && !hasId){ data[s.idField] = await s.api.push(data); if(!data.source) data.source = s.key; }
        else if(want && hasId){ await s.api.update(data); }
        else if(!want && hasId){
          /* Unticking means "stop syncing this one", NOT "delete it from the
             shared calendar" -- it used to mean the second, which made an
             unticked checkbox a destructive act on a calendar the whole
             household shares. Forget the link and leave the provider's copy
             alone. The next pull will re-import it as a fresh event, which is
             the honest outcome: the event does still exist over there. */
          data[s.idField] = undefined;
          data[s.seriesField] = undefined;
        }
      }catch(e){ errs.push(s.label); }
    }
    if(isEdit){ const idx = state.events.findIndex(e=>e.id===ev.id); state.events[idx]=data; }
    else state.events.push(data);
    await saveState(); closeModal(); render();
    if(errs.length) toast('Saved here, but calendar sync failed for '+errs.join(' & ')+'. Reconnect and retry.', 'error');
  };
}

/* ============================= HABIT TRACKER =============================
   A month grid of habits: daily habits get one checkbox per day (grouped into
   colour-tinted weeks), weekly habits get one checkbox per week. Completion is
   stored in a flat `log` map keyed `habitId|date`, so adding or removing a habit
   never has to rewrite history. */
function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function parseMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1); }

/* Days of the month split into Sunday-start weeks, matching the calendar tab. */
function habitWeeks(ym){
  const first = parseMonth(ym);
  const total = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const weeks = [];
  let cur = [];
  for(let i=1; i<=total; i++){
    const d = new Date(first.getFullYear(), first.getMonth(), i);
    if(d.getDay()===0 && cur.length){ weeks.push(cur); cur = []; }
    cur.push(d);
  }
  if(cur.length) weeks.push(cur);
  return weeks.map((days, i)=>({ label:'Week '+(i+1), days, tint:'habit-wk'+(i%6) }));
}
function habitLogKey(habit, d){
  /* Weekly habits collapse to their week's start date so any day in that week
     toggles the same box. */
  const anchor = habit.type==='weekly' ? startOfWeek(d) : d;
  return habit.id+'|'+fmtDate(anchor);
}
function habitDone(habit, d){ return !!state.habits.log[habitLogKey(habit, d)]; }
function habitsFor(personId, type){
  return state.habits.items.filter(h=>h.personId===personId && h.type===type);
}
function habitPerson(){
  return personById(state.habitPersonId) || state.people[0];
}

/* Share of that day's daily habits that are ticked — the productivity series. */
function habitDayPct(dailyHabits, d){
  if(!dailyHabits.length) return 0;
  const done = dailyHabits.filter(h=>habitDone(h, d)).length;
  return Math.round((done / dailyHabits.length) * 100);
}
function habitStreak(dailyHabits){
  if(!dailyHabits.length) return 0;
  let streak = 0;
  const d = new Date();
  /* A day only counts once it's complete; today not being done yet shouldn't
     wipe out a streak, so start from yesterday when today is incomplete. */
  if(habitDayPct(dailyHabits, d) < 100) d.setDate(d.getDate()-1);
  for(let i=0; i<400; i++){
    if(habitDayPct(dailyHabits, d) < 100) break;
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

/* Inline SVG area chart — no library, scales with the card. */
function habitChart(dailyHabits, days){
  const W = 720, H = 130, padL = 30, padR = 8, padT = 10, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const today = todayStr();
  const scored = days.filter(d=>fmtDate(d) <= today);
  if(!dailyHabits.length || scored.length < 2){
    return `<div class="habit-chart"><div style="font-size:12px;color:var(--ink-soft);padding:14px 0;text-align:center;">
      ${dailyHabits.length ? 'Tick a couple of days and your productivity line shows up here.' : 'Add a daily habit to start tracking productivity.'}
    </div></div>`;
  }
  const x = i => padL + (scored.length===1 ? plotW/2 : (i/(scored.length-1))*plotW);
  const y = pct => padT + plotH - (pct/100)*plotH;
  const pts = scored.map((d,i)=>`${x(i).toFixed(1)},${y(habitDayPct(dailyHabits,d)).toFixed(1)}`);
  const area = `M ${padL},${padT+plotH} L ${pts.join(' L ')} L ${x(scored.length-1).toFixed(1)},${padT+plotH} Z`;
  const grid = [0,50,100].map(p=>`
    <line x1="${padL}" y1="${y(p)}" x2="${W-padR}" y2="${y(p)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL-6}" y="${y(p)+3}" text-anchor="end" font-size="9" fill="var(--ink-soft)">${p}%</text>`).join('');
  const step = Math.ceil(scored.length/12);
  const xLabels = scored.map((d,i)=> i%step ? '' :
    `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-soft)">${d.getDate()}</text>`).join('');
  return `<div class="habit-chart">
      <div style="font-size:12px; font-weight:700; margin-bottom:4px;">Daily productivity</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="130" role="img" aria-label="Daily habit completion for the month">
        ${grid}
        <path d="${area}" fill="var(--good)" opacity="0.16"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${xLabels}
      </svg>
    </div>`;
}

function renderHabits(){
  const person = habitPerson();
  if(!person) return `<div class="card"><div class="empty">Add someone in Settings first.</div></div>`;
  const ym = state.habitMonth || monthStr(new Date());
  const first = parseMonth(ym);
  const weeks = habitWeeks(ym);
  const days = weeks.flatMap(w=>w.days);
  const today = todayStr();
  const daily = habitsFor(person.id, 'daily');
  const weekly = habitsFor(person.id, 'weekly');

  const chips = state.people.map(p=>
    `<span class="person-chip ${p.id===person.id?'active':''}" data-habitperson="${p.id}">${avatarHtml(p,'sm')}${escapeHtml(p.name)}</span>`
  ).join('');

  /* ---- Stats ---- */
  const scored = days.filter(d=>fmtDate(d) <= today);
  const monthPct = daily.length && scored.length
    ? Math.round(scored.reduce((sum,d)=>sum + habitDayPct(daily,d), 0) / scored.length) : 0;
  const todayPct = daily.length ? habitDayPct(daily, new Date()) : 0;
  const inThisMonth = monthStr(new Date()) === ym;
  const stats = `<div class="habit-stat-row">
      <div class="habit-stat"><div class="lbl">${inThisMonth?'Today':'Month total'}</div><div class="num">${inThisMonth?todayPct:monthPct}%</div></div>
      <div class="habit-stat"><div class="lbl">Month average</div><div class="num">${monthPct}%</div></div>
      <div class="habit-stat"><div class="lbl">Current streak</div><div class="num">${habitStreak(daily)}<span style="font-size:12px;font-weight:600;"> ${habitStreak(daily)===1?'day':'days'}</span></div></div>
    </div>`;

  /* ---- Daily grid: a week-grouped header, one checkbox per day ---- */
  const wkHead = weeks.map(w=>`<th class="habit-wk-head ${w.tint}" colspan="${w.days.length}">${w.label}</th>`).join('');
  const dowHead = weeks.map(w=>w.days.map(d=>{
    const isToday = fmtDate(d)===today;
    return `<th class="habit-dow ${w.tint} ${isToday?'is-today':''}"><span class="d">${DOW[d.getDay()][0]}</span><span class="n">${d.getDate()}</span></th>`;
  }).join('')).join('');

  const dailyRows = daily.map(h=>{
    const cells = weeks.map(w=>w.days.map(d=>{
      const ds = fmtDate(d);
      const future = ds > today;
      const on = habitDone(h, d);
      return `<td class="habit-cell ${w.tint} ${ds===today?'is-today':''} ${future?'is-future':''}">
        <button class="habit-box ${on?'on':''}" data-habit="${h.id}" data-habitdate="${ds}" ${future?'disabled':''}
          title="${escapeHtml(h.name)} · ${ds}" aria-label="${escapeHtml(h.name)} on ${ds}">${on?'✓':''}</button></td>`;
    }).join('')).join('');
    const done = days.filter(d=>fmtDate(d)<=today && habitDone(h,d)).length;
    return `<tr>
        <th class="habit-name-col"><div class="habit-name-cell"><span class="txt">${escapeHtml(h.name)}</span><button class="habit-del" data-delhabit="${h.id}" title="Remove habit">✕</button></div></th>
        ${cells}
        <td class="habit-row-total">${done}/${scored.length}</td>
        <td class="habit-filler"></td>
      </tr>`;
  }).join('');

  const dailyTable = daily.length ? `
    <div class="habit-scroll">
      <table class="habit-table">
        <thead>
          <tr><th class="habit-name-col" rowspan="2">Daily habits</th>${wkHead}<th class="habit-row-total" rowspan="2">Done</th><th class="habit-filler" rowspan="2"></th></tr>
          <tr>${dowHead}</tr>
        </thead>
        <tbody>${dailyRows}</tbody>
      </table>
    </div>` : `<div class="empty">No daily habits yet — add one to build the grid 🌱</div>`;

  /* ---- Weekly grid: one checkbox per week ---- */
  const weeklyRows = weekly.map(h=>{
    const cells = weeks.map(w=>{
      const anchor = w.days[0];
      const future = fmtDate(startOfWeek(anchor)) > today;
      const on = habitDone(h, anchor);
      return `<td class="habit-cell ${w.tint}">
        <button class="habit-box ${on?'on':''}" data-habit="${h.id}" data-habitdate="${fmtDate(anchor)}" ${future?'disabled':''}
          title="${escapeHtml(h.name)} · ${w.label}">${on?'✓':''}</button></td>`;
    }).join('');
    return `<tr>
        <th class="habit-name-col"><div class="habit-name-cell"><span class="txt">${escapeHtml(h.name)}</span><button class="habit-del" data-delhabit="${h.id}" title="Remove habit">✕</button></div></th>
        ${cells}
        <td class="habit-filler"></td>
      </tr>`;
  }).join('');

  const weeklyTable = weekly.length ? `
    <div class="habit-scroll">
      <table class="habit-table">
        <thead><tr><th class="habit-name-col">Weekly habits</th>${weeks.map(w=>`<th class="habit-wk-head ${w.tint}" style="min-width:64px;">${w.label}</th>`).join('')}<th class="habit-filler"></th></tr></thead>
        <tbody>${weeklyRows}</tbody>
      </table>
    </div>` : `<div class="empty">No weekly habits yet — things like "clean the bathroom" fit well here 🧽</div>`;

  /* The grid keeps every row so the month's history stays visible — removing a
     habit the moment it's ticked would erase the very thing being tracked. The
     drawer instead lists what's already done for today. */
  const now = new Date();
  const doneToday = [...daily, ...weekly].filter(h=>habitDone(h, now));
  const doneTodayRows = doneToday.map(h=>`
    <div class="done-row">
      <button class="done-check" data-habit="${h.id}" data-habitdate="${today}" title="Untick for today">✓</button>
      <span class="name">${escapeHtml(h.name)}</span>
      <span class="who">${h.type==='weekly'?'this week':'today'}</span>
      ${h.points?`<span class="pts">+${h.points}</span>`:''}
    </div>`).join('');

  return `<div class="card">
      <div class="section-title">
        <h2>Habit tracker</h2>
        <div style="display:flex; gap:8px;">
          ${completedClearHtml('habits', doneToday.length)}
          ${completedToggleHtml('habits', doneToday.length)}
          <button class="btn btn-ghost" id="addWeeklyHabitBtn">+ Weekly habit</button>
          <button class="btn btn-mustard" id="addDailyHabitBtn">+ Daily habit</button>
        </div>
      </div>
      <div class="people-row">${chips}</div>
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn btn-ghost" id="habitPrev">◀</button>
          <strong class="display" style="font-size:17px;">${MONTHS[first.getMonth()]} ${first.getFullYear()}</strong>
          <button class="btn btn-ghost" id="habitNext">▶</button>
          <button class="btn btn-ghost" id="habitToday">This month</button>
        </div>
      </div>
      ${stats}
      ${habitChart(daily, days)}
      <div class="habit-sub">Daily habits — tick each day as you go</div>
      ${dailyTable}
      <div class="habit-sub">Weekly habits — one tick per week</div>
      ${weeklyTable}
      ${completedSectionHtml('habits', doneToday.length, doneTodayRows, 'Nothing ticked off yet today.')}
    </div>`;
}

    <div class="field"><label>Habit</label><input id="habitName" placeholder="${type==='daily'?'Read 30 minutes':'Clean the bathroom'}"></div>

function shiftHabitMonth(dir){
  const d = parseMonth(state.habitMonth || monthStr(new Date()));
  d.setMonth(d.getMonth()+dir);
  state.habitMonth = monthStr(d);
  saveState(); render();
}

/* ============================= TO-DOS (Reminders-style) =============================
   Lists act as sections, items can nest one level as bulleted sub-tasks, and the
   smart views (Today / Scheduled / Flagged) are filters over the same item array. */
const TODO_SORTS = [
  {key:'manual',   label:'Manual order'},
  {key:'due',      label:'Due date'},
  {key:'priority', label:'Priority'},
  {key:'title',    label:'Title'}
];
const TODO_PRIORITY = ['', '!', '!!', '!!!'];

function todoList(id){ return state.todos.lists.find(l=>l.id===id); }
function todoView(){ return state.todoView || (state.todoView = {listId:'all', sort:'manual', showCompleted:false}); }
function todoPeople(t){ return (t.personIds||[]).map(personById).filter(Boolean); }
function todoWhoLabel(t){
  const ppl = todoPeople(t);
  return ppl.length ? ppl.map(p=>p.name).join(', ') : familyLabel();
}
function todoIsToday(t){ return t.due && t.due === todayStr(); }
function todoIsOverdue(t){ return t.due && t.due < todayStr() && !t.done; }

/* Which items belong to the current smart view or list. */
function todoMatchesView(t, view){
  if(view === 'all') return true;
  if(view === 'today') return t.due && t.due <= todayStr();
  if(view === 'scheduled') return !!t.due;
  if(view === 'flagged') return !!t.flagged;
  return t.listId === view;
}
function sortTodos(items, sort){
  const copy = items.slice();
  if(sort === 'due'){
    /* Undated items sink to the bottom rather than sorting as an empty string. */
    copy.sort((a,b)=>(a.due||'9999-99-99').localeCompare(b.due||'9999-99-99') || a.order-b.order);
  } else if(sort === 'priority'){
    copy.sort((a,b)=>(b.priority||0)-(a.priority||0) || a.order-b.order);
  } else if(sort === 'title'){
    copy.sort((a,b)=>a.title.localeCompare(b.title));
  } else {
    copy.sort((a,b)=>a.order-b.order);
  }
  return copy;
}
function todoDueHtml(t){
  if(!t.due) return '';
  const cls = todoIsOverdue(t) ? 'overdue' : (todoIsToday(t) ? 'today' : '');
  const d = parseDate(t.due);
  const label = todoIsToday(t) ? 'Today' : `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
  return `<span class="todo-due ${cls}">${label}${todoIsOverdue(t)?' · overdue':''}</span>`;
}
/* Notes render as a bulleted list once there's more than one line, so a pasted
   checklist reads as one. */
function todoNotesHtml(notes){
  if(!notes) return '';
  const lines = notes.split('\n').map(l=>l.replace(/^\s*[-*•]\s*/,'').trim()).filter(Boolean);
  if(lines.length <= 1) return `<div class="todo-notes">${escapeHtml(notes)}</div>`;
  return `<div class="todo-notes"><ul>${lines.map(l=>`<li>${escapeHtml(l)}</li>`).join('')}</ul></div>`;
}
function todoAttsHtml(t){
  const atts = t.attachments || [];
  if(!atts.length) return '';
  return `<div class="todo-atts">${atts.map(a=>
    a.type && a.type.startsWith('image/')
      ? `<span class="todo-att" data-attopen="${t.id}|${a.id}" title="${escapeHtml(a.name)}"><img src="${a.dataUrl}" alt="${escapeHtml(a.name)}"></span>`
      : `<span class="todo-att" data-attopen="${t.id}|${a.id}" title="${escapeHtml(a.name)}">📄</span>`
  ).join('')}</div>`;
}
function todoRowHtml(t, isSub){
  const prio = TODO_PRIORITY[t.priority||0];
  return `<div class="todo-row ${t.done?'is-done':''} ${isSub?'sub':''}">
      <button class="todo-check ${t.done?'on':''} ${t.priority?'prio':''}" data-todotoggle="${t.id}" title="${t.done?'Mark not done':'Mark done'}">${t.done?'✓':''}</button>
      <div class="todo-main">
        <div class="todo-title">${prio?`<span class="todo-prio">${prio}</span>`:''}${escapeHtml(t.title)}</div>
        ${todoNotesHtml(t.notes)}
        ${todoAttsHtml(t)}
        <div class="todo-meta">
          <span>${escapeHtml(todoWhoLabel(t))}</span>
          ${todoDueHtml(t)}
          ${t.points?`<span>⭐ ${t.points}</span>`:''}
        </div>
      </div>
      <div class="todo-actions">
        <button class="todo-flag ${t.flagged?'on':''}" data-todoflag="${t.id}" title="Flag">${t.flagged?'🚩':'⚐'}</button>
        ${isSub?'':`<button data-todosub="${t.id}" title="Add sub-task">＋</button>`}

function renderTodos(){
  const view = todoView();
  const all = state.todos.items;
  const counts = id => all.filter(t=>!t.done && !t.parentId && todoMatchesView(t, id)).length;
  const smart = [
    {id:'all', label:'All', icon:'📋', color:'#8a8a8a'},
    {id:'today', label:'Today', icon:'📆', color:'#3B6FE0'},
    {id:'scheduled', label:'Scheduled', icon:'🗓️', color:'#E2413F'},
    {id:'flagged', label:'Flagged', icon:'🚩', color:'#E07C1D'}
  ];
  const sideItem = (id, icon, color, name, count)=>`
    <div class="todo-side-item ${view.listId===id?'active':''}" data-todoview="${id}">
      <span class="todo-side-icon" style="background:${color};">${icon}</span>
      <span class="todo-side-name">${escapeHtml(name)}</span>
      <span class="todo-side-count">${count}</span>
    </div>`;
  const sidebar = `
    ${smart.map(v=>sideItem(v.id, v.icon, v.color, v.label, counts(v.id))).join('')}
    <div class="todo-side-label">My lists</div>
    ${state.todos.lists.map(l=>sideItem(l.id, l.emoji||'☰', l.color, l.name, counts(l.id))).join('')}`;

  const isSmart = ['all','today','scheduled','flagged'].includes(view.listId);
  const activeList = isSmart ? null : todoList(view.listId);
  /* The working list is always outstanding-only; anything finished drops into
     the Completed drawer at the foot of the page. */
  const inView = all.filter(t=>todoMatchesView(t, view.listId) && !t.done);
  const parents = inView.filter(t=>!t.parentId);
  const childrenOf = id => sortTodos(all.filter(t=>t.parentId===id && !t.done), view.sort);
  const rowsFor = items => sortTodos(items, view.sort)
    .map(t=>todoRowHtml(t,false) + childrenOf(t.id).map(c=>todoRowHtml(c,true)).join('')).join('');

  const group = (key, title, items, removable)=>{
    if(!items.length && !removable) return '';
    const collapsed = !!view.collapsed[key];
    return `<div class="todo-section">
        <div class="todo-section-head" data-todocollapse="${key}">
          <span class="caret">${collapsed?'▶':'▼'}</span>${escapeHtml(title)}
          <span class="cnt">${items.filter(t=>!t.done).length}</span>
          ${removable?`<button class="todo-sec-x" data-todosecdel="${removable}" title="Delete section">✕</button>`:''}
        </div>
        ${collapsed?'':(items.length?rowsFor(items):`<div style="font-size:13px;color:var(--ink-soft);padding:4px 2px;">Empty</div>`)}
      </div>`;
  };

  let body = '';
  if(isSmart){
    /* Smart views group by list, the way Reminders shows list headers in Today. */
    body = state.todos.lists.map(l=>group('L'+l.id, `${l.emoji||''} ${l.name}`, parents.filter(t=>t.listId===l.id))).join('');
    body += group('Lunsorted', 'Unsorted', parents.filter(t=>!todoList(t.listId)));
  } else {
    const secs = state.todos.sections.filter(s=>s.listId===view.listId).sort((a,b)=>a.order-b.order);
    body = group('S0', 'No section', parents.filter(t=>!t.sectionId || !secs.some(s=>s.id===t.sectionId)));
    body += secs.map(s=>group('S'+s.id, s.name, parents.filter(t=>t.sectionId===s.id), s.id)).join('');
  }
  if(!body.trim()) body = `<div class="empty">Nothing here yet — add your first to-do below ✍️</div>`;

  const addTarget = isSmart ? (state.todos.lists[0]?.id || '') : view.listId;
  const title = activeList ? `${activeList.emoji||''} ${activeList.name}` : (smart.find(v=>v.id===view.listId)||{}).label;
  const titleColor = activeList ? activeList.color : 'var(--board)';
  const openCount = counts(view.listId);

  /* Completed items are scoped to the same view, so switching lists doesn't show
     someone else's finished work. */
  const doneTodos = all.filter(t=>t.done && todoMatchesView(t, view.listId));
  const doneRows = doneTodos.map(t=>`
    <div class="done-row">
      <button class="done-check" data-todotoggle="${t.id}" title="Mark not done">✓</button>
      <span class="name">${escapeHtml(t.title)}</span>
      <span class="who">${escapeHtml(todoWhoLabel(t))}</span>
      ${t.points?`<span class="pts">+${t.points}</span>`:''}
      <button class="row-del" data-tododel="${t.id}">✕</button>
    </div>`).join('');

  return `<div class="card">
      <div class="section-title">
        <h2>To-Dos</h2>
        <div style="display:flex; gap:8px;">
          ${activeList?`<button class="btn btn-ghost" id="addTodoSectionBtn">+ Section</button>`:''}
          <button class="btn btn-ghost" id="addTodoListBtn">+ New list</button>
          <button class="btn btn-mustard" id="addTodoBtn">+ New to-do</button>
        </div>
      </div>
      <div class="todo-app">
        <aside class="todo-sidebar">${sidebar}</aside>
        <div class="todo-pane">
          <h3 class="todo-pane-title" style="color:${titleColor};">${escapeHtml(title||'To-Dos')}</h3>
          <div class="todo-pane-sub">${openCount} open${activeList?'':' · across all lists'}</div>
          <div class="todo-toolbar">
            <label style="margin:0; font-size:12px;">Sort</label>
            <select id="todoSort" style="width:auto;">
              ${TODO_SORTS.map(s=>`<option value="${s.key}" ${view.sort===s.key?'selected':''}>${s.label}</option>`).join('')}
            </select>
            <span class="spacer"></span>
            ${completedClearHtml('todos', doneTodos.length)}
            ${completedToggleHtml('todos', doneTodos.length)}
          </div>
          ${body}
          <div class="todo-add">
            <input id="todoQuickAdd" placeholder="Add a to-do and press Enter">
            <button class="btn btn-primary" id="todoQuickAddBtn" data-list="${addTarget}">Add</button>
          </div>
          ${completedSectionHtml('todos', doneTodos.length, doneRows)}
        </div>
      </div>
    </div>`;
}

/* Attachments live in the same local store as everything else, so images are
   downscaled hard before saving — a couple of full-size photos would blow past
   the browser's storage ceiling on their own. */
const ATT_MAX_DIM = 1000;
const ATT_MAX_FILE_BYTES = 600_000;   // cap for non-image files
function readAttachment(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read that file.'));
    reader.onload = ev=>{
      if(!file.type.startsWith('image/')){
        if(file.size > ATT_MAX_FILE_BYTES) return reject(new Error(`"${file.name}" is too big to store — keep files under 600 KB, or attach a photo instead.`));
        return resolve({id:uid(), name:file.name, type:file.type||'application/octet-stream', dataUrl:ev.target.result});
      }
      const img = new Image();
      img.onerror = ()=>reject(new Error('That image could not be loaded.'));
      img.onload = ()=>{
        try{
          const scale = Math.min(1, ATT_MAX_DIM/Math.max(img.width, img.height));
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const out = canvas.toDataURL('image/jpeg', 0.72);
          if(!out.startsWith('data:image/')) throw new Error('bad image data');
          resolve({id:uid(), name:file.name, type:'image/jpeg', dataUrl:out});
        }catch(err){ reject(new Error('Could not process that image.')); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function deleteTodo(id){
  /* Removing a parent takes its sub-tasks with it — an orphaned sub-task has
     nothing to indent under. */
  state.todos.items = state.todos.items.filter(t=>t.id!==id && t.parentId!==id);
}

/* Completing a to-do has to land its points on a real person. An item assigned
   to one person is unambiguous; a family item could have been done by anyone,
   so it asks rather than guessing or silently dropping the points. */
function completeTodo(t){
  const finish = async (personId)=>{
    t.done = true;
    t.doneAt = todayStr();
    t.awardedTo = personId || null;
    if(personId && t.points) addPoints(personId, t.points);
    /* Points land first, then the item goes — along with its sub-tasks, which
       have nothing to hang off once the parent is gone. */
    if(autoRemoveOn()) state.todos.items = state.todos.items.filter(x=>x.id!==t.id && x.parentId!==t.id);
    await saveState(); render();
    if(personId && t.points) toast(`${personById(personId).name} earned ${t.points} point${t.points===1?'':'s'} ⭐`, 'success');
  };
  const assigned = (t.personIds||[]).filter(id=>personById(id));
  if(!t.points){ finish(assigned[0] || null); return; }
  if(assigned.length === 1){ finish(assigned[0]); return; }

  const choices = assigned.length ? assigned : state.people.map(p=>p.id);
  openModal(`
    <h3>Who finished it?</h3>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:-4px;">"${escapeHtml(t.title)}" is worth ${t.points} point${t.points===1?'':'s'}.</p>
    <div class="who-picker">
      ${choices.map(id=>{ const p = personById(id); return `
        <button class="who-opt" data-todowho="${id}" style="cursor:pointer;">${avatarHtml(p,'sm')}<span>${escapeHtml(p.name)}</span></button>`; }).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="tdWhoSkip">No points, just mark done</button>
    </div>
  `);
  document.querySelectorAll('[data-todowho]').forEach(b=>b.onclick = ()=>{ closeModal(); finish(b.dataset.todowho); });
  document.getElementById('tdWhoSkip').onclick = ()=>{ closeModal(); finish(null); };
}

/* ============================= REWARDS =============================
   Anything created in Housekeeping, To-Dos or Habits shows up here automatically
   under the person it belongs to, so each person can see exactly what's available
   to earn and what it's worth. Nothing has to be re-entered on this tab. */
function earnRowsFor(personId){
  const rows = [];
  state.todos.items.filter(t=>!t.parentId && (t.personIds||[]).includes(personId)).forEach(t=>rows.push({
    kind:'To-do', icon:'📝', name:t.title, points:t.points||0, done:!!t.done
  }));
  state.habits.items.filter(h=>h.personId===personId).forEach(h=>rows.push({
    kind: h.type==='weekly' ? 'Habit (weekly)' : 'Habit (daily)', icon:'🌱', name:h.name, points:h.points||0, done:false
  }));
  return rows;
}
function familyEarnRows(){
  return state.todos.items
    .filter(t=>!t.parentId && !(t.personIds||[]).length)
    .map(t=>({kind:'To-do', icon:'📝', name:t.title, points:t.points||0, done:!!t.done}));
}
function earnTableHtml(rows){
  if(!rows.length) return `<div style="font-size:12.5px; color:var(--ink-soft); padding:6px 2px;">Nothing assigned yet.</div>`;
  return rows.map(r=>`
    <div class="earn-row ${r.done?'is-done':''}">
      <span class="earn-icon">${r.icon}</span>
      <span class="earn-name">${escapeHtml(r.name)}</span>
      <span class="earn-kind">${r.kind}</span>
      <span class="earn-pts">${r.points ? '+'+r.points : '—'}</span>
    </div>`).join('');
}
function renderRewards(){
  const strip = state.people.map(p=>`<div class="points-card" style="background:${p.color}; color:${p.text||'#fff'};"><div class="head">${avatarHtml(p)}<span class="lbl">${escapeHtml(p.name)}'s points</span></div><div class="num mono">${pointsFor(p.id)}</div></div>`).join('');

  const earnCards = state.people.map(p=>{

    return `<div class="earn-card">

    </div>`).join('') || `<div class="empty">No rewards yet — add one below 🎁</div>`;

  return `<div class="card">
      <div class="section-title"><h2>Rewards</h2><button class="btn btn-mustard" id="addRewardBtn">+ Add reward</button></div>
      <div class="points-strip">${strip}</div>

      <h3 style="font-size:15px; margin-bottom:2px;">Ways to earn</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0;">Every to-do and habit appears here automatically under whoever it's assigned to.</p>
      <div class="earn-grid">${earnCards}${famCard}</div>

      <h3 style="font-size:15px; margin:18px 0 8px;">Spend points on</h3>
      ${rewards}
    </div>`;
